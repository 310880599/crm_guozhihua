<script>
layui.use(['table','form','upload','util','laydate','layer'], function(){
    var table = layui.table, form = layui.form, laydate = layui.laydate, $ = layui.jquery, upload = layui.upload, layer = layui.layer;

    /** 成交客户页：高级查询展开/收起（仅本页，localStorage 记忆） */
    var ADVANCED_SEARCH_STORAGE_KEY = 'crm_client_chengjiao_advanced_search_expanded';
    function readChengjiaoAdvancedSearchExpanded() {
        try {
            return localStorage.getItem(ADVANCED_SEARCH_STORAGE_KEY) === '1';
        } catch (e) {
            return false;
        }
    }
    function writeChengjiaoAdvancedSearchExpanded(expanded) {
        try {
            localStorage.setItem(ADVANCED_SEARCH_STORAGE_KEY, expanded ? '1' : '0');
        } catch (e) {}
    }
    function applyChengjiaoAdvancedSearchState(expanded, useAnimation) {
        var $fs = $('#advancedSearchFieldset');
        var $body = $('#advancedSearchBody');
        var $btn = $('#toggleAdvancedSearch');
        if (!$fs.length || !$body.length || !$btn.length) {
            return;
        }
        if (useAnimation) {
            if (expanded) {
                $fs.removeClass('advanced-search-collapsed');
                $body.stop(true, true).css('display', 'none').slideDown(200);
                $btn.text('收起');
            } else {
                $body.stop(true, true).slideUp(200, function () {
                    $fs.addClass('advanced-search-collapsed');
                });
                $btn.text('展开');
            }
        } else {
            $body.stop(true, true).removeAttr('style');
            if (expanded) {
                $fs.removeClass('advanced-search-collapsed');
                $btn.text('收起');
            } else {
                $fs.addClass('advanced-search-collapsed');
                $btn.text('展开');
            }
        }
    }
    applyChengjiaoAdvancedSearchState(readChengjiaoAdvancedSearchExpanded(), false);
    $('#toggleAdvancedSearch').on('click', function () {
        var willExpand = $('#advancedSearchFieldset').hasClass('advanced-search-collapsed');
        writeChengjiaoAdvancedSearchExpanded(willExpand);
        applyChengjiaoAdvancedSearchState(willExpand, true);
    });

    var followIndex = null; // 记住"写跟进弹窗"的 layer index
    var allFollowIndex = null;
    var afTableIns = null;
    var currentLeadsId = null;
    var actionIconTipIndex = null;
    var isMobile = $(window).width() < 768;
    var currentUsername = "{$Think.session.username}" || "default";
    var tableId = "table-list";
    // 生成 page_key：使用 location.pathname（不要 replace 下划线，否则和数据库存的不一致）
    var pageKey = location.pathname;
    // localStorage 的 key（用于兜底）
    var columnWidthKey = "crm_colwidth_" + currentUsername + "_" + pageKey.replace(/[^\w]/g, '_') + "_" + tableId;
    var tableIns = null;
    var chengjiaoSortState = { field: '', order: '' };
    // 字段显隐/顺序与列宽 pageKey 隔离：列宽继续用 location.pathname
    var chengjiaoTableConfigPageKey = 'chengjiao';
    var chengjiaoTableConfigTableKey = 'table-list';
    var chengjiaoTableHideConfig = {};
    var chengjiaoTableColumnOrder = [];
    var chengjiaoTableConfigLoaded = false;
    var chengjiaoTableConfigSaving = false;
    var chengjiaoCurrentUrl = "{:url('successCliList')}";
    var chengjiaoCurrentWhere = {};
    var chengjiaoRenderToken = 0;
    var lastSnapshot = {};
    var resizeSaveTimer = null;

    // 主表 / 左右固定列行高同步（本页专用；合并 rAF，避免污染订单弹窗表格）
    var chengjiaoRowHeightSyncToken = 0;
    var chengjiaoRowHeightRafId = null;
    var chengjiaoRowHeightResizeBound = false;
    var chengjiaoRowHeightResizeTimer = null;

    function getChengjiaoTableView() {
        var $byLayId = $('.layui-table-view[lay-id="' + tableId + '"]');
        if ($byLayId.length === 1) {
            return $byLayId;
        }
        if ($byLayId.length > 1) {
            return $();
        }
        var $elem = $('#' + tableId);
        if (!$elem.length) {
            return $();
        }
        var $next = $elem.nextAll('.layui-table-view[lay-id="' + tableId + '"]').first();
        if ($next.length === 1) {
            return $next;
        }
        return $();
    }

    function collectChengjiaoBodyRowsByIndex($scope) {
        var map = {};
        var duplicate = false;
        if (!$scope || !$scope.length) {
            return { map: map, duplicate: false, count: 0 };
        }
        $scope.find('table').first().children('tbody').children('tr').each(function () {
            var idx = this.getAttribute('data-index');
            if (idx === null || idx === '') {
                return;
            }
            if (Object.prototype.hasOwnProperty.call(map, idx)) {
                duplicate = true;
                return;
            }
            map[idx] = this;
        });
        return {
            map: map,
            duplicate: duplicate,
            count: Object.keys(map).length
        };
    }

    function clearChengjiaoSyncedRowHeight(tr) {
        if (!tr || !tr.style) {
            return;
        }
        tr.style.removeProperty('height');
        if (tr.getAttribute('data-cj-row-h-sync') === '1') {
            tr.removeAttribute('data-cj-row-h-sync');
        }
    }

    function applyChengjiaoSyncedRowHeight(tr, h) {
        if (!tr || !tr.style || !(h > 0)) {
            return;
        }
        tr.style.setProperty('height', h + 'px');
        tr.setAttribute('data-cj-row-h-sync', '1');
    }

    function measureChengjiaoRowNaturalHeight(tr) {
        if (!tr) {
            return 0;
        }
        var rect = tr.getBoundingClientRect();
        var h = rect && rect.height ? rect.height : 0;
        if (!h) {
            h = tr.offsetHeight || 0;
        }
        return Math.ceil(h);
    }

    /**
     * 同步成交客户主表与左右固定列每一行高度（逐行取三侧最大值）
     */
    function syncChengjiaoFixedRowHeights(expectedToken) {
        if (typeof expectedToken === 'number' && expectedToken !== chengjiaoRowHeightSyncToken) {
            return;
        }
        try {
            var $view = getChengjiaoTableView();
            if (!$view.length) {
                return;
            }

            var $main = $view.find('.layui-table-main').first();
            var $left = $view.find('.layui-table-fixed-l .layui-table-body').first();
            var $right = $view.find('.layui-table-fixed-r .layui-table-body').first();
            if (!$main.length) {
                return;
            }

            var mainRows = collectChengjiaoBodyRowsByIndex($main);
            var leftRows = collectChengjiaoBodyRowsByIndex($left);
            var rightRows = collectChengjiaoBodyRowsByIndex($right);
            if (mainRows.duplicate || leftRows.duplicate || rightRows.duplicate) {
                return;
            }

            var mainMap = mainRows.map;
            var leftMap = leftRows.map;
            var rightMap = rightRows.map;
            var indices = Object.keys(mainMap);
            if (!indices.length) {
                return;
            }

            // 对应关系不可靠时不强制按错位索引写入
            if ($left.length && leftRows.count && leftRows.count !== indices.length) {
                return;
            }
            if ($right.length && rightRows.count && rightRows.count !== indices.length) {
                return;
            }

            // 1) 清理本函数写入的旧高度，恢复自然高度以便重新测量（收起后可缩回）
            indices.forEach(function (idx) {
                clearChengjiaoSyncedRowHeight(mainMap[idx]);
                if (leftMap[idx]) {
                    clearChengjiaoSyncedRowHeight(leftMap[idx]);
                }
                if (rightMap[idx]) {
                    clearChengjiaoSyncedRowHeight(rightMap[idx]);
                }
            });

            if (typeof expectedToken === 'number' && expectedToken !== chengjiaoRowHeightSyncToken) {
                return;
            }
            if (!document.contains($view[0])) {
                return;
            }

            // 2) 统一读取自然高度
            var heightPlan = [];
            indices.forEach(function (idx) {
                var mainTr = mainMap[idx];
                var leftTr = leftMap[idx] || null;
                var rightTr = rightMap[idx] || null;
                var maxH = Math.max(
                    measureChengjiaoRowNaturalHeight(mainTr),
                    measureChengjiaoRowNaturalHeight(leftTr),
                    measureChengjiaoRowNaturalHeight(rightTr)
                );
                if (maxH > 0) {
                    heightPlan.push({ mainTr: mainTr, leftTr: leftTr, rightTr: rightTr, h: maxH });
                }
            });

            if (typeof expectedToken === 'number' && expectedToken !== chengjiaoRowHeightSyncToken) {
                return;
            }
            if (!document.contains($view[0])) {
                return;
            }

            // 3) 集中写入统一高度（只改 tr，不改 deal_times 单元格 height:auto）
            heightPlan.forEach(function (item) {
                applyChengjiaoSyncedRowHeight(item.mainTr, item.h);
                if (item.leftTr) {
                    applyChengjiaoSyncedRowHeight(item.leftTr, item.h);
                }
                if (item.rightTr) {
                    applyChengjiaoSyncedRowHeight(item.rightTr, item.h);
                }
            });
        } catch (e) {
            console.warn('成交客户固定列行高同步失败:', e);
        }
    }

    function scheduleChengjiaoFixedRowHeights() {
        chengjiaoRowHeightSyncToken += 1;
        var token = chengjiaoRowHeightSyncToken;
        if (chengjiaoRowHeightRafId !== null) {
            if (typeof cancelAnimationFrame === 'function') {
                cancelAnimationFrame(chengjiaoRowHeightRafId);
            }
            chengjiaoRowHeightRafId = null;
        }

        function runSync() {
            chengjiaoRowHeightRafId = null;
            if (token !== chengjiaoRowHeightSyncToken) {
                return;
            }
            syncChengjiaoFixedRowHeights(token);
        }

        if (typeof requestAnimationFrame === 'function') {
            chengjiaoRowHeightRafId = requestAnimationFrame(function () {
                if (token !== chengjiaoRowHeightSyncToken) {
                    chengjiaoRowHeightRafId = null;
                    return;
                }
                // 再等一帧，确保 Layui 完成布局后再测量
                chengjiaoRowHeightRafId = requestAnimationFrame(runSync);
            });
        } else {
            setTimeout(runSync, 0);
        }
    }

    function bindChengjiaoRowHeightResizeOnce() {
        if (chengjiaoRowHeightResizeBound) {
            return;
        }
        chengjiaoRowHeightResizeBound = true;
        $(window).on('resize.chengjiaoRowHeight', function () {
            if (chengjiaoRowHeightResizeTimer) {
                clearTimeout(chengjiaoRowHeightResizeTimer);
            }
            chengjiaoRowHeightResizeTimer = setTimeout(function () {
                chengjiaoRowHeightResizeTimer = null;
                scheduleChengjiaoFixedRowHeights();
            }, 150);
        });
    }

    function buildChengjiaoQueryWhere(keyword) {

        if (chengjiaoSortState.field && (chengjiaoSortState.order === 'asc' || chengjiaoSortState.order === 'desc')) {

    function getChengjiaoColField(col) {
        return col && col.field ? String(col.field) : '';
    }

    function isChengjiaoCheckboxCol(col) {
        return !!(col && col.type === 'checkbox');
    }

    function isChengjiaoIdCol(col) {
        return getChengjiaoColField(col) === 'id';
    }

    function isChengjiaoActionCol(col) {
        return !!(col && col.toolbar === '#action');
    }

    function isChengjiaoSortableBusinessCol(col) {
        var field = getChengjiaoColField(col);
        if (!field || field === 'id') return false;
        if (isChengjiaoCheckboxCol(col) || isChengjiaoActionCol(col)) return false;
        return true;
    }

    /**
     * 成交客户主表顺序：始终 checkbox → id → 业务字段 → 操作列
     * 配置中缺失的新业务字段追加到已排序业务字段之后
     */
    function applyChengjiaoColumnOrder(cols) {
        if (!cols || !cols.length) return cols;

        var checkboxCol = null;
        var idCol = null;
        var actionCol = null;
        var businessCols = [];

        cols.forEach(function (col) {
            if (isChengjiaoCheckboxCol(col)) {
                checkboxCol = col;
            } else if (isChengjiaoIdCol(col)) {
                idCol = col;
            } else if (isChengjiaoActionCol(col)) {
                actionCol = col;
            } else if (col) {
                businessCols.push(col);
            }
        });

        var orderedBusiness = [];
        if (chengjiaoTableColumnOrder && chengjiaoTableColumnOrder.length) {
            var businessMap = {};
            businessCols.forEach(function (col) {
                var field = getChengjiaoColField(col);
                if (field) businessMap[field] = col;
            });

            chengjiaoTableColumnOrder.forEach(function (field) {
                field = String(field || '');
                if (!field || field === 'id') return;
                if (businessMap[field]) {
                    orderedBusiness.push(businessMap[field]);
                    delete businessMap[field];
                }
            });

            businessCols.forEach(function (col) {
                var field = getChengjiaoColField(col);
                if (field && businessMap[field]) {
                    orderedBusiness.push(businessMap[field]);
                    delete businessMap[field];
                } else if (!field) {
                    orderedBusiness.push(col);
                }
            });
        } else {
            orderedBusiness = businessCols.slice();
        }

        var result = [];
        if (checkboxCol) result.push(checkboxCol);
        if (idCol) result.push(idCol);
        result = result.concat(orderedBusiness);
        if (actionCol) result.push(actionCol);
        return result;
    }

    function loadChengjiaoTableConfig() {
        var config = {
            hide_config: {},
            column_order: []
        };

        $.ajax({
            url: "{:url('Client/getQuickFollowTableConfig')}",
            type: 'GET',
            dataType: 'json',
            async: false,
            data: {
                page_key: chengjiaoTableConfigPageKey,
                table_key: chengjiaoTableConfigTableKey
            },
            success: function (res) {
                if (res && parseInt(res.code, 10) === 0 && res.data) {
                    if (res.data.hide_config && typeof res.data.hide_config === 'object') {
                        config.hide_config = res.data.hide_config;
                    }
                    if ($.isArray(res.data.column_order)) {
                        config.column_order = res.data.column_order;
                    }
                }
            },
            error: function () {
                console.warn('读取成交客户主表字段配置失败，使用默认顺序/显示');
            }
        });

        chengjiaoTableHideConfig = config.hide_config || {};
        chengjiaoTableColumnOrder = config.column_order || [];
        chengjiaoTableConfigLoaded = true;
    }

    function collectChengjiaoTableHideConfig() {
        var baseCols = buildChengjiaoBaseCols();
        var hideConfig = {};
        var hasLevel1Value = {};
        var hasLevel2Value = {};
        var titleFieldMap = {};

        function toHideValue(hidden) {
            return (hidden === true || hidden === 1 || hidden === '1') ? 1 : 0;
        }

        baseCols.forEach(function (col) {
            var field = getChengjiaoColField(col);
            var title = $.trim(col && col.title ? String(col.title) : '');
            if (!field || isChengjiaoCheckboxCol(col) || isChengjiaoActionCol(col)) return;
            hideConfig[field] = toHideValue(col.hide);
            hasLevel1Value[field] = false;
            hasLevel2Value[field] = false;
            if (title) {
                titleFieldMap[title] = field;
            }
        });

        try {
            var $view = $('#' + tableId).next('.layui-table-view');
            var tableOptions = null;

            if (table && table.getOptions) {
                tableOptions = table.getOptions(tableId);
            }
            if (!tableOptions && table && table.config && table.config[tableId]) {
                tableOptions = table.config[tableId];
            }

            if (tableOptions && $.isArray(tableOptions.cols) && tableOptions.cols.length) {
                (tableOptions.cols[0] || []).forEach(function (col) {
                    var field = getChengjiaoColField(col);
                    if (!field || isChengjiaoCheckboxCol(col) || isChengjiaoActionCol(col)) return;
                    hideConfig[field] = toHideValue(col.hide);
                    hasLevel1Value[field] = true;
                });
            }

            $view.find('.layui-table-tool-panel input[type="checkbox"]').each(function () {
                var $checkbox = $(this);
                var field = $.trim(
                    $checkbox.attr('name') ||
                    $checkbox.attr('data-field') ||
                    $checkbox.attr('lay-filter') ||
                    ''
                );

                if (!field) {
                    var titleText = $.trim(
                        $checkbox.closest('li').text() ||
                        $checkbox.next('.layui-form-checkbox').text() ||
                        $checkbox.parent().text() ||
                        ''
                    );
                    if (titleText && titleFieldMap[titleText]) {
                        field = titleFieldMap[titleText];
                    }
                }

                if (field && !hasLevel1Value[field] && Object.prototype.hasOwnProperty.call(hideConfig, field)) {
                    hideConfig[field] = $checkbox.prop('checked') ? 0 : 1;
                    hasLevel2Value[field] = true;
                }
            });

            baseCols.forEach(function (col) {
                var field = getChengjiaoColField(col);
                if (!field || isChengjiaoCheckboxCol(col) || isChengjiaoActionCol(col)) return;
                if (hasLevel1Value[field] || hasLevel2Value[field]) return;

                var $headerCell = $view.find('.layui-table-header th[data-field="' + field + '"]');
                if ($headerCell.length && $headerCell.css('display') === 'none') {
                    hideConfig[field] = 1;
                } else if ($headerCell.length) {
                    hideConfig[field] = 0;
                }
            });
        } catch (e) {
            console.warn('收集成交客户主表字段隐藏配置失败:', e);
        }

        return hideConfig;
    }

    function saveChengjiaoTableConfig(options) {
        options = options || {};
        if (chengjiaoTableConfigSaving) return;

        var order = [];
        if (chengjiaoTableColumnOrder && chengjiaoTableColumnOrder.length) {
            order = chengjiaoTableColumnOrder.slice();
        } else {
            buildChengjiaoBaseCols().forEach(function (col) {
                if (isChengjiaoSortableBusinessCol(col)) {
                    order.push(getChengjiaoColField(col));
                }
            });
        }

        var hideConfig = options.hide_config || collectChengjiaoTableHideConfig();

        chengjiaoTableConfigSaving = true;
        $.ajax({
            url: "{:url('Client/saveQuickFollowTableConfig')}",
            type: 'POST',
            dataType: 'json',
            data: {
                page_key: chengjiaoTableConfigPageKey,
                table_key: chengjiaoTableConfigTableKey,
                hide_config: JSON.stringify(hideConfig),
                column_order: JSON.stringify(order)
            },
            complete: function () {
                chengjiaoTableConfigSaving = false;
            },
            success: function (res) {
                if (!res || parseInt(res.code, 10) !== 0) {
                    console.warn('保存成交客户主表字段配置失败:', res && res.msg ? res.msg : res);
                }
            },
            error: function () {
                console.warn('保存成交客户主表字段配置请求失败');
            }
        });
    }

    function bindChengjiaoTableHideConfigSave() {
        var $view = $('#' + tableId).next('.layui-table-view');
        if (!$view.length) return;
        var saveTimer = null;

        function delaySaveHideConfig() {
            clearTimeout(saveTimer);
            saveTimer = setTimeout(function () {
                chengjiaoTableHideConfig = collectChengjiaoTableHideConfig();
                saveChengjiaoTableConfig({
                    hide_config: chengjiaoTableHideConfig
                });
            }, 300);
        }

        function bindChengjiaoHidePanelEvents() {
            var $panel = $view.find('.layui-table-tool-panel');
            if (!$panel.length) return;

            $panel
                .off('click.chengjiaoTableHidePanelItemSave')
                .on('click.chengjiaoTableHidePanelItemSave', 'li,input,.layui-form-checkbox', function () {
                    delaySaveHideConfig();
                })
                .off('change.chengjiaoTableHidePanelItemSave')
                .on('change.chengjiaoTableHidePanelItemSave', 'input[type="checkbox"]', function () {
                    delaySaveHideConfig();
                });
        }

        $view.off('click.chengjiaoTableHidePanelSave');
        $view.on('click.chengjiaoTableHidePanelSave', '.layui-table-tool-self', function () {
            setTimeout(function () {
                bindChengjiaoHidePanelEvents();

        $view.on('click.chengjiaoTableHidePanelBodySave', '.layui-table-tool-panel', function () {
            delaySaveHideConfig();
        });

        bindChengjiaoHidePanelEvents();
        setTimeout(function () {

        }, 80);
        setTimeout(function () {
            bindChengjiaoHidePanelEvents();
        }, 220);
        $view.off('mouseleave.chengjiaoTableHidePanelSave').on('mouseleave.chengjiaoTableHidePanelSave', '.layui-table-tool-panel', function () {
            clearTimeout(saveTimer);
            saveTimer = setTimeout(function () {
                setTimeout(function () {
                    chengjiaoTableHideConfig = collectChengjiaoTableHideConfig();
                    saveChengjiaoTableConfig({
                        hide_config: chengjiaoTableHideConfig
                    });

    function bindChengjiaoColumnDragSort() {
        var draggedEl = null;

        $('#chengjiaoTableColumnSortList')
            .off('dragstart.chengjiaoColSort dragover.chengjiaoColSort drop.chengjiaoColSort dragend.chengjiaoColSort')
            .on('dragstart.chengjiaoColSort', '.chengjiao-table-col-sort-item', function (e) {
                draggedEl = this;
                $(this).addClass('dragging');
                if (e.originalEvent && e.originalEvent.dataTransfer) {
                    e.originalEvent.dataTransfer.effectAllowed = 'move';
                    e.originalEvent.dataTransfer.setData('text/plain', $(this).attr('data-field') || '');
                }
            })
            .on('dragover.chengjiaoColSort', '.chengjiao-table-col-sort-item', function (e) {
                e.preventDefault();
                if (!draggedEl || draggedEl === this) return;

                var rect = this.getBoundingClientRect();
                var offsetY = e.originalEvent.clientY - rect.top;
                if (offsetY > rect.height / 2) {
                    $(this).after(draggedEl);
                } else {
                    $(this).before(draggedEl);
                }
            })
            .on('drop.chengjiaoColSort', '.chengjiao-table-col-sort-item', function (e) {
                e.preventDefault();
            })
            .on('dragend.chengjiaoColSort', '.chengjiao-table-col-sort-item', function () {
                $(this).removeClass('dragging');
                draggedEl = null;
            });
    }

            yes: function () {

    function renderChengjiaoTable() {
        if (chengjiaoTableConfigLoaded === false) {
            loadChengjiaoTableConfig();
        }

        var colList = buildChengjiaoBaseCols();
        colList = applyChengjiaoColumnOrder(colList);

        colList.forEach(function (col) {
            var field = getChengjiaoColField(col);
            if (field && Object.prototype.hasOwnProperty.call(chengjiaoTableHideConfig, field)) {
                col.hide = parseInt(chengjiaoTableHideConfig[field], 10) === 1;
            }
        });

        var renderToken = ++chengjiaoRenderToken;
        loadSavedColWidths(function (savedWidths) {
            if (renderToken !== chengjiaoRenderToken) return;
            applySavedWidthsToCols([colList], savedWidths);
            tableIns = table.render({
                elem: '#' + tableId,
                id: tableId,
                url: chengjiaoCurrentUrl,
                method: 'post',
                toolbar: '#topBtn',
                defaultToolbar: ['filter'],
                autoSort: false,
                page: true,
                limit: 30,
                cols: [colList],
                limit: 10,
                page: { limits: [10, 20, 50, 100, 200, 500,9999999] },
                where: chengjiaoCurrentWhere,
                initSort: chengjiaoInitSortOption(),
                parseData: function(res) {
                    // 给每行数据添加aid字段，用于判断权限
                    var aid = '{:session("aid")}';
                    if (res.data && res.data.length > 0) {
                        res.data.forEach(function(item) {
                            item.aid = aid;
                        });
                    }
                    return res;
                },
                done: function () {
                    bindResizeSave();
                    var snapshot = getCurrentWidthsSnapshot();
                    if (Object.keys(snapshot).length > 0) {
                        lastSnapshot = snapshot;
                    }
                    bindChengjiaoRowHeightResizeOnce();
                    scheduleChengjiaoFixedRowHeights();
                    bindActionIconTips();
                    bindChengjiaoTableHideConfigSave();
                }
            });
            window.tableIns = tableIns;
        });
    }

    function applySavedWidthsToCols(cols, widths) {
        if (!cols || !cols[0] || !widths) return;
        cols[0].forEach(function (col) {
            if (!col || !col.field) return;
            if (!Object.prototype.hasOwnProperty.call(widths, col.field)) return;
            var w = parseInt(widths[col.field], 10);
            if (w >= 30 && w <= 3000) {
                col.width = w;
            }
        });
    }

                table_id: tableId

                if (res.code === 0 && res.data && Object.keys(res.data).length > 0) {
                    widths = res.data;
                } else {
                    try {
                        widths = JSON.parse(localStorage.getItem(columnWidthKey) || '{}');
                    } catch (e) {
                        widths = {};
                    }

                var widths = {};
                try {
                    widths = JSON.parse(localStorage.getItem(columnWidthKey) || '{}');
                } catch (e) {
                    widths = {};
                }

    function reloadKeepColWidth() {
        // 1) 先快照当前列宽（不丢你刚做好的列宽记忆）
        var snapshot = {};
        if (typeof getCurrentWidthsSnapshot === 'function') {
            snapshot = getCurrentWidthsSnapshot() || {};
        }

        // 2) 把快照回写到当前 tableIns 的 cols（避免 reload 后宽度被默认值覆盖）
        if (window.tableIns && tableIns.config && tableIns.config.cols && tableIns.config.cols[0]) {
            tableIns.config.cols[0].forEach(function (col) {
                if (!col || !col.field) return;
                if (snapshot && Object.prototype.hasOwnProperty.call(snapshot, col.field)) {
                    col.width = snapshot[col.field];
                }
            });
        }

        // 3) 同步兜底到 localStorage（可选，但建议保留）
        if (snapshot && Object.keys(snapshot).length && typeof columnWidthKey !== 'undefined') {
            localStorage.setItem(columnWidthKey, JSON.stringify(snapshot));
        }

        // 4) 尽快同步到数据库，避免 reload 后仅本地生效
        if (snapshot && Object.keys(snapshot).length && typeof saveWidths === 'function') {
            saveWidths();
        }

        // 5) 关键：刷新列表（两种写法二选一）
        // 写法A：用实例 reload（推荐）
        if (window.tableIns) {
            tableIns.reload();
            return;
        }

        // 写法B：用 table.reload（如果你某些页面 tableIns 作用域拿不到）
        layui.table.reload(tableId);
    }

    /**
     * 获取当前列宽快照
     * 读取 #table-list 对应的 .layui-table-view
     * 找到主表头：$view.find('.layui-table-header table')
     * 遍历 thead tr th 与 colgroup col，生成 {field: width} 的对象（跳过 data-field="0"）
     * 返回对象（空对象也返回）
     */
    function getCurrentWidthsSnapshot() {
        var snapshot = {};
        try {
            var $view = $('#' + tableId).next('.layui-table-view');
            if (!$view.length) return snapshot;

            // ✅只取主表头（不取 fixed 的那套）
            var $headerTable = $view.find('.layui-table-header table').eq(0);
            var $ths = $headerTable.find('thead tr th');

            $ths.each(function () {
                var $th = $(this);
                var field = $th.attr('data-field');
                if (!field || field === '0') return; // 跳过 checkbox / 空字段

                // ✅只取内容宽度（不含 padding/border），统一口径
                var w = parseInt($th.width(), 10);
                // ✅合理边界检查，防止极小/极大异常值
                if (w >= 30 && w <= 3000) {
                    snapshot[field] = w;
                }
            });
        } catch (e) {
            console.warn('获取列宽快照失败:', e);
        }
        return snapshot;
    }

    function saveWidths() {
        try {
            var widths = {};
            var $view = $('#' + tableId).next('.layui-table-view');
            if (!$view.length) return;

            // 只取主表头，不取 fixed 固定列
            var $headerTable = $view.find('.layui-table-header table').eq(0);
            $headerTable.find('thead tr th').each(function () {
                var $th = $(this);
                var field = $th.attr('data-field');
                if (!field || field === '0') return;
                var w = parseInt($th.width(), 10);
                if (w >= 30 && w <= 3000) {
                    widths[field] = w;
                }
            });

            if (!Object.keys(widths).length) return;
            localStorage.setItem(columnWidthKey, JSON.stringify(widths));

            $.ajax({
                url: "{:url('Client/saveColWidths')}",
                type: 'POST',
                dataType: 'json',
                data: {
                    page_key: pageKey,
                    table_id: tableId,
                    widths: JSON.stringify(widths)
                }
            });
        } catch (e) {
            console.warn('保存列宽失败:', e);
        }
    }

    var NEXT_UP_TIME_DEFAULT_CLOCK = '09:00:00';

    function normalizeNextUpTimeDisplay(value, emptyText) {
        var fallback = (emptyText == null) ? '' : String(emptyText);
        if (value == null) {
            return fallback;
        }
        var text = String(value).trim();
        if (text === '' || text === 'null' || text === 'undefined') {
            return fallback;
        }
        return text;
    }
    function normalizeNextUpTimeInput(value) {
        var text = $.trim(value || '');
        if (text === '') {
            return '';
        }
        var dateOnlyMatch = text.match(/^(\d{4}-\d{2}-\d{2})$/);
        if (dateOnlyMatch) {
            return dateOnlyMatch[1] + ' ' + NEXT_UP_TIME_DEFAULT_CLOCK;
        }
        var dateTimeMatch = text.match(/^(\d{4}-\d{2}-\d{2})\s+(\d{2}):(\d{2}):(\d{2})$/);
        if (dateTimeMatch && dateTimeMatch[2] === '00' && dateTimeMatch[3] === '00' && dateTimeMatch[4] === '00') {
            return dateTimeMatch[1] + ' ' + NEXT_UP_TIME_DEFAULT_CLOCK;
        }
        return text;
    }
    function shouldApplyNextUpDefaultClock(value) {
        var text = $.trim(value || '');
        if (text === '') {
            return true;
        }
        if (/^\d{4}-\d{2}-\d{2}$/.test(text)) {
            return true;
        }
        return /^\d{4}-\d{2}-\d{2}\s+00:00:00$/.test(text);
    }
    function applyNextUpTimeDefault(value) {
        var normalized = normalizeNextUpTimeInput(value);
        if ($.trim($('#next_up_time').val()) !== normalized) {
            $('#next_up_time').val(normalized);
        }
        return normalized;
    }
    function syncNextUpTimeAfterLaydateDone(doneValue) {
        setTimeout(function () {
            var finalValue = $.trim($('#next_up_time').val());
            if (finalValue === '') {
                finalValue = $.trim(doneValue || '');
            }
            applyNextUpTimeDefault(finalValue);
        }, 0);
    }
    function initFollowNextUpTimeDefault(rawValue) {
        var text = $.trim(rawValue || '');
        if (text === '') {
            $('#next_up_time').val('');
            return '';
        }
        return applyNextUpTimeDefault(text);
    }
    function applyLaydatePanelDefaultClockIfNeeded(value) {
        if (!shouldApplyNextUpDefaultClock(value)) {
            return;
        }
        var parts = NEXT_UP_TIME_DEFAULT_CLOCK.split(':');
        if (parts.length !== 3) {
            return;
        }
        setTimeout(function () {
            var $panel = $('.layui-laydate:visible').last();
            if (!$panel.length) {
                return;
            }
            var $timeInputs = $panel.find('.laydate-time-text input');
            if ($timeInputs.length >= 3) {
                $timeInputs.eq(0).val(parts[0]).trigger('keyup').trigger('blur');
                $timeInputs.eq(1).val(parts[1]).trigger('keyup').trigger('blur');
                $timeInputs.eq(2).val(parts[2]).trigger('keyup').trigger('blur');
            }
            var $timeCols = $panel.find('.laydate-time-list ol');
            if (!$timeCols.length) {
                $timeCols = $panel.find('.laydate-time-list li ol');
            }
            if ($timeCols.length >= 3) {
                $.each(parts, function (idx, part) {
                    var $col = $timeCols.eq(idx);
                    var $target = $col.children('li').filter(function () {
                        return $.trim($(this).text()) === part;
                    }).first();
                    if ($target.length) {
                        $target.trigger('click');
                    }
                });
            }
        }, 0);
    }

    function escapeHtml(text) {
        var s = text == null ? '' : String(text);
        return s
            .replace(/&/g, '&amp;')
            .replace(/</g, '&lt;')
            .replace(/>/g, '&gt;')

    function sanitizeAvatarSrc(src) {
        var val = $.trim(String(src || ''));
        if (!val) return '/static/admin/images/0.jpg';
        if (/^(https?:)?\/\//i.test(val) || /^\//.test(val)) {
            return val.replace(/"/g, '%22').replace(/'/g, '%27');
        }
        return '/static/admin/images/0.jpg';

    function clearFollowHistoryCache(leadsId) {}
    function parseFollowHistoryTimestamp(timeText) {
        var text = $.trim(String(timeText || ''));
        if (!text) return 0;
        if (/^\d{10,13}$/.test(text)) {
            var num = parseInt(text, 10);
            if (text.length === 13) {
                return num;
            }
            return num * 1000;
        }
        var ts = Date.parse(text.replace(/-/g, '/'));
        return isNaN(ts) ? 0 : ts;
    }
    function padFollowTimeNum(num) {
        return String(num).padStart(2, '0');
    }
    function formatFollowHistoryTime(rawTime) {
        var text = $.trim(String(rawTime == null ? '' : rawTime));
        if (!text) return '';
        var ts = parseFollowHistoryTimestamp(text);
        if (!ts && /年|月|日/.test(text)) {
            var normalizedText = text.replace(/年/g, '-').replace(/月/g, '-').replace(/日/g, ' ').replace(/\s+/g, ' ').trim();
            ts = parseFollowHistoryTimestamp(normalizedText);
        }
        if (!ts) {
            return text;
        }
        var d = new Date(ts);
        if (isNaN(d.getTime())) {
            return text;
        }
        var y = d.getFullYear();
        var m = padFollowTimeNum(d.getMonth() + 1);
        var day = padFollowTimeNum(d.getDate());
        var hh = padFollowTimeNum(d.getHours());
        var mm = padFollowTimeNum(d.getMinutes());
        var ss = padFollowTimeNum(d.getSeconds());
        return y + '-' + m + '-' + day + ' ' + hh + ':' + mm + ':' + ss;
    }
    function normalizeFollowHistoryRecords(records) {
        var list = [];
        $.each(records || [], function (_, item) {
            item = item || {};
            var timeVal = item.time || item.create_date || item.created_at || item.create_time || item.add_time || '';
            list.push({
                time: formatFollowHistoryTime(timeVal),
                user: item.user || item.username || item.user_name || item.realname || item.oper_user || item.create_user || '系统',
                content: item.content || item.reply_msg || item.comment || '',
                avatar: item.avatar || '',
                follow_role_text: item.follow_role_text || item.role_text || ''
            });
        });
        list.sort(function (a, b) {
            return parseFollowHistoryTimestamp(b.time) - parseFollowHistoryTimestamp(a.time);
        });
        return list;
    }

    function syncAllFollowTableRowHeights() {
        try {
            var $view = $('#all-follow-dialog #af-table').next('.layui-table-view');
            if (!$view.length) return;

            var $mainRows = $view.find('.layui-table-main tbody tr');
            if (!$mainRows.length) return;

            var $fixRRows = $view.find('.layui-table-fixed-r tbody tr');
            var $fixLRows = $view.find('.layui-table-fixed-l tbody tr');

            function setHImportant(el, h) {
                if (!el) return;
                el.style.setProperty('height', h + 'px', 'important');
            }
            function resetHImportant(el) {
                if (!el) return;
                el.style.removeProperty('height');
            }

            $mainRows.each(function () {
                resetHImportant(this);
                $(this).find('td').each(function () { resetHImportant(this); });
                $(this).find('td .layui-table-cell').each(function () { resetHImportant(this); });
            });
            if ($fixRRows.length) {
                $fixRRows.each(function () {
                    resetHImportant(this);
                    $(this).find('td').each(function () { resetHImportant(this); });
                    $(this).find('td .layui-table-cell').each(function () { resetHImportant(this); });
                });
            }
            if ($fixLRows.length) {
                $fixLRows.each(function () {
                    resetHImportant(this);
                    $(this).find('td').each(function () { resetHImportant(this); });
                    $(this).find('td .layui-table-cell').each(function () { resetHImportant(this); });
                });
            }

            $mainRows.each(function (index) {
                var mainRow = this;
                var fixRRow = ($fixRRows.length > index) ? $fixRRows.get(index) : null;
                var fixLRow = ($fixLRows.length > index) ? $fixLRows.get(index) : null;
                var hMain = $(mainRow).outerHeight() || 0;
                var hR = fixRRow ? ($(fixRRow).outerHeight() || 0) : 0;
                var hL = fixLRow ? ($(fixLRow).outerHeight() || 0) : 0;
                var h = Math.max(hMain, hR, hL);
                if (h <= 0) return;

                setHImportant(mainRow, h);
                $(mainRow).find('td').each(function () { setHImportant(this, h); });
                $(mainRow).find('td .layui-table-cell').each(function () { setHImportant(this, h); });
                if (fixRRow) {
                    setHImportant(fixRRow, h);
                    $(fixRRow).find('td').each(function () { setHImportant(this, h); });
                    $(fixRRow).find('td .layui-table-cell').each(function () { setHImportant(this, h); });
                }
                if (fixLRow) {
                    setHImportant(fixLRow, h);
                    $(fixLRow).find('td').each(function () { setHImportant(this, h); });
                    $(fixLRow).find('td .layui-table-cell').each(function () { setHImportant(this, h); });
                }
            });
        } catch (e) {
            console.warn('全部跟进表格行高同步失败:', e);
        }
    }

        });

    var dealTimesExpandState = {};

    // 成交时间展示：默认最近3条，支持展开/收起（事件委托，避免重复绑定）
    function renderDealTimesCell(d) {
        var list = Array.isArray(d.deal_times) ? d.deal_times : [];
        if (!list.length) {
            return '<div class="deal-times-wrap"><span class="deal-times-empty">暂无可确认的成交时间</span></div>';
        }
        var leadId = parseInt(d.id, 10) || 0;
        var expanded = !!(dealTimesExpandState[leadId]);
        var total = list.length;
        var showCount = (expanded || total <= 3) ? total : 3;
        var html = '<div class="deal-times-wrap" data-lead-id="' + leadId + '">';
        for (var i = 0; i < showCount; i++) {
            var item = list[i] || {};
            var t = layui.util.escape(item.order_time || '');
            if (!t) continue;
            html += '<span class="deal-time-item">' + t + '</span>';
        }
        if (total > 3) {
            if (expanded) {
                html += '<a href="javascript:;" class="deal-times-toggle" data-action="collapse">收起</a>';
            } else {
                html += '<a href="javascript:;" class="deal-times-toggle" data-action="expand">展开全部（共' + total + '条）</a>';
            }
        }
        html += '</div>';
        return html;
    }

    function isValidChengjiaoDateRange(raw) {
        raw = $.trim(raw || '');
        if (raw === '') return true;
        var start = raw, end = raw;
        if (raw.indexOf(' - ') !== -1) {
            var parts = raw.split(' - ');
            start = $.trim(parts[0] || '');
            end = $.trim(parts[1] || '');
        }
        var re = /^\d{4}-\d{2}-\d{2}$/;
        if (!re.test(start) || !re.test(end)) return false;
        function parseYmd(s) {
            var a = s.split('-');
            return new Date(parseInt(a[0], 10), parseInt(a[1], 10) - 1, parseInt(a[2], 10));
        }
        var ds = parseYmd(start), de = parseYmd(end);
        if (isNaN(ds.getTime()) || isNaN(de.getTime())) return false;
        if (ds.getFullYear() !== parseInt(start.split('-')[0], 10)) return false;
        if ((ds.getMonth() + 1) !== parseInt(start.split('-')[1], 10)) return false;
        if (ds.getDate() !== parseInt(start.split('-')[2], 10)) return false;
        if (de.getFullYear() !== parseInt(end.split('-')[0], 10)) return false;
        if ((de.getMonth() + 1) !== parseInt(end.split('-')[1], 10)) return false;
        if (de.getDate() !== parseInt(end.split('-')[2], 10)) return false;
        if (start > end) return false;
        return true;
    }

    table.on('sort(table-list)', function (obj) {
        if (obj.type === 'asc' || obj.type === 'desc') {
            chengjiaoSortState.field = obj.field;
            chengjiaoSortState.order = obj.type;
        } else {
            chengjiaoSortState.field = '';
            chengjiaoSortState.order = '';
        }
        chengjiaoCurrentWhere = buildChengjiaoQueryWhere();
        table.reload('table-list', {
            where: chengjiaoCurrentWhere,
            initSort: chengjiaoInitSortOption(obj.field),
            page: { curr: 1 }
        });
    });

    // 高级搜索表单提交
    form.on('submit(LAY-app-contlist-search)', function(data) {
        var field = data.field || {};
        // 自定义日期优先：有自定义值时清空对应快捷项，避免两组互相干扰
        if ($.trim(field.at_time || '') !== '') {
            field.timebucket = '';
        }
        if ($.trim(field.deal_time || '') !== '') {
            field.deal_timebucket = '';
        }
        if (!isValidChengjiaoDateRange(field.at_time)) {
            layer.msg('创建日期参数无效');
            return false;
        }
        if (!isValidChengjiaoDateRange(field.deal_time)) {
            layer.msg('成交日期参数无效');
            return false;
        }
        dealTimesExpandState = {};
        chengjiaoCurrentUrl = "{:url('Client/chengjiaoClientSearch')}";
        chengjiaoCurrentWhere = buildChengjiaoQueryWhere(field);
        table.reload('table-list', {
            url: chengjiaoCurrentUrl,
            where: chengjiaoCurrentWhere,
            initSort: chengjiaoInitSortOption(),
            page: { curr: 1 }
        });
        return false;
    });

    $(document).off('click.dealTimesToggle').on('click.dealTimesToggle', '.deal-times-toggle', function(e) {
        e.preventDefault();
        e.stopPropagation();
        var $wrap = $(this).closest('.deal-times-wrap');
        var leadId = parseInt($wrap.attr('data-lead-id'), 10) || 0;
        if (!leadId) return;
        var action = $(this).attr('data-action');
        dealTimesExpandState[leadId] = (action === 'expand');

        var rowData = null;
        var cache = table.cache['table-list'] || [];
        for (var i = 0; i < cache.length; i++) {
            if (parseInt(cache[i].id, 10) === leadId) {
                rowData = cache[i];
                break;
            }
        }
        if (!rowData) return;

        var $cell = $wrap.closest('td[data-field="deal_times"]').find('.layui-table-cell');
        if ($cell.length) {
            $cell.html(renderDealTimesCell(rowData));
        } else {
            $wrap.replaceWith($(renderDealTimesCell(rowData)));
        }
        scheduleChengjiaoFixedRowHeights();
    });

    // 日期选择组件初始化（支持范围选择）；创建日期与成交日期独立，不得互相清空
    laydate.render({ elem: '#at_time', range: true, trigger: 'click' });
    laydate.render({ elem: '#deal_time', range: true, trigger: 'click' });
    laydate.render({
        elem: '#next_up_time',
        type: 'datetime',
        format: 'yyyy-MM-dd HH:mm:ss',
        trigger: 'click',
        ready: function () {
            applyLaydatePanelDefaultClockIfNeeded($.trim($('#next_up_time').val()));
        },
        change: function (value) {
            if (value) {
                applyNextUpTimeDefault(value);
            }
            applyLaydatePanelDefaultClockIfNeeded(value);
        },
        done: function (value) {
            syncNextUpTimeAfterLaydateDone(value);
        }
    });
    $(document)
        .off('blur.chengjiaoNextUpTimeDefault', '#next_up_time')
        .on('blur.chengjiaoNextUpTimeDefault', '#next_up_time', function () {
            applyNextUpTimeDefault(this.value);
        });
    form.on('select(dateRange)', function(data) {
        var isCustom = (data.value === '');
        $('#at_time').toggle(isCustom);
        if (!isCustom) $('#at_time').val('');
    });
    form.on('select(dealDateRange)', function(data) {
        var isCustom = (data.value === '');
        $('#deal_time').toggle(isCustom);
        if (!isCustom) $('#deal_time').val('');
    });
    // 初始化运营人员下拉（EditableSelect插件）
    const yySelect = new EditableSelect(document.getElementById('oper_user_input'), {$_yyList|raw}, '运营人员', '', 'name');
    // 所属渠道与运营端口联动：选择渠道后异步加载对应端口列表
    form.on('select(inquiry_id)', function(data) {
        var inquiryId = data.value;
        var $portSelect = $('#port_id');
        $portSelect.empty();
        if (!inquiryId) {
            $portSelect.append('<option value="">请先选择所属渠道</option>');
            form.render('select');
            return;
        }
        $.ajax({
            url: "{:url('Client/getPortsByInquiry')}",
            type: 'GET',
            data: { inquiry_id: inquiryId },
            success: function(res) {
                if (res.code === 0 && res.data) {
                    $portSelect.append('<option value="">请选择运营端口</option>');
                    $.each(res.data, function(index, port) {
                        $portSelect.append('<option value="' + port.id + '">' + port.port_name + '</option>');
                    });
                } else {
                    $portSelect.append('<option value="">该渠道暂无端口数据</option>');
                }
                form.render('select');
            },
            error: function() {
                $portSelect.append('<option value="">获取端口失败</option>');
                form.render('select');
            }
        });
    });
});
</script>
</body>
</html>
