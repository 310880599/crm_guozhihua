<script>
layui.use(['table','form','upload','util','laydate','layer'], function(){
    var table = layui.table, form = layui.form, laydate = layui.laydate, $ = layui.jquery, upload = layui.upload, layer = layui.layer;

    /** 成交客户页：高级查询展开/收起（仅本页，localStorage 记忆） */
    var ADVANCED_SEARCH_STORAGE_KEY = 'crm_client_chengjiao_advanced_search_expanded';
    function readChengjiaoAdvancedSearchExpanded() {
        try {
            return localStorage.getItem(ADVANCED_SEARCH_STORAGE_KEY) === '1';
        } catch (e) {
            return false;
        }
    }
    function writeChengjiaoAdvancedSearchExpanded(expanded) {
        try {
            localStorage.setItem(ADVANCED_SEARCH_STORAGE_KEY, expanded ? '1' : '0');
        } catch (e) {}
    }
    function applyChengjiaoAdvancedSearchState(expanded, useAnimation) {
        var $fs = $('#advancedSearchFieldset');
        var $body = $('#advancedSearchBody');
        var $btn = $('#toggleAdvancedSearch');
        if (!$fs.length || !$body.length || !$btn.length) {
            return;
        }
        if (useAnimation) {
            if (expanded) {
                $fs.removeClass('advanced-search-collapsed');
                $body.stop(true, true).css('display', 'none').slideDown(200);
                $btn.text('收起');
            } else {
                $body.stop(true, true).slideUp(200, function () {
                    $fs.addClass('advanced-search-collapsed');
                });
                $btn.text('展开');
            }
        } else {
            $body.stop(true, true).removeAttr('style');
            if (expanded) {
                $fs.removeClass('advanced-search-collapsed');
                $btn.text('收起');
            } else {
                $fs.addClass('advanced-search-collapsed');
                $btn.text('展开');
            }
        }
    }
    applyChengjiaoAdvancedSearchState(readChengjiaoAdvancedSearchExpanded(), false);
    $('#toggleAdvancedSearch').on('click', function () {
        var willExpand = $('#advancedSearchFieldset').hasClass('advanced-search-collapsed');
        writeChengjiaoAdvancedSearchExpanded(willExpand);
        applyChengjiaoAdvancedSearchState(willExpand, true);
    });

    var followIndex = null; // 记住"写跟进弹窗"的 layer index
    var isMobile = $(window).width() < 768;
    var currentUsername = "{$Think.session.username}" || "default";
    var tableId = "table-list";

            }, width:180
        },
        { field: 'product_name', title: '产品名称' , width:180},
        { field: 'inquiry_name', title: '所属渠道' , width:180},
        { field: 'port_name', title: '运营端口', width:180 },
        { field: 'main_phone', title: '主电话' , width:180},
        { field: 'aux_phone', title: '辅助电话' , width:180},
        { field: 'joint_person_names', title: '协同人' , width:180},
        { field: 'issuccess', title: '成交状态', templet: function(res){ return res.issuccess == 1 ? '已成交' : '未成交'; } , width:180},

                var v = d.original_creation_time;
                if (!v) return '';
                // 如果是时间戳，格式化为日期
                if (/^\d+$/.test(v)) return layui.util.toDateString(v * 1000);
                return v;

        },
        { field: 'original_modification_time', title: '原修改时间', width:180, templet: function(d){
                var v = d.original_modification_time;
                if (!v) return '';

    // 初始化表格
    var tableIns = table.render({

        method: 'post',
        toolbar: '#topBtn',

    // 监听表格操作列事件
    table.on('tool(table-list)', function (obj) {
        var data = obj.data;
        
        if (obj.event === 'del') {
            // 单个删除
            layer.confirm('您确定要删除这个成交客户吗？', function (index) {
                var loading = layer.load(1, { shade: [0.1, '#fff'] });

                    layer.close(loading);

                    } else {
                        layer.msg(res.msg || '操作失败！', { time: 1000, icon: 2 });

                area: ['100%', '86%'],

    table.on('toolbar(table-list)', function(obj){

            case 'delAlls':

                if (data.length === 0) {

                    var ids = data.map(function (o) { return o.id; });
                    layer.confirm('确定删除选中的' + ids.length + '个成交客户？', function (index) {
                        var loading = layer.load(1, { shade: [0.1, '#fff'] });
                        $.post("{:url('delSuccessClientBatch')}", { ids: ids }, function (res) {
                            layer.close(loading);
                            if (res.code === 0) {
                                layer.msg(res.msg, { time: 1000, icon: 1 });
                                tableIns.reload();
                            } else {
                                layer.msg(res.msg || '删除失败', { time: 1500, icon: 2 });
                            }
                        });
                        layer.close(index);
                    });

                break;
        }

    // 自定义遮罩层工具函数
    function ensureFollowMask() {
        var $mask = $('#follow-mask');
        if (!$mask.length) {
            $('body').append('<div id="follow-mask" class="follow-mask" style="display:none;"></div>');
            $mask = $('#follow-mask');
        }
        return $mask;
    }

    // 把遮罩放到弹层下面（关键：必须在 layer.setTop 之后再调用一次）
    function showFollowMaskUnderLayer(layero) {
        var $mask = ensureFollowMask();
        var z = parseInt($(layero).css('z-index'), 10);
        if (!isNaN(z)) {
            $mask.css('z-index', z - 1);
        } else {
            $mask.css('z-index', 19999999);
        }
        $mask.show();
    }

    function hideFollowMask() {
        $('#follow-mask').hide();
    }

    function reloadKeepColWidth() {
        // 1) 先快照当前列宽（不丢你刚做好的列宽记忆）
        var snapshot = {};
        if (typeof getCurrentWidthsSnapshot === 'function') {
            snapshot = getCurrentWidthsSnapshot() || {};
        }

        // 2) 把快照回写到当前 tableIns 的 cols（避免 reload 后宽度被默认值覆盖）
        if (window.tableIns && tableIns.config && tableIns.config.cols && tableIns.config.cols[0]) {
            tableIns.config.cols[0].forEach(function (col) {
                if (!col || !col.field) return;
                if (snapshot && Object.prototype.hasOwnProperty.call(snapshot, col.field)) {
                    col.width = snapshot[col.field];
                }
            });
        }

        // 3) 同步兜底到 localStorage（可选，但建议保留）
        if (snapshot && Object.keys(snapshot).length && typeof columnWidthKey !== 'undefined') {
            localStorage.setItem(columnWidthKey, JSON.stringify(snapshot));
        }

        // 4) 关键：刷新列表（两种写法二选一）
        // 写法A：用实例 reload（推荐）
        if (window.tableIns) {
            tableIns.reload();
            return;
        }

        // 写法B：用 table.reload（如果你某些页面 tableIns 作用域拿不到）
        layui.table.reload(tableId);
    }

    /**
     * 获取当前列宽快照
     * 读取 #table-list 对应的 .layui-table-view
     * 找到主表头：$view.find('.layui-table-header table')
     * 遍历 thead tr th 与 colgroup col，生成 {field: width} 的对象（跳过 data-field="0"）
     * 返回对象（空对象也返回）
     */
    function getCurrentWidthsSnapshot() {
        var snapshot = {};
        try {
            var $view = $('#' + tableId).next('.layui-table-view');
            if (!$view.length) return snapshot;

            // ✅只取主表头（不取 fixed 的那套）
            var $headerTable = $view.find('.layui-table-header table').eq(0);
            var $ths = $headerTable.find('thead tr th');

            $ths.each(function () {
                var $th = $(this);
                var field = $th.attr('data-field');
                if (!field || field === '0') return; // 跳过 checkbox / 空字段

                // ✅只取内容宽度（不含 padding/border），统一口径
                var w = parseInt($th.width(), 10);
                // ✅合理边界检查，防止极小/极大异常值
                if (w >= 30 && w <= 3000) {
                    snapshot[field] = w;
                }
            });
        } catch (e) {
            console.warn('获取列宽快照失败:', e);
        }
        return snapshot;
    }

    // 点击写跟进按钮打开弹窗
    $(document).off('click', '.follow-btn, .client-link').on('click', '.follow-btn, .client-link', function() {
        var clientId = $(this).data('id');
        openFollowDialog(clientId);
    });

    // 打开跟进弹窗
    function openFollowDialog(clientId) {
        // 显示加载提示
        var loading = layer.load(1, {shade: 0});
        
        // 获取客户信息和跟进记录
        $.ajax({
            url: "{:url('Client/getClientDetailAndComments')}",
            method: 'GET',
            data: {id: clientId},
            success: function(res) {
                layer.close(loading);
                if (res.code === 0) {
                    var clientData = res.data.client;
                    var comments = res.data.comments;
                    
                    // 填充客户信息
                    $('#follow-client-id').text(clientData.id || '');
                    $('#follow-client-name').text(clientData.kh_name || '');
                    $('#follow-contact').text(clientData.kh_contact || '');
                    $('#follow-main-phone').text(clientData.main_phone || '暂无');
                    $('#follow-aux-phone').text(clientData.aux_phone || '暂无');
                    $('#follow-area').text(clientData.xs_area || '');
                    $('#follow-source').text(clientData.inquiry_name || clientData.inquiry_id || '');        // 所属渠道
                    $('#follow-source-port').text(clientData.port_name || clientData.port_id || '暂无');    // 运营端口
                    $('#follow-rank').text(clientData.kh_rank_name || clientData.kh_rank || '');
                    $('#follow-user').text(clientData.pr_user || '');
                    $('#follow-joint-person').text(clientData.joint_person_names || '暂无');
                    $('#follow-create-time').text(clientData.at_time || '');
                    $('#follow-last-time').text(clientData.last_up_time || '暂无');
                    $('#follow-last-record').val(clientData.last_up_records || '暂无记录');
                    $('#leads_id').val(clientData.id);
                    
                    // 填充跟进历史
                    var html = '';
                    if (comments.length > 0) {
                        $.each(comments, function(index, item) {
                            html += '<div class="timeline-item">' +
                                '<div class="timeline-title">' + item.create_date + '</div>' +
                                '<div class="timeline-content">' +
                                '<img src="' + (item.avatar || '/static/admin/images/0.jpg') + '" class="avatar" onerror="this.src=\'/static/admin/images/0.jpg\'">' +
                                '<strong>' + item.username + '：</strong>' +
                                item.reply_msg +
                                '</div>' +
                                '</div>';
                        });
                    } else {
                        html = '<p>暂无跟进记录</p>';
                    }
                    $('#follow-history-list').html(html);


                    // 如果上一次弹窗没关干净，先强制关闭
                    if (followIndex !== null) {
                        layer.close(followIndex);
                        followIndex = null;
                    }
                                        
                    // 显示弹窗
                    followIndex = layer.open({
                        type: 1,
                        title: '客户跟进 - ' + clientData.kh_name,
                        area: ['90%', '80%'],
                        content: $('#follow-dialog'),
                        closeBtn: 1,
                        shade: 0,              // ✅禁用 layui 自动遮罩
                        shadeClose: false,
                        key: true,
                        anim: -1,

                        success: function(layero, index) {
                            $('#follow-dialog').show();

                            // ✅让弹窗置顶（layui 会重排 z-index）
                            layer.setTop(layero);

                            // ✅关键：setTop 之后再把自定义遮罩放到弹窗下面
                            showFollowMaskUnderLayer(layero);

                            // ✅接管右上角 X：保证点击一定会走 layer.close
                            $(layero).find('.layui-layer-close').off('click.follow').on('click.follow', function(e) {
                                e.preventDefault();
                                e.stopPropagation();
                                layer.close(index);
                            });
                        },

                        end: function() {
                            // ✅把 DOM 放回去
                            $('#follow-dialog').hide().appendTo('body');

                            // ✅移除自定义遮罩
                            hideFollowMask();

                            // ✅历史兜底：清掉所有残留的 layui 遮罩（因为你之前多次残留过）
                            $('.layui-layer-shade').remove();

                            followIndex = null;
                        }
                    });

                } else {
                    layer.msg(res.msg || '获取客户信息失败');
                }
            },
            error: function() {
                layer.close(loading);
                layer.msg('网络错误，获取客户信息失败');
            }
        });
    }
    // 提交跟进记录
    $('#submit-comment').on('click', function(e) {
        e.preventDefault();
        e.stopPropagation();
        var replyMsg = $('#reply_msg').val();
        var leadsId = $('#leads_id').val();
        
        if (!replyMsg) {
            layer.msg('请输入跟进内容');
            return;
        }
        
        // 显示加载提示
        var loading = layer.load(1, {shade: [0.1, '#fff']});
        
        $.ajax({
            method: 'post',
            url: "{:url('Client/comment')}",
            data: {
                reply_msg: replyMsg,
                leads_id: leadsId
            },
            success: function (res) {
                layer.close(loading);
                if (res.code === 0) {
                    layer.msg(res.msg);
                    $('#reply_msg').val('');
                    
                    // 更新历史记录
                    var now = new Date();
                    var createDate = now.getFullYear() + '年' + (now.getMonth() + 1) + '月' + now.getDate() + '日 ' 
                        + now.getHours() + ':' + (now.getMinutes() < 10 ? '0' : '') + now.getMinutes();
                    
                    var historyHtml = '<div class="timeline-item">' +
                        '<div class="timeline-title">' + createDate + '</div>' +
                        '<div class="timeline-content">' +
                        '<img src="{$Think.session.avatar|default="/static/admin/images/0.jpg"}" class="avatar" onerror="this.src=\'/static/admin/images/0.jpg\'">' +
                        '<strong>{$Think.session.username}：</strong>' +
                        replyMsg +
                        '</div>' +
                        '</div>';
                    $('#follow-history-list').prepend(historyHtml);
                    
                    $('#follow-last-record').val(replyMsg);
                    $('#follow-last-time').text(createDate);
                    
                    // 更新表格中的最新跟进记录
                    reloadKeepColWidth();
                } else {
                    layer.msg(res.msg);
                }
            },
            error: function () {
                layer.close(loading);
                layer.msg('提交失败');
            }
        });
    });

    form.on('submit(LAY-app-contlist-search)', function(data) {

    // 日期选择组件初始化（支持范围选择）
    laydate.render({ elem: '#at_time', range: true, trigger: 'click' });
    form.on('select(dateRange)', function(data) {

    // 初始化运营人员下拉（EditableSelect插件）
    const yySelect = new EditableSelect(document.getElementById('oper_user_input'), {$_yyList|raw}, '运营人员', '', 'name');
    // 所属渠道与运营端口联动：选择渠道后异步加载对应端口列表
    form.on('select(inquiry_id)', function(data) {
        var inquiryId = data.value;
        var $portSelect = $('#port_id');
        $portSelect.empty();
        if (!inquiryId) {
            $portSelect.append('<option value="">请先选择所属渠道</option>');
            form.render('select');
            return;
        }
        $.ajax({
            url: "{:url('Client/getPortsByInquiry')}",
            type: 'GET',
            data: { inquiry_id: inquiryId },
            success: function(res) {
                if (res.code === 0 && res.data) {
                    $portSelect.append('<option value="">请选择运营端口</option>');
                    $.each(res.data, function(index, port) {
                        $portSelect.append('<option value="' + port.id + '">' + port.port_name + '</option>');
                    });
                } else {
                    $portSelect.append('<option value="">该渠道暂无端口数据</option>');
                }
                form.render('select');
            },
            error: function() {
                $portSelect.append('<option value="">获取端口失败</option>');
                form.render('select');
            }
        });
    });
