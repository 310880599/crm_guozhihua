<script>
layui.use(['form', 'layer', 'jquery', 'table'], function () {
    var form = layui.form
      , layer = layui.layer
      , $ = layui.jquery
      , table = layui.table;
    var positionTitleList = {$positionTitleListJson|raw};

    var collaboratorData = {$collaboratorList|raw};          // [{name, value}]
    var jointPersonInit = {$jointPersonInit|raw};            // [id, id, ...]
    xmSelect.render({
        el: '#collaboratorSelect',
        name: 'joint_person',
        layVerify: '',
        tips: '协同人员',
        filterable: true,
        clickClose: false,
        disabled: true,
        initValue: jointPersonInit,
        data: collaboratorData
    });

    function buildPositionTitleSelectHtml(name, placeholder, selectedId) {
        var selected = String(selectedId || '');
        var html = '<select name="' + name + '" lay-search class="position-title-select" disabled>';
        html += '<option value="">' + placeholder + '</option>';
        $.each(positionTitleList || [], function (_, item) {
            var id = String(item.id || '');
            var text = String(item.position_title || '');
            var sel = (selected !== '' && selected === id) ? ' selected' : '';
            html += '<option value="' + id + '"' + sel + '>' + text + '</option>';
        });
        html += '</select>';
        return html;
    }
    (function prefillMainPhones(){
        var initMainPhoneList = {$mainPhoneList|raw};
        if (!Array.isArray(initMainPhoneList)) {
            try { initMainPhoneList = JSON.parse(initMainPhoneList || '[]'); } catch (e) { initMainPhoneList = []; }
        }

        var $box = $('#mainPhoneBox');
        var $firstRow   = $box.find('.input-row').first();
        var $firstInput = $firstRow.find('.multiple_telephone').first();
        var $firstTitle = $firstRow.find('.position-title-select').first();

        if (initMainPhoneList.length > 0) {
            $firstInput.val(initMainPhoneList[0].phone || '');
            $firstTitle.val(String(initMainPhoneList[0].position_title_id || ''));
        }

        for (var i = 1; i < initMainPhoneList.length; i++) {
            var item = initMainPhoneList[i] || {};
            var phone = item.phone || '';
            var titleId = item.position_title_id || '';
            var $row = $(
                '<div class="input-row has-action-btn">' +
                    '<div class="phone">' +
                        '<input type="text" name="more_phones[]" placeholder="电话" class="layui-input multiple_telephone" value="' + phone + '" readonly>' +
                    '</div>' +
                    '<div class="position-title mobile-position-row">' +
                        '<span class="position-label">职位身份</span>' +
                        buildPositionTitleSelectHtml('more_position_title_ids[]', '职位身份（必填）', titleId) +
                    '</div>' +
                '</div>'
            );
            $box.append($row);
        }
        form.render('select');
    })();

    form.render('select');

    function getQueryParam(key) {
        var reg = new RegExp('(^|&)' + key + '=([^&]*)(&|$)', 'i');
        var r = window.location.search.substr(1).match(reg);
        if (r !== null) {
            return decodeURIComponent(r[2]);
        }
        return '';
    }

    function renderHistoryApprovedOrderTable() {
        var clientId = parseInt($('input[name="id"]').val(), 10) || 0;
        var excludeOrderId = parseInt(getQueryParam('exclude_order_id') || getQueryParam('order_id') || '0', 10) || 0;
        table.render({
            elem: '#historyApprovedOrderTable',
            id: 'historyApprovedOrderTable',
            url: "{:url('Client/historyApprovedOrders')}",
            method: 'get',
            cellMinWidth: 100,
            where: {
                client_id: clientId,
                exclude_order_id: excludeOrderId
            },
            page: true,
            limit: 10,
            limits: [10, 20, 30, 50],
            text: {
                none: '暂无历史成交订单'
            },
            cols: [[
                { field: 'order_no', title: '订单编号', minWidth: 140 },
                { field: 'order_time', title: '成交时间', minWidth: 160 },
                { field: 'money', title: '成交金额', minWidth: 120, templet: function (d) { return d.money || d.money === 0 ? d.money : ''; } },
                { field: 'profit', title: '利润', minWidth: 100, templet: function (d) { return d.profit || d.profit === 0 ? d.profit : ''; } },
                { field: 'product_name', title: '产品名称', minWidth: 140, templet: function (d) { return d.product_name || ''; } },
                { field: 'pr_user', title: '负责人', minWidth: 120, templet: function (d) { return d.pr_user || ''; } },
                {
                    title: '操作',
                    minWidth: 90,
                    align: 'center',
                    templet: function () {
                        return '<a class="layui-btn layui-btn-xs" lay-event="details">详情</a>';
                    }
                }
            ]],
            done: function (res) {
                // 仅做展示样式标记：history 订单（order_type=history，来自 crm_client_history_order）行加特殊 class
                var data = res.data || [];
                var $rows = $('#historyApprovedOrderTable').next('.layui-table-view').find('.layui-table-body tbody tr');
                $.each(data, function (i, row) {
                    if (row && row.order_type === 'history') {
                        $rows.eq(i).addClass('history-order-row');
                    }
                });
            }
        });
    }

    renderHistoryApprovedOrderTable();

    table.on('tool(historyApprovedOrderTable)', function (obj) {
        var data = obj.data || {};
        if (obj.event !== 'details') {
            return;
        }
        if (!data.id) {
            layer.msg('订单ID缺失', { icon: 2, time: 1500 });
            return;
        }
        layer.open({
            type: 2,
            title: '订单详情',
            closeBtn: 1,
            area: ['100%', '86%'],
            anim: 2,
            shadeClose: false,
            maxmin: false,
            content: ["{:url('Order/details')}?id=" + data.id]
        });
    });

    $('#closeBtn').on('click', function () {
        var index = parent.layer.getFrameIndex(window.name);
        parent.layer.close(index);
    });
});
</script>
