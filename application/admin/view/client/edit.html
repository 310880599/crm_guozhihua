<script>
layui.use(['form', 'layer', 'jquery'], function () {
    var form = layui.form
      , layer = layui.layer
      , $ = layui.jquery;
    var positionTitleList = {$positionTitleListJson|raw};

    // 协同人多选初始化
    var collaboratorData = {$collaboratorList|raw};          // [{name, value}]
    var jointPersonInit = {$jointPersonInit|raw};            // [id, id, ...]
    xmSelect.render({
        el: '#collaboratorSelect',
        name: 'joint_person',
        layVerify: '',
        tips: '请选择协同人员',
        filterable: true,
        clickClose: false,
        initValue: jointPersonInit,                          // 预选
        data: collaboratorData
    });

    // 自定义校验：电话为11位数字（与新增一致）
    form.verify({
        phone: function (value) {
            if (value.trim() && !/^\d{11}$/.test(value)) {
                return '号码应为11位纯数字';
            }
        }
    });

    function buildPositionTitleSelectHtml(name, placeholder, selectedId) {
        var selected = String(selectedId || '');
        var html = '<select name="' + name + '" lay-search class="position-title-select">';
        html += '<option value="">' + placeholder + '</option>';
        $.each(positionTitleList || [], function (_, item) {
            var id = String(item.id || '');
            var text = String(item.position_title || '');
            var sel = (selected !== '' && selected === id) ? ' selected' : '';
            html += '<option value="' + id + '"' + sel + '>' + text + '</option>';
        });
        html += '</select>';
        return html;
    }

    /* 多行（新增/删除） */
    $(document).on('click', '.add-btn', function (e) {
        e.preventDefault();
        var $container = $(this).closest('.layui-input-4');
        var $newRow = $(
            '<div class="input-row has-action-btn">' +
                '<div class="phone">' +
                    // 额外电话不覆盖主电话 name，避免影响后端接收
                    '<input type="text" name="more_phones[]" lay-verify="phone" placeholder="电话" class="layui-input multiple_telephone">' +
                '</div>' +
                '<div class="position-title mobile-position-row">' +
                    '<span class="position-label">职位身份</span>' +
                    buildPositionTitleSelectHtml('more_position_title_ids[]', '职位身份（必填）', '') +
                '</div>' +
                '<button type="button" class="remove-btn">-</button>' +
            '</div>'
        );
        $container.append($newRow);
        form.render('select');
    });

    $(document).on('click', '.remove-btn', function (e) {
        e.preventDefault();
        $(this).closest('.input-row').remove();
    });


    // 渲染下拉框
    form.render('select');

    // 根据来源联动来源端口（键：来源中文名，与新增一致）
    var shopList = {$shopList|raw}; // 店铺列表分组数据：{ 来源名称: [ {id:..., name:...}, ... ], ... }

    function fillSourcePortBySourceName(sourceName, selectedPortId) {
        var shops = shopList[sourceName] || [];
        var $sourcePort = $('select[name="source_port"]');
        $sourcePort.empty();
        if (shops.length > 0) {
            $sourcePort.append('<option value="">请选择来源端口</option>');
            $.each(shops, function (i, shop) {
                var sel = (String(selectedPortId) === String(shop.id)) ? ' selected' : '';
                $sourcePort.append('<option value="' + shop.id + '"' + sel + '>' + shop.name + '</option>');
            });
        } else {
            $sourcePort.append('<option value="">该来源暂无店铺数据</option>');
        }
        form.render('select');
    }

    // 初次按当前来源填充来源端口选项
    var initSourceName = $('select[name="kh_status"] option:selected').text();
    var initSourcePortId = "{$result.source_port|default=''}";
    fillSourcePortBySourceName(initSourceName, initSourcePortId);

    // 监听来源变化
    form.on('select(kh_status)', function (data) {
        var sourceName = $(data.elem).find("option:selected").text();
        fillSourcePortBySourceName(sourceName, ''); // 切换来源时清空来源端口选择
    });

    /* =========================
    [新增] 编辑页主电话“回填渲染”
    要求：后端把 $mainPhoneList 以 JSON 传入（phone + position_title + position_title_id）
    ========================= */
    (function prefillMainPhones(){
        var initMainPhoneList = {$mainPhoneList|raw}; // 形如 [{phone:'138...', position_title:'经理'}]
        if (!Array.isArray(initMainPhoneList)) {
            try { initMainPhoneList = JSON.parse(initMainPhoneList || '[]'); } catch (e) { initMainPhoneList = []; }
        }

        var $box = $('#mainPhoneBox');
        var $firstRow   = $box.find('.input-row').first();
        var $firstInput = $firstRow.find('.multiple_telephone').first();
        var $firstTitle = $firstRow.find('.position-title-select').first();

        if (initMainPhoneList.length > 0) {
            // 第一个主电话填入第一行
            $firstInput.val(initMainPhoneList[0].phone || '');
            $firstTitle.val(String(initMainPhoneList[0].position_title_id || ''));
        }

        // 其余主电话一行一个，并带“-”删除按钮
        for (var i = 1; i < initMainPhoneList.length; i++) {
            var item = initMainPhoneList[i] || {};
            var phone = item.phone || '';
            var titleId = item.position_title_id || '';
            var $row = $(
                '<div class="input-row has-action-btn">' +
                    '<div class="phone">' +
                        '<input type="text" name="more_phones[]" lay-verify="phone" placeholder="电话" class="layui-input multiple_telephone" value="' + phone + '">' +
                    '</div>' +
                    '<div class="position-title mobile-position-row">' +
                        '<span class="position-label">职位身份</span>' +
                        buildPositionTitleSelectHtml('more_position_title_ids[]', '职位身份（必填）', titleId) +
                    '</div>' +
                    '<button type="button" class="remove-btn">-</button>' +
                '</div>'
            );
            $box.append($row);
        }
        form.render('select');
    })();


    // 监听“所属渠道”下拉改变，联动更新“运营端口”选项
    form.on('select(inquiry_id)', function(data) {
        var inquiryId = data.value;               // 获取选择的渠道ID
        var $portSelect = $('#port_id');          // 运营端口下拉框元素
        $portSelect.empty();                     // 清空当前选项
        if (inquiryId) {
            // 发起 AJAX 请求获取该渠道的端口列表
            $.get("{:url('Client/getPortsByInquiry')}", { inquiry_id: inquiryId }, function(res) {
                // 默认先添加“请选择运营端口”提示选项
                $portSelect.append('<option value="">请选择运营端口（支持搜索）</option>');
                if (res.code === 0) {
                    var ports = res.data;
                    if (ports.length > 0) {
                        // 动态添加返回的端口列表作为选项
                        $.each(ports, function(index, port) {
                            $portSelect.append('<option value="' + port.id + '">' + port.port_name + '</option>');
                        });
                    } else {
                        // 当前渠道没有端口数据时的提示项
                        $portSelect.append('<option value="">该渠道暂无运营端口</option>');
                    }
                } else {
                    // 接口返回错误，提示加载失败
                    layer.msg(res.msg || '获取端口数据失败', {icon: 5});
                }
                form.render('select');  // 重新渲染下拉框UI
            }, 'json');
        } else {
            // 未选择任何渠道时，恢复默认提示选项
            $portSelect.append('<option value="">请选择运营端口（支持搜索）</option>');
            form.render('select');
        }
    });

    function getValidPortIds() {
        var selected = $('#port_id').val();
        if (typeof selected === 'undefined' || selected === null) {
            return [];
        }
        if (!Array.isArray(selected)) {
            selected = [selected];
        }
        return selected.map(function (v) {
            return $.trim(String(v));
        }).filter(function (v) {
            return v !== '';
        });
    }


    // 提交保存
    form.on('submit(submit)', function (data) {

        // 1) 采集主电话与职位身份（按行）
        var rawPhones = [];
        var rawTitleIds = [];
        var validPhones = [];
        var missingMainTitle = false;
        var $rows = $('#mainPhoneBox .input-row');
        $rows.each(function (idx) {
            var phone = $.trim($(this).find('.multiple_telephone').val()).replace(/\D/g, '');
            var titleId = $.trim($(this).find('.position-title-select').val() || '');
            rawPhones.push(phone);
            rawTitleIds.push(titleId);
            if (phone) {
                validPhones.push(phone);
            }
            // 第一个主电话职位身份非必填；新增主电话填写号码时职位身份必填
            if (idx > 0 && phone && !titleId) {
                layer.msg('第' + (idx + 1) + '个主电话请填写职位身份');
                missingMainTitle = true;
                return false;
            }
        });
        if (missingMainTitle) {
            return false;
        }


        // console.log($('.multiple_telephone').first().val());
        // console.log($('input[name="phone2"]').val());
        // return false;


        // 去重并仅保留11位数字
        var phones = Array.from(new Set(validPhones.filter(function (v) { return /^\d{11}$/.test(v); })));


        //至少一个有效主电话
        if (phones.length === 0) {
            layer.msg('请至少填写一个11位主电话');
            return false;
        }

        // 2) 校验辅助电话，并确保与主电话不同
        var aux = $.trim($('input[name="phone2"]').val()).replace(/\D/g, '');
        if (aux && !/^\d{11}$/.test(aux)) {
            layer.msg('辅助电话必须为11位数字');
            return false;
        }
        if (aux && phones.indexOf(aux) > -1) {
            layer.msg('主电话与辅助电话不能相同');
            return false;
        }
        var auxTitleId = $.trim($('select[name="phone2_position_title_id"]').val() || '');
        if (aux && !auxTitleId) {
            layer.msg('填写辅助电话时，职位身份必填');
            return false;
        }

        // 3) 前端强校验：所属渠道/运营端口
        var inquiryId = $.trim($('#inquiry_id').val() || '');
        if (!inquiryId) {
            layer.msg('请选择所属渠道');
            return false;
        }
        var portIds = getValidPortIds();
        if (portIds.length === 0) {
            layer.msg('请选择运营端口');
            return false;
        }

        // 4) 将主电话与职位身份以 JSON 数组方式提交，后端支持 JSON / 数组
        data.field.more_phones = JSON.stringify(rawPhones);
        data.field.more_position_title_ids = JSON.stringify(rawTitleIds);
        data.field.more_phone_title_ids = data.field.more_position_title_ids;
        data.field.phone2_position_title_id = auxTitleId;
        data.field.inquiry_id = inquiryId;
        data.field.port_id = portIds;

        // 5) 清理可能存在的旧字段，避免干扰（容错）
        delete data.field['more_phones[]'];
        delete data.field['more_position_title_ids[]'];
        delete data.field['phone'];
        delete data.field['port_id[]'];

        $.post("{:url('Client/edit')}", data.field, function (res) {
            if (res.code === 0) {
                layer.msg(res.msg, { time: 1500 }, function () {
                    var index = parent.layer.getFrameIndex(window.name);
                    parent.layer.close(index);
                    parent.layui.table.reload('table-list');
                });
            } else {
                layer.msg(res.msg || '保存失败', { time: 2000 });
            }
        }, 'json');
        return false;
    });
});
</script>
