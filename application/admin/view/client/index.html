                </div>
            </div>
        </div>
    </div>
    {include file="common/foot"/}
    <script>
        layui.use(['table', 'form', 'upload', 'util', 'laydate'], function () {
            var table = layui.table,
                form = layui.form,
                laydate = layui.laydate,
                $ = layui.jquery,
                upload = layui.upload,
                util = layui.util;

            var CLIENT_ADV_SEARCH_STORAGE_KEY = 'client_index_advanced_search_expanded';
            var CLIENT_ADV_SEARCH_CLICK_NS = 'clientAdvSearchToggle';

            /** 打开「申请成交客户」弹窗（上传凭证 + 说明） */
            function openApplySuccessClientDialog(leadsId, onSuccess) {
                var dlgIndex;
                var html = '<div style="padding:15px 20px 5px;">' +
                    '<div class="layui-form-item"><label class="layui-form-label">成交凭证</label><div class="layui-input-block">' +
                    '<button type="button" class="layui-btn layui-btn-sm" id="btnUploadProof">上传图片</button>' +
                    '<input type="hidden" id="proof_image" value="">' +
                    '<div id="proofPreview" style="margin-top:8px;"></div></div></div>' +
                    '<div class="layui-form-item"><label class="layui-form-label">申请说明</label><div class="layui-input-block">' +
                    '<textarea id="apply_remark" class="layui-textarea" placeholder="选填"></textarea></div></div></div>';
                dlgIndex = layer.open({
                    type: 1,
                    title: '申请成交客户',
                    area: ['500px', '380px'],
                    content: html,
                    btn: ['提交申请', '取消'],
                    yes: function () {
                        var proofImage = $.trim($('#proof_image').val());
                        if (!proofImage) {
                            layer.msg('请上传成交凭证', { icon: 2 });
                            return;
                        }
                        $.post("{:url('Client/applySuccessClient')}", {
                            leads_id: leadsId,
                            proof_image: proofImage,
                            apply_remark: $.trim($('#apply_remark').val())
                        }, function (res) {
                            if (res.code === 0) {
                                layer.msg(res.msg || '提交成功', { icon: 1, time: 1500 });
                                layer.close(dlgIndex);
                                if (typeof onSuccess === 'function') {
                                    onSuccess();
                                }
                            } else {
                                layer.msg(res.msg || '提交失败', { icon: 2, time: 2000 });
                            }
                        });
                    },
                    success: function () {
                        upload.render({
                            elem: '#btnUploadProof',
                            url: "{:url('UpFiles/upload')}",
                            accept: 'images',
                            done: function (res) {
                                if (res.code == 1 && res.url) {
                                    $('#proof_image').val(res.url);
                                    $('#proofPreview').html('<img src="' + res.url + '" style="max-width:220px;max-height:140px;border:1px solid #eee;">');
                                } else {
                                    layer.msg(res.info || '上传失败', { icon: 2 });
                                }
                            }
                        });
                    }
                });
            }

            function applyAdvancedSearchState() {
                var $fs = $('#clientAdvancedSearchFieldset');
                var $body = $('#clientAdvancedSearchBody');
                var $btn = $('#toggleClientAdvancedSearch');
                if (!$fs.length || !$body.length || !$btn.length) {
                    return;
                }
                $body.stop(true, true);
                var raw = null;
                try {
                    raw = localStorage.getItem(CLIENT_ADV_SEARCH_STORAGE_KEY);
                } catch (e) {}
                var expanded = (raw === '1');
                $body.css({ display: '', height: '', overflow: '', marginTop: '', marginBottom: '', paddingTop: '', paddingBottom: '' });
                if (expanded) {
                    $fs.removeClass('advanced-search-collapsed');
                    $btn.text('收起');
                } else {
                    $fs.addClass('advanced-search-collapsed');
                    $btn.text('展开');
                }
            }

            function bindAdvancedSearchToggle() {
                var $fs = $('#clientAdvancedSearchFieldset');
                var $body = $('#clientAdvancedSearchBody');
                var $btn = $('#toggleClientAdvancedSearch');
                if (!$fs.length || !$body.length || !$btn.length) {
                    return;
                }
                $btn.off('click.' + CLIENT_ADV_SEARCH_CLICK_NS).on('click.' + CLIENT_ADV_SEARCH_CLICK_NS, function () {
                    if ($fs.hasClass('advanced-search-collapsed')) {
                        $fs.removeClass('advanced-search-collapsed');
                        $body.stop(true, true).slideDown(200);
                        $btn.text('收起');
                        try {
                            localStorage.setItem(CLIENT_ADV_SEARCH_STORAGE_KEY, '1');
                        } catch (e) {}
                    } else {
                        $body.stop(true, true).slideUp(200, function () {
                            $fs.addClass('advanced-search-collapsed');
                        });
                        $btn.text('展开');
                        try {
                            localStorage.setItem(CLIENT_ADV_SEARCH_STORAGE_KEY, '0');
                        } catch (e) {}
                    }
                });
            }

            function bindClientAdvancedSelectLayerFix() {
                var $scope = $('#clientAdvancedSearchFieldset');
                if (!$scope.length) {
                    return;
                }

                function clearSelectOpenTop() {
                    $scope.find('.select-open-top').removeClass('select-open-top');
                }

                function raiseCurrentSelect($selectWrap) {
                    clearSelectOpenTop();
                    $selectWrap.closest('.layui-input-inline').addClass('select-open-top');
                    $selectWrap.closest('.layui-inline').addClass('select-open-top');
                    $selectWrap.closest('.layui-form-item').addClass('select-open-top');
                }

                $scope.off('click.clientAdvSelectTop', '.layui-form-select .layui-select-title')
                    .on('click.clientAdvSelectTop', '.layui-form-select .layui-select-title', function () {
                        var $selectWrap = $(this).closest('.layui-form-select');
                        setTimeout(function () {
                            if ($selectWrap.hasClass('layui-form-selected')) {
                                raiseCurrentSelect($selectWrap);
                            } else {
                                clearSelectOpenTop();
                            }
                        }, 0);
                    });

                $(document).off('click.clientAdvSelectTopDoc').on('click.clientAdvSelectTopDoc', function () {
                    setTimeout(function () {
                        var hasOpened = $scope.find('.layui-form-select.layui-form-selected').length > 0;
                        if (!hasOpened) {
                            clearSelectOpenTop();
                        }
                    }, 0);
                });
            }

            applyAdvancedSearchState();
            bindAdvancedSearchToggle();
            bindClientAdvancedSelectLayerFix();
            window.clientIndexAdvancedSearch = {
                applyState: applyAdvancedSearchState,
                bindToggle: bindAdvancedSearchToggle
            };

            var tableId = 'table-list';
            var pageKey = 'client_index_table';
            var columnWidthKey = 'layui_col_width_' + pageKey + '_{:session("aid")}';
            var tableIn = null;
            var lastSnapshot = {};

            function personclientEscapeHtml(s) {
                if (s == null) return '';
                return String(s)
                    .replace(/&/g, '&amp;')
                    .replace(/</g, '&lt;')
                    .replace(/>/g, '&gt;')
                    .replace(/"/g, '&quot;');
            }

            // 表格列定义（先定义，再在 restoreColWidth 后渲染）
            var cols = [[
                    { checkbox: true, fixed: true , width: 50},
                    { field: 'id', title: 'ID', hide: true },
                    {
                        field: 'kh_name', title: '客户名称', width:180, templet: function (res) {
                            return "<a href='{:url(\"dialogue\")}?id=" + res.id + "'>" + res.kh_name + "</a>";
                        }
                    },
                    { field: 'product_name', title: '产品名称', width:180 }, 
                    { field: 'main_phone', title: '主电话', width: 180 },
                    { field: 'aux_phone', title: '辅助电话', width: 180 },
                    { field: 'inquiry_name', title: '所属渠道', width:180 },
                    { field: 'port_name', title: '运营端口', width:180 },
                    {
                        field: 'main_phone_position_titles',
                        title: '主电话职位身份',
                        width: 220,
                        templet: function(d){
                            return personclientEscapeHtml(d.main_phone_position_titles || '');
                        }
                    },
                    {
                        field: 'aux_phone_position_titles',
                        title: '辅助电话职位身份',
                        width: 220,
                        templet: function(d){
                            return personclientEscapeHtml(d.aux_phone_position_titles || '');
                        }
                    },
                    { field: 'pr_user', title: '负责人', width:180 },
                    {
                        field: 'kh_rank_text', title: '客户级别', width: 120, templet: function(d) {
                            var v = d.kh_rank_text || d.kh_rank_name || d.kh_rank || '';
                            if (/^\d+$/.test(v)) return '';
                            return v;
                        }
                    },
                    {
                        field: 'issuccess', title: '成交状态', templet: function (res) {
                            return res.issuccess == 1 ? '已成交' : '未成交';
                        }, width:180
                    },
                    { field: 'at_time', title: '创建时间', width:180 },
                    { field: 'ut_time', title: '更新时间' , width:180},
                    { field: 'original_creation_time', title: '原来创建时间', width:180,  hide: false,
                        templet: function(d){
                        var v = d.original_creation_time;
                        if (!v) return '';
                        // 如果是纯数字（秒级时间戳）
                        if (/^\d+$/.test(v)) return layui.util.toDateString(v * 1000);
                        // 已经是 'YYYY-MM-DD HH:mm:ss' 字符串，直接显示
                        return v;
                        }
                    },
                    { field: 'original_modification_time', title: '原来修改时间', width:180,  hide: false,
                        templet: function(d){
                        var v = d.original_modification_time;
                        if (!v) return '';
                        // 如果是纯数字（秒级时间戳）
                        if (/^\d+$/.test(v)) return layui.util.toDateString(v * 1000);
                        // 已经是 'YYYY-MM-DD HH:mm:ss' 字符串，直接显示
                        return v;
                        }
                    },
                    { width: 420, align: 'center', toolbar: '#action' }
            ]];

            function restoreColWidth(colArr, callback) {
                var dbWidths = {};
                try {
                    var localWidths = JSON.parse(localStorage.getItem(columnWidthKey) || '{}') || {};
                    $.ajax({
                        url: "{:url('Client/getColWidths')}",
                        type: 'GET',
                        dataType: 'json',
                        data: {
                            page_key: pageKey,
                            table_id: tableId
                        },
                        success: function (res) {
                            if (res && res.code === 0 && res.data && typeof res.data === 'object') {
                                dbWidths = res.data;
                            }
                        },
                        error: function () {
                            console.warn('[colwidth] read db widths failed, fallback to localStorage');
                        },
                        complete: function () {
                            var finalWidths = Object.assign({}, localWidths, dbWidths);
                            try {
                                if (Object.keys(finalWidths).length) {
                                    localStorage.setItem(columnWidthKey, JSON.stringify(finalWidths));
                                }
                            } catch (e) {}

                            (colArr || []).forEach(function (c) {
                                if (!c || !c.field || c.field === '0') {
                                    return;
                                }
                                var w = parseInt(finalWidths[c.field], 10);
                                if (w >= 30 && w <= 3000) {
                                    c.width = w;
                                }
                            });
                            if (typeof callback === 'function') {
                                callback(colArr || []);
                            }
                        }
                    });
                } catch (e) {
                    console.warn('[colwidth] restore failed', e);
                    if (typeof callback === 'function') {
                        callback(colArr || []);
                    }
                }
            }

            function getCurrentWidthsSnapshot() {
                var snapshot = {};
                try {
                    var $view = $('#' + tableId).next('.layui-table-view');
                    if (!$view.length) {
                        return snapshot;
                    }
                    var $headerTable = $view.find('.layui-table-header table').eq(0);
                    var $ths = $headerTable.find('thead tr th');
                    $ths.each(function () {
                        var $th = $(this);
                        var field = $th.attr('data-field');
                        if (!field || field === '0') {
                            return;
                        }
                        var w = parseInt($th.width(), 10);
                        if (w >= 30 && w <= 3000) {
                            snapshot[field] = w;
                        }
                    });
                } catch (e) {
                    console.warn('[colwidth] get snapshot failed', e);
                }
                return snapshot;
            }

            function saveWidths(widthMap) {
                try {
                    var widths = widthMap || getCurrentWidthsSnapshot();
                    if (!widths || !Object.keys(widths).length) {
                        return;
                    }

                    // localStorage 兜底
                    localStorage.setItem(columnWidthKey, JSON.stringify(widths));

                    $.ajax({
                        url: "{:url('Client/saveColWidths')}",
                        type: 'POST',
                        dataType: 'json',
                        data: {
                            page_key: pageKey,
                            table_id: tableId,
                            widths: JSON.stringify(widths)
                        },
                        success: function (res) {
                            if (!res || res.code !== 0) {
                                console.warn('[colwidth] save db widths failed:', (res && res.msg) || 'unknown');
                            }
                        },
                        error: function () {
                            console.warn('[colwidth] save db widths failed: network');
                        }
                    });
                } catch (e) {
                    console.warn('[colwidth] save failed', e);
                }
            }

            function bindResizeSave() {
                var $view = $('#' + tableId).next('.layui-table-view');
                if (!$view.length) {
                    return;
                }
                $(document).off('mouseup.client_colwidth touchend.client_colwidth');
                lastSnapshot = getCurrentWidthsSnapshot();
                $(document).on('mouseup.client_colwidth touchend.client_colwidth', function () {
                    setTimeout(function () {
                        var newSnapshot = getCurrentWidthsSnapshot();
                        if (!Object.keys(newSnapshot).length) {
                            return;
                        }
                        if (JSON.stringify(newSnapshot) !== JSON.stringify(lastSnapshot)) {
                            saveWidths(newSnapshot);
                            lastSnapshot = newSnapshot;
                        }
                    }, 120);
                });
            }

            // 清空表格勾选状态：表格 DOM + 表头 + layui 缓存，避免多次搜索后拿到旧 ids
            function clearTableCheckState(tableId) {
                try { table.clearCheck(tableId); } catch (e) {}
                var $view = $('#' + tableId).next('.layui-table-view');
                if ($view.length) {
                    $view.find('.layui-table-body tbody tr, .layui-table-fixed tbody tr').removeClass('layui-table-checked');
                    $view.find('.layui-table-body tbody .layui-form-checkbox, .layui-table-fixed tbody .layui-form-checkbox').removeClass('layui-form-checked');
                    $view.find('thead .layui-form-checkbox').removeClass('layui-form-checked');
                    $view.find('input[type="checkbox"]').prop('checked', false);
                }
                var cache = table.cache[tableId];
                if (cache && Array.isArray(cache)) {
                    cache.forEach(function (row) {
                        if (row && Object.prototype.hasOwnProperty.call(row, 'LAY_CHECKED')) {
                            delete row.LAY_CHECKED;
                        }
                    });
                }
            }

            function reloadKeepColWidth(reloadOptions) {
                if (!tableIn || typeof tableIn.reload !== 'function') {
                    return;
                }
                var snapshot = {};
                if (typeof getCurrentWidthsSnapshot === 'function') {
                    snapshot = getCurrentWidthsSnapshot() || {};
                }

                if (tableIn && tableIn.config && tableIn.config.cols && tableIn.config.cols[0]) {
                    tableIn.config.cols[0].forEach(function (col) {
                        if (!col || !col.field) {
                            return;
                        }
                        if (snapshot && Object.prototype.hasOwnProperty.call(snapshot, col.field)) {
                            col.width = snapshot[col.field];
                        }
                    });
                }

                if (snapshot && Object.keys(snapshot).length && typeof columnWidthKey !== 'undefined' && typeof localStorage !== 'undefined') {
                    localStorage.setItem(columnWidthKey, JSON.stringify(snapshot));
                }

                if (snapshot && Object.keys(snapshot).length) {
                    saveWidths(snapshot);
                }

                var options = reloadOptions || {};
                tableIn.reload(options);
                setTimeout(function () { clearTableCheckState('table-list'); }, 80);
            }

            restoreColWidth(cols[0], function (finalCols) {
                // 表格初始化（默认不加任何筛选条件）
                tableIn = table.render({
                    elem: '#table-list',
                    id: tableId,
                    url: "{:url('index')}",
                    method: 'post',
                    toolbar: '#topBtn',
                    defaultToolbar: ['filter', 'print', 'exports'],
                    cols: [finalCols],
                    limit: 10,
                    page: { limits: [10, 20, 50, 100, 200, 500,9999999] },
                    parseData: function(res) {
                        // 给每行数据添加aid字段，用于判断权限
                        var aid = '{:session("aid")}';
                        if (res.data && res.data.length > 0) {
                            res.data.forEach(function(item) {
                                item.aid = aid;
                            });
                        }
                        return res;
                    },
                    done: function () {
                        bindResizeSave();
                    }
                });
            });
            // 打开跟进弹窗
            function openFollowDialog(clientId) {
                // 显示加载提示
                var loading = layer.load(1, {shade: [0.1, '#fff']});
                
                // 获取客户信息和跟进记录
                $.ajax({
                    url: "{:url('Client/getClientDetailAndComments')}",
                    method: 'GET',
                    data: {id: clientId},
                    success: function(res) {
                        layer.close(loading);
                        if (res.code === 0) {
                            var clientData = res.data.client;
                            var comments = res.data.comments;
                            
                            // 填充客户信息
                            $('#follow-client-id').text(clientData.id);
                            $('#follow-client-name').text(clientData.kh_name);
                            $('#follow-contact').text(clientData.kh_contact);
                            $('#follow-area').text(clientData.xs_area);
                            $('#follow-source').text(clientData.kh_status);
                            $('#follow-rank').text(clientData.kh_rank_name || clientData.kh_rank || '');
                            $('#follow-user').text(clientData.pr_user);
                            $('#follow-create-time').text(clientData.at_time);
                            $('#follow-last-time').text(clientData.last_up_time || '暂无');
                            $('#follow-last-record').val(clientData.last_up_records || '暂无记录');
                            $('#leads_id').val(clientData.id);
                            
                            // 填充跟进历史
                            var html = '';
                            if (comments.length > 0) {
                                $.each(comments, function(index, item) {
                                    html += '<div class="timeline-item">' +
                                        '<div class="timeline-title">' + item.create_date + '</div>' +
                                        '<div class="timeline-content">' +
                                        '<img src="' + (item.avatar || '/static/admin/images/0.jpg') + '" class="avatar" onerror="this.src=\'/static/admin/images/0.jpg\'">' +
                                        '<strong>' + item.username + '：</strong>' +
                                        item.reply_msg +
                                        '</div>' +
                                        '</div>';
                                });
                            } else {
                                html = '<p>暂无跟进记录</p>';
                            }
                            $('#follow-history-list').html(html);
                            
                            // 显示弹窗
                            var layerIndex = layer.open({
                                type: 1,
                                title: '客户跟进 - ' + clientData.kh_name,
                                area: ['90%', '80%'],
                                content: $('#follow-dialog'),
                                closeBtn: 1, // 显式启用关闭按钮
                                shade: [0.3, '#000'], // 设置遮罩层
                                shadeClose: false, // 不允许点击遮罩关闭
                                success: function(layero, index) {
                                    // 确保弹窗内容正确显示
                                    $('#follow-dialog').show();
                                    
                                    // 添加特定类名以应用 CSS 样式
                                    layero.addClass('follow-dialog-layer');
                                    
                                    // 使用最大 z-index 值
                                    var maxZIndex = 2147483647; // JavaScript 中 z-index 的最大值
                                    
                                    // 修复层级的函数 - 直接设置 style 属性
                                    function fixZIndex() {
                                        if (!layero || !layero.is(':visible')) {
                                            return;
                                        }
                                        
                                        // 强制设置所有遮罩层的 z-index 为 1（除了跟进弹窗的遮罩层）
                                        $('.layui-layer-shade').each(function() {
                                            var shadeElement = this;
                                            // 如果不是跟进弹窗的遮罩层，强制设置为 1
                                            if (!$(shadeElement).hasClass('follow-dialog-shade')) {
                                                shadeElement.style.setProperty('z-index', '1', 'important');
                                            }
                                        });
                                        
                                        // 特别处理特定 ID 的遮罩层，强制设置为 1
                                        var $specificShade = $('#layui-layer-shade100002');
                                        if ($specificShade.length && $specificShade[0]) {
                                            $specificShade[0].style.setProperty('z-index', '1', 'important');
                                        }
                                        
                                        // 确保弹窗有正确的类名
                                        layero.addClass('follow-dialog-layer');
                                        
                                        // 直接设置 style 属性，覆盖任何内联样式
                                        // 使用原生 DOM 方法直接设置，避免被其他代码覆盖
                                        var layerElement = layero[0];
                                        if (layerElement) {
                                            layerElement.style.setProperty('z-index', maxZIndex, 'important');
                                            layerElement.style.setProperty('position', 'fixed', 'important');
                                        }
                                        
                                        // 确保遮罩层的 z-index 低于弹窗
                                        // 尝试多种方式查找遮罩层
                                        var $shade = layero.prev('.layui-layer-shade');
                                        if (!$shade.length) {
                                            // 查找所有遮罩层，选择最后一个（通常是当前弹窗的）
                                            var $allShades = $('.layui-layer-shade');
                                            if ($allShades.length > 0) {
                                                $shade = $allShades.last();
                                            }
                                        }
                                        
                                        // 如果还是找不到，尝试通过父元素查找
                                        if (!$shade.length && layero.parent().length) {
                                            $shade = layero.parent().find('.layui-layer-shade').last();
                                        }
                                        
                                        if ($shade.length && $shade[0]) {
                                            $shade.addClass('follow-dialog-shade');
                                            // 使用原生 DOM 方法直接设置
                                            var shadeElement = $shade[0];
                                            shadeElement.style.setProperty('z-index', (maxZIndex - 1), 'important');
                                            shadeElement.style.setProperty('position', 'fixed', 'important');
                                        }
                                        
                                        // 确保关闭按钮可以点击
                                        var $closeBtn = layero.find('.layui-layer-close');
                                        if ($closeBtn.length) {
                                            $closeBtn.css({
                                                'z-index': maxZIndex,
                                                'position': 'relative',
                                                'pointer-events': 'auto',
                                                'cursor': 'pointer'
                                            });
                                        }
                                    }
                                    
                                    // 立即执行一次
                                    fixZIndex();
                                    
                                    // 使用 setTimeout 确保 DOM 完全渲染后再设置
                                    setTimeout(fixZIndex, 10);
                                    setTimeout(fixZIndex, 50);
                                    setTimeout(fixZIndex, 100);
                                    setTimeout(fixZIndex, 200);
                                    setTimeout(fixZIndex, 500);
                                    
                                    // 使用定时器持续监控并修复层级（每100ms检查一次，更频繁）
                                    var zIndexTimer = setInterval(function() {
                                        if (layero.is(':visible')) {
                                            fixZIndex();
                                        } else {
                                            // 弹窗已关闭，清除定时器
                                            clearInterval(zIndexTimer);
                                        }
                                    }, 100);
                                    
                                    // 使用 MutationObserver 监听 DOM 变化
                                    var observer = new MutationObserver(function(mutations) {
                                        // 立即修复层级
                                        fixZIndex();
                                    });
                                    
                                    // 监听弹窗和遮罩层的属性变化（包括子元素）
                                    if (layero[0]) {
                                        observer.observe(layero[0], {
                                            attributes: true,
                                            attributeFilter: ['style', 'class'],
                                            subtree: true, // 监听子元素变化
                                            childList: false
                                        });
                                    }
                                    
                                    // 查找并监听遮罩层
                                    var findAndObserveShade = function() {
                                        var $shade = layero.prev('.layui-layer-shade');
                                        if (!$shade.length) {
                                            $shade = $('.layui-layer-shade').last();
                                        }
                                        if ($shade.length && $shade[0]) {
                                            observer.observe($shade[0], {
                                                attributes: true,
                                                attributeFilter: ['style', 'class'],
                                                subtree: false
                                            });
                                        }
                                    };
                                    
                                    // 延迟查找遮罩层，因为可能还没创建
                                    setTimeout(findAndObserveShade, 50);
                                    setTimeout(findAndObserveShade, 200);
                                    
                                    // 保存 observer、timer 和修复函数，以便在关闭时清理和在提交后调用
                                    layero.data('zIndexObserver', observer);
                                    layero.data('zIndexTimer', zIndexTimer);
                                    layero.data('fixZIndex', fixZIndex); // 保存修复函数
                                    layero.data('layerIndex', layerIndex); // 保存弹窗索引
                                    
                                    // 将修复函数和弹窗索引也保存到全局，以便提交跟进记录时调用
                                    window.currentFollowDialogFixZIndex = fixZIndex;
                                    window.currentFollowDialogLayerIndex = layerIndex;
                                },
                                end: function() {
                                    // 清理定时器和观察者
                                    var layero = $('.layui-layer[data-index="' + layerIndex + '"]');
                                    if (layero.length) {
                                        var observer = layero.data('zIndexObserver');
                                        var timer = layero.data('zIndexTimer');
                                        if (observer) {
                                            observer.disconnect();
                                        }
                                        if (timer) {
                                            clearInterval(timer);
                                        }
                                    }
                                    // 清理全局修复函数和弹窗索引引用
                                    if (window.currentFollowDialogFixZIndex) {
                                        delete window.currentFollowDialogFixZIndex;
                                    }
                                    if (window.currentFollowDialogLayerIndex) {
                                        delete window.currentFollowDialogLayerIndex;
                                    }
                                    // 弹窗完全关闭后，确保元素被正确隐藏并移除遮挡
                                    $('#follow-dialog').hide().appendTo('body');
                                }
                            });
                        } else {
                            layer.msg(res.msg || '获取客户信息失败');
                        }
                    },
                    error: function() {
                        layer.close(loading);
                        layer.msg('网络错误，获取客户信息失败');
                    }
                });
            }

            // 提交跟进记录
            $('#submit-comment').on('click', function() {
                var replyMsg = $('#reply_msg').val();
                var leadsId = $('#leads_id').val();
                
                if (!replyMsg) {
                    layer.msg('请输入跟进内容');
                    return;
                }
                
                // 显示加载提示
                var loading = layer.load(1, {shade: [0.1, '#fff']});
                
                $.ajax({
                    method: 'post',
                    url: "{:url('Client/comment')}",
                    data: {
                        reply_msg: replyMsg,
                        leads_id: leadsId
                    },
                    success: function (res) {
                        layer.close(loading);
                        
                        // 修复层级的函数
                        var fixZIndexAfterSubmit = function() {
                            // 强制设置所有遮罩层的 z-index 为 1
                            $('.layui-layer-shade').each(function() {
                                var shadeElement = this;
                                if (shadeElement) {
                                    shadeElement.style.setProperty('z-index', '1', 'important');
                                }
                            });
                            
                            // 特别处理特定 ID 的遮罩层
                            var $specificShade = $('#layui-layer-shade100002');
                            if ($specificShade.length && $specificShade[0]) {
                                $specificShade[0].style.setProperty('z-index', '1', 'important');
                            }
                            
                            // 尝试从全局获取修复函数
                            if (window.currentFollowDialogFixZIndex) {
                                window.currentFollowDialogFixZIndex();
                            }
                            // 也尝试从弹窗元素获取修复函数
                            var $followLayer = $('.layui-layer.follow-dialog-layer');
                            if ($followLayer.length) {
                                var fixFunc = $followLayer.data('fixZIndex');
                                if (fixFunc) {
                                    fixFunc();
                                }
                            }
                        };
                        
                        if (res.code === 0) {
                            // 立即修复层级
                            fixZIndexAfterSubmit();
                            
                            // 查找跟进弹窗索引的函数
                            var findFollowLayerIndex = function() {
                                // 尝试从全局获取弹窗索引
                                var followLayerIndex = window.currentFollowDialogLayerIndex;
                                // 也尝试从弹窗元素获取索引
                                if (!followLayerIndex) {
                                    var $followLayer = $('.layui-layer.follow-dialog-layer');
                                    if ($followLayer.length) {
                                        followLayerIndex = $followLayer.data('layerIndex');
                                        if (!followLayerIndex && $followLayer.attr('times')) {
                                            followLayerIndex = $followLayer.attr('times');
                                        }
                                    }
                                }
                                // 如果还是找不到，直接查找包含 #follow-dialog 的弹窗
                                if (!followLayerIndex) {
                                    var $dialogLayer = $('#follow-dialog').closest('.layui-layer');
                                    if ($dialogLayer.length && $dialogLayer.attr('times')) {
                                        followLayerIndex = $dialogLayer.attr('times');
                                    }
                                }
                                return followLayerIndex;
                            };
                            
                            // 显示成功消息
                            layer.msg(res.msg, { time: 1500, icon: 1 });
                            
                            $('#reply_msg').val('');
                            
                            // 更新历史记录
                            var now = new Date();
                            var createDate = now.getFullYear() + '年' + (now.getMonth() + 1) + '月' + now.getDate() + '日 ' 
                                + now.getHours() + ':' + (now.getMinutes() < 10 ? '0' : '') + now.getMinutes();
                            
                            var historyHtml = '<div class="timeline-item">' +
                                '<div class="timeline-title">' + createDate + '</div>' +
                                '<div class="timeline-content">' +
                                '<img src="{$Think.session.avatar|default="/static/admin/images/0.jpg"}" class="avatar" onerror="this.src=\'/static/admin/images/0.jpg\'">' +
                                '<strong>{$Think.session.username}：</strong>' +
                                res.data.reply_msg +
                                '</div>' +
                                '</div>';
                            $('#follow-history-list').prepend(historyHtml);
                            
                            // 更新最新跟进记录显示
                            $('#follow-last-record').val(res.data.reply_msg);
                            $('#follow-last-time').text(createDate);
                            
                            // 更新表格中的最新跟进记录
                            reloadKeepColWidth();
                            
                            // 延迟关闭弹窗，确保数据已更新
                            setTimeout(function() {
                                var followLayerIndex = findFollowLayerIndex();
                                if (followLayerIndex) {
                                    layer.close(parseInt(followLayerIndex));
                                }
                            }, 500); // 延迟500ms关闭，让用户看到成功消息
                        } else {
                            layer.msg(res.msg, {
                                end: function() {
                                    // layer.msg 关闭后修复层级
                                    setTimeout(fixZIndexAfterSubmit, 10);
                                    setTimeout(fixZIndexAfterSubmit, 50);
                                }
                            });
                            // 立即修复层级
                            fixZIndexAfterSubmit();
                        }
                    },
                    error: function () {
                        layer.close(loading);
                        
                        // 修复层级的函数
                        var fixZIndexAfterSubmit = function() {
                            // 强制设置所有遮罩层的 z-index 为 1
                            $('.layui-layer-shade').each(function() {
                                var shadeElement = this;
                                if (shadeElement) {
                                    shadeElement.style.setProperty('z-index', '1', 'important');
                                }
                            });
                            
                            // 特别处理特定 ID 的遮罩层
                            var $specificShade = $('#layui-layer-shade100002');
                            if ($specificShade.length && $specificShade[0]) {
                                $specificShade[0].style.setProperty('z-index', '1', 'important');
                            }
                            
                            if (window.currentFollowDialogFixZIndex) {
                                window.currentFollowDialogFixZIndex();
                            }
                            var $followLayer = $('.layui-layer.follow-dialog-layer');
                            if ($followLayer.length) {
                                var fixFunc = $followLayer.data('fixZIndex');
                                if (fixFunc) {
                                    fixFunc();
                                }
                            }
                        };
                        
                        layer.msg('提交失败', {
                            end: function() {
                                // layer.msg 关闭后修复层级
                                setTimeout(fixZIndexAfterSubmit, 10);
                                setTimeout(fixZIndexAfterSubmit, 50);
                            }
                        });
                        // 立即修复层级
                        fixZIndexAfterSubmit();
                    }
                });
            });
            table.on('tool(table-list)', function (obj) {

                if (obj.event === 'del') {

                        var loading = layer.load(1, { shade: [0.1, '#fff'] });

                            layer.close(loading);
                            if (res.code === 0) {
                                layer.msg(res.msg, { time: 1000, icon: 1 });
                                reloadKeepColWidth();
                            } else {
                                layer.msg('操作失败！', { time: 1000, icon: 2 });
                            }
                        });
                        layer.close(index);
                    });
                } else if (obj.event === 'edit') {
                    layer_add("编辑客户", "{:url('Client/edit')}?id=" + data.id);
                } else if (obj.event === 'alter') {
                    console.log('[转移客户-单条]', {
                        id: data.id,
                        kh_name: data.kh_name || '',
                        pr_user: data.pr_user || '',
                        main_phone: data.main_phone || '',

                } else if (obj.event === 'chengjiao') {
                    openApplySuccessClientDialog(data.id, function () {
                        reloadKeepColWidth();
                    });
                }
            });

            $('body').on('click', '#add', function () {
                layer.open({
                    type: 2,
                    title: '添加客户',
                    closeBtn: 1,
                    area: ['100%', '86%'],
                    anim: 2,
                    shadeClose: false,
                    maxmin: false,
                    content: ["{:url('Client/add')}"]
                });
            });

            // 批量改为未成交（兼容现有 layui table 多选逻辑）
            $('body').on('click', '#batchClientUnSuccess', function () {
                var checkStatus = table.checkStatus('table-list');
                var data = checkStatus.data || [];
                if (data.length === 0) {
                    layer.msg('请选择客户');
                    return;
                }

                var ids = data.map(function (item) {
                    return item.id;
                });

                layer.confirm('确认将选中的客户改为未成交客户吗？', function (index) {
                    $.post("{:url('Client/batchClientUnSuccess')}", { ids: ids }, function (res) {
                        if (res.code === 0) {
                            layer.msg(res.msg, { time: 1000, icon: 1 });
                            reloadKeepColWidth();
                        } else {
                            layer.msg(res.msg || '操作失败', { time: 1500, icon: 2 });
                        }
                    });
                    layer.close(index);
                });
            });

            // 工具栏批量操作（原样保留）；alterAll 仅从当前页可见且已勾选的行取 id，避免缓存残留
            table.on('toolbar(table-list)', function (obj) {
                var checkStatus = table.checkStatus('table-list');
                var data = checkStatus.data || [];
                switch (obj.event) {
                    case 'moveGh':
                        if (data.length === 0) { layer.msg('请选择一行'); }
                        else {
                            var alterList = data.map(function (o) { return o.id; });
                            var currConfirm = layer.confirm('您确定这' + data.length + '个客户转入公海吗？', function () {
                                layer.open({
                                    type: 2,
                                    title: '移入公海',
                                    closeBtn: 1,
                                    area: ['100%', '86%'],
                                    anim: 2,
                                    shadeClose: false,
                                    maxmin: false,
                                    content: ["{:url('Client/toMoveGh')}?ids=" + alterList]
                                });
                            });
                        }
                        break;
                    case 'alterAll':
                        (function () {
                            var tableId = 'table-list';
                            var currentPageRows = Array.isArray(table.cache[tableId]) ? table.cache[tableId] : [];
                            var currentPageMap = {};
                            currentPageRows.forEach(function (row) {
                                var rowId = parseInt(row.id, 10);
                                if (rowId > 0) {
                                    currentPageMap[rowId] = row;
                                }
                            });
                            var checkedRows = table.checkStatus('table-list').data || [];
                            console.log('[转移客户-批量] checkStatus.data', checkedRows);
                            var alterList2 = [];
                            var namesList = [];
                            var seenId = {};
                            checkedRows.forEach(function (row) {
                                var id = parseInt(row.id, 10);
                                if (id > 0 && !seenId[id] && currentPageMap[id]) {
                                    seenId[id] = true;
                                    alterList2.push(id);
                                    namesList.push(currentPageMap[id].kh_name || row.kh_name || '');
                                }
                            });
                            console.log('[转移客户-批量] 最终 ids', alterList2, 'kh_name', namesList);
                            console.log('[客户列表-转移弹窗] 传给 Client/alterPrUser 的 ids=', alterList2.join(','));
                            if (alterList2.length === 0) {
                                layer.msg('请选择当前列表中的客户');
                                return;
                            }
                            var currConfirm2 = layer.confirm('您确定要转移这' + alterList2.length + '个客户吗？', function () {
                                layer.close(currConfirm2);
                                layer.open({
                                    type: 2,
                                    title: '转移客户',
                                    closeBtn: 1,
                                    area: ['100%', '86%'],
                                    anim: 2,
                                    shadeClose: false,
                                    maxmin: false,
                                    content: ["{:url('Client/alterPrUser')}?ids=" + alterList2.join(',')]
                                });
                            });
                        })();
                        break;
                    case 'chengjiaoAll':
                        layer.msg('成交客户已改为申请审核流程，暂不支持批量直接成交，请逐个客户提交成交申请。', { icon: 0, time: 3000 });
                        break;
                    case 'delAlls':
                        if (data.length === 0) {
                            layer.msg('请先选择要删除的客户');
                        } else {
                            var ids2 = data.map(function (o) { return o.id; });
                            layer.confirm('确定删除选中的' + ids2.length + '个客户？', function (index) {
                                var loading = layer.load(1, { shade: [0.1, '#fff'] });
                                $.post("{:url('delBatch')}", { ids: ids2 }, function (res) {
                                    layer.close(loading);
                                    if (res.code === 0) {
                                        layer.msg(res.msg, { time: 1000, icon: 1 });
                                        reloadKeepColWidth();
                                    } else {
                                        layer.msg(res.msg || '删除失败', { time: 1500, icon: 2 });
                                    }
                                });
                                layer.close(index);
                            });
                        }
                        break;
                }
            });

            // 监听搜索提交事件：每次查询回到第一页，reload 完成后强制清空勾选
            form.on('submit(LAY-app-contlist-search)', function (data) {
                var keyword = data.field;
                console.log('[客户列表-搜索] keyword', keyword);
                clearTableCheckState('table-list');
                reloadKeepColWidth({
                    url: "{:url('index')}",
                    method: 'post',
                    where: { keyword: keyword },
                    page: { curr: 1 },
                    done: function () {
                        bindResizeSave();
                        clearTableCheckState('table-list');
                        console.log('[客户列表-reload] 查询完成，已清空勾选');
                    }
                });
                return false;
            });

            // 监听所属渠道变化，动态加载对应的运营端口选项

            form.on('select(inquiry_id)', function(data) {
                var inquiryId = data.value;
                var $portSelect = $('#port_id');

                if (inquiryId) {
                    $.get("{:url('Client/getPortsByInquiry')}", {

                    }, function(res) {

                            $portSelect.append('<option value="">请选择运营端口</option>');

                form.render('select');
            });






    

    
    










            // 日期范围选择器初始化
            laydate.render({
                elem: '#at_time',
                range: true,
                trigger: 'click'
            });

            // 批量导入（原样保留）
            var indexMsg;
            upload.render({

                    layer.close(indexMsg);
                    layer.msg('系统繁忙，请稍后...', { time: 1800, icon: 1 });
                }
            });

            // 待办跟进等入口：URL 带 follow_open_id 时自动打开跟进弹窗
            var followOpenId = parseInt('{$followOpenId|default=0}', 10) || 0;
            if (followOpenId > 0 && typeof openFollowDialog === 'function') {
                setTimeout(function () {
                    openFollowDialog(followOpenId);
                }, 400);
            }
        });
    </script>
