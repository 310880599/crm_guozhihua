    <script>
        layui.use(['table', 'form', 'upload', 'util', 'laydate', 'element', 'layer'], function () {
            const { table, form, laydate, upload, util, element } = layui;
            var $ = layui.$;
            var layer = layui.layer;
            var BASE_COL_WIDTH = 180;
            var IMAGE_COL_MIN_WIDTH = 300;
            var IMAGE_COL_WIDTH = 360;

            var defaultToolbar = ['filter'];
            {if session('aid') eq 1}
            defaultToolbar = ['filter', 'print', 'exports'];
            {/if}

            // ========== 列宽 / 列显示 / 列顺序（与待审核订单一致，独立 page_key）==========
            var COLWIDTH_PAGE_KEY = 'client_check_order';
            var COLWIDTH_TABLE_ID = 'table-list';
            var COLCFG_PAGE_KEY = 'client_check_order';
            var COLCFG_TABLE_ID = 'table-list';
            var COLORDER_PAGE_KEY = 'client_check_order';
            var COLORDER_TABLE_KEY = 'main_table';

            var ORDER_COL_FIELD_WHITELIST = [];
            var checkOrderCurrentFilters = {};

            function buildCheckOrderKeywordFromForm() {
                var raw = {};
                $('#searchForm').serializeArray().forEach(function (item) {
                    raw[item.name] = item.value;
                });
                var keyword = {};
                for (var k in raw) {
                    if (!raw.hasOwnProperty(k)) continue;
                    var v = (typeof raw[k] === 'string') ? $.trim(raw[k]) : raw[k];
                    if (v !== '' && v !== null && typeof v !== 'undefined') {
                        keyword[k] = v;
                    }
                }
                if (raw.hasOwnProperty('timebucket')) {
                    var tb = $.trim(raw.timebucket || '');
                    if (tb !== '') keyword.timebucket = tb;
                }
                return keyword;
            }

            function setCheckOrderCurrentFiltersFromForm() {
                var keyword = buildCheckOrderKeywordFromForm();
                if (!keyword.timebucket && !keyword.at_time) {
                    keyword.timebucket = 'month';
                }
                checkOrderCurrentFilters = { keyword: keyword };
                return $.extend(true, {}, checkOrderCurrentFilters);
            }

            function getCheckOrderCurrentFilters() {
                if (!checkOrderCurrentFilters || !checkOrderCurrentFilters.keyword) {
                    return setCheckOrderCurrentFiltersFromForm();
                }
                return $.extend(true, {}, checkOrderCurrentFilters);
            }

            function buildOrderColWhitelist(tableCols) {
                var arr = [];
                (tableCols || []).forEach(function (c) {
                    if (c && c.field) arr.push(String(c.field));
                });
                ORDER_COL_FIELD_WHITELIST = arr;
            }

            function getFieldFromCheckbox($cb) {
                var v = ($cb.attr('value') || '').trim();
                if (v && v !== 'on') return v;
                var n = ($cb.attr('name') || '').trim();
                if (n && n !== 'on') return n;
                var d = ($cb.attr('data-field') || $cb.data('field') || '').toString().trim();

            function applyOrderToCols(cols, orderArr) {
                if (!cols || !cols.length) return cols || [];
                var leftFixed = [], rightFixed = [], normal = [], byField = {};
                cols.forEach(function (c) {
                    if (!c) return;
                    var f = c.field;
                    var isLeft = (c.fixed === 'left' || c.fixed === true) || (c.type === 'numbers' || c.type === 'checkbox');
                    var isRight = c.fixed === 'right';
                    if (isLeft) { leftFixed.push(c); return; }
                    if (isRight) { rightFixed.push(c); return; }
                    if (f && f !== '0' && !/^\d+$/.test(String(f))) {
                        normal.push(c);
                        byField[f] = c;
                    } else {
                        normal.push(c);
                    }
                });
                var ordered = [];
                var used = {};
                if (orderArr && orderArr.length) {
                    orderArr.forEach(function (field) {
                        if (byField[field] && !used[field]) {
                            ordered.push(byField[field]);
                            used[field] = true;
                        }
                    });
                }
                normal.forEach(function (c) {
                    var f = c.field;
                    if (f && f !== '0' && !/^\d+$/.test(String(f)) && !used[f]) ordered.push(c);
                });
                return leftFixed.concat(ordered).concat(rightFixed);
            }

            function parseImages(val) {
                if (!val) return [];
                if (Array.isArray(val)) return val;
                var s = String(val).trim();
                if (!s) return [];
                if (s.charAt(0) === '[' || s.charAt(0) === '{') {
                    try {
                        var parsed = JSON.parse(s);
                        if (Array.isArray(parsed)) return parsed;
                        if (parsed && typeof parsed === 'object') {
                            var keys = Object.keys(parsed).sort(function (a, b) {
                                return parseInt(a, 10) - parseInt(b, 10);
                            });
                            if (keys.length && keys.every(function (k) { return /^\d+$/.test(k); })) {
                                return keys.map(function (k) { return parsed[k]; });
                            }
                        }
                    } catch (e) {}
                    try { return s.split(',').map(function(x){ return x.trim(); }).filter(Boolean); } catch (e2) { return []; }
                }
                return s.split(',').map(function(x){ return x.trim(); }).filter(Boolean);
            }

            function escapeHtmlAttr(str) {
                return String(str == null ? '' : str)
                    .replace(/&/g, '&amp;')
                    .replace(/"/g, '&quot;')
                    .replace(/</g, '&lt;');
            }

            function normalizeVoucherRowItems(arr) {
                if (!arr || !arr.length) return [];
                return arr.map(function (item) {
                    if (item == null) return null;
                    if (typeof item === 'string') {
                        var u = item.trim();
                        return u ? { full: u, thumb: u } : null;
                    }
                    if (typeof item === 'object') {
                        var f = item.full || item.url || item.path || item.src || '';
                        var t = item.thumb || item.thumbnail || item.small || f;
                        f = String(f || '').trim();
                        t = String(t || f).trim();
                        return f ? { full: f, thumb: t } : null;
                    }
                    return null;
                }).filter(Boolean);
            }

             */
            function getVoucherImageList(res, rawField, imagesField) {
                var api = res[imagesField];
                if (Array.isArray(api) && api.length > 0) {
                    var fromApi = normalizeVoucherRowItems(api);
                    if (fromApi && fromApi.length > 0) {
                        return fromApi;
                    }
                }
                return normalizeVoucherRowItems(parseImages(res[rawField]));
            }

            function renderVoucherStripCell(res, rawField, imagesField) {
                var on = String(res.order_no || '');
                if (/合计/.test(on)) return '';
                var list = getVoucherImageList(res, rawField, imagesField);
                if (!list || !list.length) return '-';
                var dataImages = encodeURIComponent(JSON.stringify(list));
                var html = '<div class="img-strip voucher-strip" data-images="' + dataImages + '">';
                var hasImg = false;
                for (var i = 0; i < list.length; i++) {
                    var full = list[i].full || list[i].thumb || '';
                    var thumb = list[i].thumb || full;
                    if (full) {
                        hasImg = true;
                        html += '<img class="js-img-gallery-preview voucher-item-img" data-index="' + i
                            + '" data-full="' + escapeHtmlAttr(full) + '" src="' + escapeHtmlAttr(thumb) + '" loading="lazy" alt="">';
                    }
                }
                html += '</div>';
                return hasImg ? html : '-';
            }

                    var hMain = $(this).outerHeight() || 0;
                    var hLeft = $leftTrs.eq(i).outerHeight() || 0;
                    var hRight = $rightTrs.eq(i).outerHeight() || 0;
                    var maxH = Math.max(hMain, hLeft, hRight);
                    if (maxH > 0) {

                        $cb.attr('data-field', field);
                        $item.addClass('col-sort-item');
                        if ($item.find('.drag-handle').length === 0) {
                            $item.prepend('<span class="drag-handle" title="拖拽排序" style="cursor: move; user-select:none; display:inline-block; margin-right:6px;">&#9776;</span>');
                        }
                    });
                    new Sortable(panel, {
                        draggable: '.col-sort-item',
                        handle: '.drag-handle',
                        animation: 150,
                        ghostClass: 'col-sort-ghost',
                        chosenClass: 'col-sort-chosen',
                        filter: 'input, .layui-form-checkbox, .layui-icon',
                        preventOnFilter: false,
                        onEnd: function () {
                            var orderArr = [];
                            $panel.find('.col-sort-item').each(function () {
                                var f = ($(this).attr('data-field') || '').trim();
                                if (f && f !== 'on') orderArr.push(f);
                            });
                            if (!orderArr.length) return;
                            orderArr = orderArr.filter(function (f) {
                                return ORDER_COL_FIELD_WHITELIST.indexOf(f) !== -1;
                            });
                            if (!orderArr.length) return;
                            saveColOrder(orderArr);
                            applyOrderAndRerender(orderArr);
                        }
                    });
                    panel.setAttribute('data-col-sortable-inited', '1');
                }
                if (!__colSortObserverInited) {
                    __colSortObserverInited = true;
                    var observer = new MutationObserver(function () {
                        var panel = document.querySelector('.layui-table-tool-panel');
                        if (panel) initSortable(panel);
                    });
                    observer.observe(document.body, { childList: true, subtree: true });
                }
                var panel0 = document.querySelector('.layui-table-tool-panel');
                if (panel0) initSortable(panel0);
            }

            function reloadTableWithDbCols(extraOpt) {
                ensureColsMaster();
                var cols0 = cloneCols0(CHECK_ORDER_COLS_MASTER);
                restoreColOrder(cols0);
                restoreColConfig(cols0);
                restoreColWidth(cols0);
                var where = getCheckOrderCurrentFilters();
                var url = (tableIn.config && tableIn.config.url) ? tableIn.config.url : '{:url("checkOrder")}';
                var opt = { cols: [cols0], where: where, url: url };
                if (extraOpt && typeof extraOpt === 'object') {
                    for (var k in extraOpt) {
                        if (extraOpt.hasOwnProperty(k)) opt[k] = extraOpt[k];
                    }
                }
                tableIn.reload(opt);
            }

            buildOrderColWhitelist(checkOrderCols[0]);

            table.on('tool(table-list)', function (obj) {
                var data = obj.data;
            });

            table.on('toolbar(table-list)', function (obj) {
                table.checkStatus(obj.config.id);
            });

            form.on('submit(LAY-app-contlist-search)', function (data) {
                setCheckOrderCurrentFiltersFromForm();
                reloadTableWithDbCols({
                    where: getCheckOrderCurrentFilters(),
                    page: { curr: 1 }
                });
                return false;
            });

            element.render('collapse');

            laydate.render({
                elem: '#at_time',
                range: true,
                trigger: 'click'
            });

            form.on('select(dateRange)', function (data) {
                const isCustom = data.value === '';
                $('#at_time').toggle(isCustom);
                if (!isCustom) {
                    $('#at_time').val('');
                }
            });

            $('#at_time').hide();

            // === 图片预览功能（支持缩放/拖拽）开始 ===
            // 统一的图片预览函数（从 add.html 复制，支持缩放/拖拽）
            function openZoomPreview(imgSrc) {
                if (!imgSrc) return;

                // 缩放参数
                var scale = 1;
                var minScale = 0.2;
                var maxScale = 6;

                // 位置（用于拖拽）
                var translateX = 0, translateY = 0;
                var isDragging = false;
                var startX = 0, startY = 0;

                function clamp(v, min, max) { return Math.max(min, Math.min(max, v)); }

                function applyTransform() {
                    var $img = $('#previewZoomImg');
                    $img.css('transform', 'translate(' + translateX + 'px,' + translateY + 'px) scale(' + scale + ')');
                    $('#zoomRateText').text(Math.round(scale * 100) + '%');
                }

                function resetTransform() {
                    scale = 1;
                    translateX = 0;
                    translateY = 0;
                    applyTransform();
                }

                function zoomBy(delta, centerX, centerY) {
                    var oldScale = scale;
                    scale = clamp(scale + delta, minScale, maxScale);

                    // 以鼠标点为中心缩放（体验更好）
                    if (centerX != null && centerY != null) {
                        translateX = translateX - centerX * (scale / oldScale - 1);
                        translateY = translateY - centerY * (scale / oldScale - 1);
                    }
                    applyTransform();
                }

                var html = ''
                    + '<div id="previewWrap" style="position:relative; width:100%; height:100%; background:#000;">'
                    + '  <div id="previewToolbar" style="position:absolute; top:12px; left:12px; z-index:9999; display:flex; gap:8px; align-items:center;">'
                    + '    <button type="button" class="layui-btn layui-btn-sm" id="btnZoomIn">放大 +</button>'
                    + '    <button type="button" class="layui-btn layui-btn-sm" id="btnZoomOut">缩小 -</button>'
                    + '    <button type="button" class="layui-btn layui-btn-sm layui-btn-primary" id="btnZoomReset">重置</button>'
                    + '    <span id="zoomRateText" style="color:#fff; font-size:12px; margin-left:6px;">100%</span>'
                    + '  </div>'
                    + '  <div id="previewStage" style="position:absolute; inset:0; overflow:auto; padding:20px;">'
                    + '    <div id="previewCanvas" style="position:relative; min-width:100%; min-height:100%; display:flex; align-items:flex-start; justify-content:center;">'
                    + '      <img id="previewZoomImg" src="' + imgSrc + '" style="transform-origin: top center; max-width:none; user-select:none; cursor:grab;" />'
                    + '    </div>'
                    + '  </div>'
                    + '</div>';

                layer.open({
                    type: 1,
                    title: '图片预览（可放大缩小，滚轮缩放，拖拽移动）',
                    closeBtn: 1,
                    shadeClose: true,
                    area: ['90vw', '90vh'],
                    content: html,
                    success: function(layero) {
                        // 初始化
                        resetTransform();

                        // 关键：关闭按钮点击阻止冒泡（可选但更稳）
                        layero.find('.layui-layer-close').off('click.previewCloseFix').on('click.previewCloseFix', function(ev){
                            ev.stopPropagation();
                        });

                        // 按钮事件（先解绑再绑定，避免重复）
                        $('#btnZoomIn').off('click.preview').on('click.preview', function() { zoomBy(0.2); });
                        $('#btnZoomOut').off('click.preview').on('click.preview', function() { zoomBy(-0.2); });
                        $('#btnZoomReset').off('click.preview').on('click.preview', function() {
                            resetTransform();
                        });

                        // 鼠标滚轮缩放（在预览区域内）
                        $('#previewStage').off('wheel.preview').on('wheel.preview', function(ev) {
                            ev.preventDefault();
                            var oe = ev.originalEvent || ev;
                            var delta = (oe.deltaY > 0) ? -0.12 : 0.12;

                            var rect = this.getBoundingClientRect();
                            var cx = (oe.clientX || 0) - rect.left;
                            var cy = (oe.clientY || 0) - rect.top;

                            zoomBy(delta, cx, cy);
                        });

                        // 拖拽移动（按住图片拖动）
                        $('#previewZoomImg').off('mousedown.preview').on('mousedown.preview', function(ev) {
                            isDragging = true;
                            startX = ev.clientX;
                            startY = ev.clientY;
                            $(this).css('cursor', 'grabbing');
                            ev.preventDefault();
                            ev.stopPropagation();
                        });

                        // 用命名空间绑定，避免影响别的页面逻辑
                        $(document)
                            .off('mousemove.previewDrag').on('mousemove.previewDrag', function(ev) {
                                if (!isDragging) return;
                                var dx = ev.clientX - startX;
                                var dy = ev.clientY - startY;
                                startX = ev.clientX;
                                startY = ev.clientY;
                                translateX += dx;
                                translateY += dy;
                                applyTransform();
                            })
                            .off('mouseup.previewDrag').on('mouseup.previewDrag', function() {
                                if (!isDragging) return;
                                isDragging = false;
                                $('#previewZoomImg').css('cursor', 'grab');
                            });
                    },
                    end: function() {
                        // 记录关闭时间：防止点右上角 X 时 click 穿透到底下图片又触发打开
                        window.__IMG_PREVIEW_CLOSE_AT__ = Date.now();

                        // 清理拖拽事件
                        $(document).off('mousemove.previewDrag mouseup.previewDrag');
                    }
                });
            }

            // 新增：图片组预览函数（支持上一张/下一张切换，保持缩放/拖拽功能）
            function openZoomPreviewGallery(images, startIndex) {
                if (!images || images.length === 0) return;
                if (startIndex < 0 || startIndex >= images.length) startIndex = 0;

                // 统一处理：将 images 转换为 full 地址数组
                var fullImages = [];
                for (var i = 0; i < images.length; i++) {
                    var img = images[i];
                    if (typeof img === 'string') {
                        fullImages.push(img);
                    } else if (img && img.full) {
                        fullImages.push(img.full);
                    } else if (img && img.thumb) {
                        fullImages.push(img.thumb);
                    }
                }
                if (fullImages.length === 0) return;

                var currentIndex = startIndex;
                var totalImages = fullImages.length;

                // 缩放参数
                var scale = 1;
                var minScale = 0.2;
                var maxScale = 6;

                // 位置（用于拖拽）
                var translateX = 0, translateY = 0;
                var isDragging = false;
                var startX = 0, startY = 0;

                function clamp(v, min, max) { return Math.max(min, Math.min(max, v)); }

                function applyTransform() {
                    var $img = $('#previewZoomImg');
                    $img.css('transform', 'translate(' + translateX + 'px,' + translateY + 'px) scale(' + scale + ')');
                    $('#zoomRateText').text(Math.round(scale * 100) + '%');
                }

                // 重置缩放和位置（切换图片时调用）
                function resetTransform() {
                    scale = 1;
                    translateX = 0;
                    translateY = 0;
                    applyTransform();
                }

                function zoomBy(delta, centerX, centerY) {
                    var oldScale = scale;
                    scale = clamp(scale + delta, minScale, maxScale);

                    // 以鼠标点为中心缩放（体验更好）
                    if (centerX != null && centerY != null) {
                        translateX = translateX - centerX * (scale / oldScale - 1);
                        translateY = translateY - centerY * (scale / oldScale - 1);
                    }
                    applyTransform();
                }

                // 切换图片
                function switchImage(newIndex) {
                    if (newIndex < 0 || newIndex >= totalImages) return;
                    currentIndex = newIndex;
                    
                    // 切换图片时自动重置缩放和位置（避免继承上一张的 transform）
                    resetTransform();
                    
                    // 更新图片源
                    $('#previewZoomImg').attr('src', fullImages[currentIndex]);
                    
                    // 更新计数器显示
                    $('#galleryCounter').text((currentIndex + 1) + ' / ' + totalImages);
                    
                    // 更新按钮状态
                    $('#btnPrev').prop('disabled', currentIndex === 0);
                    $('#btnNext').prop('disabled', currentIndex === totalImages - 1);
                }

                var html = ''
                    + '<div id="previewWrap" style="position:relative; width:100%; height:100%; background:#000;">'
                    + '  <div id="previewToolbar" style="position:absolute; top:12px; left:12px; z-index:9999; display:flex; gap:8px; align-items:center; flex-wrap:wrap;">'
                    + '    <button type="button" class="layui-btn layui-btn-sm" id="btnPrev">上一张 ←</button>'
                    + '    <button type="button" class="layui-btn layui-btn-sm" id="btnNext">下一张 →</button>'
                    + '    <span id="galleryCounter" style="color:#fff; font-size:12px; margin:0 8px;">' + (currentIndex + 1) + ' / ' + totalImages + '</span>'
                    + '    <span style="color:#fff; font-size:12px; margin:0 4px;">|</span>'
                    + '    <button type="button" class="layui-btn layui-btn-sm" id="btnZoomIn">放大 +</button>'
                    + '    <button type="button" class="layui-btn layui-btn-sm" id="btnZoomOut">缩小 -</button>'
                    + '    <button type="button" class="layui-btn layui-btn-sm layui-btn-primary" id="btnZoomReset">重置</button>'
                    + '    <span id="zoomRateText" style="color:#fff; font-size:12px; margin-left:6px;">100%</span>'
                    + '  </div>'
                    + '  <div id="previewStage" style="position:absolute; inset:0; overflow:auto; padding:20px;">'
                    + '    <div id="previewCanvas" style="position:relative; min-width:100%; min-height:100%; display:flex; align-items:flex-start; justify-content:center;">'
                    + '      <img id="previewZoomImg" src="' + fullImages[currentIndex] + '" style="transform-origin: top center; max-width:none; user-select:none; cursor:grab;" />'
                    + '    </div>'
                    + '  </div>'
                    + '</div>';

                var layerIndex = layer.open({
                    type: 1,
                    title: '图片预览（可放大缩小，滚轮缩放，拖拽移动，键盘左右键切换）',
                    closeBtn: 1,
                    shadeClose: true,
                    area: ['90vw', '90vh'],
                    content: html,
                    success: function(layero) {
                        // 初始化
                        resetTransform();
                        $('#btnPrev').prop('disabled', currentIndex === 0);
                        $('#btnNext').prop('disabled', currentIndex === totalImages - 1);

                        // 关键：关闭按钮点击阻止冒泡
                        layero.find('.layui-layer-close').off('click.previewCloseFix').on('click.previewCloseFix', function(ev){
                            ev.stopPropagation();
                        });

                        // 上一张/下一张按钮
                        $('#btnPrev').off('click.gallery').on('click.gallery', function() {
                            if (currentIndex > 0) {
                                switchImage(currentIndex - 1);
                            }
                        });
                        $('#btnNext').off('click.gallery').on('click.gallery', function() {
                            if (currentIndex < totalImages - 1) {
                                switchImage(currentIndex + 1);
                            }
                        });

                        // 缩放按钮
                        $('#btnZoomIn').off('click.preview').on('click.preview', function() { zoomBy(0.2); });
                        $('#btnZoomOut').off('click.preview').on('click.preview', function() { zoomBy(-0.2); });
                        $('#btnZoomReset').off('click.preview').on('click.preview', function() {
                            resetTransform();
                        });

                        // 键盘左右键切换图片
                        $(document).off('keydown.galleryPreview').on('keydown.galleryPreview', function(ev) {
                            // 只在预览弹窗打开时响应
                            if (!layero || !layero.is(':visible')) return;
                            
                            if (ev.key === 'ArrowLeft' || ev.keyCode === 37) {
                                ev.preventDefault();
                                if (currentIndex > 0) {
                                    switchImage(currentIndex - 1);
                                }
                            } else if (ev.key === 'ArrowRight' || ev.keyCode === 39) {
                                ev.preventDefault();
                                if (currentIndex < totalImages - 1) {
                                    switchImage(currentIndex + 1);
                                }
                            } else if (ev.key === 'Escape' || ev.keyCode === 27) {
                                ev.preventDefault();
                                layer.close(layerIndex);
                            }
                        });

                        // 鼠标滚轮缩放（在预览区域内）
                        $('#previewStage').off('wheel.preview').on('wheel.preview', function(ev) {
                            ev.preventDefault();
                            var oe = ev.originalEvent || ev;
                            var delta = (oe.deltaY > 0) ? -0.12 : 0.12;

                            var rect = this.getBoundingClientRect();
                            var cx = (oe.clientX || 0) - rect.left;
                            var cy = (oe.clientY || 0) - rect.top;

                            zoomBy(delta, cx, cy);
                        });

                        // 拖拽移动（按住图片拖动）
                        $('#previewZoomImg').off('mousedown.preview').on('mousedown.preview', function(ev) {
                            isDragging = true;
                            startX = ev.clientX;
                            startY = ev.clientY;
                            $(this).css('cursor', 'grabbing');
                            ev.preventDefault();
                            ev.stopPropagation();
                        });

                        // 用命名空间绑定，避免影响别的页面逻辑
                        $(document)
                            .off('mousemove.previewDrag').on('mousemove.previewDrag', function(ev) {
                                if (!isDragging) return;
                                var dx = ev.clientX - startX;
                                var dy = ev.clientY - startY;
                                startX = ev.clientX;
                                startY = ev.clientY;
                                translateX += dx;
                                translateY += dy;
                                applyTransform();
                            })
                            .off('mouseup.previewDrag').on('mouseup.previewDrag', function() {
                                if (!isDragging) return;
                                isDragging = false;
                                $('#previewZoomImg').css('cursor', 'grab');
                            });
                    },
                    end: function() {
                        // 记录关闭时间：防止点右上角 X 时 click 穿透到底下图片又触发打开
                        window.__IMG_PREVIEW_CLOSE_AT__ = Date.now();

                        // 清理事件
                        $(document).off('mousemove.previewDrag mouseup.previewDrag keydown.galleryPreview');
                    }
                });
            }

            // 事件委托：绑定图片组预览（.js-img-gallery-preview）
            $(document).on('click', '.js-img-gallery-preview', function() {
                // 防止关闭后立即点击穿透
                if (window.__IMG_PREVIEW_CLOSE_AT__ && Date.now() - window.__IMG_PREVIEW_CLOSE_AT__ < 350) {
                    return;
                }

                // 获取图片组容器
                var $container = $(this).closest('.img-strip, .voucher-strip');
                if ($container.length === 0) {
                    // 如果没有容器，降级为单图预览
                    var imgSrc = $(this).data('full') || $(this).attr('src');
                    if (imgSrc) openZoomPreview(imgSrc);
                    return;
                }

                // 从 data-images 属性读取图片数组（使用 attr 直接读取，因为数据是 encodeURIComponent 编码的）
                var imagesData = null;
                var encodedData = $container.attr('data-images');
                if (encodedData) {
                    try {
                        imagesData = JSON.parse(decodeURIComponent(encodedData));
                    } catch(e) {
                        console.error('解析图片数据失败', e);
                    }
                }

                if (!imagesData || imagesData.length === 0) {
                    // 降级为单图预览
                    var imgSrc = $(this).data('full') || $(this).attr('src');
                    if (imgSrc) openZoomPreview(imgSrc);
                    return;
                }

                // 获取当前点击的图片索引
                var startIndex = parseInt($(this).data('index')) || 0;
                if (startIndex < 0 || startIndex >= imagesData.length) startIndex = 0;

                // 打开图片组预览
                openZoomPreviewGallery(imagesData, startIndex);
            });

            // 事件委托：绑定单图预览（.js-img-preview，兼容旧数据和其他列）
            $(document).on('click', '.js-img-preview', function() {
                // 防止关闭后立即点击穿透
                if (window.__IMG_PREVIEW_CLOSE_AT__ && Date.now() - window.__IMG_PREVIEW_CLOSE_AT__ < 350) {
                    return;
                }

                // 优先读取data-full属性（原图URL），如果没有则使用src（兼容旧数据）
                var imgSrc = $(this).data('full') || $(this).attr('src');
                if (!imgSrc) return;

                openZoomPreview(imgSrc);
            });
            // === 图片预览功能（支持缩放/拖拽）结束 ===

        });

        /*添加*/
        function resetForm() {
            document.getElementById('searchForm').reset();
        }
    </script>
