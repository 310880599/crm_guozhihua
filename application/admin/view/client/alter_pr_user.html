{include file="common/head"/}
<div class="admin-main layui-anim layui-anim-upbit" ng-app="hd" ng-controller="ctrl">

    <form class="layui-form layui-form-pane">



        <div class="layui-form-item">
            <label class="layui-form-label">客户</label>
            <div class="layui-input-4">
                <input type="text" id="client_name_display" class="layui-input" disabled value="{$client_name}" placeholder="未找到客户">
                <input type="hidden" name="ids" id="ids" value="{$ids}" lay-verify="required">
                {if $ids}<div class="layui-form-mid layui-word-aux" style="margin-top:4px;">客户ID（只读）：{$ids}</div>{/if}
            </div>
        </div>

        <div class="layui-form-item">
            <label class="layui-form-label">负责人</label>
            <div class="layui-input-4" >
                <select id="username" name="username" lay-verify="required" lay-search="">
                    <option value="">请选择负责人</option>
                    {volist name='adminResult' id='vo'}
                    <option value="{$vo.username}">{$vo.username}</option>
                    {/volist}

                </select>
            </div>
        </div>



        <div class="layui-form-item">
            <div class="layui-input-block">
                <button type="button" class="layui-btn" lay-submit="" lay-filter="submit">确认分配</button>
            </div>
        </div>
    </form>
</div>
{include file="common/foot"/}

<script>


    layui.use(['form', 'layer'], function () {
        var form = layui.form, layer = layui.layer,$= layui.jquery;


        //监听提交
        form.on('submit(submit)', function(data){
            var $submitBtn = $('button[lay-filter="submit"]');
            var originalText = $submitBtn.text();

            // 防重复点击：提交期间禁用按钮并提示“提交中...”
            $submitBtn.prop('disabled', true).addClass('layui-btn-disabled').text('提交中...');

            var request = $.post("{:url('Client/alterPrUser')}", data.field, function (res) {
                if (res.code == 0){
                    layer.msg(res.msg,{time:1000},function () {
                        var index = parent.layer.getFrameIndex(window.name); //获取窗口索引
                        parent.layer.close(index); // 关闭layer
                    });
                    window.parent.location.reload();
                } else {
                    layer.msg(res.msg,{time:2000});
                }
            }, 'json');

            // 网络错误等情况的处理
            request.fail(function () {
                layer.msg('请求失败，请稍后重试',{time:2000});
            }).always(function () {
                // 请求结束后恢复按钮状态（成功时一般已经关闭弹窗，这里是兜底）
                $submitBtn.prop('disabled', false).removeClass('layui-btn-disabled').text(originalText);
            });

            return false;
        });
    });
</script>
</body>
</html>
