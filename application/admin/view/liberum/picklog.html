{include file="common/head"/}
<style>
    body { background: #f5f7fa !important; }
    .liberum-log-container { position: absolute; top: 0; left: 0; right: 0; bottom: 0; padding: 20px; background: #f5f7fa; overflow: auto; }
    .search-card { background: #fff; border-radius: 8px; box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08); padding: 16px; margin-bottom: 12px; }
    .search-card .layui-form-item { display: flex; flex-wrap: wrap; align-items: center; margin-bottom: 0; gap: 10px 0; }
    .search-card .layui-inline { display: inline-flex; align-items: center; margin-right: 16px; margin-bottom: 10px; vertical-align: middle; }
    .search-card .layui-form-label {
        width: auto !important;
        min-width: 96px;
        white-space: nowrap;
        padding: 9px 8px 9px 0;
        text-align: right;
        box-sizing: border-box;
    }
    .search-card .layui-input-inline { width: 160px; margin-right: 0; }
    .table-wrapper {
        background: #fff;
        border-radius: 8px;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
        padding: 0;
        overflow: visible;
    }
    .layui-table-view { border: none !important; }
    .layui-table-body { overflow: auto; }
    .layui-table-page {
        flex-shrink: 0;
        background: #fff !important;
        border-top: 1px solid #e0e0e0 !important;
        padding: 12px 20px !important;
    }
    #pickLogTable + .layui-table-view .layui-table-main .layui-table-body { overflow: auto !important; }
    #pickLogTable + .layui-table-view .layui-table-box { overflow: hidden !important; }
    #pickLogTable + .layui-table-view .layui-table-fixed-l .layui-table-body,
    #pickLogTable + .layui-table-view .layui-table-fixed-r .layui-table-body {
        overflow-y: hidden !important;
    }
    #pickLogTable + .layui-table-view .layui-table-fixed-l,
    #pickLogTable + .layui-table-view .layui-table-fixed-r {
        overflow: hidden !important;
    }
</style>

<div class="liberum-log-container">
    <fieldset class="layui-elem-field" style="margin-bottom: 12px;">
        <legend>客户提取记录</legend>
        <div class="search-card">
            <div class="layui-form" lay-filter="pick-log-search-form">
                <div class="layui-form-item" style="margin-bottom: 10px;">
                    <div class="layui-inline">
                        <label class="layui-form-label">日期查询：</label>
                        <div class="layui-input-inline"><input type="text" name="pick_date" id="pick_date" placeholder="请输入日期" class="layui-input"></div>
                    </div>
                    <div class="layui-inline">
                        <label class="layui-form-label">提取人：</label>
                        <div class="layui-input-inline">
                            <select name="pick_user_keyword" lay-search>
                                <option value="">全部</option>
                                {volist name="pickUserList" id="vo"}
                                <option value="{$vo}">{$vo}</option>
                                {/volist}
                            </select>
                        </div>
                    </div>
                    <div class="layui-inline">
                        <label class="layui-form-label">客户名称：</label>
                        <div class="layui-input-inline"><input type="text" name="client_keyword" placeholder="请输入客户名称" class="layui-input"></div>
                    </div>
                    <div class="layui-inline">
                        <label class="layui-form-label">手机号：</label>
                        <div class="layui-input-inline"><input type="text" name="phone" placeholder="请输入手机号" class="layui-input"></div>
                    </div>
                    <div class="layui-inline">
                        <label class="layui-form-label">是否已退回：</label>
                        <div class="layui-input-inline">
                            <select name="is_returned">
                                <option value="">全部</option>
                                <option value="0">未退回</option>
                                <option value="1">已退回</option>
                            </select>
                        </div>
                    </div>
                    <div class="layui-inline">
                        <button class="layui-btn" lay-submit lay-filter="pick-log-search"><i class="layui-icon layui-icon-search"></i>查询</button>
                        <button type="button" class="layui-btn layui-btn-normal" id="pick-log-export"><i class="layui-icon layui-icon-export"></i>导出数据</button>
                        <button type="button" class="layui-btn layui-btn-primary" id="pick-log-reset">重置</button>
                    </div>
                </div>
            </div>
        </div>
    </fieldset>

    <div class="table-wrapper">
        <table class="layui-table" id="pickLogTable" lay-filter="pickLogTable"></table>
    </div>
</div>

<script type="text/html" id="pickLogTopBtn">
    <button type="button" class="layui-btn layui-btn-warm layui-btn-sm" lay-event="batchReturn">
        <i class="layui-icon">&#xe65a;</i>批量退回公海
    </button>
    <button type="button" class="layui-btn layui-btn-danger layui-btn-sm" lay-event="batchHide">
        <i class="layui-icon">&#xe640;</i>批量隐藏记录
    </button>
</script>

{include file="common/foot"/}
<script>
    layui.use(['table', 'form', 'laydate'], function () {
        var table = layui.table, form = layui.form, laydate = layui.laydate, $ = layui.jquery;
        var tableId = 'pickLogTable';
        var baseUrl = "{:url('Liberum/getPickLogList')}";
        var exportUrl = "{:url('Liberum/exportPickLog')}";
        var batchReturnUrl = "{:url('Liberum/batchReturnToLiberum')}";
        var canDangerOperate = {$canDangerOperate|default=0};
        var ghTypeList = <?php echo json_encode(isset($ghTypeList) ? $ghTypeList : [], JSON_UNESCAPED_UNICODE); ?>;

        laydate.render({ elem: '#pick_date' });

        var tableIns = table.render({
            elem: '#' + tableId,
            id: tableId,
            url: baseUrl,
            method: 'get',
            height: 'full-300',
            page: true,
            limit: 10,
            limits: [10, 20, 30, 50, 100],
            toolbar: canDangerOperate ? '#pickLogTopBtn' : false,
            cols: [[
                {type: 'checkbox', fixed: 'left'},
                {field: 'id', title: 'ID', width: 80, sort: true},
                {field: 'client_id', title: '客户ID', width: 110, templet: function (d) { return d.client_id || d.leads_id || ''; }},
                {field: 'client_name', title: '客户名称', width: 180, templet: function (d) { return d.client_name || d.kh_name || ''; }},
                {field: 'client_phone', title: '客户电话', width: 150, templet: function (d) { return d.client_phone || d.phone || ''; }},
                {field: 'pick_user', title: '提取人', width: 130, templet: function (d) { return d.pick_user || d.operator_name || ''; }},
                {field: 'pick_date', title: '提取日期', width: 120},
                {field: 'pick_time', title: '提取时间', width: 180},
                {field: 'before_pr_user', title: '原负责人', width: 130},
                {field: 'before_gh_type_name', title: '提取前公海类型', width: 180, templet: function(d) { return d.before_gh_type_name || d.gh_type || ''; }},
                {field: 'current_pr_user', title: '当前负责人', width: 130, templet: function (d) { return d.current_pr_user || d.pr_user || ''; }},
                {field: 'is_returned', title: '是否已退回', width: 120, templet: function (d) {
                    var returned = parseInt(d.is_returned || 0) === 1;
                    return returned
                        ? '<span class="layui-badge layui-bg-orange">已退回</span>'
                        : '<span class="layui-badge-rim">未退回</span>';
                }}
            ]]
        });

        form.on('submit(pick-log-search)', function (data) {
            table.reload(tableId, {
                where: data.field,
                page: {curr: 1}
            });
            return false;
        });

        $('#pick-log-reset').on('click', function () {
            $('.search-card .layui-input').val('');
            $('select[name="pick_user_keyword"]').val('');
            $('select[name="is_returned"]').val('');
            form.render();
            table.reload(tableId, {
                where: {},
                page: {curr: 1}
            });
        });

        $('#pick-log-export').on('click', function () {
            var field = form.val('pick-log-search-form') || {};
            var query = $.param(field);
            var url = exportUrl + (query ? ('?' + query) : '');
            window.location.href = url;
        });

        table.on('toolbar(' + tableId + ')', function (obj) {
            var checkedData = table.checkStatus(tableId).data || [];
            var ids = [];
            $.each(checkedData, function (_, item) {
                var id = parseInt(item.id, 10);
                if (id > 0) {
                    ids.push(id);
                }
            });
            ids = Array.from(new Set(ids));

            if (obj.event === 'batchReturn') {
                if (!ids.length) {
                    layer.msg('请选择需要退回公海的记录');
                    return;
                }

                var optionsHtml = '<option value="">默认原公海/提取前公海类型</option>';
                $.each(ghTypeList || [], function (_, item) {
                    var id = parseInt(item.id, 10) || 0;
                    var typeName = item.type_name || '';
                    if (id > 0) {
                        optionsHtml += '<option value="' + id + '">' + typeName + '</option>';
                    }
                });

                var contentHtml = ''
                    + '<div style="padding: 16px 20px 4px 20px;">'
                    + '  <div style="margin-bottom: 10px; color: #666;">请选择本次退回公海的类型；不选择则按提取记录里的提取前公海类型退回。</div>'
                    + '  <form class="layui-form" lay-filter="batch-return-gh-form">'
                    + '      <div class="layui-form-item">'
                    + '          <label class="layui-form-label" style="width: 110px;">退回公海类型</label>'
                    + '          <div class="layui-input-block" style="margin-left: 110px;">'
                    + '              <select name="gh_type_id" lay-search>'
                    +                    optionsHtml
                    + '              </select>'
                    + '          </div>'
                    + '      </div>'
                    + '  </form>'
                    + '</div>';

                layer.open({
                    type: 1,
                    title: '批量退回公海',
                    area: ['520px', '240px'],
                    content: contentHtml,
                    btn: ['确认退回', '取消'],
                    success: function () {
                        form.render('select', 'batch-return-gh-form');
                    },
                    yes: function (index, layero) {
                        var $layerDom = layero && layero.length ? layero : $('#layui-layer' + index);
                        var ghTypeRaw = '';
                        if ($layerDom && $layerDom.length) {
                            ghTypeRaw = $.trim($layerDom.find('select[name="gh_type_id"]').val() || '');
                        }
                        var ghTypeId = parseInt(ghTypeRaw, 10) || 0;
                        layer.confirm('确认将选中的客户退回公海吗？如果客户当前负责人已经不是原提取人，系统也会按管理员操作强制退回，并在流入公海记录中记录原当前负责人。', {
                            icon: 3,
                            title: '二次确认'
                        }, function (confirmIndex) {
                            console.log('[picklog] batchReturnToLiberum submit', {
                                gh_type_id: ghTypeId,
                                ids: ids
                            });
                            $.ajax({
                                url: batchReturnUrl,
                                type: 'post',
                                dataType: 'json',
                                data: {
                                    ids: ids,
                                    gh_type_id: ghTypeId
                                },
                                success: function (res) {
                                    if (parseInt(res.code, 10) === 0) {
                                        layer.msg(res.msg || '操作成功');
                                        table.reload(tableId);
                                        layer.close(index);
                                    } else {
                                        layer.msg(res.msg || '操作失败');
                                    }
                                },
                                error: function () {
                                    layer.msg('请求失败，请稍后重试');
                                }
                            });
                            layer.close(confirmIndex);
                        });
                    }
                });
                return;
            }

            if (obj.event === 'batchHide') {
                if (!ids.length) {
                    layer.msg('请选择需要隐藏的记录');
                    return;
                }
                layer.confirm('确定要隐藏选中的客户提取记录吗？隐藏后默认列表将不再显示，但数据库仍会保留记录。', {
                    icon: 3,
                    title: '提示'
                }, function (index) {
                    $.ajax({
                        url: "{:url('Liberum/batchHidePickLog')}",
                        type: 'post',
                        dataType: 'json',
                        data: {ids: ids},
                        success: function (res) {
                            if (parseInt(res.code, 10) === 0) {
                                layer.msg(res.msg || '隐藏成功');
                                table.reload(tableId);
                            } else {
                                layer.msg(res.msg || '隐藏失败');
                            }
                        },
                        error: function () {
                            layer.msg('请求失败，请稍后重试');
                        }
                    });
                    layer.close(index);
                });
            }
        });

    });
</script>
</body>
</html>
