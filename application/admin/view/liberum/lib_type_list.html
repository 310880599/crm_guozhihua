{include file="common/head"/}
<style>
    /* 公海类型列表页面样式优化 - 撑满页面 */
    body {
        background: #f5f7fa !important;
    }
    
    .lib-type-list-container {
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        padding: 20px;
        background: #f5f7fa;
        overflow: auto;
    }
    
    .filtrate-warp {
        margin-bottom: 10px;
    }

    .filtrate-warp .title {
        padding: 5px 12px 7px 12px;
        font-size: 14px;
        font-weight: normal;
        text-align: left;
        cursor: pointer;
        width: 90px;
        background-color: transparent !important;
        color: #333 !important;
    }

    .filtrate-warp .title:hover {
        color: #4285f4;
    }

    .filtrate-warp .flag {
        padding: 6px 12px 6px 12px;
        cursor: pointer;
    }

    .filtrate-warp .flag:hover {
        color: #4285f4;
    }

    .filtrate-warp .layui-badge:hover {
        color: white !important;
    }
    
    /* 表格容器样式 - 撑满可用空间 */
    .lib-type-table-wrapper {
        background: #fff;
        border-radius: 8px;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
        overflow: hidden;
        padding: 0;
        height: calc(100vh - 100px);
        display: flex;
        flex-direction: column;
    }
    
    /* LayUI 表格视图撑满 */
    .layui-table-view {
        flex: 1;
        display: flex;
        flex-direction: column;
        height: 100%;
        border: none !important;
    }
    
    .layui-table-body {
        flex: 1;
        overflow: auto;
    }
    
    /* LayUI 表格工具栏样式优化 */
    .layui-table-tool {
        background: #fff !important;
        padding: 16px 20px !important;
        border-bottom: 1px solid #e0e0e0 !important;
        margin: 0 !important;
        flex-shrink: 0;
        display: flex;
        align-items: center;
    }
    
    .layui-table-tool .layui-btn {
        border-radius: 6px !important;
        transition: all 0.3s ease !important;
        vertical-align: middle !important;
        display: inline-flex !important;
        align-items: center !important;
        gap: 6px;
    }
    
    .layui-table-tool .layui-btn-primary {
        background: #4285f4 !important;
        border-color: #4285f4 !important;
        color: #fff !important;
    }
    
    .layui-table-tool .layui-btn-primary:hover {
        background: #3367d6 !important;
        border-color: #3367d6 !important;
        transform: translateY(-1px);
        box-shadow: 0 4px 12px rgba(66, 133, 244, 0.3);
    }
    
    /* 操作按钮样式优化 - 修复对齐问题 */
    .layui-table-view .layui-table td {
        vertical-align: middle !important;
    }
    
    .layui-table-view .layui-table td .layui-btn-xs {
        border-radius: 4px !important;
        padding: 4px 12px !important;
        font-size: 12px !important;
        transition: all 0.3s ease !important;
        margin: 0 4px !important;
        vertical-align: middle !important;
        display: inline-flex !important;
        align-items: center !important;
        gap: 4px;
        line-height: 1.5 !important;
    }
    
    .layui-table-view .layui-table td .layui-btn-xs:hover {
        transform: translateY(-1px);
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.15);
    }
    
    .layui-table-view .layui-table td .layui-btn-xs:not(.layui-btn-danger) {
        background: #4285f4 !important;
        border-color: #4285f4 !important;
        color: #fff !important;
    }
    
    .layui-table-view .layui-table td .layui-btn-xs:not(.layui-btn-danger):hover {
        background: #3367d6 !important;
        border-color: #3367d6 !important;
    }
    
    .layui-table-view .layui-table td .layui-btn-danger {
        background: #ea4335 !important;
        border-color: #ea4335 !important;
    }
    
    .layui-table-view .layui-table td .layui-btn-danger:hover {
        background: #d33b2c !important;
        border-color: #d33b2c !important;
    }
    
    /* 分页栏样式 */
    .layui-table-page {
        flex-shrink: 0;
        background: #fff !important;
        border-top: 1px solid #e0e0e0 !important;
        padding: 12px 20px !important;
    }
</style>
<div class="lib-type-list-container">
    <fieldset class="layui-elem-field" style="margin-bottom: 12px;">
        <legend>高级查询</legend>
        <div class="layui-card" style="box-shadow: none; margin-top: 10px;">
            <div class="layui-form layui-card-header layuiadmin-card-header-auto"
                 style="border-bottom: transparent; height: auto;">
                <div class="layui-form-item" style="text-align: left; padding-left: 20px;">
                    <div class="layui-inline">
                        <label class="layui-form-label">公海类型：</label>
                        <div class="layui-input-inline">
                            <input type="text" id="type_name" name="type_name" placeholder="请输入公海类型名称" class="layui-input">
                        </div>
                    </div>
                    <div class="layui-inline" style="float: right; padding-bottom: 15px;">
                        <button class="layui-btn layuiadmin-btn-list" lay-submit lay-filter="LAY-lib-type-search">
                            <i class="layui-icon layui-icon-search layuiadmin-button-btn" style="vertical-align: sub;"></i>查询数据
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </fieldset>
    <div class="lib-type-table-wrapper">
        <table class="layui-table" id="table-list" lay-filter="table-list"></table>
    </div>
</div>



<script type="text/html" id="action">
    <a class="layui-btn layui-btn-xs" lay-event="edit"><i class="layui-icon">&#xe642;</i>编辑</a>
    <a class="layui-btn layui-btn-danger layui-btn-xs" lay-event="del"><i class="layui-icon">&#xe640;</i>删除</a>
</script>

<script type="text/html" id="topBtn">
    <button type="button" class="layui-btn layui-btn-primary layui-btn-sm" lay-event="add"><i class="layui-icon">&#xe608;</i>添加公海类型</button>
    <button type="button" class="layui-btn layui-btn-danger layui-btn-sm" lay-event="batchDel"><i class="layui-icon">&#xe640;</i>批量删除</button>
    <button type="button" class="layui-btn layui-btn-warm layui-btn-sm" lay-event="importExcel"><i class="layui-icon">&#xe67c;</i>导入Excel</button>
    <button type="button" class="layui-btn layui-btn-normal layui-btn-sm" lay-event="downloadTpl"><i class="layui-icon">&#xe601;</i>下载模板</button>
</script>


{include file="common/foot"/}
<script>
    layui.use(['table','form','util'], function() {
        var table = layui.table,form = layui.form, $ = layui.jquery,util = layui.util;
        var tableIn = table.render({
            elem: '#table-list',
            id: 'table-list',
            url: '{:url("Liberum/libTypeList")}',
            method: 'post',
            toolbar: '#topBtn',
            page: true,
            cols: [[
                {checkbox:true,fixed: true},
                {field: 'id', title: 'ID', width: 120, fixed: true},
                {field: 'type_name', title: '公海类型', },
                {field: 'creator', title: '创建人', width: 140},
                {field: 'create_time', title:'创建时间',templet:function (res) {
                        var v = res.create_time || res.add_time;
                        if (!v) return '';
                        if (/^\d+$/.test(v)) return util.toDateString(v * 1000);
                        return v;
                    }},
                {field: 'update_time', title:'修改时间',templet:function (res) {
                        var v = res.update_time;
                        if (!v) return '';
                        if (/^\d+$/.test(v)) return util.toDateString(v * 1000);
                        return v;
                    }},
                {title:'操作',width: 260, align: 'center', toolbar: '#action'}
            ]],
            limit: 10 //每页默认显示的数量
        });

        table.on('tool(table-list)', function(obj) {
            var data = obj.data;

            if (obj.event === 'del') {
                layer.confirm('您确定要删除吗？', function(index){
                    var loading = layer.load(1, {shade: [0.1, '#fff']});
                    $.post("{:url('Liberum/libTypeDel')}",{id:data.id},function(res){
                        layer.close(loading);
                        if(res.code===0){
                            layer.msg(res.msg,{time:1000,icon:1});
                            tableIn.reload({page:{curr:1}});
                        }else{
                            layer.msg(res.msg || '操作失败！',{time:1000,icon:2});
                        }
                    }, 'json');
                    layer.close(index);
                });
            }else if(obj.event === 'edit'){
                layer.open({
                    type: 2,
                    title: '编辑公海类型',
                    closeBtn: 1,
                    area: ['550px', '350px'],
                    anim: 2,
                    shadeClose: false,
                    maxmin: true,
                    content: ["{:url('Liberum/libTypeEdit')}?id=" + data.id, 'no'],
                    end: function () {
                        table.reload('table-list');
                    }
                });
            }
        });

        table.on('toolbar(table-list)', function(obj){
            if (obj.event === 'add') {
                layer.open({
                    type: 2,
                    title: '添加公海类型',
                    closeBtn: 1,
                    area: ['500px','260px'],
                    anim: 2,
                    shadeClose: false,
                    maxmin: false,
                    content: ["{:url('Liberum/libTypeAdd')}", 'no'],
                    end: function () {
                        table.reload('table-list');
                    }
                });
            } else if (obj.event === 'batchDel') {
                var rows = table.checkStatus('table-list').data || [];
                if (!rows.length) {
                    return layer.msg('请先勾选要删除的记录', {icon: 0});
                }
                var ids = rows.map(function (r) { return r.id; });
                layer.confirm('确认删除选中的 ' + ids.length + ' 条记录吗？', function(index){
                    $.post("{:url('Liberum/batchLibTypeDel')}", {ids: ids}, function(res){
                        if(res.code===0){
                            layer.msg(res.msg || '删除成功', {time:1000,icon:1});
                            tableIn.reload({page:{curr:1}});
                        }else{
                            layer.msg(res.msg || '操作失败！',{time:1200,icon:2});
                        }
                    }, 'json');
                    layer.close(index);
                });
            } else if (obj.event === 'importExcel') {
                layer.open({
                    type: 2,
                    title: '导入公海类型',
                    closeBtn: 1,
                    area: ['600px', '360px'],
                    anim: 2,
                    shadeClose: false,
                    maxmin: false,
                    content: ["{:url('Liberum/libTypeImport')}", 'no'],
                    end: function () {
                        table.reload('table-list');
                    }
                });
            } else if (obj.event === 'downloadTpl') {
                window.location.href = "{:url('Liberum/libTypeTpl')}";
            }
        });

        form.on('submit(LAY-lib-type-search)', function (data) {
            table.reload('table-list', {
                url: "{:url('Liberum/libTypeList')}",
                where: data.field,
                page: { curr: 1 }
            });
            return false;
        });

    });
</script>
</body>
</html>
