{include file="common/head"/}
<style>
    body { background: #f5f7fa !important; }
    .liberum-log-container { position: absolute; top: 0; left: 0; right: 0; bottom: 0; padding: 20px; background: #f5f7fa; overflow: auto; }
    .search-card { background: #fff; border-radius: 8px; box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08); padding: 16px; margin-bottom: 12px; }
    .search-card .layui-form-item { display: flex; flex-wrap: wrap; align-items: center; margin-bottom: 0; gap: 10px 0; }
    .search-card .layui-inline { display: inline-flex; align-items: center; margin-right: 16px; margin-bottom: 10px; vertical-align: middle; }
    .search-card .layui-form-label {
        width: auto !important;
        min-width: 96px;
        white-space: nowrap;
        padding: 9px 8px 9px 0;
        text-align: right;
        box-sizing: border-box;
    }
    .search-card .layui-input-inline { width: 160px; margin-right: 0; }
    .table-wrapper { background: #fff; border-radius: 8px; box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08); overflow: hidden; padding: 0; height: calc(100vh - 220px); display: flex; flex-direction: column; }
    .layui-table-view { flex: 1; display: flex; flex-direction: column; height: 100%; border: none !important; }
    .layui-table-body { flex: 1; overflow: auto; }
    .layui-table-page { flex-shrink: 0; background: #fff !important; border-top: 1px solid #e0e0e0 !important; padding: 12px 20px !important; }
</style>

<div class="liberum-log-container">
    <fieldset class="layui-elem-field" style="margin-bottom: 12px;">
        <legend>客户流入公海记录</legend>
        <div class="search-card">
            <div class="layui-form" lay-filter="in-log-search-form">
                <div class="layui-form-item" style="margin-bottom: 10px;">
                    <div class="layui-inline">
                        <label class="layui-form-label">日期查询：</label>
                        <div class="layui-input-inline"><input type="text" name="in_date" id="in_date" placeholder="请输入日期" class="layui-input"></div>
                    </div>
                    <div class="layui-inline">
                        <label class="layui-form-label">原负责人：</label>
                        <div class="layui-input-inline"><input type="text" name="before_pr_user_keyword" placeholder="请输入原负责人" class="layui-input"></div>
                    </div>
                    <div class="layui-inline">
                        <label class="layui-form-label">操作人：</label>
                        <div class="layui-input-inline"><input type="text" name="operator_keyword" placeholder="请输入操作人" class="layui-input"></div>
                    </div>
                    <div class="layui-inline">
                        <label class="layui-form-label">流入原因：</label>
                        <div class="layui-input-inline"><input type="text" name="reason" placeholder="请输入流入原因" class="layui-input"></div>
                    </div>
                    <div class="layui-inline">
                        <label class="layui-form-label">客户名称：</label>
                        <div class="layui-input-inline"><input type="text" name="client_keyword" placeholder="请输入客户名称" class="layui-input"></div>
                    </div>
                    <div class="layui-inline">
                        <label class="layui-form-label">手机号：</label>
                        <div class="layui-input-inline"><input type="text" name="phone" placeholder="请输入手机号" class="layui-input"></div>
                    </div>
                    <div class="layui-inline">
                        <label class="layui-form-label">是否已恢复：</label>
                        <div class="layui-input-inline">
                            <select name="is_recovered">
                                <option value="">全部</option>
                                <option value="0">未恢复</option>
                                <option value="1">已恢复</option>
                            </select>
                        </div>
                    </div>
                    <div class="layui-inline">
                        <button class="layui-btn" lay-submit lay-filter="in-log-search"><i class="layui-icon layui-icon-search"></i>查询</button>
                        <button type="button" class="layui-btn layui-btn-normal" id="in-log-export"><i class="layui-icon layui-icon-export"></i>导出数据</button>
                        <button type="button" class="layui-btn layui-btn-primary" id="in-log-reset">重置</button>
                    </div>
                </div>
            </div>
        </div>
    </fieldset>

    <div class="table-wrapper">
        <table class="layui-table" id="inLogTable" lay-filter="inLogTable"></table>
    </div>
</div>

<script type="text/html" id="inLogToolbarTpl">
    <div class="layui-btn-container">
        <button type="button" class="layui-btn layui-btn-normal layui-btn-sm" lay-event="batchRestoreOwner">批量恢复原负责人</button>
        <button type="button" class="layui-btn layui-btn-danger layui-btn-sm" lay-event="batchHide">批量隐藏记录</button>
    </div>
</script>

{include file="common/foot"/}
<script>
    layui.use(['table', 'form', 'laydate'], function () {
        var table = layui.table, form = layui.form, laydate = layui.laydate, $ = layui.jquery;
        var tableId = 'inLogTable';
        var baseUrl = "{:url('Liberum/getInLogList')}";
        var exportUrl = "{:url('Liberum/exportInLog')}";
        var batchRestoreUrl = "{:url('Liberum/batchRestoreOwner')}";
        var batchHideUrl = "{:url('Liberum/batchHideInLog')}";
        var canDangerOperate = {$canDangerOperate|default=0};

        laydate.render({ elem: '#in_date' });

        table.render({
            elem: '#' + tableId,
            id: tableId,
            url: baseUrl,
            method: 'get',
            page: true,
            limit: 10,
            toolbar: canDangerOperate ? '#inLogToolbarTpl' : false,
            cols: [[
                {type: 'checkbox', fixed: 'left'},
                {field: 'id', title: 'ID', width: 80, sort: true},
                {field: 'client_id', title: '客户ID', width: 110, templet: function (d) { return d.client_id || d.leads_id || ''; }},
                {field: 'client_name', title: '客户名称', minWidth: 140, templet: function (d) { return d.client_name || d.kh_name || ''; }},
                {field: 'client_phone', title: '客户电话', minWidth: 130, templet: function (d) { return d.client_phone || d.phone || ''; }},
                {field: 'before_pr_user', title: '原负责人', width: 110},
                {field: 'current_pr_user', title: '当前负责人', width: 110},
                {field: 'reason', title: '流入原因', minWidth: 140},
                {field: 'in_time', title: '流入时间', minWidth: 170},
                {field: 'operator_name', title: '操作人', width: 120, templet: function (d) { return d.operator_name || d.operator_id || ''; }},
                {field: 'current_status', title: '当前状态', width: 100, templet: function (d) {
                    if (d.current_status === null || d.current_status === undefined || d.current_status === '') {
                        return '未知';
                    }
                    var status = parseInt(d.current_status, 10);
                    if (status === 1) return '<span class="layui-badge layui-bg-green">客户</span>';
                    if (status === 2) return '<span class="layui-badge layui-bg-gray">公海</span>';
                    return d.current_status;
                }},
                {field: 'current_gh_type_name', title: '当前公海类型', minWidth: 130, templet: function (d) {
                    return d.current_gh_type_name || d.current_gh_type || '';
                }},
                {field: 'source_type', title: '来源类型', width: 110, templet: function (d) {
                    var sourceType = (d.source_type || '').toString();
                    if (sourceType === 'pick_return') return '提取退回';
                    if (sourceType === 'manual') return '手动移入';
                    if (sourceType === 'auto_rule') return '自动规则流入';
                    if (sourceType === 'pick_log_batch_return') return '批量退回公海';
                    return sourceType;
                }},
                {field: 'is_recovered', title: '是否已恢复', width: 120, templet: function (d) {
                    var recovered = parseInt(d.is_recovered || 0) === 1;
                    return recovered
                        ? '<span class="layui-badge layui-bg-green">已恢复</span>'
                        : '<span class="layui-badge-rim">未恢复</span>';
                }},
                {field: 'recover_operator_name', title: '恢复操作人', width: 120, templet: function (d) {
                    return d.recover_operator_name || d.recover_operator_id || '';
                }},
                {field: 'recovered_time', title: '恢复时间', minWidth: 170}
            ]]
        });

        form.on('submit(in-log-search)', function (data) {
            table.reload(tableId, {
                where: data.field,
                page: {curr: 1}
            });
            return false;
        });

        $('#in-log-reset').on('click', function () {
            $('.search-card .layui-input').val('');
            form.render();
            table.reload(tableId, {
                where: {},
                page: {curr: 1}
            });
        });

        $('#in-log-export').on('click', function () {
            var field = form.val('in-log-search-form') || {};
            var query = $.param(field);
            var url = exportUrl + (query ? ('?' + query) : '');
            window.location.href = url;
        });

        table.on('toolbar(' + tableId + ')', function (obj) {
            var checkStatus = table.checkStatus(tableId);
            var selected = checkStatus.data || [];
            var ids = [];
            $.each(selected, function (idx, row) {
                var id = parseInt(row.id, 10);
                if (id > 0) {
                    ids.push(id);
                }
            });

            if (obj.event === 'batchRestoreOwner') {
                if (!ids.length) {
                    layer.msg('请先勾选需要恢复的记录');
                    return;
                }

                layer.confirm(
                    '确定要恢复选中的客户吗？<br>系统只会恢复当前仍在公海中的客户，<br>已经被别人领取的客户不会恢复。',
                    {icon: 3, title: '确认恢复'},
                    function (index) {
                        layer.close(index);
                        $.post(batchRestoreUrl, {ids: ids}, function (res) {
                            if (res && parseInt(res.code, 10) === 0) {
                                layer.msg(res.msg || '批量恢复成功');
                                var currPageText = $('.layui-laypage-curr em').last().text();
                                var currPage = parseInt(currPageText, 10);
                                if (!(currPage > 0)) {
                                    currPage = 1;
                                }
                                table.reload(tableId, {
                                    page: {curr: currPage}
                                });
                                return;
                            }
                            layer.msg((res && res.msg) ? res.msg : '批量恢复失败');
                        }, 'json').fail(function () {
                            layer.msg('请求失败，请稍后重试');
                        });
                    }
                );
                return;
            }

            if (obj.event === 'batchHide') {
                if (!ids.length) {
                    layer.msg('请选择需要隐藏的记录');
                    return;
                }

                layer.confirm(
                    '确定要隐藏选中的客户流入公海记录吗？隐藏后默认列表将不再显示，但数据库仍会保留记录。',
                    {icon: 3, title: '提示'},
                    function (index) {
                        layer.close(index);
                        $.post(batchHideUrl, {ids: ids}, function (res) {
                            if (res && parseInt(res.code, 10) === 0) {
                                layer.msg(res.msg || '隐藏成功');
                                table.reload(tableId, {
                                    page: {curr: 1}
                                });
                                return;
                            }
                            layer.msg((res && res.msg) ? res.msg : '隐藏失败');
                        }, 'json').fail(function () {
                            layer.msg('请求失败，请稍后重试');
                        });
                    }
                );
            }
        });
    });
</script>
</body>
</html>
