{include file="common/head"/}
<style>
    body { background: #f5f7fa !important; }
    /* 页面外层：仅纵向滚动，避免出现底部多余横向滚动条 */
    .auto-candidate-container {
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        padding: 20px;
        background: #f5f7fa;
        overflow-x: hidden;
        overflow-y: auto;
    }
    .search-card {
        background: #fff;
        border-radius: 8px;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
        padding: 16px;
        margin-bottom: 12px;
    }
    .search-card .layui-form-item {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        margin-bottom: 0;
        gap: 10px 0;
    }
    .search-card .layui-inline {
        display: inline-flex;
        align-items: center;
        margin-right: 14px;
        margin-bottom: 10px;
        vertical-align: middle;
    }
    .search-card .layui-form-label {
        width: auto !important;
        min-width: 96px;
        white-space: nowrap;
        padding: 9px 8px 9px 0;
        text-align: right;
        box-sizing: border-box;
    }
    .search-card .layui-input-inline {
        width: 155px;
        margin-right: 0;
    }
    .search-card .layui-input-inline .xm-select-parent {
        width: 100%;
    }
    .search-card .layui-input-inline .xm-select {
        min-height: 38px;
        line-height: 36px;
    }
    .table-wrapper {
        background: #fff;
        border-radius: 8px;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
        padding: 0;
        overflow: hidden;
    }
    .layui-table-view {
        border: none !important;
        overflow: visible !important;
    }
    .layui-table-page {
        background: #fff !important;
        border-top: 1px solid #e0e0e0 !important;
        padding: 12px 20px !important;
    }
    /* 仅主表区域保留一根横向滚动条；纵向由页面外层滚动 */
    #autoCandidateTable + .layui-table-view .layui-table-box {
        overflow: hidden !important;
    }
    #autoCandidateTable + .layui-table-view .layui-table-body.layui-table-main {
        overflow-x: auto !important;
        overflow-y: hidden !important;
    }
    #autoCandidateTable + .layui-table-view .layui-table-fixed-l .layui-table-body,
    #autoCandidateTable + .layui-table-view .layui-table-fixed-r .layui-table-body {
        overflow: hidden !important;
    }
    #autoCandidateTable + .layui-table-view .layui-table-fixed-l,
    #autoCandidateTable + .layui-table-view .layui-table-fixed-r {
        overflow: hidden !important;
    }
    .candidate-reason-cell {
        white-space: normal;
        line-height: 1.5;
    }
    /* 自动公海候选：右侧固定操作列背景色，避免横向滚动时透明透字 */
    #autoCandidateTable + .layui-table-view .layui-table-fixed-r,
    #autoCandidateTable + .layui-table-view .layui-table-fixed-r .layui-table-header,
    #autoCandidateTable + .layui-table-view .layui-table-fixed-r .layui-table-body,
    #autoCandidateTable + .layui-table-view .layui-table-fixed-r table,
    #autoCandidateTable + .layui-table-view .layui-table-fixed-r th,
    #autoCandidateTable + .layui-table-view .layui-table-fixed-r td,
    #autoCandidateTable + .layui-table-view .layui-table-fixed-r .layui-table-cell {
        background-color: #f0fdf4 !important;
    }
</style>

<div class="auto-candidate-container">
    <fieldset class="layui-elem-field" style="margin-bottom: 12px;">
        <legend>自动公海候选</legend>
        <div class="search-card">
            <div class="layui-form" lay-filter="auto-candidate-search-form">
                <div class="layui-form-item">
                    <div class="layui-inline">
                        <label class="layui-form-label">客户名称：</label>
                        <div class="layui-input-inline">
                            <input type="text" name="client_keyword" placeholder="请输入客户名称" class="layui-input">
                        </div>
                    </div>
                    <div class="layui-inline">
                        <label class="layui-form-label">手机号：</label>
                        <div class="layui-input-inline">
                            <input type="text" name="phone" placeholder="请输入手机号" class="layui-input">
                        </div>
                    </div>
                    <div class="layui-inline">
                        <label class="layui-form-label">当前负责人：</label>
                        <div class="layui-input-inline">
                            <div id="autoCandidatePrUserSelect"></div>
                        </div>
                    </div>
                    <div class="layui-inline">
                        <label class="layui-form-label">命中规则：</label>
                        <div class="layui-input-inline">
                            <select name="candidate_rule">
                                <option value="">全部</option>
                                <option value="创建未跟进超时">创建未跟进</option>
                                <option value="领取后未跟进超时">领取后未跟进</option>
                                <option value="首次跟进超时">首次跟进超时</option>
                                <option value="领取后首次跟进超时">领取后首次跟进超时</option>
                                <option value="跟进间隔超时">跟进间隔超时</option>
                                <option value="最后跟进超时">最后跟进超时</option>
                            </select>
                        </div>
                    </div>
                    <div class="layui-inline">
                        <label class="layui-form-label">超期天数≥：</label>
                        <div class="layui-input-inline">
                            <input type="number" min="0" name="overdue_days" placeholder="请输入天数" class="layui-input">
                        </div>
                    </div>
                    <div class="layui-inline">
                        <button class="layui-btn" lay-submit lay-filter="auto-candidate-search">
                            <i class="layui-icon layui-icon-search"></i>查询
                        </button>
                        <button type="button" class="layui-btn layui-btn-primary" id="auto-candidate-reset">重置</button>
                    </div>
                </div>
            </div>
        </div>
    </fieldset>

    <div class="table-wrapper">
        <table class="layui-table" id="autoCandidateTable" lay-filter="autoCandidateTable"></table>
    </div>
</div>

<script type="text/html" id="autoCandidateToolbarTpl">
    <div class="layui-btn-container">
        <button type="button" class="layui-btn layui-btn-warm layui-btn-sm" lay-event="batchConfirmIn">批量确认流入公海</button>
    </div>
</script>

<script type="text/html" id="autoCandidateRowBarTpl">
    <button type="button" class="layui-btn layui-btn-normal layui-btn-xs" lay-event="confirmIn">确认流入公海</button>
</script>

{include file="common/foot"/}
<script>
    layui.use(['table', 'form'], function () {
        var table = layui.table, form = layui.form, $ = layui.jquery;
        var tableId = 'autoCandidateTable';
        var baseUrl = "{:url('Liberum/getAutoCandidateList')}";
        var prUserOptionsUrl = "{:url('Liberum/getPrUserOptions')}";
        var confirmUrl = "{:url('Liberum/confirmAutoLiberum')}";
        var batchConfirmUrl = "{:url('Liberum/batchConfirmAutoLiberum')}";
        var ghTypeList = <?php echo json_encode(isset($ghTypeList) ? $ghTypeList : [], JSON_UNESCAPED_UNICODE); ?>;
        var prUserSelectInstance = null;

        function getSelectedPrUser() {
            if (!prUserSelectInstance) {
                return '';
            }
            return $.trim(prUserSelectInstance.getValue('valueStr') || '');
        }

        function renderPrUserSelect(dataList) {
            prUserSelectInstance = xmSelect.render({
                el: '#autoCandidatePrUserSelect',
                name: 'pr_user',
                layVerify: '',
                tips: '请选择负责人',
                radio: true,
                clickClose: true,
                filterable: true,
                data: dataList || []
            });
        }

        function initPrUserOptions() {
            $.ajax({
                url: prUserOptionsUrl,
                type: 'get',
                dataType: 'json',
                success: function (res) {
                    var list = [];
                    if (res && parseInt(res.code, 10) === 0 && $.isArray(res.data)) {
                        list = res.data;
                    }
                    renderPrUserSelect(list);
                },
                error: function () {
                    renderPrUserSelect([]);
                }
            });
        }

        function openGhTypeDialog(title, yesCallback) {
            var optionsHtml = '<option value="">请选择公海类型</option>';
            $.each(ghTypeList || [], function (_, item) {
                var id = parseInt(item.id, 10) || 0;
                var typeName = item.type_name || '';
                if (id > 0) {
                    optionsHtml += '<option value="' + id + '">' + typeName + '</option>';
                }
            });

            var contentHtml = ''
                + '<div style="padding: 16px 20px 4px 20px;">'
                + '  <div style="margin-bottom: 10px; color: #666;">请选择本次流入公海的类型，确认后客户将进入所选公海。</div>'
                + '  <form class="layui-form" lay-filter="auto-candidate-gh-form">'
                + '      <div class="layui-form-item">'
                + '          <label class="layui-form-label" style="width: 100px;">公海类型</label>'
                + '          <div class="layui-input-block" style="margin-left: 100px;">'
                + '              <select name="gh_type_id" lay-search>'
                +                    optionsHtml
                + '              </select>'
                + '          </div>'
                + '      </div>'
                + '  </form>'
                + '</div>';

            layer.open({
                type: 1,
                title: title || '选择公海类型',
                area: ['520px', '240px'],
                content: contentHtml,
                btn: ['确认', '取消'],
                success: function () {
                    form.render('select', 'auto-candidate-gh-form');
                },
                yes: function (index, layero) {
                    var $layerDom = layero && layero.length ? layero : $('#layui-layer' + index);
                    var ghTypeRaw = '';
                    if ($layerDom && $layerDom.length) {
                        ghTypeRaw = $.trim($layerDom.find('select[name="gh_type_id"]').val() || '');
                    }
                    var ghTypeId = parseInt(ghTypeRaw, 10) || 0;
                    if (!(ghTypeId > 0)) {
                        layer.msg('请选择公海类型');
                        return;
                    }
                    if (typeof yesCallback === 'function') {
                        yesCallback(ghTypeId, index, $layerDom);
                    }
                }
            });
        }

        var tableIns = table.render({
            elem: '#' + tableId,
            id: tableId,
            url: baseUrl,
            method: 'get',
            page: true,
            limit: 10,
            limits: [10, 20, 30, 50, 100],
            toolbar: '#autoCandidateToolbarTpl',
            text: {
                none: '当前暂无符合自动流入公海规则的客户'
            },
            cols: [[
                {type: 'checkbox', fixed: 'left', width: 60},
                {field: 'id', title: '客户ID', width: 100, sort: true},
                {field: 'kh_name', title: '客户名称', width: 160},
                {field: 'phone', title: '客户电话', width: 140},
                {field: 'pr_user', title: '当前负责人', width: 130},
                {field: 'create_time', title: '创建时间', width: 180},
                {field: 'last_follow_time', title: '最后跟进时间', width: 180, templet: function (d) {
                    return d.last_follow_time || '';
                }},
                {field: 'overdue_days', title: '超期天数', width: 120, align: 'right'},
                {field: 'candidate_rule', title: '命中规则', width: 150},
                {field: 'candidate_reason', title: '候选原因', width: 260, templet: function (d) {
                    var txt = d.candidate_reason || '';
                    return '<div class="candidate-reason-cell">' + txt + '</div>';
                }},
                {field: 'status', title: '当前状态', width: 120, align: 'center', templet: function (d) {
                    var status = parseInt(d.status, 10);
                    if (status === 1) {
                        return '<span class="layui-badge layui-bg-green">正常客户</span>';
                    }
                    if (status === 2) {
                        return '<span class="layui-badge layui-bg-gray">公海客户</span>';
                    }
                    return d.status === undefined || d.status === null ? '' : d.status;
                }},
                {field: 'issuccess', title: '成交状态', width: 120, align: 'center', templet: function (d) {
                    var success = parseInt(d.issuccess, 10);
                    if (success === 1) {
                        return '<span class="layui-badge layui-bg-orange">已成交</span>';
                    }
                    return '<span class="layui-badge-rim">未成交</span>';
                }},
                {fixed: 'right', title: '操作', toolbar: '#autoCandidateRowBarTpl', width: 150, align: 'center'}
            ]]
        });

        form.on('submit(auto-candidate-search)', function (data) {
            var field = data.field || {};
            var prUser = getSelectedPrUser();
            var where = $.extend({}, field, {
                kh_name: field.client_keyword || '',
                pr_user: prUser
            });

            table.reload(tableId, {
                where: where,
                page: {curr: 1}
            });
            return false;
        });

        $('#auto-candidate-reset').on('click', function () {
            $('.search-card .layui-input').val('');
            form.val('auto-candidate-search-form', {
                candidate_rule: ''
            });
            if (prUserSelectInstance) {
                prUserSelectInstance.setValue([]);
            }
            form.render('select');

            table.reload(tableId, {
                where: {},
                page: {curr: 1}
            });
        });

        table.on('tool(' + tableId + ')', function (obj) {
            if (obj.event !== 'confirmIn') {
                return;
            }

            var row = obj.data || {};
            var leadId = parseInt(row.id, 10);
            if (!(leadId > 0)) {
                layer.msg('客户ID无效');
                return;
            }

            var $btn = $(obj.tr).find('button[lay-event="confirmIn"]');
            if ($btn.hasClass('layui-btn-disabled')) {
                return;
            }

            openGhTypeDialog('确认流入公海', function (ghTypeId, dialogIndex) {
                layer.confirm('确认将该客户流入所选公海类型吗？', {icon: 3, title: '二次确认'}, function (confirmIndex) {
                    layer.close(confirmIndex);
                    $btn.addClass('layui-btn-disabled').attr('disabled', true);
                    var loading = layer.load(1, {shade: [0.1, '#fff']});
                    $.ajax({
                        url: confirmUrl,
                        type: 'post',
                        dataType: 'json',
                        data: {
                            id: leadId,
                            gh_type_id: ghTypeId
                        },
                        success: function (res) {
                            layer.close(loading);
                            $btn.removeClass('layui-btn-disabled').removeAttr('disabled');
                            if (res && parseInt(res.code, 10) === 0) {
                                layer.msg(res.msg || '操作成功', {icon: 1});
                                table.reload(tableId, {});
                                layer.close(dialogIndex);
                                return;
                            }
                            layer.msg((res && res.msg) ? res.msg : '操作失败', {icon: 2});
                        },
                        error: function (xhr) {
                            layer.close(loading);
                            $btn.removeClass('layui-btn-disabled').removeAttr('disabled');
                            var errMsg = '请求失败，请稍后重试';
                            if (xhr && xhr.responseJSON && xhr.responseJSON.msg) {
                                errMsg = xhr.responseJSON.msg;
                            }
                            layer.msg(errMsg, {icon: 2});
                        }
                    });
                });
            });
        });

        table.on('toolbar(' + tableId + ')', function (obj) {
            if (obj.event !== 'batchConfirmIn') {
                return;
            }

            var checkStatus = table.checkStatus(tableId);
            var selected = checkStatus.data || [];
            var ids = [];
            $.each(selected, function (_, row) {
                var id = parseInt(row.id, 10);
                if (id > 0) {
                    ids.push(id);
                }
            });
            ids = Array.from(new Set(ids));

            if (!ids.length) {
                layer.msg('请选择需要流入公海的客户');
                return;
            }

            var $batchBtn = $('.layui-table-tool button[lay-event="batchConfirmIn"]');
            if ($batchBtn.hasClass('layui-btn-disabled')) {
                return;
            }

            openGhTypeDialog('批量确认流入公海', function (ghTypeId, dialogIndex) {
                layer.confirm('确认将选中的客户批量流入所选公海类型吗？', {icon: 3, title: '二次确认'}, function (confirmIndex) {
                    layer.close(confirmIndex);
                    $batchBtn.addClass('layui-btn-disabled').attr('disabled', true);
                    var loading = layer.load(1, {shade: [0.1, '#fff']});
                    $.ajax({
                        url: batchConfirmUrl,
                        type: 'post',
                        dataType: 'json',
                        data: {
                            ids: ids,
                            gh_type_id: ghTypeId
                        },
                        traditional: true,
                        success: function (res) {
                            layer.close(loading);
                            $batchBtn.removeClass('layui-btn-disabled').removeAttr('disabled');
                            if (res && parseInt(res.code, 10) === 0) {
                                layer.msg(res.msg || '批量处理成功', {icon: 1});
                                table.reload(tableId, {});
                                layer.close(dialogIndex);
                                return;
                            }
                            layer.msg((res && res.msg) ? res.msg : '批量处理失败', {icon: 2});
                        },
                        error: function (xhr) {
                            layer.close(loading);
                            $batchBtn.removeClass('layui-btn-disabled').removeAttr('disabled');
                            var errMsg = '请求失败，请稍后重试';
                            if (xhr && xhr.responseJSON && xhr.responseJSON.msg) {
                                errMsg = xhr.responseJSON.msg;
                            }
                            layer.msg(errMsg, {icon: 2});
                        }
                    });
                });
            });
        });

        initPrUserOptions();
    });
</script>
</body>
</html>
