{include file="common/head"/}
<style>
    body {
        background: #f5f7fa !important;
    }
    .first-timeout-container {
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        padding: 20px;
        background: #f5f7fa;
        overflow-y: auto;
    }
    .page-card {
        background: #fff;
        border-radius: 8px;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
        padding: 16px;
        margin-bottom: 12px;
    }
    .page-desc {
        color: #555;
        line-height: 1.8;
        font-size: 13px;
    }
    .status-tips {
        margin-top: 8px;
        color: #1e9fff;
        font-size: 13px;
        line-height: 1.8;
    }
    .pool-closed-tip {
        margin-top: 8px;
    }
    .search-form .layui-form-item {
        margin-bottom: 0;
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 10px 0;
    }
    .search-form .layui-inline {
        display: inline-flex;
        align-items: center;
        margin-right: 14px;
        margin-bottom: 8px;
    }
    .search-form .layui-form-label {
        width: auto !important;
        min-width: 90px;
        white-space: nowrap;
        padding: 9px 8px 9px 0;
        text-align: right;
    }
    .search-form .layui-input-inline {
        width: 170px;
        margin-right: 0;
    }
    .table-card {
        background: #fff;
        border-radius: 8px;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
        overflow: hidden;
    }
    #firstTimeoutTable + .layui-table-view .layui-table-body.layui-table-main {
        overflow-x: auto !important;
    }
    #firstTimeoutTable + .layui-table-view .layui-table-box {
        overflow: hidden !important;
    }
    .first-timeout-toolbar {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 8px;
        width: 100%;
        box-sizing: border-box;
        background: transparent;
    }
    /* 首次超时分配：操作列整列浅蓝背景 */
    #firstTimeoutTable + .layui-table-view .layui-table-fixed-r th,
    #firstTimeoutTable + .layui-table-view .layui-table-fixed-r td {
        background: #f0f7ff !important;
    }
    #firstTimeoutTable + .layui-table-view .layui-table-fixed-r .layui-table-cell {
        background: transparent !important;
    }
    /* 操作列表头稍微深一点，便于区分 */
    #firstTimeoutTable + .layui-table-view .layui-table-fixed-r .layui-table-header th {
        background: #eef5ff !important;
    }
    .ft-btn-detail {
        background: linear-gradient(135deg, #409EFF, #66B1FF) !important;
        color: #fff !important;
        border: none !important;
        border-radius: 6px !important;
        transition: all .25s ease;
    }
    .ft-btn-detail:hover {
        transform: translateY(-1px);
        box-shadow: 0 4px 10px rgba(64,158,255,.28);
    }
    .ft-btn-assign {
        background: linear-gradient(135deg, #19be6b, #36d399) !important;
        color: #fff !important;
        border: none !important;
        border-radius: 6px !important;
        transition: all .25s ease;
    }
    .ft-btn-assign:hover {
        transform: translateY(-1px);
        box-shadow: 0 4px 10px rgba(25,190,107,.28);
    }
    .ft-btn-reset {
        background: linear-gradient(135deg, #eef2f7, #dbe7f3) !important;
        color: #3a506b !important;
        border: none !important;
        border-radius: 6px !important;
        transition: all .25s ease;
    }
    .ft-btn-reset:hover {
        background: linear-gradient(135deg, #dbe7f3, #c9d9ea) !important;
        box-shadow: 0 3px 8px rgba(0,0,0,.08);
    }
</style>

<div class="first-timeout-container">
    <div class="page-card">
        <fieldset class="layui-elem-field layui-field-title" style="margin-top: 0;">
            <legend>首次超时分配</legend>
        </fieldset>
        <div class="page-desc">
            本页面用于处理新规则生效后，新建客户超过首次跟进期限仍未跟进的客户。客户不可由业务员自由领取，只能由对应运营人员重新分配。
        </div>
        <div class="status-tips">
            首次跟进期限：<span id="ft-first-follow-days">-</span>天，
            运营池状态：<span id="ft-pool-status">-</span>，
            规则生效日期：<span id="ft-rule-date">-</span>
        </div>
        <div class="layui-bg-orange pool-closed-tip" id="ft-pool-closed-tip" style="display:none; padding: 10px 12px; border-radius: 4px; color: #fff;">
            当前首次超时运营池已关闭，新客户首次超时将直接进入普通公海。
        </div>
    </div>

    <div class="page-card">
        <div class="layui-form search-form" lay-filter="first-timeout-search-form">
            <div class="layui-form-item">
                <div class="layui-inline">
                    <label class="layui-form-label">客户名称：</label>
                    <div class="layui-input-inline">
                        <input type="text" name="kh_name" placeholder="请输入客户名称" class="layui-input">
                    </div>
                </div>
                <div class="layui-inline">
                    <label class="layui-form-label">手机号：</label>
                    <div class="layui-input-inline">
                        <input type="text" name="main_phone" placeholder="请输入手机号" class="layui-input">
                    </div>
                </div>
                <div class="layui-inline">
                    <label class="layui-form-label">所属渠道：</label>
                    <div class="layui-input-inline">
                        <input type="text" name="inquiry_name" placeholder="请输入所属渠道" class="layui-input">
                    </div>
                </div>
                <div class="layui-inline">
                    <label class="layui-form-label">运营端口：</label>
                    <div class="layui-input-inline">
                        <input type="text" name="port_name" placeholder="请输入运营端口" class="layui-input">
                    </div>
                </div>
                <div class="layui-inline">
                    <label class="layui-form-label">创建时间范围：</label>
                    <div class="layui-input-inline" style="width: 230px;">
                        <input type="text" name="at_time_range" id="at_time_range" placeholder="请选择创建时间范围" class="layui-input">
                    </div>
                </div>
                <div class="layui-inline">
                    <button type="button" class="layui-btn layui-btn-warm" id="first-timeout-batch-assign">批量重新分配</button>
                </div>
                <div class="layui-inline">
                    <button class="layui-btn" lay-submit lay-filter="first-timeout-search">
                        <i class="layui-icon layui-icon-search"></i> 查询
                    </button>
                    <button type="button" class="layui-btn ft-btn-reset" id="first-timeout-reset">重置</button>
                </div>
            </div>
        </div>
    </div>

    <div class="table-card">
        <table class="layui-table" id="firstTimeoutTable" lay-filter="firstTimeoutTable"></table>
    </div>
</div>

<script type="text/html" id="firstTimeoutRowBarTpl">
    <div class="first-timeout-toolbar">
        <button type="button" class="layui-btn layui-btn-xs ft-btn-detail" lay-event="detail">
            查看详情
        </button>
        <button type="button" class="layui-btn layui-btn-xs ft-btn-assign" lay-event="assign">
            重新分配
        </button>
    </div>
</script>

{include file="common/foot"/}
<script>
    layui.use(['table', 'form', 'laydate'], function () {
        var table = layui.table, form = layui.form, laydate = layui.laydate, $ = layui.jquery;
        var tableId = 'firstTimeoutTable';
        var configStatusUrl = "{:url('Liberum/getFirstTimeoutConfigStatus')}";
        var assignOptionsUrl = "{:url('Liberum/getAssignUserOptions')}";
        var assignSubmitUrl = "{:url('Liberum/assignFirstTimeout')}";
        var batchAssignSubmitUrl = "{:url('Liberum/batchAssignFirstTimeout')}";
        var clientDetailBaseUrl = "{:url('Liberum/firstTimeoutDetail')}";
        var isAssignSubmitting = false;

        laydate.render({
            elem: '#at_time_range',
            type: 'datetime',
            range: true
        });

        var tableIns = table.render({
            elem: '#' + tableId,
            id: tableId,
            url: "{:url('Liberum/getFirstTimeoutList')}",
            method: 'get',
            page: true,
            height: 'full-220',
            text: {
                none: '暂无首次超时分配数据'
            },
            cols: [[
                {type: 'checkbox', fixed: 'left', width: 60},
                {field: 'id', title: 'ID', width: 90, sort: true},
                {field: 'kh_name', title: '客户名称', width: 160},
                {field: 'main_phone', title: '主电话', width: 140},
                {field: 'inquiry_name', title: '所属渠道', width: 150},
                {field: 'port_name', title: '运营端口', width: 140},
                {field: 'pr_user', title: '原负责人', width: 130},
                {field: 'at_time', title: '创建时间', width: 170},
                {field: 'timeout_days', title: '超时天数', width: 110, align: 'right'},
                {field: 'status_text', title: '状态说明', width: 130},
                {field: 'recent_operate_time', title: '最近操作时间', width: 170},
                {field: 'last_follow_time', title: '最后跟进时间', width: 170},
                {field: 'operation', title: '操作', toolbar: '#firstTimeoutRowBarTpl', width: 180, fixed: 'right', align: 'center'}
            ]],
            where: {}
        });

        form.on('submit(first-timeout-search)', function (data) {
            table.reload(tableId, {
                page: {curr: 1},
                where: data.field || {}
            });
            return false;
        });

        $('#first-timeout-reset').on('click', function () {
            $('.search-form .layui-input').val('');
            table.reload(tableId, {
                page: {curr: 1},
                where: {}
            });
        });

        table.on('tool(' + tableId + ')', function (obj) {
            var row = obj.data || {};
            var leadId = parseInt(row.id, 10) || 0;
            if (!(leadId > 0)) {
                layer.msg('客户ID无效');
                return;
            }

            if (obj.event === 'detail') {
                var detailWidth = Math.min(1000, Math.floor($(window).width() * 0.92));
                var detailHeight = Math.min(620, Math.floor($(window).height() * 0.86));
                layer.open({
                    type: 2,
                    title: '客户详情',
                    area: [detailWidth + 'px', detailHeight + 'px'],
                    shadeClose: true,
                    maxmin: true,
                    content: clientDetailBaseUrl + '?id=' + leadId
                });
                return;
            }

            if (obj.event === 'assign') {
                openAssignDialog([leadId], false);
            }
        });

        $('#first-timeout-batch-assign').on('click', function () {
            var checked = table.checkStatus(tableId).data || [];
            var ids = [];
            $.each(checked, function (_, row) {
                var id = parseInt(row.id, 10) || 0;
                if (id > 0) {
                    ids.push(id);
                }
            });
            ids = Array.from(new Set(ids));
            if (!ids.length) {
                layer.msg('请先勾选需要重新分配的客户');
                return;
            }
            openAssignDialog(ids, true);
        });

        function openAssignDialog(leadIds, isBatch) {
            leadIds = $.isArray(leadIds) ? leadIds : [];
            if (!leadIds.length) {
                layer.msg('客户ID无效');
                return;
            }
            if (isAssignSubmitting) {
                return;
            }
            var loading = layer.load(1, {shade: [0.1, '#fff']});
            $.ajax({
                url: assignOptionsUrl,
                type: 'get',
                dataType: 'json',
                success: function (res) {
                    layer.close(loading);
                    var list = [];
                    if (res && parseInt(res.code, 10) === 0 && $.isArray(res.data)) {
                        list = res.data;
                    }

                    var optionsHtml = '<option value="">请选择业务员</option>';
                    $.each(list, function (_, item) {
                        var name = $.trim((item && item.name) ? item.name : '');
                        var value = $.trim((item && item.value) ? item.value : '');
                        if (name !== '' && value !== '') {
                            optionsHtml += '<option value="' + value + '">' + name + '</option>';
                        }
                    });

                    var contentHtml = ''
                        + '<div style="padding: 16px 20px 4px 20px;">'
                        + '  <div style="margin-bottom: 10px; color: #ff6f00; font-size: 12px;">重新分配后，客户将重新开始计时，请确认。</div>'
                        + '  <form class="layui-form" lay-filter="first-timeout-assign-form">'
                        + '      <div class="layui-form-item">'
                        + '          <label class="layui-form-label" style="width: 90px;">业务员</label>'
                        + '          <div class="layui-input-block" style="margin-left: 90px;">'
                        + '              <select name="assign_user" lay-search>'
                        +                    optionsHtml
                        + '              </select>'
                        + '          </div>'
                        + '      </div>'
                        + '  </form>'
                        + '</div>';

                    layer.open({
                        type: 1,
                        title: isBatch ? '批量重新分配客户' : '重新分配客户',
                        area: ['520px', '240px'],
                        content: contentHtml,
                        btn: ['确认分配', '取消'],
                        success: function () {
                            form.render('select', 'first-timeout-assign-form');
                        },
                        yes: function (index, layero) {
                            var $layerDom = layero && layero.length ? layero : $('#layui-layer' + index);
                            var assignUser = $.trim($layerDom.find('select[name="assign_user"]').val() || '');
                            if (assignUser === '') {
                                layer.msg('请选择业务员');
                                return;
                            }

                            if (isAssignSubmitting) {
                                return;
                            }
                            isAssignSubmitting = true;
                            var $confirmBtn = $layerDom.closest('.layui-layer').find('.layui-layer-btn0');
                            $confirmBtn.addClass('layui-btn-disabled').attr('disabled', true);
                            var requestLoading = layer.load(1, {shade: [0.1, '#fff']});
                            $.ajax({
                                url: isBatch ? batchAssignSubmitUrl : assignSubmitUrl,
                                type: 'post',
                                dataType: 'json',
                                data: {
                                    id: leadIds[0] || 0,
                                    ids: leadIds,
                                    assign_user: assignUser
                                },
                                traditional: true,
                                success: function (assignRes) {
                                    isAssignSubmitting = false;
                                    $confirmBtn.removeClass('layui-btn-disabled').removeAttr('disabled');
                                    layer.close(requestLoading);
                                    if (assignRes && parseInt(assignRes.code, 10) === 0) {
                                        layer.msg(assignRes.msg || (isBatch ? '批量重新分配成功' : '重新分配成功'), {icon: 1});
                                        layer.close(index);
                                        table.reload(tableId);
                                        return;
                                    }
                                    layer.msg((assignRes && assignRes.msg) ? assignRes.msg : '重新分配失败', {icon: 2});
                                },
                                error: function (xhr) {
                                    isAssignSubmitting = false;
                                    $confirmBtn.removeClass('layui-btn-disabled').removeAttr('disabled');
                                    layer.close(requestLoading);
                                    var errMsg = '请求失败，请稍后重试';
                                    if (xhr && xhr.responseJSON && xhr.responseJSON.msg) {
                                        errMsg = xhr.responseJSON.msg;
                                    }
                                    layer.msg(errMsg, {icon: 2});
                                }
                            });
                        }
                    });
                },
                error: function () {
                    layer.close(loading);
                    layer.msg('加载业务员列表失败', {icon: 2});
                }
            });
        }

        function loadConfigStatus() {
            $.ajax({
                url: configStatusUrl,
                type: 'get',
                dataType: 'json',
                success: function (res) {
                    if (!res || parseInt(res.code, 10) !== 0 || !res.data) {
                        return;
                    }
                    var data = res.data || {};
                    var enablePool = parseInt(data.enable_operator_pool, 10) === 1;
                    $('#ft-first-follow-days').text(parseInt(data.first_follow_days, 10) || 7);
                    $('#ft-pool-status').text(enablePool ? '已开启' : '已关闭');
                    $('#ft-rule-date').text(data.rule_effective_date || '-');
                    if (enablePool) {
                        $('#ft-pool-closed-tip').hide();
                    } else {
                        $('#ft-pool-closed-tip').show();
                    }
                }
            });
        }

        loadConfigStatus();
    });
</script>
</body>
</html>
