<style>
    /* 公海列表页面样式优化 - 撑满页面 */
    body {
        background: #f5f7fa !important;
    }
    .wukong-search-card .search-form-row {
        display: flex !important;
        align-items: center;
        flex-wrap: wrap;
        gap: 12px 16px;
        width: 100%;
    }
    .liberum-list-container {
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        padding: 20px;
        background: #f5f7fa;
        overflow: auto;
    }
    
    .filtrate-warp {
        margin-bottom: 10px;
    }

    .filtrate-warp .title {
        padding: 5px 12px 7px 12px;
        font-size: 14px;
        font-weight: normal;
        text-align: left;
        cursor: pointer;
        width: 90px;
        background-color: transparent !important;
        color: #333 !important;
    }

    .filtrate-warp .title:hover {
        color: #4285f4;
    }

    .filtrate-warp .flag {
        padding: 6px 12px 6px 12px;
        cursor: pointer;
    }

    .filtrate-warp .flag:hover {
        color: #4285f4;
    }

    .filtrate-warp .layui-badge:hover {
        color: white !important;
    }
    
    /* 查询区域样式优化 */
    .wukong-search-card {
        background: #fff;
        border-radius: 8px;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
        padding: 20px;
        margin-bottom: 20px;
    }
    
    .wukong-search-card .layui-form-item {
        margin-bottom: 15px;
    }
    
    .wukong-search-card .search-item {
        display: flex;
        align-items: center;
        margin-right: 0 !important;
        margin-bottom: 0 !important;
        flex-shrink: 0;
    }
    
    .wukong-search-card .layui-form-label {
        width: auto !important;
        min-width: 72px;
        color: #333;
        font-weight: 500;
        background-color: transparent !important;
        padding: 9px 8px;
        white-space: nowrap;
        line-height: 20px;
        text-align: right;
    }
    
    .wukong-search-card .search-item .layui-input-inline {
        width: 160px;
        margin-right: 0 !important;
    }
    
    .wukong-search-card .search-item .layui-form-select {
        width: 160px;
    }
    
    .wukong-search-card .search-btn {
        flex-shrink: 0;
        margin-left: 4px;
    }
    
    .wukong-search-card .layui-input,
    .wukong-search-card .layui-select {
        border-radius: 6px;
        border: 1px solid #e0e0e0;
        transition: all 0.3s ease;
    }
    
    .wukong-search-card .layui-input:focus,
    .wukong-search-card .layui-select:focus {
        border-color: #4285f4;
        box-shadow: 0 0 0 3px rgba(66, 133, 244, 0.1);
    }
    
    .wukong-search-card .layui-btn {
        border-radius: 6px;
        background: #4285f4;
        border-color: #4285f4;
        transition: all 0.3s ease;
    }
    
    .wukong-search-card .layui-btn:hover {
        background: #3367d6;
        border-color: #3367d6;
        transform: translateY(-1px);
        box-shadow: 0 4px 12px rgba(66, 133, 244, 0.3);
    }
    
    /* 表格容器样式 */
    .liberum-table-wrapper {
        background: #fff;
        border-radius: 8px;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
        overflow: hidden;
        padding: 0;
        height: calc(100vh - 280px);
        display: flex;
        flex-direction: column;
    }
    
    /* LayUI 表格视图撑满 */
    .layui-table-view {
        flex: 1;
        display: flex;
        flex-direction: column;
        height: 100%;
        border: none !important;
    }
    
    .layui-table-body {
        flex: 1;
        overflow: auto;
    }
    
    /* 操作按钮样式优化 */
    .layui-table-view .layui-table td {
        vertical-align: middle !important;
    }
    
    .layui-table-view .layui-table td .layui-btn-xs {
        border-radius: 4px !important;
        padding: 4px 12px !important;
        font-size: 12px !important;
        transition: all 0.3s ease !important;
        margin: 0 4px !important;
        vertical-align: middle !important;
        display: inline-flex !important;
        align-items: center !important;
        gap: 4px;
        line-height: 1.5 !important;
    }
    
    .layui-table-view .layui-table td .layui-btn-xs:hover {
        transform: translateY(-1px);
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.15);
    }
    
    .layui-table-view .layui-table td .layui-btn-danger {
        background: #ea4335 !important;
        border-color: #ea4335 !important;
    }
    
    .layui-table-view .layui-table td .layui-btn-danger:hover {
        background: #d33b2c !important;
        border-color: #d33b2c !important;
    }
    
    /* 客户名称链接样式 */
    .layui-table-view .layui-table td a[onclick*="showClientDetails"] {
        color: #4285f4 !important;
        text-decoration: none;
        transition: all 0.3s ease;
    }
    
    .layui-table-view .layui-table td a[onclick*="showClientDetails"]:hover {
        color: #3367d6 !important;
        text-decoration: underline;
    }
    
    /* 分页栏样式 */
    .layui-table-page {
        flex-shrink: 0;
        background: #fff !important;
        border-top: 1px solid #e0e0e0 !important;
        padding: 12px 20px !important;
    }

    /* 公海客户列表：右侧固定操作列背景色，避免横向滚动时出现透明透字 */
    #liberumTable + .layui-table-view .layui-table-fixed-r,
    #liberumTable + .layui-table-view .layui-table-fixed-r .layui-table-header,
    #liberumTable + .layui-table-view .layui-table-fixed-r .layui-table-body,
    #liberumTable + .layui-table-view .layui-table-fixed-r table,
    #liberumTable + .layui-table-view .layui-table-fixed-r th,
    #liberumTable + .layui-table-view .layui-table-fixed-r td,
    #liberumTable + .layui-table-view .layui-table-fixed-r .layui-table-cell {
        background-color: #fff7ed !important;
    }
</style>

            <button class="layui-btn layuiadmin-btn-list search-btn" lay-submit lay-filter="LAY-app-contlist-search">

<script>
    layui.use(['table','form','upload','util','laydate'], function() {
        var table = layui.table,form = layui.form,laydate = layui.laydate, $ = layui.jquery,upload = layui.upload,util = layui.util;
        var currentUsername = "{$Think.session.username}" || 'default';
        var tableId = 'liberumTable';
        var pageKey = 'liberum_index';
        var columnWidthKey = 'crm_colwidth_' + currentUsername + '_' + pageKey + '_' + tableId;
        var lastSnapshot = {};

        function getCurrentWidthsSnapshot() {
            var snapshot = {};
            try {
                var $view = $('#' + tableId).next('.layui-table-view');
                if (!$view.length) return snapshot;

                var $headerTable = $view.find('.layui-table-header table').eq(0);
                var $ths = $headerTable.find('thead tr th');
                $ths.each(function () {
                    var $th = $(this);
                    var field = $th.attr('data-field');
                    if (!field || field === '0') return;
                    var w = parseInt($th.width(), 10);
                    if (w >= 30 && w <= 3000) {
                        snapshot[field] = w;
                    }
                });
            } catch (e) {
                console.warn('获取列宽快照失败:', e);
            }
            return snapshot;
        }

        function saveWidths() {
            try {
                var widths = getCurrentWidthsSnapshot();
                if (!Object.keys(widths).length) return;

                localStorage.setItem(columnWidthKey, JSON.stringify(widths));

                $.ajax({
                    url: "{:url('Liberum/saveColWidths')}",
                    type: 'POST',
                    dataType: 'json',
                    data: {
                        page_key: pageKey,
                        table_id: tableId,
                        widths: JSON.stringify(widths)
                    },
                    success: function (res) {
                        if (res.code !== 0) {
                            layer.msg('列宽保存失败', {icon: 2, time: 1500});
                        }
                    },
                    error: function () {
                        layer.msg('列宽保存失败', {icon: 2, time: 1500});
                    }
                });
            } catch (e) {
                console.warn('保存列宽失败:', e);
            }
        }

        function bindResizeSave() {
            var $view = $('#' + tableId).next('.layui-table-view');
            if (!$view.length) return;

            $(document).off('mouseup.liberum_colwidth touchend.liberum_colwidth');
            lastSnapshot = getCurrentWidthsSnapshot();

            $(document).on('mouseup.liberum_colwidth touchend.liberum_colwidth', function () {
                setTimeout(function () {
                    var newSnapshot = getCurrentWidthsSnapshot();
                    if (!Object.keys(newSnapshot).length) return;
                    if (JSON.stringify(newSnapshot) !== JSON.stringify(lastSnapshot)) {
                        saveWidths();
                        lastSnapshot = newSnapshot;
                    }
                }, 120);
            });
        }

        function restoreColWidth(colArr) {
            var dbWidths = {};
            $.ajax({
                url: "{:url('Liberum/getColWidths')}",
                type: 'GET',
                data: {
                    page_key: pageKey,
                    table_id: tableId
                },
                async: false,
                success: function (res) {
                    if (res.code === 0 && res.data && Object.keys(res.data).length > 0) {
                        dbWidths = res.data;
                    }
                },
                error: function () {
                    console.warn('读取列宽失败，使用本地缓存兜底');
                }
            });

            try {
                var saved = JSON.parse(localStorage.getItem(columnWidthKey) || '{}');
                var finalWidths = saved;
                if (Object.keys(dbWidths).length > 0) {
                    finalWidths = Object.assign({}, saved, dbWidths);
                    localStorage.setItem(columnWidthKey, JSON.stringify(finalWidths));
                }

                colArr.forEach(function (c) {
                    if (!c || !c.field) return;
                    var w = parseInt(finalWidths[c.field], 10);
                    if (w >= 30 && w <= 3000) {
                        c.width = w;
                    }
                });
            } catch (e) {
                console.warn('恢复列宽失败:', e);
            }
        }

        function getCols() {
            var cols = [[
                {type:'checkbox', fixed:'left'},
                {field: 'id', title: 'ID', width: 80, fixed: true, hide:true},
                {
                    field: 'kh_name',
                    title: '客户名称', width:160,
                    templet: function(d) {
                        return '<a href="javascript:;" onclick="showClientDetails('+ d.id +')" style="color:#1E9FFF">'+ (d.kh_name || '') +'</a>';
                    }
                },
                {field:'product_name', title:'产品名称', width:180},
                {field:'main_phone', title:'主电话', width:150},
                {field:'aux_phone', title:'辅助电话', width:150},
                {field:'inquiry_name', title:'所属渠道', width:130},
                {field:'port_name', title:'运营端口', width:150},
                {field:'current_gh_type_name', title:'当前公海类型', width:140, templet: function(d){ return d.current_gh_type_name || '未设置'; }},
                {field:'main_phone_position_titles', title:'主电话职位身份', width:190},
                {field:'aux_phone_position_titles', title:'辅助电话职位身份', width:190},
                {field:'kh_rank_display', title:'客户级别', width:100},
                {field:'remark', title:'备注', width:160},
                {field:'to_gh_time', title:'最新转入时间', width:170},
                {field:'at_user', title:'创建人', width:110},
                {field:'pr_user', title:'负责人', width:110},
                {field:'pr_user_bef', title:'前负责人', width:110},
                {fixed:'right', title:'操作', toolbar:'#action', width:160, align:'center'}
            ]];

            restoreColWidth(cols[0]);
            return cols;
        }

        var tableIn = table.render({
            elem: '#' + tableId,
            id: tableId,
            url: '{:url("index")}',
            method: 'post',
            toolbar: '#topBtn',
            page: true,
            cols: getCols(),
            limit: 10,
            done: function () {
                bindResizeSave();
            }
        });


        table.on('tool(table-list)', function(obj) {
            var data = obj.data;

            if (obj.event === 'robClient') {
                layer.confirm('您确定要抢这个客户吗？', function(index){
                    var $btn = $(obj.tr).find('a[lay-event="robClient"]');
                    if ($btn.hasClass('layui-btn-disabled')) {
                        return;
                    }
                    $btn.addClass('layui-btn-disabled').attr('disabled', true);
                    var loading = layer.load(1, {shade: [0.1, '#fff']});
                    $.post("{:url('robClient')}",{id:data.id},function(res){
                        layer.close(loading);
                        $btn.removeClass('layui-btn-disabled').removeAttr('disabled');
                        if(res.code===0){
                            layer.msg(res.msg,{time:1000,icon:1});
                            tableIn.reload();
                        }else{
                            layer.msg(res.msg || '操作失败！',{time:1500,icon:2});
                        }
                    }).fail(function(){
                        layer.close(loading);
                        $btn.removeClass('layui-btn-disabled').removeAttr('disabled');
                        layer.msg('网络异常，请稍后重试', {time:1500, icon:2});
                    });
                    layer.close(index);
                });
            }
        });


        //监听搜索
        form.on('submit(LAY-app-contlist-search)', function(data){
            var field = data.field;

            /* layer.alert(JSON.stringify(data.field), {
                  title: '最终的提交信息'
                })
                return false;*/


            table.reload(tableId, {
                url:"{:url('Liberum/liberumSearch')}",
                where: {
                    keyword: data.field
                },
                page:{
                    curr:1
                },
                done: function () {
                    bindResizeSave();
                }
            });


        });

        laydate.render({
            elem: '#at_time'
        });

        laydate.render({
            elem: '#created_after',
            type: 'date'
        });


    });
</script>

<script>
    // 在layui.use作用域外定义带参数检查的弹窗函数
    function showClientDetails(id) {
        if (typeof layui === 'undefined' || typeof layui.jquery === 'undefined') {
            console.error('Layui or jQuery not loaded');
            layer.msg('系统资源未正确加载', {icon: 2});
            return;
        }
        
        var $ = layui.jquery;
        $.get("{:url('getClientDetails')}", {id: id}, function(res) {
            if(res.code === 0) {
                var data = res.data;
                var html = `
                    <div class="layui-card" style="padding: 20px">
                        <div class="layui-row">
                            <div class="layui-col-md6">
                                <p><strong>客户名称：</strong>${data.kh_name || '-'}</p>
                                <p><strong>客户级别：</strong>${data.kh_rank || '-'}</p>
                                <p><strong>国家地区：</strong>${data.xs_area || '-'}</p>
                                <p><strong>客户来源：</strong>${data.kh_status || '-'}</p>
                            </div>
                            <div class="layui-col-md6">
                                <p><strong>联系电话：</strong><i class="layui-icon layui-icon-phone" style="color:#4CAF50"></i> ${data.phone || '-'}</p>
                                <p><strong>邮箱：</strong><i class="layui-icon layui-icon-email" style="color:#4285F4"></i> ${data.email || '-'}</p>
                                <p><strong>WhatsApp：</strong><i class="layui-icon layui-icon-cellphone" style="color:#25D366"></i> ${data.whatsapp || '-'}</p>
                                <p><strong>阿里ID/微信：</strong>${data.ali_id || '-'} / ${data.wechat || '-'}</p>
                            </div>
                        </div>
                        <div class="layui-form-item layui-form-text">
                            <label><strong>备注信息：</strong></label>
                            <div class="layui-input-block">
                                <pre style="border:0;background:#f8f8f8">${data.remark || '暂无备注信息'}</pre>
                            </div>
                        </div>
                    </div>
                `;
                
                layer.open({
                    type: 1,
                    title: '客户详情信息',
                    area: ['800px', '500px'],
                    content: html,
                    btn: ['关闭'],
                    shadeClose: true,
                    resize: false
                });
            } else {
                layer.msg('获取客户信息失败', {icon: 2});
            }
        });
    }
</script>
