<!DOCTYPE html>
<html>
<head>
    {include file="common/head"/}
    <style>
        .filtrate-warp { margin-bottom: 10px; }
        .layui-elem-field {
            background: #fff !important;
            border-radius: 8px !important;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08) !important;
            border: 1px solid #e8e8e8 !important;
            overflow: hidden !important;
        }
        .layui-elem-field legend {
            margin-left: 20px;
            padding: 0 10px;
            font-size: 20px;
            font-weight: 300;
            background: #4285f4;
            color: #fff;
            padding: 10px 15px;
            border-radius: 10px;
        }
        .layui-form-label { white-space: nowrap; }
        .client-rank-search .layui-form-label {
            width: 110px;
            padding-left: 0;
            padding-right: 8px;
            box-sizing: border-box;
        }
        .client-rank-search .layui-input-inline {
            width: 190px;
        }
        .client-rank-search .layui-inline {
            margin-right: 12px;
        }
    </style>
</head>
<body class="layui-layout-body">
<div class="admin-main layui-anim layui-anim-upbit">
    <fieldset class="layui-elem-field ">
        <legend>高级查询</legend>
        <div class="layui-card" style="box-shadow:none;margin-top:10px;">
            <div class="layui-form layui-card-header layuiadmin-card-header-auto" style="border-bottom:transparent;height:auto;">
                <div class="layui-form-item client-rank-search" style="text-align:left;padding-left:20px;">
                    <div class="layui-inline">
                        <label class="layui-form-label">客户级别名称：</label>
                        <div class="layui-input-inline">
                            <input type="text" id="rank_name" name="rank_name" placeholder="请输入客户级别名称" class="layui-input">
                        </div>
                    </div>
                    <div class="layui-inline">
                        <label class="layui-form-label">级别编码：</label>
                        <div class="layui-input-inline">
                            <input type="text" id="rank_code" name="rank_code" placeholder="请输入级别编码" class="layui-input">
                        </div>
                    </div>
                </div>
                <div class="layui-inline" style="float:right;padding-bottom:15px;">
                    <button class="layui-btn layuiadmin-btn-list" lay-submit lay-filter="LAY-app-contlist-search">
                        <i class="layui-icon layui-icon-search layuiadmin-button-btn" style="vertical-align:sub;"></i>查询数据
                    </button>
                </div>
            </div>
        </div>
    </fieldset>

    <table class="layui-table" id="table-list" lay-filter="table-list"></table>
</div>

<script type="text/html" id="action">
    <a class="layui-btn layui-btn-xs" lay-event="edit"><i class="layui-icon">&#xe642;</i>编辑</a>
    <a class="layui-btn layui-btn-danger layui-btn-xs" lay-event="del"><i class="layui-icon">&#xe640;</i>删除</a>
</script>

<script type="text/html" id="topBtn">
  <button class="layui-btn layui-btn-success layui-btn-sm" lay-event="add">
    <i class="layui-icon">&#xe608;</i> 添加客户级别
  </button>
  <button class="layui-btn layui-btn-danger layui-btn-sm" lay-event="batchDel">
    <i class="layui-icon">&#xe640;</i> 批量删除
  </button>
  <button class="layui-btn layui-btn-warm layui-btn-sm" lay-event="importExcel">
    <i class="layui-icon">&#xe67c;</i> 导入Excel
  </button>
  <button class="layui-btn layui-btn-normal layui-btn-sm" lay-event="downloadTpl">
    <i class="layui-icon">&#xe601;</i> 下载模板
  </button>
</script>

{include file="common/foot"/}
<script>
layui.use(['table','form','util','jquery'], function () {
    var table = layui.table, form = layui.form, util = layui.util, $ = layui.jquery;

    var tableIns = table.render({
        elem: '#table-list',
        id: 'table-list',
        url: "{:url('ClientRank/index')}",
        method: 'post',
        toolbar: '#topBtn',
        page: true,
        cols: [[
            {type: 'checkbox', fixed: 'left'},
            {field: 'id', title: 'ID', width: 80, sort: true},
            {field: 'rank_name', title: '客户级别名称', width: 180},
            {field: 'rank_code', title: '级别编码', width: 120},
            {field: 'description', title: '级别说明', minWidth: 180},
            {field: 'sort', title: '排序', width: 90, sort: true},
            {field: 'creator', title: '创建人', width: 120},
            {
                field: 'create_time', title: '创建时间', width: 180, templet: function (d) {
                    var v = d.create_time;
                    if (!v) return '';
                    if (/^\d+$/.test(v)) return util.toDateString(v * 1000, 'yyyy-MM-dd HH:mm:ss');
                    return v;
                }
            },
            {
                field: 'update_time', title: '修改时间', width: 180, templet: function (d) {
                    var v = d.update_time;
                    if (!v) return '';
                    if (/^\d+$/.test(v)) return util.toDateString(v * 1000, 'yyyy-MM-dd HH:mm:ss');
                    return v;
                }
            },
            {title: '操作', width: 160, align: 'center', toolbar: '#action'}
        ]],
        limit: 10
    });

    table.on('tool(table-list)', function (obj) {
        var data = obj.data;
        if (obj.event === 'del') {
            layer.confirm('确认删除该客户级别吗？', function (index) {
                $.post("{:url('ClientRank/del')}", {id: data.id}, function (res) {
                    if (res.code === 0) {
                        layer.msg(res.msg, {icon: 1, time: 1000});
                        tableIns.reload();
                    } else {
                        layer.msg(res.msg || '删除失败！', {icon: 2, time: 1500});
                    }
                }, 'json');
                layer.close(index);
            });
        } else if (obj.event === 'edit') {
            layer.open({
                type: 2,
                title: '编辑客户级别',
                area: ['700px', '460px'],
                shadeClose: false,
                content: ["{:url('ClientRank/edit')}?id=" + data.id, 'no']
            });
        }
    });

    table.on('toolbar(table-list)', function (obj) {
        if (obj.event === 'add') {
            layer.open({
                type: 2,
                title: '添加客户级别',
                // 高度改为视口百分比，配合 add.html 内部滚动，保证底部按钮可见
                area: ['700px', '80%'],
                shadeClose: true,
                content: ["{:url('ClientRank/add')}", 'no']
            });
        } else if (obj.event === 'batchDel') {
            var rows = table.checkStatus('table-list').data || [];
            if (!rows.length) return layer.msg('请先勾选要删除的记录', {icon: 0});
            var ids = rows.map(function (r) { return r.id; });
            layer.confirm('确认删除选中的 ' + ids.length + ' 条记录吗？', function (index) {
                $.post("{:url('ClientRank/batchDel')}", {ids: ids}, function (res) {
                    if (res.code === 0) {
                        layer.msg('删除成功', {icon: 1, time: 800});
                        tableIns.reload({page: {curr: 1}});
                    } else {
                        layer.msg(res.msg || '删除失败', {icon: 2});
                    }
                }, 'json');
                layer.close(index);
            });
        } else if (obj.event === 'importExcel') {
            layer.open({
                type: 2,
                title: '客户级别批量导入',
                area: ['620px', '420px'],
                shadeClose: true,
                content: ["{:url('ClientRank/import')}", 'no']
            });
        } else if (obj.event === 'downloadTpl') {
            window.location.href = "{:url('ClientRank/tpl')}";
        }
    });

    form.on('submit(LAY-app-contlist-search)', function (data) {
        table.reload('table-list', {
            url: "{:url('ClientRank/rankSearch')}",
            where: data.field,
            page: {curr: 1}
        });
        return false;
    });
});
</script>
</body>
</html>
