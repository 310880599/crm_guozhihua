<!DOCTYPE html>
<html>
<head>
    {include file="common/head"/}
    <style>
        .layui-btn-secondary {
            background-color: #f5f5f5 !important;
            border-color: #d2d2d2 !important;
            color: #333 !important;
        }
        .layui-btn-secondary:hover {
            background-color: #e8e8e8 !important;
            border-color: #c0c0c0 !important;
            color: #000 !important;
        }
    </style>
</head>
<body>
<form class="layui-form" style="padding:15px 20px 0 20px;">
    <div class="layui-form-item">
        <label class="layui-form-label">客户级别名称</label>
        <div class="layui-input-block">
            <input type="text" name="rank_name" required lay-verify="required" placeholder="请输入客户级别名称" autocomplete="off" class="layui-input">
        </div>
    </div>
    <div class="layui-form-item">
        <label class="layui-form-label">级别编码</label>
        <div class="layui-input-block">
            <input type="text" name="rank_code" required lay-verify="required" placeholder="请输入级别编码，如 A/B/C" autocomplete="off" class="layui-input">
        </div>
    </div>
    <div class="layui-form-item">
        <label class="layui-form-label">级别说明</label>
        <div class="layui-input-block">
            <textarea name="description" placeholder="请输入级别说明（可选）" class="layui-textarea"></textarea>
        </div>
    </div>
    <div class="layui-form-item">
        <label class="layui-form-label">排序</label>
        <div class="layui-input-block">
            <input type="number" name="sort" value="0" placeholder="请输入排序（默认0）" autocomplete="off" class="layui-input">
        </div>
    </div>
    <div class="layui-form-item">
        <label class="layui-form-label">创建人</label>
        <div class="layui-input-block">
            <input type="text" value="{$currentAdmin.username|default=''}" class="layui-input layui-bg-gray" readonly>
        </div>
    </div>
    <div class="layui-form-item">
        <div class="layui-input-block">
            <button type="submit" class="layui-btn" lay-submit lay-filter="formSubmit">立即提交</button>
            <button type="button" class="layui-btn layui-btn-secondary" onclick="var i = parent.layer.getFrameIndex(window.name); parent.layer.close(i);">取消</button>
        </div>
    </div>
</form>

{include file="common/foot"/}
<script>
layui.use(['form', 'jquery'], function () {
    var form = layui.form, $ = layui.jquery;
    form.on('submit(formSubmit)', function (data) {
        $.post("{:url('ClientRank/add')}", data.field, function (res) {
            if (res.code === 0) {
                layer.msg('添加成功！', {icon: 1, time: 1000}, function () {
                    parent.layui.table.reload('table-list');
                    var index = parent.layer.getFrameIndex(window.name);
                    parent.layer.close(index);
                });
            } else {
                layer.msg(res.msg || '添加失败', {icon: 2, time: 1500});
            }
        }, 'json');
        return false;
    });
});
</script>
</body>
</html>
