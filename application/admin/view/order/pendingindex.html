    <script>
        layui.use(['table', 'form', 'upload', 'util', 'laydate', 'element', 'layer'], function () {
            const { table, form, laydate, $, upload, util, element } = layui;
            var layer = layui.layer;
            // 根据超级管理员权限设置工具栏按钮
            var defaultToolbar = ['filter'];
            {if session('aid') eq 1}
            defaultToolbar = ['filter', 'print', 'exports'];
            {/if}

            // ================= 列宽记忆（数据库优先 + localStorage 兜底）=================
            var COLWIDTH_PAGE_KEY = 'order_pending'; // 固定键：避免 URL 变化导致丢失
            var COLWIDTH_TABLE_ID = 'table-list';    // 你的表格 id

            // ================= 列配置记忆（显示/隐藏）（数据库优先 + localStorage 兜底）=================
            var COLCFG_PAGE_KEY = 'order_pending'; // 与列宽保持一致（固定键）
            var COLCFG_TABLE_ID = 'table-list';    // 表格 id

            function colwidthStorageKey() {
                return 'colwidth:' + COLWIDTH_PAGE_KEY + ':' + COLWIDTH_TABLE_ID;
            }

            function getCurrentWidthsSnapshot() {
                var map = {};
                try {
                    var $ths = $('#table-list')
                        .next('.layui-table-view')
                        .find('.layui-table-header thead tr')
                        .eq(0)
                        .find('th');

                    $ths.each(function () {
                        var field = $(this).attr('data-field');
                        if (!field || field === '0') return;
                        if (/^\d+$/.test(field)) return; // 过滤 Layui 自动生成的纯数字 field（例如 "14"）
                        var w = parseInt($(this).outerWidth(), 10);
                        if (w > 0) map[field] = w;
                    });
                } catch (e) {}
                return map;
            }

            function applyWidthsToCols(cols, widthMap) {
                if (!cols || !cols.length || !widthMap) return;
                cols.forEach(function (c) {
                    if (!c || !c.field) return;
                    if (widthMap[c.field]) c.width = parseInt(widthMap[c.field], 10);
                });
            }

            function loadLocalWidths() {
                try {
                    var raw = localStorage.getItem(colwidthStorageKey());
                    if (!raw) return null;
                    var obj = JSON.parse(raw);
                    return obj && typeof obj === 'object' ? obj : null;
                } catch (e) { return null; }
            }

            function saveLocalWidths(widthMap) {
                try {
                    localStorage.setItem(colwidthStorageKey(), JSON.stringify(widthMap || {}));
                } catch (e) {}
            }

            function restoreColWidth(cols) {
                var dbMap = null;
                try {
                    $.ajax({
                        url: "{:url('Order/getColWidths')}",
                        type: 'post',
                        dataType: 'json',
                        async: false,
                        data: { page_key: COLWIDTH_PAGE_KEY, table_id: COLWIDTH_TABLE_ID },
                        success: function (res) {
                            if (res && (res.code === 0 || res.code === 1) && res.data) {
                                dbMap = res.data;
                            }
                        }
                    });
                } catch (e) {}

                var localMap = loadLocalWidths();
                if (dbMap) applyWidthsToCols(cols, dbMap);
                else if (localMap) applyWidthsToCols(cols, localMap);
            }

            function saveWidths(widthMap) {
                saveLocalWidths(widthMap);
                $.ajax({
                    url: "{:url('Order/saveColWidths')}",
                    type: 'post',
                    dataType: 'json',
                    data: {
                        page_key: COLWIDTH_PAGE_KEY,
                        table_id: COLWIDTH_TABLE_ID,
                        widths: JSON.stringify(widthMap || {})
                    }
                });
            }

            var __colwidth_last_snapshot = null;
            function bindResizeSave() {
                __colwidth_last_snapshot = getCurrentWidthsSnapshot();
                $(document).off('mouseup.colwidthsave touchend.colwidthsave');
                $(document).on('mouseup.colwidthsave touchend.colwidthsave', function () {
                    setTimeout(function () {
                        var now = getCurrentWidthsSnapshot();
                        var changed = false;

                        if (!__colwidth_last_snapshot) changed = true;
                        else {
                            var aKeys = Object.keys(__colwidth_last_snapshot);
                            var bKeys = Object.keys(now);
                            if (aKeys.length !== bKeys.length) changed = true;
                            else {
                                for (var i = 0; i < bKeys.length; i++) {
                                    var k = bKeys[i];
                                    if (parseInt(now[k], 10) !== parseInt(__colwidth_last_snapshot[k], 10)) {
                                        changed = true; break;
                                    }
                                }
                            }
                        }

                        if (changed) {
                            __colwidth_last_snapshot = now;
                            saveWidths(now);
                        }
                    }, 120);
                });
            }
            // ================= 列宽记忆 END =================

            // ================= 列配置记忆（显示/隐藏）BEGIN =================
            function colcfgStorageKey() {
                return 'colcfg:' + COLCFG_PAGE_KEY + ':' + COLCFG_TABLE_ID;
            }

            function loadLocalColCfg() {
                try {
                    var raw = localStorage.getItem(colcfgStorageKey());
                    if (!raw) return null;
                    var obj = JSON.parse(raw);
                    return obj && typeof obj === 'object' ? obj : null;
                } catch (e) {
                    return null;
                }
            }

            function saveLocalColCfg(obj) {
                try {
                    localStorage.setItem(colcfgStorageKey(), JSON.stringify(obj || {}));
                } catch (e) {}
            }

            // 把隐藏状态应用到列定义（渲染前调用）
            function applyHideToCols(cols, hideMap) {
                if (!cols || !cols.length || !hideMap) return;
                cols.forEach(function (c) {
                    if (!c || !c.field) return;
                    var field = c.field;
                    if (!field || field === '0') return;
                    // 过滤纯数字 field（Layui 自动列）以及操作列（通常无 field）
                    if (/^\d+$/.test(field)) return;
                    if (Object.prototype.hasOwnProperty.call(hideMap, field)) {

                        dataType: 'json',
                        async: false,
                        data: { page_key: COLCFG_PAGE_KEY },
                        success: function (res) {
                            if (res && (res.code === 0 || res.code === 1) && res.data) {
                                dbCfg = res.data;
                            }
                        }
                    });
                } catch (e) {}

                var localCfg = loadLocalColCfg();
                // 约定：后端 data 即为 hideMap（field=>0/1）
                if (dbCfg) applyHideToCols(cols, dbCfg);
                else if (localCfg) applyHideToCols(cols, localCfg);

            // 获取当前页面实际隐藏状态快照（以 DOM 为准）
            function getCurrentHideSnapshot() {
                var hideMap = {};
                try {
                    var $view = $('#table-list').next('.layui-table-view');
                    var $ths = $view.find('.layui-table-header thead tr').eq(0).find('th');

                    // 只处理 pendingCols[0] 里定义过的 field
                    if (Array.isArray(pendingCols) && pendingCols.length > 0) {
                        pendingCols[0].forEach(function (c) {
                            if (!c || !c.field) return;
                            var field = c.field;
                            if (!field || field === '0') return;
                            if (/^\d+$/.test(field)) return; // 过滤纯数字 field

                            var $th = $ths.filter('[data-field="' + field + '"]');
                            var hide = 1; // 默认认为隐藏
                            if ($th.length) {
                                if (!$th.hasClass('layui-hide') && $th.css('display') !== 'none') {
                                    hide = 0;
                                }
                            }
                            hideMap[field] = hide;
                        });
                    }
                } catch (e) {}
                return hideMap;
            }

            function colcfgChanged(oldSnap, newSnap) {
                if (!oldSnap && newSnap) return true;
                if (oldSnap && !newSnap) return true;
                if (!oldSnap && !newSnap) return false;
                var aKeys = Object.keys(oldSnap);
                var bKeys = Object.keys(newSnap);
                if (aKeys.length !== bKeys.length) return true;
                for (var i = 0; i < bKeys.length; i++) {
                    var k = bKeys[i];
                    if (parseInt(newSnap[k], 10) !== parseInt(oldSnap[k], 10)) {
                        return true;
                    }
                }
                return false;
            }

                        }
                    }, 60);
                });

                $(document).off('mouseup.colcfg_panel touchend.colcfg_panel')

            // 解析多图字段：兼容 JSON 数组、逗号分隔、单张字符串
            function parseImages(val) {
                if (!val) return [];
                if (Array.isArray(val)) return val;
                var s = String(val).trim();
                if (!s) return [];
                if (s.charAt(0) === '[') {
                    try { return JSON.parse(s); } catch (e) {}
                    try { return s.split(',').map(function(x){ return x.trim(); }).filter(Boolean); } catch (e) { return []; }
                }
                return s.split(',').map(function(x){ return x.trim(); }).filter(Boolean);
            }

            // HTML 转义防注入
            function escapeHtml(str) {
                if (str == null || str === '') return '';
                var s = String(str);
                return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;');
            }
            // 多行展示：后端 \n 拆行，逐行转义后用 div 拼接
            function renderMultiline(val) {
                if (val == null || val === '') return '--';
                var s = String(val).trim();
                if (!s) return '--';
                var lines = s.split(/\n/);
                var out = [];
                for (var i = 0; i < lines.length; i++) {
                    out.push(escapeHtml(lines[i]));
                }
                return out.length ? '<div class="item-multi">' + out.join('<br>') + '</div>' : '--';

                var translateX = 0, translateY = 0;
                var isDragging = false;
                var startX = 0, startY = 0;
                function clamp(v, min, max) { return Math.max(min, Math.min(max, v)); }

                function resetTransform() {
                    scale = 1;
                    translateX = 0;
                    translateY = 0;
                    applyTransform();
                }
                function zoomBy(delta, centerX, centerY) {
                    var oldScale = scale;
                    scale = clamp(scale + delta, minScale, maxScale);
                    if (centerX != null && centerY != null) {
                        translateX = translateX - centerX * (scale / oldScale - 1);
                        translateY = translateY - centerY * (scale / oldScale - 1);
                    }
                    applyTransform();
                }
                var html = ''
                    + '<div id="previewWrap" style="position:relative; width:100%; height:100%; background:#000;">'

                    + '    <span id="zoomRateText" style="color:#fff; font-size:12px; margin-left:6px;">100%</span>'
                    + '  </div>'
                    + '  <div id="previewStage" style="position:absolute; inset:0; overflow:auto; padding:20px;">'
                    + '    <div id="previewCanvas" style="position:relative; min-width:100%; min-height:100%; display:flex; align-items:flex-start; justify-content:center;">'
                    + '      <img id="previewZoomImg" src="' + imgSrc + '" style="transform-origin: top center; max-width:none; user-select:none; cursor:grab;" />'
                    + '    </div>'
                    + '  </div>'
                    + '</div>';
                layer.open({
                    type: 1,
                    title: '图片预览（可放大缩小，滚轮缩放，拖拽移动）',
                    closeBtn: 1,
                    shadeClose: true,

                        layero.find('.layui-layer-close').off('click.previewCloseFix').on('click.previewCloseFix', function(ev){ ev.stopPropagation(); });
                        $('#btnZoomIn').off('click.preview').on('click.preview', function() { zoomBy(0.2); });
                        $('#btnZoomOut').off('click.preview').on('click.preview', function() { zoomBy(-0.2); });
                        $('#btnZoomReset').off('click.preview').on('click.preview', function() { resetTransform(); });
                        $('#previewStage').off('wheel.preview').on('wheel.preview', function(ev) {
                            ev.preventDefault();
                            var oe = ev.originalEvent || ev;
                            var delta = (oe.deltaY > 0) ? -0.12 : 0.12;
                            var rect = this.getBoundingClientRect();
                            var cx = (oe.clientX || 0) - rect.left;
                            var cy = (oe.clientY || 0) - rect.top;
                            zoomBy(delta, cx, cy);
                        });
                        $('#previewZoomImg').off('mousedown.preview').on('mousedown.preview', function(ev) {
                            isDragging = true;
                            startX = ev.clientX;
                            startY = ev.clientY;
                            $(this).css('cursor', 'grabbing');
                            ev.preventDefault();
                            ev.stopPropagation();
                        });
                        $(document)
                            .off('mousemove.previewDrag').on('mousemove.previewDrag', function(ev) {
                                if (!isDragging) return;
                                var dx = ev.clientX - startX;
                                var dy = ev.clientY - startY;
                                startX = ev.clientX;
                                startY = ev.clientY;
                                translateX += dx;
                                translateY += dy;
                                applyTransform();
                            })
                            .off('mouseup.previewDrag').on('mouseup.previewDrag', function() {
                                if (!isDragging) return;
                                isDragging = false;
                                $('#previewZoomImg').css('cursor', 'grab');
                            });
                    },
                    end: function() {
                        window.__IMG_PREVIEW_CLOSE_AT__ = Date.now();
                        $(document).off('mousemove.previewDrag mouseup.previewDrag');
                    }
                });
            }

            function openZoomPreviewGallery(images, startIndex) {
                if (!images || images.length === 0) return;
                if (startIndex < 0 || startIndex >= images.length) startIndex = 0;
                var fullImages = [];
                for (var i = 0; i < images.length; i++) {
                    var img = images[i];
                    if (typeof img === 'string') {
                        fullImages.push(img);
                    } else if (img && img.full) {
                        fullImages.push(img.full);
                    } else if (img && img.thumb) {
                        fullImages.push(img.thumb);
                    }
                }
                if (fullImages.length === 0) return;
                var currentIndex = startIndex;
                var totalImages = fullImages.length;
                var scale = 1;
                var minScale = 0.2;
                var maxScale = 6;
                var translateX = 0, translateY = 0;
                var isDragging = false;
                var startX = 0, startY = 0;
                function clamp(v, min, max) { return Math.max(min, Math.min(max, v)); }
                function applyTransform() {
                    var $img = $('#previewZoomImg');
                    $img.css('transform', 'translate(' + translateX + 'px,' + translateY + 'px) scale(' + scale + ')');
                    $('#zoomRateText').text(Math.round(scale * 100) + '%');
                }
                function resetTransform() {
                    scale = 1;
                    translateX = 0;
                    translateY = 0;
                    applyTransform();
                }
                function zoomBy(delta, centerX, centerY) {
                    var oldScale = scale;
                    scale = clamp(scale + delta, minScale, maxScale);
                    if (centerX != null && centerY != null) {
                        translateX = translateX - centerX * (scale / oldScale - 1);
                        translateY = translateY - centerY * (scale / oldScale - 1);
                    }
                    applyTransform();
                }
                function switchImage(newIndex) {
                    if (newIndex < 0 || newIndex >= totalImages) return;
                    currentIndex = newIndex;
                    resetTransform();
                    $('#previewZoomImg').attr('src', fullImages[currentIndex]);
                    $('#galleryCounter').text((currentIndex + 1) + ' / ' + totalImages);
                    $('#btnPrev').prop('disabled', currentIndex === 0);
                    $('#btnNext').prop('disabled', currentIndex === totalImages - 1);
                }
                var html = ''
                    + '<div id="previewWrap" style="position:relative; width:100%; height:100%; background:#000;">'
                    + '  <div id="previewToolbar" style="position:absolute; top:12px; left:12px; z-index:9999; display:flex; gap:8px; align-items:center; flex-wrap:wrap;">'
                    + '    <button type="button" class="layui-btn layui-btn-sm" id="btnPrev">上一张 ←</button>'
                    + '    <button type="button" class="layui-btn layui-btn-sm" id="btnNext">下一张 →</button>'
                    + '    <span id="galleryCounter" style="color:#fff; font-size:12px; margin:0 8px;">' + (currentIndex + 1) + ' / ' + totalImages + '</span>'
                    + '    <span style="color:#fff; font-size:12px; margin:0 4px;">|</span>'
                    + '    <button type="button" class="layui-btn layui-btn-sm" id="btnZoomIn">放大 +</button>'
                    + '    <button type="button" class="layui-btn layui-btn-sm" id="btnZoomOut">缩小 -</button>'
                    + '    <button type="button" class="layui-btn layui-btn-sm layui-btn-primary" id="btnZoomReset">重置</button>'
                    + '    <span id="zoomRateText" style="color:#fff; font-size:12px; margin-left:6px;">100%</span>'
                    + '  </div>'
                    + '  <div id="previewStage" style="position:absolute; inset:0; overflow:auto; padding:20px;">'
                    + '    <div id="previewCanvas" style="position:relative; min-width:100%; min-height:100%; display:flex; align-items:flex-start; justify-content:center;">'
                    + '      <img id="previewZoomImg" src="' + fullImages[currentIndex] + '" style="transform-origin: top center; max-width:none; user-select:none; cursor:grab;" />'
                    + '    </div>'
                    + '  </div>'
                    + '</div>';
                var layerIndex = layer.open({
                    type: 1,
                    title: '图片预览（可放大缩小，滚轮缩放，拖拽移动，键盘左右键切换）',
                    closeBtn: 1,
                    shadeClose: true,
                    area: ['90vw', '90vh'],
                    content: html,
                    success: function(layero) {
                        resetTransform();
                        $('#btnPrev').prop('disabled', currentIndex === 0);
                        $('#btnNext').prop('disabled', currentIndex === totalImages - 1);
                        layero.find('.layui-layer-close').off('click.previewCloseFix').on('click.previewCloseFix', function(ev){ ev.stopPropagation(); });
                        $('#btnPrev').off('click.gallery').on('click.gallery', function() { if (currentIndex > 0) { switchImage(currentIndex - 1); } });
                        $('#btnNext').off('click.gallery').on('click.gallery', function() { if (currentIndex < totalImages - 1) { switchImage(currentIndex + 1); } });
                        $('#btnZoomIn').off('click.preview').on('click.preview', function() { zoomBy(0.2); });
                        $('#btnZoomOut').off('click.preview').on('click.preview', function() { zoomBy(-0.2); });
                        $('#btnZoomReset').off('click.preview').on('click.preview', function() { resetTransform(); });
                        $(document).off('keydown.galleryPreview').on('keydown.galleryPreview', function(ev) {
                            if (!layero || !layero.is(':visible')) return;
                            if (ev.key === 'ArrowLeft' || ev.keyCode === 37) {
                                ev.preventDefault();
                                if (currentIndex > 0) { switchImage(currentIndex - 1); }
                            } else if (ev.key === 'ArrowRight' || ev.keyCode === 39) {
                                ev.preventDefault();
                                if (currentIndex < totalImages - 1) { switchImage(currentIndex + 1); }
                            } else if (ev.key === 'Escape' || ev.keyCode === 27) {
                                ev.preventDefault();
                                layer.close(layerIndex);
                            }
                        });
                        $('#previewStage').off('wheel.preview').on('wheel.preview', function(ev) {
                            ev.preventDefault();
                            var oe = ev.originalEvent || ev;
                            var delta = (oe.deltaY > 0) ? -0.12 : 0.12;
                            var rect = this.getBoundingClientRect();
                            var cx = (oe.clientX || 0) - rect.left;
                            var cy = (oe.clientY || 0) - rect.top;
                            zoomBy(delta, cx, cy);
                        });
                        $('#previewZoomImg').off('mousedown.preview').on('mousedown.preview', function(ev) {
                            isDragging = true;
                            startX = ev.clientX;
                            startY = ev.clientY;
                            $(this).css('cursor', 'grabbing');
                            ev.preventDefault();
                            ev.stopPropagation();
                        });
                        $(document)
                            .off('mousemove.previewDrag').on('mousemove.previewDrag', function(ev) {
                                if (!isDragging) return;
                                var dx = ev.clientX - startX;
                                var dy = ev.clientY - startY;
                                startX = ev.clientX;
                                startY = ev.clientY;
                                translateX += dx;
                                translateY += dy;
                                applyTransform();
                            })
                            .off('mouseup.previewDrag').on('mouseup.previewDrag', function() {
                                if (!isDragging) return;
                                isDragging = false;
                                $('#previewZoomImg').css('cursor', 'grab');
                            });
                    },
                    end: function() {
                        window.__IMG_PREVIEW_CLOSE_AT__ = Date.now();
                        $(document).off('mousemove.previewDrag mouseup.previewDrag keydown.galleryPreview');
                    }
                });
            }

            $(document).on('click', '.js-img-gallery-preview', function() {
                if (window.__IMG_PREVIEW_CLOSE_AT__ && Date.now() - window.__IMG_PREVIEW_CLOSE_AT__ < 350) { return; }
                var $container = $(this).closest('.img-strip');
                if ($container.length === 0) {
                    var imgSrc = $(this).data('full') || $(this).attr('src');
                    if (imgSrc) openZoomPreview(imgSrc);
                    return;
                }
                var imagesData = null;
                var encodedData = $container.attr('data-images');
                if (encodedData) {
                    try { imagesData = JSON.parse(decodeURIComponent(encodedData)); } catch(e) {}
                }
                if (!imagesData || imagesData.length === 0) {
                    var imgSrc = $(this).data('full') || $(this).attr('src');
                    if (imgSrc) openZoomPreview(imgSrc);
                    return;
                }
                var startIndex = parseInt($(this).data('index')) || 0;
                if (startIndex < 0 || startIndex >= imagesData.length) startIndex = 0;
                openZoomPreviewGallery(imagesData, startIndex);
            });

            $(document).on('click', '.js-img-preview', function() {
                if (window.__IMG_PREVIEW_CLOSE_AT__ && Date.now() - window.__IMG_PREVIEW_CLOSE_AT__ < 350) { return; }
                var imgSrc = $(this).data('full') || $(this).attr('src');
                if (!imgSrc) return;
                openZoomPreview(imgSrc);
            });
            // === 图片预览功能（支持缩放/拖拽）结束 ===

        });

        /*添加*/
        function layer_add(title, url) {
            var index = layer.open({
                type: 2,
                title: title,
                closeBtn: 1, //是否显示关闭按钮
                area: ['100%', '86%'],
                anim: 2,  //动画
                shadeClose: false,  //点击空白处是否关闭
                maxmin: true, //开启最大化最小化按钮
                content: [url, 'no']
            });
        }

        function resetForm() {
            document.getElementById('searchForm').reset();
        }
    </script>
