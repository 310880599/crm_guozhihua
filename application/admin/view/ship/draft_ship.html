        background-color: #ffffff;
    }
    .draft-ship-wrap .layui-table-view[lay-id="draft-table"] .layui-table-fixed-r .layui-table-header,
    .draft-ship-wrap .layui-table-view[lay-id="draft-table"] .layui-table-fixed-r .layui-table-header th {

    .draft-ship-wrap .layui-table-view[lay-id="draft-table"] .layui-table-fixed-r tbody tr:hover > td,

<script>
layui.use(['table', 'form', 'layer'], function () {
    var table = layui.table;
    var layer = layui.layer;
    var form = layui.form;
    var $ = layui.$;

    var listUrl = '{:url("Ship/draftShip")}';
    var editUrlBase = '{:url("Ship/createShip")}';
    var deletingMap = {};
    var authorizingMap = {};
    var isSuperAdmin = false;
    var candidateCache = null;
    var pmDialogIndex = null;
    var currentPmApplyId = 0;

    function escapeHtml(str) {
        return String(str == null ? '' : str)
            .replace(/&/g, '&amp;')
            .replace(/</g, '&lt;')
            .replace(/>/g, '&gt;')
            .replace(/"/g, '&quot;')
            .replace(/'/g, '&#39;');
    }

    function formatAmount(v) {
        var n = parseFloat(v);
        if (isNaN(n)) {
            return '0.00';
        }
        return n.toFixed(2);
    }

    var tableIns = table.render({
        elem: '#draft-table',
        id: 'draft-table',
        url: listUrl,
        method: 'post',
        page: true,
        limit: 10,
        limits: [10, 20, 50],
        text: { none: '暂无草稿' },
        where: { keyword: '', op: 'list' },
        cols: [[
            {
                field: 'apply_no',
                title: '发货申请编号',
                minWidth: 160,
                templet: function (d) { return escapeHtml(d.apply_no || ''); }
            },
            {
                field: 'order_no',
                title: '关联订单编号',
                minWidth: 150,
                templet: function (d) { return escapeHtml(d.order_no || ''); }
            },
            {
                field: 'customer_name',
                title: '客户名称',
                minWidth: 140,
                templet: function (d) { return escapeHtml(d.customer_name || ''); }
            },
            {
                field: 'applicant_name',
                title: '申请人',
                width: 110,
                templet: function (d) { return escapeHtml(d.applicant_name || ''); }
            },
            {
                field: 'order_amount',
                title: '原订单金额',
                width: 120,
                templet: function (d) { return escapeHtml(formatAmount(d.order_amount)); }
            },
            {
                field: 'product_summary',
                title: '发货产品摘要',
                minWidth: 220,
                templet: function (d) {
                    var text = d.product_summary || '';
                    return '<span class="draft-product-summary" title="' + escapeHtml(text) + '">'
                        + escapeHtml(text) + '</span>';
                }
            },
            {
                field: 'create_time',
                title: '创建时间',
                width: 170,
                templet: function (d) { return escapeHtml(d.create_time || ''); }
            },
            {
                field: 'update_time',
                title: '最近修改时间',
                width: 170,
                templet: function (d) { return escapeHtml(d.update_time || ''); }
            },
            {
                field: 'status',
                title: '状态',
                width: 80,
                templet: function () { return '草稿'; }
            },
            {
                title: '操作',
                width: 280,
                fixed: 'right',
                toolbar: '#draft-action-tpl'
            }
        ]],
        parseData: function (res) {
            isSuperAdmin = !!(res && parseInt(res.is_super_admin, 10) === 1);
            var rows = (res && res.data) ? res.data : [];
            if (Object.prototype.toString.call(rows) === '[object Array]') {
                rows.forEach(function (row) {
                    if (row) {
                        row._is_super_admin = isSuperAdmin;
                    }
                });
            }
            return res;
        },
        done: function (res) {
            if (res && typeof res.code !== 'undefined' && parseInt(res.code, 10) !== 0) {
                layer.msg(res.msg || '加载失败', { icon: 2 });
            }
        }
    });

    function reloadTable(resetPage, pageCurr) {
        var opts = {
            where: {
                keyword: $.trim($('#keyword').val() || ''),
                op: 'list'
            }
        };
        if (resetPage) {
            opts.page = { curr: 1 };
        } else if (pageCurr && pageCurr > 0) {
            opts.page = { curr: pageCurr };
        }
        tableIns.reload(opts);
    }

    function getCurrentPage() {
        var cfg = tableIns && tableIns.config ? tableIns.config : {};
        var page = cfg.page;
        if (page && typeof page === 'object' && page.curr) {
            return parseInt(page.curr, 10) || 1;
        }
        return 1;
    }

    function reloadAfterDelete() {
        var cache = table.cache['draft-table'] || [];
        var curr = getCurrentPage();
        if (cache.length <= 1 && curr > 1) {
            reloadTable(false, curr - 1);
        } else {
            reloadTable(false);
        }
    }

    function requestDeleteDraft(id) {
        if (deletingMap[id]) {
            return;
        }
        deletingMap[id] = true;
        var loadIdx = layer.load(1, { shade: 0.1 });
        $.ajax({
            url: listUrl,
            type: 'post',
            dataType: 'json',
            data: {
                op: 'delete_draft',
                id: id
            },
            success: function (res) {
                layer.close(loadIdx);
                deletingMap[id] = false;
                if (res && parseInt(res.code, 10) === 0) {
                    layer.msg(res.msg || '草稿删除成功', { icon: 1 });
                    reloadAfterDelete();
                } else {
                    layer.msg((res && res.msg) ? res.msg : '草稿删除失败', { icon: 2 });
                }
            },
            error: function () {
                layer.close(loadIdx);
                deletingMap[id] = false;
                layer.msg('网络异常，删除失败', { icon: 2 });
            }
        });
    }

    $('#btn-search').on('click', function () {
        reloadTable(true);
    });

    $('#btn-reset').on('click', function () {
        $('#keyword').val('');
        reloadTable(true);
    });

    $('#keyword').on('keydown', function (e) {
        if (e.keyCode === 13) {
            e.preventDefault();
            reloadTable(true);
        }
    });

    table.on('tool(draft-table)', function (obj) {
        var id = parseInt(obj.data && obj.data.id, 10);
        if (!id || id <= 0 || String(id) !== String(obj.data.id)) {
            layer.msg('草稿ID无效', { icon: 2 });
            return;
        }

        if (obj.event === 'continueEdit') {
            window.location.href = editUrlBase + (editUrlBase.indexOf('?') >= 0 ? '&' : '?') + 'id=' + id;
            return;
        }

        // 仅跳转编辑页；不直接调用 submitApply。归属与正式提交权限由编辑页/Service 校验。
        if (obj.event === 'submitApplyGuide') {
            layer.msg('请进入编辑页后由原申请人提交审核', { icon: 0, time: 1800 }, function () {
                window.location.href = editUrlBase + (editUrlBase.indexOf('?') >= 0 ? '&' : '?') + 'id=' + id;
            });
            return;
        }

        if (obj.event === 'deleteDraft') {
            var applyNo = (obj.data && obj.data.apply_no) ? String(obj.data.apply_no) : '';
            var tip = applyNo
                ? ('确定删除发货申请草稿【' + escapeHtml(applyNo) + '】吗？删除后将无法继续编辑。')
                : '确定删除该发货申请草稿吗？删除后将无法继续编辑。';

            // Layui 2.4.5：btn[0] → yes 回调；btn[1] → btn2 回调
            layer.confirm(tip, {
                icon: 3,
                title: '删除确认',
                btn: ['取消', '确认删除']
            }, function (index) {
                // 第一个按钮：取消
                layer.close(index);
            }, function (index) {
                // 第二个按钮：确认删除
                layer.close(index);
                requestDeleteDraft(id);
            });
            return;
        }

        if (obj.event === 'authorizePm') {
            if (!isSuperAdmin) {
                layer.msg('仅超级管理员可操作', { icon: 2 });
                return;
            }
            openPmSubstituteDialog(id, (obj.data && obj.data.apply_no) ? String(obj.data.apply_no) : '');
        }
    });

    function managerStatusText(status) {
        switch (String(status || '')) {
            case 'missing':
                return '不存在';
            case 'disabled':
                return '已停用';
            case 'invalid_id':
                return 'ID非法';
            case 'valid':
                return '正常';
            default:
                return status || '-';
        }
    }

    function displayStatusText(status) {
        switch (String(status || '')) {
            case 'authorized':
                return '已授权有效';
            case 'need_authorize':
                return '待指定';
            case 'revoked':
                return '已撤销';
            case 'original_restored':
                return '原经理已恢复';
            case 'substitute_unavailable':
                return '替代人不可用';
            case 'frozen':
                return '已冻结';
            case 'none':
                return '无需替代';
            default:
                return status || '-';
        }
    }

    function loadCandidates(cb) {
        if (candidateCache) {
            cb(candidateCache);
            return;
        }
        $.ajax({
            url: listUrl,
            type: 'post',
            dataType: 'json',
            data: { op: 'list_substitute_candidates' },
            success: function (res) {
                if (res && parseInt(res.code, 10) === 0) {
                    candidateCache = res.data || [];
                    cb(candidateCache);
                } else {
                    layer.msg((res && res.msg) ? res.msg : '候选人加载失败', { icon: 2 });
                    cb([]);
                }
            },
            error: function () {
                layer.msg('网络异常，候选人加载失败', { icon: 2 });
                cb([]);
            }
        });
    }

    function buildCandidateOptions(selectedId) {
        var html = '<option value="">请选择替代产品经理</option>';
        var list = candidateCache || [];
        var sid = selectedId ? String(selectedId) : '';
        list.forEach(function (c) {
            var id = String(c.admin_id || '');
            var label = c.display_name || ((c.username || '') + '（ID:' + id + '）');
            html += '<option value="' + escapeHtml(id) + '"'
                + (sid && sid === id ? ' selected' : '') + '>'
                + escapeHtml(label) + '</option>';
        });
        return html;
    }

    function renderPmSubstituteList(payload) {
        var items = (payload && payload.items) ? payload.items : [];
        var $box = $('#pm-sub-list');
        if (!items.length) {
            $box.html('<div style="padding:20px;color:#999;text-align:center;">当前草稿没有发货产品</div>');
            return;
        }
        var html = '';
        items.forEach(function (it) {
            var canAuth = parseInt(it.can_authorize, 10) === 1;
            var displayStatus = String(it.display_status || '');
            var showActions = canAuth || displayStatus === 'authorized' || displayStatus === 'substitute_unavailable';
            html += '<div class="pm-sub-item" data-oid="' + escapeHtml(String(it.order_item_id || '')) + '"'
                + ' data-token="' + escapeHtml(String(it.version_token || 'none')) + '"'
                + ' style="border:1px solid #e6e6e6;border-radius:2px;padding:10px 12px;margin-bottom:10px;">';
            html += '<div><strong>' + escapeHtml(it.product_name || '未命名产品') + '</strong>'
                + ' <span style="color:#999;">（原产品ID:' + escapeHtml(String(it.order_item_id || '')) + '，'
                + escapeHtml(String(it.line_count || 0)) + ' 行）</span></div>';
            html += '<div style="margin-top:4px;">原经理：'
                + escapeHtml(it.original_manager_name || (it.original_manager_id ? ('ID:' + it.original_manager_id) : '—'))
                + ' / 状态：' + escapeHtml(managerStatusText(it.manager_status))
                + ' / 授权：' + escapeHtml(displayStatusText(it.display_status))
                + '</div>';
            if (it.display_tip) {
                html += '<div style="margin-top:4px;color:#FF5722;">' + escapeHtml(it.display_tip) + '</div>';
            }
            if (!showActions) {
                html += '</div>';
                return;
            }
            html += '<div class="layui-form" style="margin-top:8px;">';
            html += '<div class="layui-form-item" style="margin-bottom:8px;">'
                + '<label class="layui-form-label" style="width:90px;padding:9px 0;">替代经理</label>'
                + '<div class="layui-input-block" style="margin-left:100px;">'
                + '<select class="pm-sub-candidate">' + buildCandidateOptions(it.substitute_manager_id) + '</select>'
                + '</div></div>';
            html += '<div class="layui-form-item" style="margin-bottom:8px;">'
                + '<label class="layui-form-label" style="width:90px;padding:9px 0;">原因</label>'
                + '<div class="layui-input-block" style="margin-left:100px;">'
                + '<textarea class="layui-textarea pm-sub-reason" maxlength="500" placeholder="首次指定/修改/撤销均需填写原因">'
                + escapeHtml(displayStatus === 'authorized' ? '' : (it.reason || ''))
                + '</textarea></div></div>';
            html += '<div style="text-align:right;">';
            if (canAuth || displayStatus === 'authorized' || displayStatus === 'substitute_unavailable') {
                html += '<button type="button" class="layui-btn layui-btn-sm btn-pm-authorize">'
                    + (displayStatus === 'authorized' || displayStatus === 'substitute_unavailable' ? '修改授权' : '指定授权')
                    + '</button>';
            }
            if (displayStatus === 'authorized' || displayStatus === 'substitute_unavailable') {
                html += '<button type="button" class="layui-btn layui-btn-primary layui-btn-sm btn-pm-revoke" style="margin-left:8px;">撤销授权</button>';
            }
            html += '</div></div></div>';
        });
        $box.html(html);
        form.render('select');
    }

    function refreshPmSubstituteDialog() {
        if (!currentPmApplyId) {
            return;
        }
        var loadIdx = layer.load(1, { shade: 0.1 });
        $.ajax({
            url: listUrl,
            type: 'post',
            dataType: 'json',
            data: { op: 'list_pm_substitutes', apply_id: currentPmApplyId },
            success: function (res) {
                layer.close(loadIdx);
                if (!res || parseInt(res.code, 10) !== 0) {
                    layer.msg((res && res.msg) ? res.msg : '加载授权信息失败', { icon: 2 });
                    return;
                }
                $('#pm-sub-apply-no').text((res.data && res.data.apply_no) ? res.data.apply_no : '');
                loadCandidates(function () {
                    renderPmSubstituteList(res.data || {});
                });
            },
            error: function () {
                layer.close(loadIdx);
                layer.msg('网络异常，加载授权信息失败', { icon: 2 });
            }
        });
    }

    function openPmSubstituteDialog(applyId, applyNo) {
        currentPmApplyId = applyId;
        $('#pm-sub-apply-no').text(applyNo || '');
        $('#pm-sub-list').html('<div style="padding:20px;text-align:center;color:#999;">加载中…</div>');
        pmDialogIndex = layer.open({
            type: 1,
            title: '指定替代产品经理',
            area: ['720px', '520px'],
            content: $('#pm-sub-dialog'),
            success: function () {
                refreshPmSubstituteDialog();
            },
            end: function () {
                currentPmApplyId = 0;
                pmDialogIndex = null;
            }
        });
    }

    function requestPmAction(op, data, done) {
        var key = String(data.apply_id) + ':' + String(data.order_item_id) + ':' + op;
        if (authorizingMap[key]) {
            return;
        }
        authorizingMap[key] = true;
        var loadIdx = layer.load(1, { shade: 0.1 });
        $.ajax({
            url: listUrl,
            type: 'post',
            dataType: 'json',
            data: $.extend({ op: op }, data),
            success: function (res) {
                layer.close(loadIdx);
                authorizingMap[key] = false;
                if (res && parseInt(res.code, 10) === 0) {
                    layer.msg(res.msg || '操作成功', { icon: 1 });
                    if (typeof done === 'function') {
                        done(res);
                    }
                    refreshPmSubstituteDialog();
                } else {
                    layer.msg((res && res.msg) ? res.msg : '操作失败', { icon: 2 });
                }
            },
            error: function () {
                layer.close(loadIdx);
                authorizingMap[key] = false;
                layer.msg('网络异常，操作失败', { icon: 2 });
            }
        });
    }

    $(document).on('click', '.btn-pm-authorize', function () {
        var $item = $(this).closest('.pm-sub-item');
        var oid = parseInt($item.attr('data-oid'), 10) || 0;
        var token = String($item.attr('data-token') || 'none');
        var managerId = parseInt($item.find('.pm-sub-candidate').val(), 10) || 0;
        var reason = $.trim($item.find('.pm-sub-reason').val() || '');
        if (!currentPmApplyId || oid <= 0) {
            layer.msg('参数无效', { icon: 2 });
            return;
        }
        if (managerId <= 0) {
            layer.msg('请选择替代产品经理', { icon: 2 });
            return;
        }
        if (!reason) {
            layer.msg('请填写授权原因', { icon: 2 });
            return;
        }
        if (reason.length > 500) {
            layer.msg('授权原因不能超过500个字符', { icon: 2 });
            return;
        }
        requestPmAction('authorize_pm_substitute', {
            apply_id: currentPmApplyId,
            order_item_id: oid,
            substitute_manager_id: managerId,
            reason: reason,
            expected_version_token: token
        });
    });

    $(document).on('click', '.btn-pm-revoke', function () {
        var $item = $(this).closest('.pm-sub-item');
        var oid = parseInt($item.attr('data-oid'), 10) || 0;
        var token = String($item.attr('data-token') || '');
        var reason = $.trim($item.find('.pm-sub-reason').val() || '');
        if (!currentPmApplyId || oid <= 0) {
            layer.msg('参数无效', { icon: 2 });
            return;
        }
        if (!reason) {
            layer.msg('请填写撤销原因', { icon: 2 });
            return;
        }
        if (reason.length > 500) {
            layer.msg('撤销原因不能超过500个字符', { icon: 2 });
            return;
        }
        layer.confirm('确认撤销该产品的替代产品经理授权吗？', {
            icon: 3,
            title: '撤销确认',
            btn: ['取消', '确认撤销']
        }, function (index) {
            layer.close(index);
        }, function (index) {
            layer.close(index);
            requestPmAction('revoke_pm_substitute', {
                apply_id: currentPmApplyId,
                order_item_id: oid,
                reason: reason,
                expected_version_token: token
            });
        });
    });
});
</script>
</body>
</html>
