<script>
layui.use(['table', 'form', 'layer'], function () {
    var table = layui.table;
    var layer = layui.layer;
    var $ = layui.$;

    var listUrl = '{:url("Ship/draftShip")}';
    var editUrlBase = '{:url("Ship/createShip")}';

    function escapeHtml(str) {
        return String(str == null ? '' : str)
            .replace(/&/g, '&amp;')
            .replace(/</g, '&lt;')
            .replace(/>/g, '&gt;')
            .replace(/"/g, '&quot;')
            .replace(/'/g, '&#39;');
    }

    function formatAmount(v) {
        var n = parseFloat(v);
        if (isNaN(n)) {
            return '0.00';
        }
        return n.toFixed(2);
    }

    var tableIns = table.render({
        elem: '#draft-table',
        id: 'draft-table',
        url: listUrl,
        method: 'post',
        page: true,
        limit: 10,
        limits: [10, 20, 50],
        text: { none: '暂无草稿' },
        where: { keyword: '' },
        cols: [[
            {
                field: 'apply_no',
                title: '发货申请编号',
                minWidth: 160,
                templet: function (d) { return escapeHtml(d.apply_no || ''); }
            },
            {
                field: 'order_no',
                title: '关联订单编号',
                minWidth: 150,
                templet: function (d) { return escapeHtml(d.order_no || ''); }
            },
            {
                field: 'customer_name',
                title: '客户名称',
                minWidth: 140,
                templet: function (d) { return escapeHtml(d.customer_name || ''); }
            },
            {
                field: 'applicant_name',
                title: '申请人',
                width: 110,
                templet: function (d) { return escapeHtml(d.applicant_name || ''); }
            },
            {
                field: 'order_amount',
                title: '原订单金额',
                width: 120,
                templet: function (d) { return escapeHtml(formatAmount(d.order_amount)); }
            },
            {
                field: 'product_summary',
                title: '发货产品摘要',
                minWidth: 220,
                templet: function (d) {
                    var text = d.product_summary || '';
                    return '<span class="draft-product-summary" title="' + escapeHtml(text) + '">'
                        + escapeHtml(text) + '</span>';
                }
            },
            {
                field: 'create_time',
                title: '创建时间',
                width: 170,
                templet: function (d) { return escapeHtml(d.create_time || ''); }
            },
            {
                field: 'update_time',
                title: '最近修改时间',
                width: 170,
                templet: function (d) { return escapeHtml(d.update_time || ''); }
            },
            {
                field: 'status',
                title: '状态',
                width: 80,
                templet: function () { return '草稿'; }
            },
            {
                title: '操作',
                width: 110,
                fixed: 'right',
                toolbar: '#draft-action-tpl'
            }
        ]],
        done: function (res) {
            if (res && typeof res.code !== 'undefined' && parseInt(res.code, 10) !== 0) {
                layer.msg(res.msg || '加载失败', { icon: 2 });
            }
        }
    });

    function reloadTable(resetPage) {
        var opts = {
            where: {
                keyword: $.trim($('#keyword').val() || '')
            }
        };
        if (resetPage) {
            opts.page = { curr: 1 };
        }
        tableIns.reload(opts);
    }

    $('#btn-search').on('click', function () {
        reloadTable(true);
    });

    $('#btn-reset').on('click', function () {
        $('#keyword').val('');
        reloadTable(true);
    });

    $('#keyword').on('keydown', function (e) {
        if (e.keyCode === 13) {
            e.preventDefault();
            reloadTable(true);
        }
    });

    table.on('tool(draft-table)', function (obj) {
        if (obj.event !== 'continueEdit') {
            return;
        }
        var id = parseInt(obj.data && obj.data.id, 10);
        if (!id || id <= 0 || String(id) !== String(obj.data.id)) {
            layer.msg('草稿ID无效', { icon: 2 });
            return;
        }
        window.location.href = editUrlBase + (editUrlBase.indexOf('?') >= 0 ? '&' : '?') + 'id=' + id;
    });
});
</script>
</body>
</html>
