<style>
    .my-ship-wrap {
        padding: 12px 16px 20px;
    }
    .my-ship-wrap .layui-card {
        box-shadow: none;
        margin-top: 8px;
    }
    .my-ship-table-box {
        overflow-x: auto;
    }
    .my-ship-product-summary {
        display: inline-block;
        max-width: 260px;
        overflow: hidden;

        white-space: nowrap;

    }
    .my-ship-apply-no-link {
        color: #1E9FFF;
        cursor: pointer;
    }
    .my-ship-apply-no-link:hover {
        text-decoration: underline;
    }
    /*
     * M4-2A：右侧固定操作列可见时，隐藏主表重复「查看详情」，保留 td 占位。
     * Layui 正常会镜像生成固定列节点；scrollPatch 无横向溢出时会给
     * .layui-table-fixed-r 加 .layui-hide，此时 :has 不匹配，主表按钮自动恢复。
     * 不得删除固定列镜像 DOM。
     */
    .my-ship-wrap .layui-table-view[lay-id="my-ship-table"]:has(.layui-table-fixed-r:not(.layui-hide))
        .layui-table-main a[lay-event="viewDetail"].my-ship-detail-btn {
        visibility: hidden;
        pointer-events: none;
    }

    /* 右侧固定操作列不透明白底，避免主表文字/按钮透出 */
    .my-ship-wrap .layui-table-view[lay-id="my-ship-table"] .layui-table-fixed-r,
    .my-ship-wrap .layui-table-view[lay-id="my-ship-table"] .layui-table-fixed-r .layui-table-body,
    .my-ship-wrap .layui-table-view[lay-id="my-ship-table"] .layui-table-fixed-r table,
    .my-ship-wrap .layui-table-view[lay-id="my-ship-table"] .layui-table-fixed-r td,
    .my-ship-wrap .layui-table-view[lay-id="my-ship-table"] .layui-table-fixed-r .layui-table-cell {
        background-color: #fff;
    }
    .my-ship-wrap .layui-table-view[lay-id="my-ship-table"] .layui-table-fixed-r .layui-table-header,
    .my-ship-wrap .layui-table-view[lay-id="my-ship-table"] .layui-table-fixed-r .layui-table-header th {
        background-color: #f2f2f2;
    }
    .my-ship-wrap .layui-table-view[lay-id="my-ship-table"] .layui-table-fixed-r tbody tr:hover > td,
    .my-ship-wrap .layui-table-view[lay-id="my-ship-table"] .layui-table-fixed-r tbody tr.layui-table-hover > td {
        background-color: #f2f2f2;
    }
    /* 固定列左侧细边框 + 轻阴影，区分滚动区与操作列 */
    .my-ship-wrap .layui-table-view[lay-id="my-ship-table"] .layui-table-fixed-r {
        box-shadow: -2px 0 6px rgba(0, 0, 0, 0.08);
        border-left: 1px solid #e6e6e6;
    }

    /* 操作列「查看详情」：不透明蓝底白字 */
    .my-ship-wrap .my-ship-detail-btn {
        background-color: #1E9FFF !important;
        color: #fff !important;
        border: 1px solid #1E9FFF !important;
        border-radius: 2px;
        opacity: 1 !important;
    }
    .my-ship-wrap .my-ship-detail-btn:hover {
        background-color: #0b83e6 !important;
        border-color: #0b83e6 !important;
        color: #fff !important;
    }
</style>

<script type="text/html" id="my-ship-action-tpl">
    <a class="layui-btn layui-btn-xs my-ship-detail-btn" lay-event="viewDetail">查看详情</a>
</script>

{include file="common/foot"/}
<script>
layui.use(['table', 'form', 'layer', 'laydate'], function () {
    var table = layui.table;
    var layer = layui.layer;
    var form = layui.form;
    var laydate = layui.laydate;
    var $ = layui.$;

    var listUrl = '{:url("Ship/myShip")}';
    var detailUrlBase = '{:url("Ship/applyDetail")}';

    function escapeHtml(str) {
        return String(str == null ? '' : str)
            .replace(/&/g, '&amp;')
            .replace(/</g, '&lt;')
            .replace(/>/g, '&gt;')
            .replace(/"/g, '&quot;')
            .replace(/'/g, '&#39;');
    }

    function formatAmount(v) {
        var n = parseFloat(v);
        if (isNaN(n)) {
            return '0.00';
        }
        return n.toFixed(2);
    }

    function buildWhere() {
        return {
            op: 'list',
            keyword: $.trim($('#keyword').val() || ''),
            status: $('#status').val() || '',
            start_time: $.trim($('#start_time').val() || ''),
            end_time: $.trim($('#end_time').val() || '')
        };
    }

    function openDetail(id) {
        id = parseInt(id, 10);
        if (!id || id <= 0) {
            layer.msg('申请ID无效', { icon: 2 });
            return;
        }
        var url = detailUrlBase + (detailUrlBase.indexOf('?') >= 0 ? '&' : '?') + 'id=' + id;
        layer.open({
            type: 2,
            title: '发货申请详情',
            area: ['92%', '92%'],
            maxmin: true,
            shadeClose: true,
            content: url
        });
    }

    laydate.render({
        elem: '#start_time',
        type: 'date',
        format: 'yyyy-MM-dd',
        done: function () {
            // 筛选变更由查询按钮统一触发，避免输入过程连发
        }
    });
    laydate.render({
        elem: '#end_time',
        type: 'date',
        format: 'yyyy-MM-dd'
    });

    var tableIns = table.render({
        elem: '#my-ship-table',
        id: 'my-ship-table',
        url: listUrl,
        method: 'post',
        page: true,
        limit: 10,
        limits: [10, 20, 50],
        text: { none: '暂无正式发货申请' },
        where: buildWhere(),
        cols: [[
            {
                field: 'apply_no',
                title: '发货申请编号',
                minWidth: 160,
                templet: function (d) {
                    var no = escapeHtml(d.apply_no || '');
                    return '<a class="my-ship-apply-no-link" lay-event="viewDetail" title="查看详情">' + no + '</a>';
                }
            },
            {
                field: 'order_no',
                title: '原订单编号',
                minWidth: 150,
                templet: function (d) { return escapeHtml(d.order_no || ''); }
            },
            {
                field: 'customer_name',
                title: '客户名称',
                minWidth: 130,
                templet: function (d) { return escapeHtml(d.customer_name || ''); }
            },
            {
                field: 'order_amount',
                title: '原订单总金额',
                width: 120,
                templet: function (d) { return escapeHtml(formatAmount(d.order_amount)); }
            },
            {
                field: 'product_summary',
                title: '发货产品摘要',
                minWidth: 200,
                templet: function (d) {
                    var text = d.product_summary || '';
                    return '<span class="my-ship-product-summary" title="' + escapeHtml(text) + '">'
                        + escapeHtml(text) + '</span>';
                }
            },
            {
                field: 'shipping_date',
                title: '预计发货日期',
                width: 120,
                templet: function (d) { return escapeHtml(d.shipping_date || ''); }
            },
            {
                field: 'submit_time',
                title: '申请提交时间',
                width: 170,
                templet: function (d) { return escapeHtml(d.submit_time || ''); }
            },
            {
                field: 'status_text',
                title: '审批状态',
                width: 140,
                templet: function (d) { return escapeHtml(d.status_text || ''); }
            },
            {
                field: 'current_approver_text',
                title: '当前审批人',
                minWidth: 120,
                templet: function (d) { return escapeHtml(d.current_approver_text || '-'); }
            },
            {
                field: 'next_stage_text',
                title: '下一审批阶段',
                minWidth: 160,
                templet: function (d) { return escapeHtml(d.next_stage_text || '-'); }
            },
            {
                title: '操作',
                width: 100,
                fixed: 'right',
                toolbar: '#my-ship-action-tpl'
            }
        ]],
        done: function (res) {
            if (res && typeof res.code !== 'undefined' && parseInt(res.code, 10) !== 0) {
                layer.msg(res.msg || '加载失败', { icon: 2 });
            }
        }
    });

    function reloadTable(resetPage) {
        var opts = { where: buildWhere() };
        if (resetPage) {
            opts.page = { curr: 1 };
        }
        tableIns.reload(opts);
    }

    $('#btn-search').on('click', function () {
        reloadTable(true);
    });

    $('#btn-reset').on('click', function () {
        $('#keyword').val('');
        $('#status').val('');
        $('#start_time').val('');
        $('#end_time').val('');
        form.render('select');
        reloadTable(true);
    });

    $('#keyword').on('keydown', function (e) {
        if (e.keyCode === 13) {
            e.preventDefault();
            reloadTable(true);
        }
    });

    table.on('tool(my-ship-table)', function (obj) {
        var id = parseInt(obj.data && obj.data.id, 10);
        if (!id || id <= 0 || String(id) !== String(obj.data.id)) {
            layer.msg('申请ID无效', { icon: 2 });
            return;
        }
        if (obj.event === 'viewDetail') {
            openDetail(id);
        }
    });
});
</script>
</body>
</html>
