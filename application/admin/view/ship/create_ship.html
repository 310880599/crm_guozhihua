    }

    function safeStorageGet(storage, key) {
        try {
            if (!storage) return null;
            return storage.getItem(key);
        } catch (e) {
            return null;
        }
    }

    function safeStorageSet(storage, key, value) {
        try {
            if (!storage) return false;
            storage.setItem(key, value);
            return true;
        } catch (e) {
            return false;
        }
    }

    function safeStorageRemove(storage, key) {
        try {
            if (!storage) return;
            storage.removeItem(key);
        } catch (e) { /* ignore */ }
    }

    function readIntentMap(storage, key) {
        var raw = safeStorageGet(storage, key);
        if (!raw) return {};
        try {
            var parsed = JSON.parse(raw);
            return (parsed && typeof parsed === 'object' && !Array.isArray(parsed)) ? parsed : {};
        } catch (e) {
            return {};
        }
    }

    function writeIntentMap(storage, key, map) {
        return safeStorageSet(storage, key, JSON.stringify(map));
    }

    function isProtectedIntentState(state) {
        return state === 'prepared' || state === 'sending' || state === 'uncertain';
    }

    function stripPiiFromIntent(intent) {
        if (!intent) return null;
        return {
            version: 1,
            accountId: intent.accountId,
            applyId: intent.applyId,
            orderId: intent.orderId,
            submitToken: intent.submitToken,
            state: intent.state,
            createdAt: intent.createdAt,
            updatedAt: intent.updatedAt,
            scopeKey: intent.scopeKey,
            hasFrozenPayload: !!(intent.frozenPayload && typeof intent.frozenPayload === 'object')
        };
    }

    function persistSubmitIntent(intent) {
        if (!intent || !intent.scopeKey) {
            return { ok: false, msg: '提交意图无效，无法持久化。' };
        }
        var storageFailMsg = '浏览器无法安全保存提交状态，本次未发送请求。请检查浏览器存储权限。';
        var fullMap = readIntentMap(window.sessionStorage, SUBMIT_INTENT_FULL_KEY);
        var prevFull = Object.prototype.hasOwnProperty.call(fullMap, intent.scopeKey)
            ? fullMap[intent.scopeKey]
            : null;
        fullMap[intent.scopeKey] = intent;
        var fullOk = writeIntentMap(window.sessionStorage, SUBMIT_INTENT_FULL_KEY, fullMap);
        if (!fullOk) {
            return { ok: false, msg: storageFailMsg };
        }
        var indexMap = readIntentMap(window.localStorage, SUBMIT_INTENT_INDEX_KEY);
        indexMap[intent.scopeKey] = stripPiiFromIntent(intent);
        var indexOk = writeIntentMap(window.localStorage, SUBMIT_INTENT_INDEX_KEY, indexMap);
        if (!indexOk) {
            // session 已写、local 失败：回滚本次写入，且不得误删既有 uncertain 意图
            if (prevFull) {
                fullMap[intent.scopeKey] = prevFull;
            } else {
                delete fullMap[intent.scopeKey];
            }
            writeIntentMap(window.sessionStorage, SUBMIT_INTENT_FULL_KEY, fullMap);
            return { ok: false, msg: storageFailMsg };
        }
        activeSubmitIntent = intent;
        broadcastSubmitIntent(intent);
        return { ok: true };
    }

    function clearSubmitIntent(scopeKey, opts) {
        opts = opts || {};
        var fullMap = readIntentMap(window.sessionStorage, SUBMIT_INTENT_FULL_KEY);
        delete fullMap[scopeKey];
        writeIntentMap(window.sessionStorage, SUBMIT_INTENT_FULL_KEY, fullMap);
        if (opts.clearIndex !== false) {
            var indexMap = readIntentMap(window.localStorage, SUBMIT_INTENT_INDEX_KEY);
            delete indexMap[scopeKey];
            writeIntentMap(window.localStorage, SUBMIT_INTENT_INDEX_KEY, indexMap);
        }
        if (activeSubmitIntent && activeSubmitIntent.scopeKey === scopeKey) {
            activeSubmitIntent = null;
        }
        if (opts.broadcast !== false) {
            broadcastSubmitIntent({ scopeKey: scopeKey, state: 'cleared' });
        }
    }

    function loadSubmitIntentForPage() {
        var applyId = parseInt($('#apply_id').val(), 10) || 0;
        var orderId = parseInt($('#order_id').val(), 10) || 0;
        var fullMap = readIntentMap(window.sessionStorage, SUBMIT_INTENT_FULL_KEY);
        var indexMap = readIntentMap(window.localStorage, SUBMIT_INTENT_INDEX_KEY);
        var candidates = [];
        var sk;
        for (sk in fullMap) {
            if (!Object.prototype.hasOwnProperty.call(fullMap, sk)) continue;
            candidates.push({ source: 'full', intent: fullMap[sk] });
        }
        for (sk in indexMap) {
            if (!Object.prototype.hasOwnProperty.call(indexMap, sk)) continue;
            if (!fullMap[sk]) {
                candidates.push({ source: 'index', intent: indexMap[sk] });
            }
        }
        var matched = null;
        var foreignUncertain = null;
        var now = Date.now();
        for (var i = 0; i < candidates.length; i++) {
            var item = candidates[i];
            var intent = item.intent;
            if (!intent || !intent.submitToken) continue;
            if (intent.updatedAt && (now - intent.updatedAt) > SUBMIT_INTENT_TTL_MS) {
                if (!isProtectedIntentState(intent.state)) {
                    clearSubmitIntent(intent.scopeKey || sk, { broadcast: false });
                }
                continue;
            }
            var sameApply = (parseInt(intent.applyId, 10) || 0) === applyId;
            var sameOrder = (parseInt(intent.orderId, 10) || 0) === orderId;
            if (!sameApply && !(applyId === 0 && sameOrder && orderId > 0)) {
                continue;
            }
            if (applyId === 0 && orderId > 0 && !sameOrder) {
                continue;
            }
            if ((parseInt(intent.accountId, 10) || 0) !== pageSessionAid) {
                if (isProtectedIntentState(intent.state)) {
                    foreignUncertain = intent;
                }
                continue;
            }
            if (!matched || (intent.updatedAt || 0) > (matched.intent.updatedAt || 0)) {
                matched = item;
            }
        }
        return { matched: matched, foreignUncertain: foreignUncertain };
    }

    function showSubmitIntentBanner(html, level) {
        var $b = $('#submit-intent-banner');
        if (!html) {
            $b.hide().empty();
            return;
        }
        var color = level === 'danger' ? '#a94442' : (level === 'success' ? '#3c763d' : '#8a6d3b');
        $b.css('color', color).html(html).show();
    }

    function setSubmitButtonsForState(state) {
        var $submit = $('#btn-submit-apply');
        var $retry = $('#btn-retry-submit');
        var $save = $('#btn-save-draft');
        if (formLockedAfterSubmit || state === 'success') {
            $submit.addClass('layui-btn-disabled').prop('disabled', true).text('已提交审核');
            $retry.hide();
            $save.addClass('layui-btn-disabled').prop('disabled', true);
            return;
        }
        if (state === 'sending') {
            $submit.addClass('layui-btn-disabled').prop('disabled', true).text('提交中...');
            $retry.hide();
            $save.addClass('layui-btn-disabled').prop('disabled', true);
            return;
        }
        if (state === 'uncertain' || state === 'prepared') {
            $submit.addClass('layui-btn-disabled').prop('disabled', true).text('提交审核');
            $retry.show().removeClass('layui-btn-disabled').prop('disabled', false);
            $save.addClass('layui-btn-disabled').prop('disabled', true);
            return;
        }
        $submit.removeClass('layui-btn-disabled').prop('disabled', false).text('提交审核');
        $retry.hide();
        if (!savingDraft) {
            $save.removeClass('layui-btn-disabled').prop('disabled', false).text('保存草稿');
        }
    }

    function lockFormAfterSuccess(applyNo) {
        formLockedAfterSubmit = true;
        $('#ship-create-form').find('input, textarea, select, button').not('#btn-back,#btn-back-to-draft').each(function () {
            var $el = $(this);
            if ($el.attr('id') === 'btn-back' || $el.attr('id') === 'btn-back-to-draft') {
                return;
            }
            if ($el.is('button')) {
                if ($el.attr('id') === 'btn-submit-apply') {
                    $el.addClass('layui-btn-disabled').prop('disabled', true).text('已提交审核');
                } else if ($el.attr('id') === 'btn-retry-submit') {
                    $el.hide();
                } else if ($el.attr('id') === 'btn-save-draft') {
                    $el.addClass('layui-btn-disabled').prop('disabled', true);
                } else if ($el.attr('id') !== 'btn-reopen-draft') {
                    $el.addClass('layui-btn-disabled').prop('disabled', true);
                }
            } else {
                $el.prop('disabled', true);
            }
        });
        if (applyNo) {
            $('#apply_no_display').text(applyNo);
        }
        setSubmitButtonsForState('success');
    }

    function validateFormalSubmitPayload(data) {
        if (!data || !data.order_id) {
            return { ok: false, msg: '请先选择有效订单。' };
        }
        if (!data.shipping_date || !/^\d{4}-\d{2}-\d{2}$/.test(data.shipping_date)) {
            return { ok: false, msg: '预计发货日期不能为空或格式不正确。' };
        }
        if (!data.receiver_name) {
            return { ok: false, msg: '收货人不能为空。' };
        }
        if (!data.receiver_phone) {
            return { ok: false, msg: '收货电话不能为空。' };
        }
        if (!data.receiver_address) {
            return { ok: false, msg: '收货地址不能为空。' };
        }
        if (!data.shipping_method) {
            return { ok: false, msg: '发货方式不能为空。' };
        }
        if (!data.items || !data.items.length) {
            return { ok: false, msg: '至少需要一条正整数数量的发货行。' };
        }
        if (data.items.length > 200) {
            return { ok: false, msg: '发货明细行数超过限制' };
        }
        var positive = 0;
        for (var i = 0; i < data.items.length; i++) {
            var row = data.items[i];
            var qty = parseInt(row.apply_qty, 10) || 0;
            if (qty <= 0) {
                continue;
            }
            positive++;
            if (!row.factory_id || parseInt(row.factory_id, 10) <= 0) {
                return { ok: false, msg: '正式提交必须为每条发货行选择有效厂家。' };
            }
            if (!hasConfirmedMoney(row.apply_unit_price)) {
                return { ok: false, msg: '本次销售单价必填（允许 0.00，不允许空值）。' };
            }
            if (!isStrictMoneyString(String(row.apply_unit_price).trim())) {
                return { ok: false, msg: '本次销售单价格式不正确。' };
            }
            if (!hasConfirmedMoney(row.apply_purchase_unit_price)) {
                return { ok: false, msg: '本次采购单价必填（允许 0.00，不允许空值）。' };
            }
            if (!isStrictMoneyString(String(row.apply_purchase_unit_price).trim())) {
                return { ok: false, msg: '本次采购单价格式不正确。' };
            }
        }
        if (positive <= 0) {
            return { ok: false, msg: '至少需要一条正整数数量的发货行。' };
        }
        return { ok: true };
    }

    function buildFrozenPostBody(intent) {
        var payload = intent.frozenPayload;
        var body = {
            apply_id: payload.apply_id,
            order_id: payload.order_id,
            shipping_date: payload.shipping_date,
            receiver_name: payload.receiver_name,
            receiver_phone: payload.receiver_phone,
            receiver_address: payload.receiver_address,
            shipping_method: payload.shipping_method,
            shipping_remark: payload.shipping_remark,
            submit_token: intent.submitToken,
            csrf_token: pageCsrfToken,
            items: JSON.stringify(payload.items)
        };
        if (payload.order_amount_confirmed === 1) {
            body.order_amount_confirmed = '1';
            body.confirmed_order_amount = String(payload.confirmed_order_amount);
        }
        if (payload.shipping_date_history_confirmed === 1) {
            body.shipping_date_history_confirmed = '1';
        }
        return body;
    }

    function closeSubmitLoading() {
        if (submitLoadIndex != null) {
            layer.close(submitLoadIndex);
            submitLoadIndex = null;
        }
    }

    function markIntentState(intent, state) {
        intent.state = state;
        intent.updatedAt = Date.now();
        return persistSubmitIntent(intent);
    }

    function handleSubmitSuccess(intent, res, isReplay) {
        var data = (res && res.data) ? res.data : {};
        var applyNo = data.apply_no || '';
        // 先持久化/广播明确 success，再静默清理，避免 cleared 覆盖 success
        intent.state = 'success';
        intent.updatedAt = Date.now();
        var saved = persistSubmitIntent(intent);
        if (!saved.ok) {
            broadcastSubmitIntent({
                scopeKey: intent.scopeKey,
                state: 'success',
                accountId: intent.accountId || 0,
                submitToken: intent.submitToken || ''
            });
        }
        clearSubmitIntent(intent.scopeKey, { broadcast: false });
        activeSubmitIntent = null;
        closeSubmitLoading();
        submittingApply = false;
        lockFormAfterSuccess(applyNo);
        var tip = isReplay
            ? ('该发货申请此前已经提交成功' + (applyNo ? ('：' + applyNo) : ''))
            : ('发货申请已提交审核' + (applyNo ? ('：' + applyNo) : ''));
        showSubmitIntentBanner(escapeHtml(tip), 'success');
        layer.msg(tip, { icon: 1, time: 4000 });
    }

    function handleSubmitUncertain(intent, tip) {
        var persistRes = markIntentState(intent, 'uncertain');
        closeSubmitLoading();
        submittingApply = false;
        // 持久化失败也必须保留内存中的原 token / 冻结载荷，禁止清除
        intent.state = 'uncertain';
        activeSubmitIntent = intent;
        setSubmitButtonsForState('uncertain');
        var msg = tip || '网络异常，无法确认本次发货申请是否已经提交。请保留当前提交信息，使用原请求重试或联系管理员核实。';
        if (!persistRes || !persistRes.ok) {
            msg = '提交结果未知，且浏览器无法保存保护状态。请勿关闭本页面，请联系管理员核实是否已提交成功。';
        }
        showSubmitIntentBanner(escapeHtml(msg), 'danger');
        layer.alert(escapeHtml(msg), { icon: 0, title: '提交结果待确认' });
    }

    function handleSubmitAuthInvalid(intent, res) {
        // 登录/CSRF 无效：请求未进 Service，但必须保留已发送意图供核实，禁止宣称可随意重发新 token
        markIntentState(intent, 'uncertain');
        intent.state = 'uncertain';
        activeSubmitIntent = intent;
        closeSubmitLoading();
        submittingApply = false;
        setSubmitButtonsForState('uncertain');
        var msg = (res && res.msg)
            ? res.msg
            : '登录或安全校验失效，请刷新页面后使用原请求重新确认提交状态。';
        showSubmitIntentBanner(escapeHtml(msg), 'danger');
        layer.alert(escapeHtml(msg), { icon: 0, title: '请重新核实身份' });
    }

    function handleSubmitRejected(intent, res) {
        // 仅机器可识别的明确安全拒绝：可解除保护；禁止把普通 code!=0 当明确拒绝
        broadcastSubmitIntent({
            scopeKey: intent.scopeKey,
            state: 'definite_reject',
            accountId: intent.accountId || 0,
            submitToken: intent.submitToken || ''
        });
        clearSubmitIntent(intent.scopeKey, { broadcast: false });
        activeSubmitIntent = null;
        closeSubmitLoading();
        submittingApply = false;
        setSubmitButtonsForState('idle');
        var msg = (res && res.msg) ? res.msg : '提交被拒绝，请检查后重试。';
        showSubmitIntentBanner(escapeHtml(msg), 'danger');
        layer.msg(msg, { icon: 2 });
    }

    function isAuthInvalidSubmitMsg(msg) {
        return msg === '请先登录'
            || msg === '登录状态无效'
            || msg === '安全校验失败，请刷新页面后重试'
            || msg === '登录身份已变化，请刷新页面后重新确认提交状态';
    }

    function classifySubmitResponse(res, xhr) {
        if (res && res.data && res.data.result_uncertain === true) {
            return 'uncertain';
        }
        if (res && res.code === 0 && res.data && res.data.submission_succeeded === true) {
            return res.data.idempotent_replay === true ? 'idempotent_success' : 'success';
        }
        // 服务端若将来提供机器可识别“绝对未写库”标志，才可 definite_reject
        if (res && res.data && res.data.submission_definitely_rejected === true) {
            return 'definite_reject';
        }
        if (res && typeof res === 'object' && res.msg === '正式提交接口尚未开放') {
            return 'gate_closed';
        }
        if (res && typeof res === 'object' && isAuthInvalidSubmitMsg(res.msg)) {
            return 'auth_invalid';
        }
        // 保守默认：已发出的非成功结果（含 code=-200 空 data / Throwable 兜底）一律 uncertain，保留 token
        return 'uncertain';
    }

    function sendFrozenSubmitRequest(intent) {
        if (!intent || !intent.frozenPayload || !intent.submitToken) {
            layer.msg('无法恢复原始提交载荷，禁止自动重发。请登录原账号后联系管理员核实申请结果。', { icon: 2 });
            return;
        }
        if ((parseInt(intent.accountId, 10) || 0) !== pageSessionAid) {
            layer.alert('当前登录账号与原提交意图不一致。请重新登录原账号后核查提交结果，禁止以当前账号重发。', { icon: 0, title: '账号不一致' });
            return;
        }
        if (!pageCsrfToken) {
            layer.msg('安全校验信息缺失，请刷新页面后重试。', { icon: 2 });
            return;
        }
        if (submittingApply) {
            return;
        }
        submittingApply = true;
        // 发送前先写入 sending，避免关闭浏览器时误判为未发送
        var persistRes = markIntentState(intent, 'sending');
        if (!persistRes.ok) {
            submittingApply = false;
            layer.msg(persistRes.msg, { icon: 2 });
            return;
        }
        setSubmitButtonsForState('sending');
        submitLoadIndex = layer.load(2);
        var body = buildFrozenPostBody(intent);
        $.ajax({
            url: submitApiUrl,
            type: 'POST',
            data: body,
            dataType: 'json',
            timeout: 60000
        }).done(function (res) {
            var kind = classifySubmitResponse(res);
            if (kind === 'success') {
                handleSubmitSuccess(intent, res, false);
                return;
            }
            if (kind === 'idempotent_success') {
                handleSubmitSuccess(intent, res, true);
                return;
            }
            if (kind === 'gate_closed') {
                // 开关关闭：Controller 在进入 Service 前固定拒绝，可解除本次未执行意图
                broadcastSubmitIntent({
                    scopeKey: intent.scopeKey,
                    state: 'gate_closed',
                    accountId: intent.accountId || 0,
                    submitToken: intent.submitToken || ''
                });
                clearSubmitIntent(intent.scopeKey, { broadcast: false });
                activeSubmitIntent = null;
                closeSubmitLoading();
                submittingApply = false;
                setSubmitButtonsForState('idle');
                showSubmitIntentBanner(escapeHtml(res.msg || '正式提交接口尚未开放'), 'danger');
                layer.msg(res.msg || '正式提交接口尚未开放', { icon: 0 });
                return;
            }
            if (kind === 'auth_invalid') {
                handleSubmitAuthInvalid(intent, res);
                return;
            }
            if (kind === 'definite_reject') {
                handleSubmitRejected(intent, res);
                return;
            }
            // uncertain（含 code=-200 无事务语义、未知字段、缺少成功标志等）
            handleSubmitUncertain(intent, (res && res.msg) ? res.msg : '');
        }).fail(function (xhr) {
            // 超时/断连/非 JSON/HTTP 500/登录页 HTML：一律结果未知，保留 token
            handleSubmitUncertain(intent);
        });
    }

    function beginFormalSubmitFlow() {
        if (isRejectedEditMode) {
            layer.msg('审核失败编辑不能提交审核，请使用「保存修改」。再次提交功能尚未开放。', { icon: 0 });
            return;
        }
        if (formLockedAfterSubmit) {
            layer.msg('该发货申请已提交审核。', { icon: 0 });
            return;
        }
        if (savingDraft || submittingApply || savingRejected) {
            layer.msg('请等待当前操作完成。', { icon: 0 });
            return;
        }
        if (!pageSessionAid || pageSessionAid <= 0) {
            layer.msg('登录状态无效，请重新登录。', { icon: 2 });
            return;
        }
        if (!pageCsrfToken) {
            layer.msg('安全校验信息缺失，请刷新页面后重试。', { icon: 2 });
            return;
        }

        var restored = loadSubmitIntentForPage();
        if (restored.foreignUncertain) {
            layer.alert('检测到其他账号留下的未确认提交意图。请重新登录原账号核查结果；当前账号不得重发该提交。', {
                icon: 0,
                title: '账号切换保护'
            });
            return;
        }
        if (restored.matched) {
            var existing = restored.matched.intent;
            if (restored.matched.source === 'index' && !existing.frozenPayload) {
                showSubmitIntentBanner('检测到可能已发送但无法恢复原始提交载荷的记录，禁止自动重新提交。请联系管理员核实原申请结果。', 'danger');
                setSubmitButtonsForState('uncertain');
                layer.alert('无法恢复原始冻结载荷，禁止生成新的提交标识重发。请保留现场并联系管理员核实。', { icon: 0, title: '提交结果待核实' });
                return;
            }
            if (isProtectedIntentState(existing.state) && existing.frozenPayload) {
                activeSubmitIntent = existing;
                setSubmitButtonsForState(existing.state === 'sending' ? 'uncertain' : existing.state);
                showSubmitIntentBanner('存在未确认的正式提交意图，请使用原请求重新确认，不要重新生成提交标识。', 'danger');
                return;
            }
        }

        var built = buildShippingFormData({});
        if (!built.ok) {
            layer.msg(built.msg, { icon: 2 });
            return;
        }
        var formalCheck = validateFormalSubmitPayload(built.data);
        if (!formalCheck.ok) {
            layer.msg(formalCheck.msg, { icon: 2 });
            return;
        }

        function afterHistoryConfirm(historyConfirmed) {
            var payload = $.extend(true, {}, built.data);
            if (historyConfirmed) {
                payload.shipping_date_history_confirmed = 1;
            }

            function afterAmountConfirm(amountExtra) {
                if (amountExtra && amountExtra.order_amount_confirmed) {
                    payload.order_amount_confirmed = 1;
                    payload.confirmed_order_amount = String(amountExtra.confirmed_order_amount);
                    orderAmountConfirmed = true;
                    confirmedOrderAmount = String(amountExtra.confirmed_order_amount);
                } else if (orderAmountChanged && currentOrderMoney != null && !payload.order_amount_confirmed) {
                    layer.confirm(
                        '原订单金额已发生变化，当前订单金额为 '
                        + escapeHtml(String(currentOrderMoney))
                        + ' 元。确认已重新核对后继续提交审核？',
                        { icon: 0, title: '原订单金额变化确认' },
                        function (idx) {
                            layer.close(idx);
                            afterAmountConfirm({
                                order_amount_confirmed: 1,
                                confirmed_order_amount: String(currentOrderMoney)
                            });
                        }
                    );
                    return;
                }

                layer.confirm('确定提交该发货申请进入审批流程吗？提交成功后将不能再按草稿方式修改。', {
                    icon: 3,
                    title: '提交确认'
                }, function (idx) {
                    layer.close(idx);
                    var tokenRes = generateSecureSubmitToken();
                    if (!tokenRes.ok) {
                        layer.msg(tokenRes.msg, { icon: 2 });
                        return;
                    }
                    var now = Date.now();
                    var intent = {
                        version: 1,
                        accountId: pageSessionAid,
                        applyId: payload.apply_id || 0,
                        orderId: payload.order_id,
                        submitToken: tokenRes.token,
                        state: 'prepared',
                        createdAt: now,
                        updatedAt: now,
                        scopeKey: intentScopeKey(pageSessionAid, payload.apply_id || 0, payload.order_id),
                        frozenPayload: payload
                    };
                    var saved = persistSubmitIntent(intent);
                    if (!saved.ok) {
                        layer.msg(saved.msg, { icon: 2 });
                        return;
                    }
                    sendFrozenSubmitRequest(intent);
                });
            }

            afterAmountConfirm(null);
        }

        var today = getShanghaiTodayYmd();
        if (built.data.shipping_date < today) {
            layer.confirm('当前选择的发货日期早于今天，是否确认按照该日期提交审核？', {
                icon: 0,
                title: '历史发货日期确认'
            }, function (idx) {
                layer.close(idx);
                afterHistoryConfirm(true);
            });
            return;
        }
        afterHistoryConfirm(false);
    }

    function retryFrozenSubmit() {
        if (!activeSubmitIntent || !activeSubmitIntent.frozenPayload) {
            var restored = loadSubmitIntentForPage();
            if (restored.matched && restored.matched.intent && restored.matched.intent.frozenPayload) {
                activeSubmitIntent = restored.matched.intent;
            } else {
                layer.msg('无法恢复原始提交载荷，禁止自动重发。请联系管理员核实。', { icon: 2 });
                return;
            }
        }
        sendFrozenSubmitRequest(activeSubmitIntent);
    }

    function broadcastSubmitIntent(intent) {
        try {
            if (submitChannel) {
                submitChannel.postMessage({
                    type: 'intent',
                    scopeKey: intent.scopeKey,
                    state: intent.state,
                    accountId: intent.accountId || 0,
                    submitToken: intent.submitToken || ''
                });
            }
        } catch (e) { /* ignore */ }
    }

    function initSubmitIntentChannel() {
        try {
            if (typeof window.BroadcastChannel === 'function') {
                submitChannel = new BroadcastChannel(SUBMIT_CHANNEL_NAME);
                submitChannel.onmessage = function (ev) {
                    var data = ev && ev.data ? ev.data : null;
                    if (!data || data.type !== 'intent') return;
                    if (!activeSubmitIntent) return;
                    if (data.scopeKey !== activeSubmitIntent.scopeKey) return;
                    if (data.state === 'success') {
                        if (formLockedAfterSubmit) return;
                        lockFormAfterSuccess('');
                        showSubmitIntentBanner('该申请已提交审核，请刷新页面查看最新状态', 'success');
                        clearSubmitIntent(activeSubmitIntent.scopeKey, { broadcast: false });
                        return;
                    }
                    if (data.state === 'cleared') {
                        // cleared 仅表示本地清理，不能代表成功；已成功锁定则忽略
                        if (formLockedAfterSubmit) return;
                        clearSubmitIntent(activeSubmitIntent.scopeKey, { broadcast: false });
                        setSubmitButtonsForState('idle');
                        return;
                    }
                    if (data.state === 'gate_closed') {
                        if (formLockedAfterSubmit) return;
                        clearSubmitIntent(activeSubmitIntent.scopeKey, { broadcast: false });
                        setSubmitButtonsForState('idle');
                        showSubmitIntentBanner('正式提交接口尚未开放', 'danger');
                        return;
                    }
                    if (data.state === 'definite_reject' || data.state === 'rejected') {
                        if (formLockedAfterSubmit) return;
                        clearSubmitIntent(activeSubmitIntent.scopeKey, { broadcast: false });
                        setSubmitButtonsForState('idle');
                        return;
                    }
                    if (data.state === 'sending' || data.state === 'uncertain' || data.state === 'auth_invalid' || data.state === 'prepared') {
                        // uncertain/auth 不得释放其他标签保护，禁止新 token
                        setSubmitButtonsForState('uncertain');
                        showSubmitIntentBanner('其他标签页正在处理同一提交意图，请勿重新生成提交标识。', 'danger');
                    }
                };
            }
        } catch (e) {
            submitChannel = null;
        }
        try {
            window.addEventListener('storage', function (ev) {
                if (!ev || ev.key !== SUBMIT_INTENT_INDEX_KEY) return;
                if (formLockedAfterSubmit) return;
                var restored = loadSubmitIntentForPage();
                if (restored.matched && restored.matched.intent) {
                    var remote = restored.matched.intent;
                    if (remote.state === 'success') {
                        // 仅锁定本页已有同 scope 活动意图，避免 apply_id=0 订单级永久互锁
                        if (activeSubmitIntent && activeSubmitIntent.scopeKey === remote.scopeKey) {
                            lockFormAfterSuccess('');
                            showSubmitIntentBanner('该申请已提交审核，请刷新页面查看最新状态', 'success');
                            clearSubmitIntent(activeSubmitIntent.scopeKey, { broadcast: false });
                        }
                    } else if (isProtectedIntentState(remote.state) || remote.state === 'auth_invalid') {
                        if (!activeSubmitIntent || activeSubmitIntent.scopeKey === remote.scopeKey) {
                            if (remote.frozenPayload) {
                                activeSubmitIntent = remote;
                            } else if (activeSubmitIntent && activeSubmitIntent.scopeKey === remote.scopeKey) {
                                activeSubmitIntent.state = remote.state === 'sending' ? 'uncertain' : remote.state;
                            }
                            setSubmitButtonsForState(
                                (remote.state === 'sending' || remote.state === 'auth_invalid') ? 'uncertain' : remote.state
                            );
                            showSubmitIntentBanner('其他标签页正在处理同一提交意图，请勿重新生成提交标识。', 'danger');
                        }
                    }
                }
            });
        } catch (e) { /* ignore */ }
    }

    function restoreSubmitIntentOnLoad() {
        initSubmitIntentChannel();
        var restored = loadSubmitIntentForPage();
        if (restored.foreignUncertain) {
            showSubmitIntentBanner('检测到其他账号的未确认提交意图。请重新登录原账号核查结果；当前不得重发。', 'danger');
            setSubmitButtonsForState('idle');
            return;
        }
        if (!restored.matched) {
            setSubmitButtonsForState('idle');
            return;
        }
        var item = restored.matched;
        var intent = item.intent;
        if (item.source === 'index' && !intent.frozenPayload && isProtectedIntentState(intent.state)) {
            showSubmitIntentBanner('浏览器关闭后无法恢复完整冻结载荷。为防止重复申请，已禁止自动重发。请联系管理员核实原提交结果。', 'danger');
            setSubmitButtonsForState('uncertain');
            $('#btn-retry-submit').addClass('layui-btn-disabled').prop('disabled', true);
            return;
        }
        if (intent.state === 'success') {
            lockFormAfterSuccess('');
            showSubmitIntentBanner('该发货申请此前已经提交成功。', 'success');
            return;
        }
        if (isProtectedIntentState(intent.state) && intent.frozenPayload) {
            activeSubmitIntent = intent;
            if (intent.state === 'sending') {
                // 刷新前可能已发送：升级为 uncertain，保留原 token
                markIntentState(intent, 'uncertain');
            }
            setSubmitButtonsForState('uncertain');
            showSubmitIntentBanner('检测到未确认的正式提交意图，请使用原请求重新确认。', 'danger');
            return;
        }
        setSubmitButtonsForState('idle');
    }

    $('#btn-submit-apply').on('click', function () {
        beginFormalSubmitFlow();
    });
    $('#btn-retry-submit').on('click', function () {
        retryFrozenSubmit();
    });

    function normalizeSnapshotText(v) {
        return String(v == null ? '' : v).trim();
    }

    function normalizeSnapshotFactoryId(v) {
        if (v === null || v === undefined || v === '') {
            return null;
        }
        var n = parseInt(v, 10);
        if (!isFinite(n) || n <= 0) {
            return null;
        }
        return n;
    }

    /** 空/未填 → null；已填（含 0 / 0.00）保留 trim 后字符串，不与 null 合并 */
    function normalizeSnapshotMoney(v) {
        if (v === null || v === undefined || String(v).trim() === '') {
            return null;
        }
        return String(v).trim();
    }

    function moneySnapshotEqual(a, b) {
        if (a === null && b === null) {
            return true;
        }
        if (a === null || b === null) {
            return false;
        }
        if (a === b) {
            return true;
        }
        var na = Number(a);
        var nb = Number(b);
        return isFinite(na) && isFinite(nb) && na === nb;
    }

    function buildEditableSnapshot() {
        var lines = [];
        for (var i = 0; i < shippingLines.length; i++) {
            var line = shippingLines[i];
            lines.push({
                order_item_id: parseInt(line.order_item_id, 10) || 0,
                apply_product_name: normalizeSnapshotText(line.apply_product_name),
                apply_spec_model: normalizeSnapshotText(line.apply_spec_model),
                apply_qty: normalizeSnapshotText(line.apply_qty),
                apply_unit_price: normalizeSnapshotMoney(line.apply_unit_price),
                apply_purchase_unit_price: normalizeSnapshotMoney(line.apply_purchase_unit_price),
                factory_id: normalizeSnapshotFactoryId(line.factory_id),
                remark: normalizeSnapshotText(line.remark),
                line_order: i
            });
        }
        return {
            apply_id: parseInt($('#apply_id').val(), 10) || 0,
            order_id: parseInt($('#order_id').val(), 10) || 0,
            shipping_date: normalizeSnapshotText($('#shipping_date').val()),
            receiver_name: normalizeSnapshotText($('#receiver_name').val()),
            receiver_phone: normalizeSnapshotText($('#receiver_phone').val()),
            receiver_address: normalizeSnapshotText($('#receiver_address').val()),
            shipping_method: normalizeSnapshotText($('#shipping_method').val()),
            shipping_remark: normalizeSnapshotText($('#shipping_remark').val()),
            lines: lines
        };
    }

    function captureDraftBaseline() {
        draftBaselineSnapshot = buildEditableSnapshot();
    }

    function snapshotsEqual(a, b) {
        if (!a || !b) {
            return false;
        }
        if (a.apply_id !== b.apply_id
            || a.order_id !== b.order_id
            || a.shipping_date !== b.shipping_date
            || a.receiver_name !== b.receiver_name
            || a.receiver_phone !== b.receiver_phone
            || a.receiver_address !== b.receiver_address
            || a.shipping_method !== b.shipping_method
            || a.shipping_remark !== b.shipping_remark) {
            return false;
        }
        if (a.lines.length !== b.lines.length) {
            return false;
        }
        for (var i = 0; i < a.lines.length; i++) {
            var x = a.lines[i];
            var y = b.lines[i];
            if (x.order_item_id !== y.order_item_id
                || x.apply_product_name !== y.apply_product_name
                || x.apply_spec_model !== y.apply_spec_model
                || x.apply_qty !== y.apply_qty
                || x.factory_id !== y.factory_id
                || x.remark !== y.remark
                || x.line_order !== y.line_order) {
                return false;
            }
            if (!moneySnapshotEqual(x.apply_unit_price, y.apply_unit_price)
                || !moneySnapshotEqual(x.apply_purchase_unit_price, y.apply_purchase_unit_price)) {
                return false;
            }
        }
        return true;
    }

    function hasUnsavedChanges() {
        if (!isLegitimateDraftEdit || !draftBaselineSnapshot) {
            return false;
        }
        // 仅 DOM→内存同步；不重绘表格，不覆盖用户输入
        syncLineInputsFromDom();
        return !snapshotsEqual(draftBaselineSnapshot, buildEditableSnapshot());
    }

    function enableLegitimateDraftEditMode() {
        isLegitimateDraftEdit = true;
        $('#page-mode-title').text('编辑发货申请');
        $('#btn-back-to-draft').show();
    }

    function goBackToDraftBox() {
        if (savingDraft) {
            layer.msg('正在保存草稿，请稍候。', { icon: 0 });
            return;
        }
        if (submittingApply || (activeSubmitIntent && isProtectedIntentState(activeSubmitIntent.state))) {
            layer.msg('存在未确认的正式提交，请先处理后再返回。', { icon: 0 });
            return;
        }
        if (!hasUnsavedChanges()) {
            window.location.href = draftBoxUrl;
            return;
        }
        layer.confirm('当前有尚未保存的修改，确定放弃修改并返回草稿箱吗？', {
            icon: 0,
            title: '提示',
            btn: ['继续编辑', '放弃修改并返回']
        }, function (index) {
            // 按钮1：继续编辑
            layer.close(index);
        }, function (index) {
            // 按钮2：放弃修改并返回
            layer.close(index);
            window.location.href = draftBoxUrl;
        });
    }

    function applyDraftData(draftData) {
        if (!draftData || !draftData.order_id) {
            return false;
        }
        var applyIdNum = parseInt(draftData.apply_id, 10) || 0;
        $('#apply_id').val(draftData.apply_id || '');
        if (draftData.apply_no) {
            $('#apply_no_display').text(draftData.apply_no);
        }
        $('#order_id').val(draftData.order_id);
        fillOrderDisplay(draftData.order || {}, false);
        orderSourceItems = draftData.order_source_items || draftData.items || [];
        renderProductTable(orderSourceItems);

        draftOrderAmount = draftData.draft_order_amount != null ? String(draftData.draft_order_amount) : null;
        currentOrderMoney = draftData.current_order_amount != null
            ? String(draftData.current_order_amount)
            : (draftData.order && draftData.order.money != null ? String(draftData.order.money) : currentOrderMoney);
        orderAmountChanged = !!draftData.order_amount_changed;
        orderAmountConfirmed = false;
        confirmedOrderAmount = null;

        var warns = draftData.warnings || [];
        if (draftData.order_amount_change_message) {
            warns = warns.slice();
            if (warns.indexOf(draftData.order_amount_change_message) < 0) {
                warns.unshift(draftData.order_amount_change_message);
            }
        }
        showWarnBanner(warns);

        var lines = draftData.shipping_lines || [];
        shippingLines = lines.map(function (row) {
            var line = {
                item_id: row.item_id || 0,
                client_row_key: nextClientRowKey(),
                order_item_id: row.order_item_id || 0,
                apply_line_no: row.apply_line_no || 0,
                is_invalid_order_item: !!row.is_invalid_order_item,
                invalid_tip: row.invalid_tip || '',
                product_name: row.product_name || '',
                spec_model: row.spec_model || '',
                unit: row.unit || '',
                order_qty: row.order_qty || 0,
                applied_qty: row.applied_qty || 0,
                remaining_qty: row.remaining_qty || 0,
                unit_price: row.unit_price,
                total_price: row.total_price,
                order_purchase_amount: row.order_purchase_amount,
                supplier_id: row.supplier_id || '',
                supplier_name: row.supplier_name || '',
                product_manager_id: row.product_manager_id != null && row.product_manager_id !== ''
                    ? row.product_manager_id
                    : null,
                product_manager_name: row.product_manager_name || '',
                manager_invalid: !!row.manager_invalid,
                manager_invalid_reason: row.manager_invalid_reason || '',
                manager_status: row.manager_status || (row.manager_invalid ? 'missing' : 'valid'),
                pm_substitute_display_status: row.pm_substitute_display_status || '',
                pm_substitute_tip: row.pm_substitute_tip || '',
                pm_substitute_effective: !!row.pm_substitute_effective,
                substitute_manager_id: row.substitute_manager_id != null && row.substitute_manager_id !== ''
                    ? row.substitute_manager_id
                    : null,
                substitute_manager_name: row.substitute_manager_name || '',
                apply_product_name: row.apply_product_name || '',
                apply_spec_model: row.apply_spec_model || '',
                apply_qty: row.apply_qty != null ? row.apply_qty : 0,
                // 正式价原样回填；NULL/空不回填建议值进输入框
                apply_unit_price: hasConfirmedMoney(row.apply_unit_price) ? row.apply_unit_price : '',
                apply_purchase_unit_price: hasConfirmedMoney(row.apply_purchase_unit_price) ? row.apply_purchase_unit_price : '',
                display_apply_unit_price: row.display_apply_unit_price,
                display_apply_purchase_unit_price: row.display_apply_purchase_unit_price,
                is_suggest_unit_price: !!row.is_suggest_unit_price,
                is_suggest_purchase_unit_price: !!row.is_suggest_purchase_unit_price,
                suggest_purchase_unit_price: row.suggest_purchase_unit_price,
                apply_sales_amount: row.apply_sales_amount,
                apply_purchase_amount: row.apply_purchase_amount,
                factory_id: row.factory_id != null && row.factory_id !== '' ? row.factory_id : null,
                factory_name: row.factory_name || '',
                remark: row.remark || ''
            };
            // 若后端未带 suggest_purchase 但给了 display 建议展示，保留展示源
            if (line.suggest_purchase_unit_price == null
                && !!row.is_suggest_purchase_unit_price
                && row.display_apply_purchase_unit_price != null) {
                line.suggest_purchase_unit_price = row.display_apply_purchase_unit_price;
            }
            refreshLineSuggestFlags(line);
            return line;
        });

        if (draftData.edit_url) {
            draftEditUrl = draftData.edit_url;
            $('#btn-reopen-draft').show();
        } else if (draftData.apply_id) {
            draftEditUrl = apiUrl + (apiUrl.indexOf('?') >= 0 ? '&' : '?') + 'id=' + encodeURIComponent(draftData.apply_id);
            $('#btn-reopen-draft').show();
        }

        // 收货等信息须在厂家加载与表格渲染完成前写好，避免基准快照读到空表单
        $('#shipping_date').val(draftData.shipping_date || '');
        $('#receiver_name').val(draftData.receiver_name || '');
        $('#receiver_phone').val(draftData.receiver_phone || '');
        $('#receiver_address').val(draftData.receiver_address || '');
        $('#shipping_method').val(draftData.shipping_method || '');
        $('#shipping_remark').val(draftData.shipping_remark || '');
        $('#selected-order-tip').text('已选择订单：' + ((draftData.order && draftData.order.order_no) || ''));
        $('#btn-select-order').addClass('layui-btn-disabled').prop('disabled', true);

        ensureFactories(function (factoriesOk) {
            renderShippingLineTable();
            // 合法编辑态：草稿已回填且 apply_id 为正整数（不单凭 URL draftId）
            if (applyIdNum > 0) {
                enableLegitimateDraftEditMode();
                // 基准快照须在厂家选项就绪、行上厂家可选中、表格已渲染后建立
                if (factoriesOk) {
                    syncLineInputsFromDom();
                    captureDraftBaseline();
                }
            }
        });
        return applyIdNum > 0;
    }

    // 草稿编辑 / 审核失败编辑初始化
    var draftDataJson = '{$draftDataJson|raw}';
    var rejectedEditDataJson = '{$rejectedEditDataJson|raw}';
    ensureFactories(function () {
        if (isRejectedEditMode) {
            if (!rejectedEditDataJson) {
                layer.msg('审核失败申请数据缺失或无权编辑', { icon: 2 });
                return;
            }
            try {
                var rejectedData = JSON.parse(rejectedEditDataJson);
                applyDraftData(rejectedData);
                // applyDraftData 会切入草稿编辑 UI；随后强制切回驳回编辑模式
                enableRejectedEditMode(rejectedData);
                $('#btn-reopen-draft').hide();
                $('#btn-back-to-draft').hide();
                $('#btn-save-draft').hide();
                $('#btn-submit-apply').hide();
                $('#btn-save-rejected').show();
            } catch (e) {
                layer.msg('审核失败申请数据解析失败', { icon: 2 });
            }
            return;
        }
        if (draftDataJson) {
            try {
                var draftData = JSON.parse(draftDataJson);
                applyDraftData(draftData);
            } catch (e) {
                layer.msg('草稿数据解析失败', { icon: 2 });
            }
        } else if (parseInt('{$draftId|default=0}', 10) > 0) {
            layer.msg('草稿不存在或无权编辑', { icon: 2 });
        }
        // 订单/草稿回填后再恢复提交意图，避免 scope 错配
        restoreSubmitIntentOnLoad();
    });
});
</script>
