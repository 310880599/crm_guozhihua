{include file="common/head"/}
<style>
    body { background: #f5f7fa !important; }
    .ship-create-container {
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        padding: 20px;
        background: #f5f7fa;
        overflow: auto;
    }
    .create-card {
        background: #fff;
        border-radius: 8px;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
        padding: 18px 20px 8px 20px;
        margin-bottom: 16px;
    }
    .create-card-title {
        font-size: 15px;
        font-weight: 600;
        color: #333;
        margin: 0 0 14px 0;
        padding-left: 8px;
        border-left: 3px solid #1E9FFF;
        line-height: 1.2;
    }
    .create-form .layui-form-label {
        width: 130px;
    }
    .create-form .layui-input-block {
        margin-left: 160px;
    }
    .create-form .layui-input-inline {
        width: 280px;
    }
    .readonly-text {
        line-height: 38px;
        color: #333;
    }
    .unit-text {
        color: #999;
        line-height: 38px;
        margin-left: 8px;
        display: inline-block;
    }
    .empty-tip {
        color: #999;
        padding: 20px 0;
        text-align: center;
    }
    .toolbar-row {
        margin-bottom: 12px;
    }
    #product-table-wrap .layui-input,
    #shipping-line-table-wrap .layui-input {
        height: 32px;
        line-height: 32px;
        width: 100%;
        box-sizing: border-box;
    }
    /* 仅作用于本次发货行表格：解除 Layui 单元格固定高度/nowrap/overflow 裁切 */
    #shipping-line-table-wrap {
        overflow-x: auto;
        padding-bottom: 6px;
    }
    #shipping-line-table-wrap .layui-table-body td .layui-table-cell {
        height: auto !important;
        min-height: 38px;
        max-height: none;
        line-height: 1.45;
        white-space: normal;
        overflow: visible;
        text-overflow: clip;
        padding: 8px 10px;
        word-break: break-word;

    #shipping-line-table-wrap .layui-table-header .layui-table-cell {

    #shipping-line-table-wrap .ship-amount-preview,
    #shipping-line-table-wrap .ship-suggest-tip,
    #shipping-line-table-wrap .ship-invalid-tip {
        white-space: normal;
        word-break: break-word;
        display: block;
    }
    #shipping-line-table-wrap .ship-amount-preview {
        padding: 2px 0;
    }
    #shipping-line-table-wrap .line-factory-select {
        display: block;
        width: 100%;
        max-width: 100%;
        height: 32px;
        line-height: 32px;
        padding: 0 8px;
        border: 1px solid #e6e6e6;
        border-radius: 2px;
        background-color: #fff;
        box-sizing: border-box;
    }
    #shipping-line-table-wrap .line-action-btns {
        white-space: normal;
        line-height: 1.6;
    }
    #shipping-line-table-wrap .line-action-btns .layui-btn {
        margin: 2px 2px 2px 0;
    }
    .order-select-bar {
        display: flex;
        align-items: center;
        gap: 12px;
        flex-wrap: wrap;
    }
    .order-select-bar .readonly-text {
        line-height: 32px;
    }
    .ship-warn-banner {
        display: none;
        margin-bottom: 12px;
        padding: 10px 12px;
        border: 1px solid #FFB800;
        background: #fff8e6;
        color: #a66b00;
        border-radius: 4px;
        line-height: 1.6;
    }
    .ship-invalid-tip {
        color: #FF5722;
        font-size: 12px;
        line-height: 1.4;
    }
    .ship-suggest-tip {
        color: #999;
        font-size: 12px;
        line-height: 1.4;
        margin-top: 2px;
    }
    .ship-suggest-tip a.ship-adopt-suggest {
        color: #1E9FFF;
        margin-left: 4px;
    }
    .ship-amount-preview {
        color: #666;
        font-size: 12px;
        line-height: 1.5;
    }
    .ship-amount-preview .ship-preview-only {
        color: #999;
    }
    .line-action-btns .layui-btn {

    /* 页头：标题与「返回草稿箱」左右排列，窄屏可换行，避免遮挡下方内容 */

        width: calc(100% - 24px);
        margin-left: 12px;
        padding: 0 8px;
        box-sizing: border-box;
    }
    .ship-create-head-bar {
        display: flex;
        align-items: center;
        justify-content: space-between;

        width: 100%;

    }
    .ship-create-head-bar .ship-page-mode-title {

        color: inherit;

    }
    .ship-create-head-bar #btn-back-to-draft {
        flex: 0 0 auto;
    }
</style>

            <div class="ship-create-head-bar">

            </div>
        </legend>
    </fieldset>

    <div class="ship-warn-banner" id="ship-warn-banner"></div>

    <form class="layui-form create-form" lay-filter="ship-create-form" id="ship-create-form">
        <input type="hidden" name="order_id" id="order_id" value="">
        <input type="hidden" name="apply_id" id="apply_id" value="">

        <!-- 区域一：关联订单 -->
        <div class="create-card">
            <h3 class="create-card-title">关联订单</h3>

            <div class="layui-form-item">
                <label class="layui-form-label">发货申请编号</label>
                <div class="layui-input-block">
                    <div class="readonly-text" id="apply_no_display">保存草稿后生成</div>
                </div>
            </div>

            <div class="layui-form-item">
                <label class="layui-form-label">关联订单</label>
                <div class="layui-input-block order-select-bar">
                    <button type="button" class="layui-btn layui-btn-normal" id="btn-select-order">
                        <i class="layui-icon layui-icon-search"></i> 选择订单
                    </button>
                    <span class="readonly-text" id="selected-order-tip">请先选择审核通过的订单</span>
                </div>
            </div>

            <div class="layui-form-item">
                <label class="layui-form-label">订单编号</label>
                <div class="layui-input-inline">
                    <input type="text" class="layui-input" id="display_order_no" readonly placeholder="-">
                </div>
            </div>

            <div class="layui-form-item">
                <label class="layui-form-label">客户名称</label>
                <div class="layui-input-inline">
                    <input type="text" class="layui-input" id="display_cname" readonly placeholder="-">
                </div>
            </div>

            <div class="layui-form-item">
                <label class="layui-form-label">业务员</label>
                <div class="layui-input-inline">
                    <input type="text" class="layui-input" id="display_pr_user" readonly placeholder="-">
                </div>
            </div>

            <div class="layui-form-item">
                <label class="layui-form-label">所属团队</label>
                <div class="layui-input-inline">
                    <input type="text" class="layui-input" id="display_team_name" readonly placeholder="-">
                </div>
            </div>

            <div class="layui-form-item">
                <label class="layui-form-label">成交时间</label>
                <div class="layui-input-inline">
                    <input type="text" class="layui-input" id="display_order_time" readonly placeholder="-">
                </div>
            </div>

            <div class="layui-form-item">
                <label class="layui-form-label">原订单金额</label>
                <div class="layui-input-inline">
                    <input type="text" class="layui-input" id="display_money" readonly placeholder="-">
                </div>
                <span class="unit-text">元</span>
            </div>

            <div class="layui-form-item">
                <label class="layui-form-label">已收款金额</label>
                <div class="layui-input-inline">
                    <input type="text" class="layui-input" id="display_amount_received" readonly placeholder="-">
                </div>
                <span class="unit-text">（仅展示）</span>

        </div>

        <!-- 区域二：订单产品（只读源） -->

        <!-- 区域二B：本次发货行 -->

            <h3 class="create-card-title">本次发货行</h3>

            </div>

            <div class="layui-form-item">
                <label class="layui-form-label">收货人</label>
                <div class="layui-input-inline">
                    <input type="text" name="receiver_name" id="receiver_name" autocomplete="off"

                </div>

            <div class="layui-form-item">
                <label class="layui-form-label">收货联系电话</label>
                <div class="layui-input-inline">
                    <input type="text" name="receiver_phone" id="receiver_phone" autocomplete="off"

            <div class="layui-form-item">
                <label class="layui-form-label">收货地址</label>
                <div class="layui-input-block" style="max-width: 620px;">
                    <textarea name="receiver_address" id="receiver_address" placeholder="请输入收货地址"

            <div class="layui-form-item">
                <label class="layui-form-label">发货方式</label>
                <div class="layui-input-inline">
                    <input type="text" name="shipping_method" id="shipping_method" autocomplete="off"
                           placeholder="如：物流、快递、自提等" class="layui-input">

            <div class="layui-form-item">
                <label class="layui-form-label">发货备注</label>

                    <textarea name="shipping_remark" id="shipping_remark" placeholder="请输入发货备注"

        <div class="create-card" style="padding-bottom: 18px;">

                <div class="layui-input-block">
                    <button type="button" class="layui-btn" id="btn-save-draft" lay-submit lay-filter="ship-save-draft">保存草稿</button>
                    <button type="button" class="layui-btn layui-btn-primary" id="btn-reopen-draft" style="display:none;">重新打开本草稿</button>

<script>
layui.use(['form', 'layer', 'table', 'laydate'], function () {
    var form = layui.form;
    var layer = layui.layer;
    var table = layui.table;
    var laydate = layui.laydate;
    var $ = layui.$;

    var apiUrl = '{:url("Ship/createShip")}';
    var orderSourceItems = [];
    var shippingLines = [];
    var factoryOptions = [];
    var factoriesLoaded = false;
    var productTableRendered = false;
    var shippingTableRendered = false;
    var rowKeySeq = 1;
    var savingDraft = false;
    var currentOrderMoney = null;
    var draftOrderAmount = null;
    var orderAmountChanged = false;
    var orderAmountConfirmed = false;
    var confirmedOrderAmount = null;
    var draftEditUrl = '';
    var draftBoxUrl = '{:url("Ship/draftShip")}';
    var isLegitimateDraftEdit = false;
    var draftBaselineSnapshot = null;

    laydate.render({
        elem: '#shipping_date',
        type: 'date',
        trigger: 'click'
    });

    function escapeHtml(str) {
        return String(str == null ? '' : str)
            .replace(/&/g, '&amp;')
            .replace(/</g, '&lt;')
            .replace(/>/g, '&gt;')
            .replace(/"/g, '&quot;')
            .replace(/'/g, '&#39;');
    }

    function escapeAttr(str) {
        return escapeHtml(str);
    }

    function nextClientRowKey() {
        return 'tmp_' + Date.now() + '_' + (rowKeySeq++);
    }

    /** 已确认的本次金额（非空字符串）；空/null 表示未填写，不得用建议值冒充 */
    function hasConfirmedMoney(v) {
        return v !== null && v !== undefined && String(v).trim() !== '';
    }

    function moneyPreview(qty, unitPrice) {
        if (!isStrictNonNegIntString(String(qty)) || parseInt(String(qty), 10) <= 0) {
            return '';
        }
        if (unitPrice === null || unitPrice === undefined || String(unitPrice).trim() === '') {
            return '';
        }
        if (!isStrictMoneyString(String(unitPrice).trim())) {
            return '金额格式错误';
        }
        // 仅前端预览；落库以服务端 BCMath 为准
        var q = parseInt(String(qty), 10);
        var parts = String(unitPrice).trim().split('.');
        var yuan = parseInt(parts[0], 10) || 0;
        var fen = parts[1] ? (parts[1] + '00').slice(0, 2) : '00';
        var totalFen = q * (yuan * 100 + parseInt(fen, 10));
        var sign = totalFen < 0 ? '-' : '';
        totalFen = Math.abs(totalFen);
        var fenStr = String(totalFen % 100);
        if (fenStr.length < 2) {
            fenStr = '0' + fenStr;
        }
        return sign + Math.floor(totalFen / 100) + '.' + fenStr;
    }

    function isStrictNonNegIntString(raw) {
        return /^(?:0|[1-9]\d*)$/.test(String(raw == null ? '' : raw).trim());
    }

    function isStrictMoneyString(raw) {
        return /^(?:0|[1-9]\d*)(?:\.\d{1,2})?$/.test(String(raw == null ? '' : raw).trim());
    }

    function parseStrictNonNegInt(raw, fieldLabel) {
        var text = String(raw == null ? '' : raw).trim();
        if (text === '') {
            return { ok: true, value: 0 };
        }
        if (!isStrictNonNegIntString(text)) {
            return { ok: false, msg: fieldLabel + '必须是大于等于0的整数，不能是小数、科学计数法或混合字符。' };
        }
        var n = parseInt(text, 10);
        if (!isFinite(n) || n < 0) {
            return { ok: false, msg: fieldLabel + '必须是大于等于0的整数。' };
        }
        return { ok: true, value: n };
    }

    function parseStrictOptionalMoney(raw, fieldLabel) {
        var text = String(raw == null ? '' : raw).trim();
        if (text === '') {
            return { ok: true, value: null };
        }
        if (!isStrictMoneyString(text)) {
            return { ok: false, msg: fieldLabel + '格式不正确（非负，最多两位小数）。' };
        }
        return { ok: true, value: text };
    }

    function showWarnBanner(messages) {
        var list = [];
        if (Object.prototype.toString.call(messages) === '[object Array]') {
            list = messages;
        } else if (messages) {
            list = [String(messages)];
        }
        if (!list.length) {
            $('#ship-warn-banner').hide().html('');
            return;
        }
        var html = list.map(function (m) {
            return '<div>' + escapeHtml(m) + '</div>';
        }).join('');
        $('#ship-warn-banner').html(html).show();
    }

    function fillOrderDisplay(order, fillReceiverIfEmpty) {
        order = order || {};
        $('#display_order_no').val(order.order_no || '');
        $('#display_cname').val(order.cname || '');
        $('#display_pr_user').val(order.pr_user || '');
        $('#display_team_name').val(order.team_name || '');
        $('#display_order_time').val(order.order_time || '');
        $('#display_money').val(order.money !== undefined && order.money !== null ? order.money : '');
        $('#display_amount_received').val(order.amount_received || '');
        currentOrderMoney = order.money !== undefined && order.money !== null ? String(order.money) : null;
        if (fillReceiverIfEmpty !== false) {
            if ($('#receiver_phone').val() === '' && order.default_receiver_phone) {
                $('#receiver_phone').val(order.default_receiver_phone);
            }
            if ($('#receiver_address').val() === '' && order.default_receiver_address) {
                $('#receiver_address').val(order.default_receiver_address);
            }
        }
        $('#selected-order-tip').text('已选择订单：' + (order.order_no || ''));
    }

    function findOrderSourceItem(orderItemId) {
        orderItemId = parseInt(orderItemId, 10) || 0;
        for (var i = 0; i < orderSourceItems.length; i++) {
            if (parseInt(orderSourceItems[i].order_item_id, 10) === orderItemId) {
                return orderSourceItems[i];
            }
        }
        return null;
    }

    function buildFactorySelectHtml(selectedId) {
        // lay-ignore：保留原生 select，避免表格内 Layui 自定义下拉被单元格 overflow 裁切
        var html = '<select class="layui-input line-factory-select" lay-ignore>';
        html += '<option value="">请选择厂家（草稿可空）</option>';
        for (var i = 0; i < factoryOptions.length; i++) {
            var f = factoryOptions[i];
            var selected = (selectedId && parseInt(selectedId, 10) === parseInt(f.factory_id, 10)) ? ' selected' : '';
            html += '<option value="' + escapeAttr(f.factory_id) + '"' + selected + '>'
                + escapeHtml(f.factory_name) + '</option>';
        }
        html += '</select>';
        return html;
    }

    function syncLineInputsFromDom() {
        $('#shipping-line-table-wrap tr[data-row-key]').each(function () {
            var $tr = $(this);
            var key = $tr.attr('data-row-key');
            var line = getShippingLineByKey(key);
            if (!line) {
                return;
            }
            line.apply_product_name = $.trim($tr.find('.line-apply-product-name').val() || '');
            line.apply_spec_model = $.trim($tr.find('.line-apply-spec-model').val() || '');
            line.apply_qty = $.trim($tr.find('.line-apply-qty').val() || '');
            // 仅读取输入框正式值；建议价不在输入框内，未填写保持空→保存为 NULL
            line.apply_unit_price = $.trim($tr.find('.line-apply-unit-price').val() || '');
            line.apply_purchase_unit_price = $.trim($tr.find('.line-apply-purchase-unit-price').val() || '');
            line.remark = $.trim($tr.find('.line-remark').val() || '');
            var factoryVal = $tr.find('.line-factory-select').val();
            line.factory_id = factoryVal ? parseInt(factoryVal, 10) : null;
            if (!line.factory_id) {
                line.factory_id = null;
                line.factory_name = '';
            } else {
                var optText = $tr.find('.line-factory-select option:selected').text();
                line.factory_name = optText || '';
            }
            refreshLineSuggestFlags(line);
        });
    }

    /** 正式价为空时才展示建议标识；不把建议值写入正式字段 */
    function refreshLineSuggestFlags(line) {
        if (!line) {
            return;
        }
        var hasSale = hasConfirmedMoney(line.apply_unit_price);
        var hasPurchase = hasConfirmedMoney(line.apply_purchase_unit_price);
        var saleSuggest = line.unit_price != null && line.unit_price !== '' ? line.unit_price : null;
        var purchaseSuggest = line.suggest_purchase_unit_price != null && line.suggest_purchase_unit_price !== ''
            ? line.suggest_purchase_unit_price
            : null;
        line.is_suggest_unit_price = !hasSale && saleSuggest != null;
        line.is_suggest_purchase_unit_price = !hasPurchase && purchaseSuggest != null;
        line.display_apply_unit_price = hasSale ? line.apply_unit_price : saleSuggest;
        line.display_apply_purchase_unit_price = hasPurchase ? line.apply_purchase_unit_price : purchaseSuggest;
    }

    function getShippingLineByKey(key) {
        for (var i = 0; i < shippingLines.length; i++) {
            if (shippingLines[i].client_row_key === key) {
                return shippingLines[i];
            }
        }
        return null;
    }

    function createLineFromSource(source, overrides) {
        source = source || {};
        overrides = overrides || {};
        var qtyDefault = overrides.apply_qty !== undefined ? overrides.apply_qty : 0;
        // 正式本次单价仅来自 overrides 或留空；建议价不得预填进正式字段

            ? overrides.apply_purchase_unit_price

        var line = {
            item_id: 0,

            supplier_id: source.supplier_id || '',

            product_manager_name: source.product_manager_name || '',
            apply_product_name: overrides.apply_product_name != null ? overrides.apply_product_name : (source.product_name || ''),
            apply_spec_model: overrides.apply_spec_model != null ? overrides.apply_spec_model : (source.spec_model || ''),
            apply_qty: qtyDefault,
            apply_unit_price: applyUnitPrice,
            apply_purchase_unit_price: applyPurchaseUnitPrice,
            display_apply_unit_price: null,
            display_apply_purchase_unit_price: null,
            is_suggest_unit_price: false,

        return line;
    }

    function updateAmountPreviews() {
        $('#shipping-line-table-wrap tr[data-row-key]').each(function () {
            var $tr = $(this);
            var key = $tr.attr('data-row-key');
            var line = getShippingLineByKey(key);
            var qty = $.trim($tr.find('.line-apply-qty').val() || '');
            var sale = $.trim($tr.find('.line-apply-unit-price').val() || '');
            var purchase = $.trim($tr.find('.line-apply-purchase-unit-price').val() || '');
            var saleFormal = sale !== '';
            var purchaseFormal = purchase !== '';
            if (!saleFormal && line) {
                var saleSuggest = line.display_apply_unit_price != null && line.display_apply_unit_price !== ''
                    ? line.display_apply_unit_price
                    : (line.unit_price != null && line.unit_price !== '' ? line.unit_price : null);
                if (saleSuggest != null) {
                    sale = String(saleSuggest);
                }
            }
            if (!purchaseFormal && line) {
                var purchaseSuggest = line.suggest_purchase_unit_price != null && line.suggest_purchase_unit_price !== ''
                    ? line.suggest_purchase_unit_price
                    : (line.display_apply_purchase_unit_price != null && line.display_apply_purchase_unit_price !== ''
                        ? line.display_apply_purchase_unit_price
                        : null);
                if (purchaseSuggest != null) {
                    purchase = String(purchaseSuggest);
                }
            }
            var salesAmt = moneyPreview(qty, sale);
            var purchaseAmt = moneyPreview(qty, purchase);
            var saleHtml = (saleFormal || !salesAmt)
                ? ('销:' + escapeHtml(salesAmt || '-'))
                : ('<span class="ship-preview-only">销(预览):' + escapeHtml(salesAmt) + '</span>');
            var purchaseHtml = (purchaseFormal || !purchaseAmt)
                ? ('采:' + escapeHtml(purchaseAmt || '-'))
                : ('<span class="ship-preview-only">采(预览):' + escapeHtml(purchaseAmt) + '</span>');
            $tr.find('.ship-amount-preview').html(saleHtml + '<br>' + purchaseHtml);
        });
    }

        $.post(apiUrl, { op: 'list_factories' }, function (res) {

                layer.msg((res && res.msg) ? res.msg : '厂家列表加载失败', { icon: 2 });
                factoryOptions = [];
                factoriesLoaded = false;
                if (typeof callback === 'function') {
                    callback(false);
                }
                return;
            }
            factoryOptions = res.data || [];
            factoriesLoaded = true;
            if (typeof callback === 'function') {
                callback(true);
            }
        }, 'json').fail(function () {
            layer.msg('厂家列表加载失败，请稍后重试', { icon: 2 });
            if (typeof callback === 'function') {
                callback(false);
            }

                return;
            }
            var data = res.data || {};
            $('#order_id').val(orderId);
            fillOrderDisplay(data.order || {}, options.fillReceiverIfEmpty !== false);
            renderProductTable(data.items || []);
            if (!options.keepShippingLines) {
                resetShippingState();

            if (data.warnings && data.warnings.length) {
                layer.msg(data.warnings.join('；'), { icon: 0, time: 4000 });

            if (typeof callback === 'function') {
                callback(data);

            layer.close(loadIndex);
            layer.msg('网络异常，请稍后重试', { icon: 2 });
        });

    function collectShippingItemsForSave() {
        syncLineInputsFromDom();
        var items = [];
        for (var i = 0; i < shippingLines.length; i++) {
            var line = shippingLines[i];
            if (line.is_invalid_order_item) {
                return { ok: false, msg: '存在原订单产品行已失效的发货行，请先重选有效产品后再保存。' };
            }
            var qtyRes = parseStrictNonNegInt(line.apply_qty, '本次发货数量');
            if (!qtyRes.ok) {
                return { ok: false, msg: qtyRes.msg };
            }
            var saleRes = parseStrictOptionalMoney(line.apply_unit_price, '本次销售单价');
            if (!saleRes.ok) {
                return { ok: false, msg: saleRes.msg };
            }
            var purchaseRes = parseStrictOptionalMoney(line.apply_purchase_unit_price, '本次采购单价');
            if (!purchaseRes.ok) {
                return { ok: false, msg: purchaseRes.msg };
            }
            items.push({
                order_item_id: parseInt(line.order_item_id, 10) || 0,
                apply_qty: qtyRes.value,
                apply_product_name: line.apply_product_name || '',
                apply_spec_model: line.apply_spec_model || '',
                apply_unit_price: saleRes.value,
                apply_purchase_unit_price: purchaseRes.value,
                factory_id: line.factory_id ? parseInt(line.factory_id, 10) : null,
                remark: line.remark || ''
            });
        }
        var hasPositive = false;
        for (var j = 0; j < items.length; j++) {
            if (items[j].apply_qty > 0) {
                hasPositive = true;
                break;
            }
        }
        if (!hasPositive) {
            return { ok: false, msg: '至少需要一条正整数数量的发货行。' };
        }
        return { ok: true, items: items };
    }

    function doSaveDraft(extra) {
        extra = extra || {};
        if (savingDraft) {
            return;
        }
        var orderId = parseInt($('#order_id').val(), 10) || 0;
        if (!orderId) {
            layer.msg('请先选择有效订单', { icon: 2 });
            return;
        }

        var collected = collectShippingItemsForSave();
        if (!collected.ok) {
            layer.msg(collected.msg, { icon: 2 });
            return;
        }

        var postData = {
            op: 'save_draft',
            order_id: orderId,
            apply_id: parseInt($('#apply_id').val(), 10) || 0,
            shipping_date: $.trim($('#shipping_date').val()),
            receiver_name: $.trim($('#receiver_name').val()),
            receiver_phone: $.trim($('#receiver_phone').val()),
            receiver_address: $.trim($('#receiver_address').val()),
            shipping_method: $.trim($('#shipping_method').val()),
            shipping_remark: $.trim($('#shipping_remark').val()),
            items: JSON.stringify(collected.items)
        };

        if (extra.order_amount_confirmed) {
            postData.order_amount_confirmed = 1;
            postData.confirmed_order_amount = extra.confirmed_order_amount;
        } else if (orderAmountConfirmed && confirmedOrderAmount != null) {
            postData.order_amount_confirmed = 1;
            postData.confirmed_order_amount = confirmedOrderAmount;
        }

        savingDraft = true;
        var $btn = $('#btn-save-draft');
        $btn.addClass('layui-btn-disabled').prop('disabled', true).text('保存中...');
        var loadIndex = layer.load(2);
        $.post(apiUrl, postData, function (res) {
            layer.close(loadIndex);
            savingDraft = false;
            $btn.removeClass('layui-btn-disabled').prop('disabled', false).text('保存草稿');

            if (!res || res.code !== 0) {
                var msg = (res && res.msg) ? res.msg : '草稿保存失败，请稍后重试。';
                if (msg.indexOf('原订单金额已发生变化') >= 0 && currentOrderMoney != null) {
                    layer.confirm(escapeHtml(msg) + '<br><br>确认已重新核对当前订单金额 '
                        + escapeHtml(currentOrderMoney) + ' 元后继续保存？', {
                        icon: 0,
                        title: '原订单金额变化确认'
                    }, function (idx) {
                        layer.close(idx);
                        orderAmountConfirmed = true;
                        confirmedOrderAmount = String(currentOrderMoney);
                        doSaveDraft({
                            order_amount_confirmed: 1,
                            confirmed_order_amount: confirmedOrderAmount
                        });
                    });
                    return;
                }
                layer.msg(msg, { icon: 2 });
                return;
            }

            var data = res.data || {};
            if (data.apply_id) {
                $('#apply_id').val(data.apply_id);
            }
            if (data.apply_no) {
                $('#apply_no_display').text(data.apply_no);
            }
            if (data.edit_url) {
                draftEditUrl = data.edit_url;
                $('#btn-reopen-draft').show();
            } else if (data.apply_id) {
                draftEditUrl = apiUrl + (apiUrl.indexOf('?') >= 0 ? '&' : '?') + 'id=' + encodeURIComponent(data.apply_id);
                $('#btn-reopen-draft').show();
            }

            orderAmountChanged = false;
            orderAmountConfirmed = false;
            confirmedOrderAmount = null;
            draftOrderAmount = currentOrderMoney;

            layer.msg((res.msg || '草稿保存成功') + (data.apply_no ? ('：' + data.apply_no) : ''), { icon: 1 }, function () {
                if (data.apply_id) {
                    // 删除旧明细后重新插入，必须重新打开以获取最新行 ID
                    window.location.href = draftEditUrl || (apiUrl + (apiUrl.indexOf('?') >= 0 ? '&' : '?') + 'id=' + encodeURIComponent(data.apply_id));
                }
            });
        }, 'json').fail(function () {
            layer.close(loadIndex);
            savingDraft = false;
            $btn.removeClass('layui-btn-disabled').prop('disabled', false).text('保存草稿');
            layer.msg('网络异常，请稍后重试', { icon: 2 });
        });
    }

    table.on('tool(product-table)', function (obj) {
        if (obj.event !== 'add_line') {
            return;
        }
        var source = obj.data || {};
        ensureFactories(function () {
            // 新增行会整表重绘，先同步已有行未保存输入
            syncLineInputsFromDom();
            shippingLines.push(createLineFromSource(source, {
                apply_qty: 0
            }));
            renderShippingLineTable();
        });
    });

    table.on('tool(shipping-line-table)', function (obj) {
        var data = obj.data || {};
        var key = data.client_row_key;
        if (!key) {
            var $tr = $(obj.tr);
            key = $tr.attr('data-row-key');
        }
        syncLineInputsFromDom();
        var line = getShippingLineByKey(key);
        if (!line) {
            return;
        }

        if (obj.event === 'delete_line') {
            shippingLines = shippingLines.filter(function (item) {
                return item.client_row_key !== key;
            });
            renderShippingLineTable();
            return;
        }

        if (obj.event === 'copy_line') {
            if (line.is_invalid_order_item) {
                layer.msg('失效行请先重选有效产品后再复制', { icon: 0 });
                return;
            }
            var source = findOrderSourceItem(line.order_item_id);
            if (!source) {
                layer.msg('无法复制：原订单产品不存在', { icon: 2 });
                return;
            }
            // 只复制已确认正式价；未确认时新行继续展示建议值，不静默落库
            var copied = createLineFromSource(source, {
                apply_product_name: line.apply_product_name,
                apply_spec_model: line.apply_spec_model,
                apply_qty: 0,
                apply_unit_price: hasConfirmedMoney(line.apply_unit_price) ? line.apply_unit_price : '',
                apply_purchase_unit_price: hasConfirmedMoney(line.apply_purchase_unit_price) ? line.apply_purchase_unit_price : '',
                factory_id: null,
                factory_name: '',
                remark: line.remark || ''
            });
            shippingLines.push(copied);
            renderShippingLineTable();
            return;
        }

        if (obj.event === 'rebind_line') {
            openRebindDialog(line);
        }
    });

    $(document).on('input', '#shipping-line-table-wrap .line-apply-qty, #shipping-line-table-wrap .line-apply-unit-price, #shipping-line-table-wrap .line-apply-purchase-unit-price', function () {
        var $input = $(this);
        var $tr = $input.closest('tr');
        var key = $tr.attr('data-row-key');
        var line = getShippingLineByKey(key);
        if (line) {
            if ($input.hasClass('line-apply-unit-price')) {
                line.apply_unit_price = $.trim($input.val() || '');
            } else if ($input.hasClass('line-apply-purchase-unit-price')) {
                line.apply_purchase_unit_price = $.trim($input.val() || '');
            } else if ($input.hasClass('line-apply-qty')) {
                line.apply_qty = $.trim($input.val() || '');
            }
            refreshLineSuggestFlags(line);
        }
        updateAmountPreviews();
    });

    // 明确采用建议价 → 写入正式输入框，之后才会被保存
    $(document).on('click', '#shipping-line-table-wrap .ship-adopt-suggest', function (e) {
        e.preventDefault();
        e.stopPropagation();
        var $a = $(this);
        var $tr = $a.closest('tr');
        var key = $tr.attr('data-row-key');
        var field = $a.attr('data-field');
        // 整表重绘前先同步所有行当前输入，避免丢失其他行未保存内容
        syncLineInputsFromDom();
        var line = getShippingLineByKey(key);
        if (!line) {
            return;
        }
        if (field === 'unit') {
            var saleSuggest = line.display_apply_unit_price != null && line.display_apply_unit_price !== ''
                ? line.display_apply_unit_price
                : line.unit_price;
            if (saleSuggest == null || saleSuggest === '') {
                return;
            }
            line.apply_unit_price = String(saleSuggest);
        } else if (field === 'purchase') {
            var purchaseSuggest = line.suggest_purchase_unit_price != null && line.suggest_purchase_unit_price !== ''
                ? line.suggest_purchase_unit_price
                : line.display_apply_purchase_unit_price;
            if (purchaseSuggest == null || purchaseSuggest === '') {
                return;
            }
            line.apply_purchase_unit_price = String(purchaseSuggest);
        } else {
            return;
        }
        refreshLineSuggestFlags(line);
        renderShippingLineTable();
    });

    $('#btn-select-order').on('click', function () {
        openOrderSelectLayer();
    });

    $('#btn-back').on('click', function () {
        if (window.history.length > 1) {
            window.history.back();
        } else {
            window.location.href = '{:url("index/index")}';
        }
    });

    $('#btn-back-to-draft').on('click', function () {
        goBackToDraftBox();
    });

    $('#btn-reopen-draft').on('click', function () {
        if (!draftEditUrl) {
            var applyId = parseInt($('#apply_id').val(), 10) || 0;
            if (!applyId) {
                return;
            }
            draftEditUrl = apiUrl + (apiUrl.indexOf('?') >= 0 ? '&' : '?') + 'id=' + encodeURIComponent(applyId);
        }
        window.location.href = draftEditUrl;
    });

    form.on('submit(ship-save-draft)', function () {
        doSaveDraft();
        return false;
    });

    function normalizeSnapshotText(v) {
        return String(v == null ? '' : v).trim();
    }

    function normalizeSnapshotFactoryId(v) {
        if (v === null || v === undefined || v === '') {
            return null;
        }
        var n = parseInt(v, 10);
        if (!isFinite(n) || n <= 0) {
            return null;
        }
        return n;
    }

    /** 空/未填 → null；已填（含 0 / 0.00）保留 trim 后字符串，不与 null 合并 */
    function normalizeSnapshotMoney(v) {
        if (v === null || v === undefined || String(v).trim() === '') {
            return null;
        }
        return String(v).trim();
    }

    function moneySnapshotEqual(a, b) {
        if (a === null && b === null) {
            return true;
        }
        if (a === null || b === null) {
            return false;
        }
        if (a === b) {
            return true;
        }
        var na = Number(a);
        var nb = Number(b);
        return isFinite(na) && isFinite(nb) && na === nb;
    }

    function buildEditableSnapshot() {
        var lines = [];
        for (var i = 0; i < shippingLines.length; i++) {
            var line = shippingLines[i];
            lines.push({
                order_item_id: parseInt(line.order_item_id, 10) || 0,
                apply_product_name: normalizeSnapshotText(line.apply_product_name),
                apply_spec_model: normalizeSnapshotText(line.apply_spec_model),
                apply_qty: normalizeSnapshotText(line.apply_qty),
                apply_unit_price: normalizeSnapshotMoney(line.apply_unit_price),
                apply_purchase_unit_price: normalizeSnapshotMoney(line.apply_purchase_unit_price),
                factory_id: normalizeSnapshotFactoryId(line.factory_id),
                remark: normalizeSnapshotText(line.remark),
                line_order: i
            });
        }
        return {
            apply_id: parseInt($('#apply_id').val(), 10) || 0,
            order_id: parseInt($('#order_id').val(), 10) || 0,
            shipping_date: normalizeSnapshotText($('#shipping_date').val()),
            receiver_name: normalizeSnapshotText($('#receiver_name').val()),
            receiver_phone: normalizeSnapshotText($('#receiver_phone').val()),
            receiver_address: normalizeSnapshotText($('#receiver_address').val()),
            shipping_method: normalizeSnapshotText($('#shipping_method').val()),
            shipping_remark: normalizeSnapshotText($('#shipping_remark').val()),
            lines: lines
        };
    }

    function captureDraftBaseline() {
        draftBaselineSnapshot = buildEditableSnapshot();
    }

    function snapshotsEqual(a, b) {
        if (!a || !b) {
            return false;
        }
        if (a.apply_id !== b.apply_id
            || a.order_id !== b.order_id
            || a.shipping_date !== b.shipping_date
            || a.receiver_name !== b.receiver_name
            || a.receiver_phone !== b.receiver_phone
            || a.receiver_address !== b.receiver_address
            || a.shipping_method !== b.shipping_method
            || a.shipping_remark !== b.shipping_remark) {
            return false;
        }
        if (a.lines.length !== b.lines.length) {
            return false;
        }
        for (var i = 0; i < a.lines.length; i++) {
            var x = a.lines[i];
            var y = b.lines[i];
            if (x.order_item_id !== y.order_item_id
                || x.apply_product_name !== y.apply_product_name
                || x.apply_spec_model !== y.apply_spec_model
                || x.apply_qty !== y.apply_qty
                || x.factory_id !== y.factory_id
                || x.remark !== y.remark
                || x.line_order !== y.line_order) {
                return false;
            }
            if (!moneySnapshotEqual(x.apply_unit_price, y.apply_unit_price)
                || !moneySnapshotEqual(x.apply_purchase_unit_price, y.apply_purchase_unit_price)) {
                return false;
            }
        }
        return true;
    }

    function hasUnsavedChanges() {
        if (!isLegitimateDraftEdit || !draftBaselineSnapshot) {
            return false;
        }
        // 仅 DOM→内存同步；不重绘表格，不覆盖用户输入
        syncLineInputsFromDom();
        return !snapshotsEqual(draftBaselineSnapshot, buildEditableSnapshot());
    }

    function enableLegitimateDraftEditMode() {
        isLegitimateDraftEdit = true;
        $('#page-mode-title').text('编辑发货申请');
        $('#btn-back-to-draft').show();
    }

    function goBackToDraftBox() {
        if (savingDraft) {
            layer.msg('正在保存草稿，请稍候。', { icon: 0 });
            return;
        }
        if (!hasUnsavedChanges()) {
            window.location.href = draftBoxUrl;
            return;
        }
        layer.confirm('当前有尚未保存的修改，确定放弃修改并返回草稿箱吗？', {
            icon: 0,
            title: '提示',
            btn: ['继续编辑', '放弃修改并返回']
        }, function (index) {
            // 按钮1：继续编辑
            layer.close(index);
        }, function (index) {
            // 按钮2：放弃修改并返回
            layer.close(index);
            window.location.href = draftBoxUrl;
        });
    }

    function applyDraftData(draftData) {
        if (!draftData || !draftData.order_id) {
            return false;
        }
        var applyIdNum = parseInt(draftData.apply_id, 10) || 0;
        $('#apply_id').val(draftData.apply_id || '');
        if (draftData.apply_no) {
            $('#apply_no_display').text(draftData.apply_no);
        }
        $('#order_id').val(draftData.order_id);
        fillOrderDisplay(draftData.order || {}, false);
        orderSourceItems = draftData.order_source_items || draftData.items || [];
        renderProductTable(orderSourceItems);

        draftOrderAmount = draftData.draft_order_amount != null ? String(draftData.draft_order_amount) : null;
        currentOrderMoney = draftData.current_order_amount != null
            ? String(draftData.current_order_amount)
            : (draftData.order && draftData.order.money != null ? String(draftData.order.money) : currentOrderMoney);
        orderAmountChanged = !!draftData.order_amount_changed;
        orderAmountConfirmed = false;
        confirmedOrderAmount = null;

        var warns = draftData.warnings || [];
        if (draftData.order_amount_change_message) {
            warns = warns.slice();
            if (warns.indexOf(draftData.order_amount_change_message) < 0) {
                warns.unshift(draftData.order_amount_change_message);
            }
        }
        showWarnBanner(warns);

        var lines = draftData.shipping_lines || [];
        shippingLines = lines.map(function (row) {
            var line = {
                item_id: row.item_id || 0,
                client_row_key: nextClientRowKey(),
                order_item_id: row.order_item_id || 0,
                apply_line_no: row.apply_line_no || 0,
                is_invalid_order_item: !!row.is_invalid_order_item,
                invalid_tip: row.invalid_tip || '',
                product_name: row.product_name || '',
                spec_model: row.spec_model || '',
                unit: row.unit || '',
                order_qty: row.order_qty || 0,
                applied_qty: row.applied_qty || 0,
                remaining_qty: row.remaining_qty || 0,
                unit_price: row.unit_price,
                total_price: row.total_price,
                order_purchase_amount: row.order_purchase_amount,
                supplier_id: row.supplier_id || '',
                supplier_name: row.supplier_name || '',
                product_manager_name: row.product_manager_name || '',
                apply_product_name: row.apply_product_name || '',
                apply_spec_model: row.apply_spec_model || '',
                apply_qty: row.apply_qty != null ? row.apply_qty : 0,
                // 正式价原样回填；NULL/空不回填建议值进输入框
                apply_unit_price: hasConfirmedMoney(row.apply_unit_price) ? row.apply_unit_price : '',
                apply_purchase_unit_price: hasConfirmedMoney(row.apply_purchase_unit_price) ? row.apply_purchase_unit_price : '',
                display_apply_unit_price: row.display_apply_unit_price,
                display_apply_purchase_unit_price: row.display_apply_purchase_unit_price,
                is_suggest_unit_price: !!row.is_suggest_unit_price,
                is_suggest_purchase_unit_price: !!row.is_suggest_purchase_unit_price,
                suggest_purchase_unit_price: row.suggest_purchase_unit_price,
                apply_sales_amount: row.apply_sales_amount,
                apply_purchase_amount: row.apply_purchase_amount,
                factory_id: row.factory_id != null && row.factory_id !== '' ? row.factory_id : null,
                factory_name: row.factory_name || '',
                remark: row.remark || ''
            };
            // 若后端未带 suggest_purchase 但给了 display 建议展示，保留展示源
            if (line.suggest_purchase_unit_price == null
                && !!row.is_suggest_purchase_unit_price
                && row.display_apply_purchase_unit_price != null) {
                line.suggest_purchase_unit_price = row.display_apply_purchase_unit_price;
            }
            refreshLineSuggestFlags(line);
            return line;
        });

        if (draftData.edit_url) {
            draftEditUrl = draftData.edit_url;
            $('#btn-reopen-draft').show();
        } else if (draftData.apply_id) {
            draftEditUrl = apiUrl + (apiUrl.indexOf('?') >= 0 ? '&' : '?') + 'id=' + encodeURIComponent(draftData.apply_id);
            $('#btn-reopen-draft').show();
        }

        // 收货等信息须在厂家加载与表格渲染完成前写好，避免基准快照读到空表单
        $('#shipping_date').val(draftData.shipping_date || '');
        $('#receiver_name').val(draftData.receiver_name || '');
        $('#receiver_phone').val(draftData.receiver_phone || '');
        $('#receiver_address').val(draftData.receiver_address || '');
        $('#shipping_method').val(draftData.shipping_method || '');
        $('#shipping_remark').val(draftData.shipping_remark || '');
        $('#selected-order-tip').text('已选择订单：' + ((draftData.order && draftData.order.order_no) || ''));
        $('#btn-select-order').addClass('layui-btn-disabled').prop('disabled', true);

        ensureFactories(function (factoriesOk) {
            renderShippingLineTable();
            // 合法编辑态：草稿已回填且 apply_id 为正整数（不单凭 URL draftId）
            if (applyIdNum > 0) {
                enableLegitimateDraftEditMode();
                // 基准快照须在厂家选项就绪、行上厂家可选中、表格已渲染后建立
                if (factoriesOk) {
                    syncLineInputsFromDom();
                    captureDraftBaseline();
                }
            }
        });
        return applyIdNum > 0;
    }

    // 草稿编辑初始化
    var draftDataJson = '{$draftDataJson|raw}';
    ensureFactories(function () {
        if (draftDataJson) {
            try {
                var draftData = JSON.parse(draftDataJson);
                applyDraftData(draftData);
            } catch (e) {
                layer.msg('草稿数据解析失败', { icon: 2 });
            }
        } else if (parseInt('{$draftId|default=0}', 10) > 0) {
            layer.msg('草稿不存在或无权编辑', { icon: 2 });
        }
    });
});
</script>
