<style>
    body { background: #f5f7fa !important; }
    .ship-create-container {
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        padding: 20px;
        background: #f5f7fa;
        overflow: auto;
    }
    .create-card {
        background: #fff;
        border-radius: 8px;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
        padding: 18px 20px 8px 20px;
        margin-bottom: 16px;
    }
    .create-card-title {
        font-size: 15px;
        font-weight: 600;
        color: #333;
        margin: 0 0 14px 0;
        padding-left: 8px;
        border-left: 3px solid #1E9FFF;
        line-height: 1.2;
    }
    .create-form .layui-form-label {
        width: 130px;
    }
    .create-form .layui-input-block {
        margin-left: 160px;
    }
    .create-form .layui-input-inline {
        width: 280px;
    }
    .readonly-text {
        line-height: 38px;
        color: #333;
    }
    .unit-text {
        color: #999;
        line-height: 38px;
        margin-left: 8px;
        display: inline-block;
    }
    .empty-tip {
        color: #999;
        padding: 20px 0;
        text-align: center;
    }
    .toolbar-row {
        margin-bottom: 12px;
    }
    #product-table-wrap .layui-input,
    #shipping-line-table-wrap .layui-input {
        height: 32px;
        line-height: 32px;
        width: 100%;
        box-sizing: border-box;
    }
    /* 产品源表：允许经理异常提示换行，避免被单元格裁切 */
    #product-table-wrap .layui-table-body td .layui-table-cell {
        height: auto !important;
        min-height: 38px;
        max-height: none;
        line-height: 1.45;
        white-space: normal;
        overflow: visible;
        text-overflow: clip;
        word-break: break-word;
    }
    /* 仅作用于本次发货行表格：解除 Layui 单元格固定高度/nowrap/overflow 裁切 */
    #shipping-line-table-wrap {
        overflow-x: auto;
        padding-bottom: 6px;
    }
    #shipping-line-table-wrap .layui-table-body td .layui-table-cell {
        height: auto !important;
        min-height: 38px;
        max-height: none;
        line-height: 1.45;
        white-space: normal;
        overflow: visible;
        text-overflow: clip;
        padding: 8px 10px;
        word-break: break-word;
    }
    #shipping-line-table-wrap .layui-table-header .layui-table-cell {
        height: 38px;
        line-height: 28px;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
    }
    #shipping-line-table-wrap .ship-amount-preview,
    #shipping-line-table-wrap .ship-suggest-tip,
    #shipping-line-table-wrap .ship-invalid-tip {
        white-space: normal;
        word-break: break-word;
        display: block;
    }
    #shipping-line-table-wrap .ship-amount-preview {
        padding: 2px 0;
    }
    #shipping-line-table-wrap .line-factory-select {
        display: block;
        width: 100%;
        max-width: 100%;
        height: 32px;
        line-height: 32px;
        padding: 0 8px;
        border: 1px solid #e6e6e6;
        border-radius: 2px;
        background-color: #fff;
        box-sizing: border-box;
    }
    #shipping-line-table-wrap .line-action-btns {
        white-space: normal;
        line-height: 1.6;
    }
    #shipping-line-table-wrap .line-action-btns .layui-btn {
        margin: 2px 2px 2px 0;
    }
    .order-select-bar {
        display: flex;
        align-items: center;
        gap: 12px;
        flex-wrap: wrap;
    }
    .order-select-bar .readonly-text {
        line-height: 32px;
    }
    .ship-warn-banner {
        display: none;
        margin-bottom: 12px;
        padding: 10px 12px;
        border: 1px solid #FFB800;
        background: #fff8e6;
        color: #a66b00;
        border-radius: 4px;

    }
    .ship-invalid-tip {

    }

    }

    /* 页头：标题与「返回草稿箱」左右排列，窄屏可换行，避免遮挡下方内容 */

        width: calc(100% - 24px);
        margin-left: 12px;
        padding: 0 8px;
        box-sizing: border-box;
    }
    .ship-create-head-bar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        flex-wrap: wrap;
        gap: 8px 16px;
        width: 100%;
        box-sizing: border-box;
    }
    .ship-create-head-bar .ship-page-mode-title {
        font-size: inherit;

        color: inherit;
        line-height: 1.4;
    }
    .ship-create-head-bar #btn-back-to-draft {
        flex: 0 0 auto;
    }
</style>

<div class="ship-create-container">
    <fieldset class="layui-elem-field ship-create-page-head" style="margin-bottom: 12px;">
        <legend>
            <div class="ship-create-head-bar">
                <span class="ship-page-mode-title" id="page-mode-title">新建发货申请</span>
                <button type="button" class="layui-btn layui-btn-primary layui-btn-sm" id="btn-back-to-draft" style="display:none;">← 返回草稿箱</button>
            </div>
        </legend>
    </fieldset>

    <div class="ship-warn-banner" id="ship-warn-banner"></div>
    <div class="ship-warn-banner" id="rejected-edit-tip-banner" style="display:none; border-color:#1E9FFF; background:#eef7ff; color:#0b5f9a;">
        当前为审核失败申请编辑。保存修改后仍为审核失败状态，不等于再次提交审核（再次提交功能尚未开放）。
    </div>
    <div class="ship-warn-banner" id="reject-reason-banner" style="display:none;"></div>

    <form class="layui-form create-form" lay-filter="ship-create-form" id="ship-create-form">
        <input type="hidden" name="order_id" id="order_id" value="">
        <input type="hidden" name="apply_id" id="apply_id" value="">
        <input type="hidden" name="expected_work_hash" id="expected_work_hash" value="">

        <!-- 区域一：关联订单 -->
        <div class="create-card">
            <h3 class="create-card-title">关联订单</h3>

            <div class="layui-form-item">
                <label class="layui-form-label">发货申请编号</label>
                <div class="layui-input-block">
                    <div class="readonly-text" id="apply_no_display">保存草稿后生成</div>
                </div>
            </div>

            <div class="layui-form-item">
                <label class="layui-form-label">关联订单</label>
                <div class="layui-input-block order-select-bar">
                    <button type="button" class="layui-btn layui-btn-normal" id="btn-select-order">
                        <i class="layui-icon layui-icon-search"></i> 选择订单
                    </button>
                    <span class="readonly-text" id="selected-order-tip">请先选择审核通过的订单</span>
                </div>
            </div>

            <div class="layui-form-item">
                <label class="layui-form-label">订单编号</label>
                <div class="layui-input-inline">
                    <input type="text" class="layui-input" id="display_order_no" readonly placeholder="-">
                </div>
            </div>

            <div class="layui-form-item">
                <label class="layui-form-label">客户名称</label>
                <div class="layui-input-inline">
                    <input type="text" class="layui-input" id="display_cname" readonly placeholder="-">
                </div>
            </div>

            <div class="layui-form-item">
                <label class="layui-form-label">业务员</label>
                <div class="layui-input-inline">
                    <input type="text" class="layui-input" id="display_pr_user" readonly placeholder="-">
                </div>
            </div>

            <div class="layui-form-item">
                <label class="layui-form-label">所属团队</label>
                <div class="layui-input-inline">
                    <input type="text" class="layui-input" id="display_team_name" readonly placeholder="-">
                </div>
            </div>

            <div class="layui-form-item">
                <label class="layui-form-label">成交时间</label>
                <div class="layui-input-inline">
                    <input type="text" class="layui-input" id="display_order_time" readonly placeholder="-">
                </div>
            </div>

            <div class="layui-form-item">
                <label class="layui-form-label">原订单金额</label>
                <div class="layui-input-inline">
                    <input type="text" class="layui-input" id="display_money" readonly placeholder="-">
                </div>
                <span class="unit-text">元</span>
            </div>

            <div class="layui-form-item">
                <label class="layui-form-label">已收款金额</label>
                <div class="layui-input-inline">
                    <input type="text" class="layui-input" id="display_amount_received" readonly placeholder="-">
                </div>
                <span class="unit-text">（仅展示）</span>
            </div>
        </div>

        <!-- 区域二：订单产品（只读源） -->
        <div class="create-card">
            <h3 class="create-card-title">订单产品（只读，用于添加发货行）</h3>
            <div id="product-table-wrap">
                <div class="empty-tip" id="product-empty-tip">选择订单后显示产品明细</div>
                <table class="layui-hide" id="product-table" lay-filter="product-table"></table>
            </div>
        </div>

        <!-- 区域二B：本次发货行 -->
        <div class="create-card">
            <h3 class="create-card-title">本次发货行</h3>
            <div class="toolbar-row">
                <span class="unit-text" style="margin-left:0;">可对同一原订单产品添加多行并分别指定厂家；零数量行保存时不会落库。</span>
            </div>
            <div id="shipping-line-table-wrap">
                <div class="empty-tip" id="shipping-empty-tip">请从上方订单产品添加发货行</div>
                <table class="layui-hide" id="shipping-line-table" lay-filter="shipping-line-table"></table>
            </div>
        </div>

        <!-- 区域三：发货信息 -->
        <div class="create-card">
            <h3 class="create-card-title">发货信息</h3>

            <div class="layui-form-item">
                <label class="layui-form-label">预计发货日期</label>
                <div class="layui-input-inline">
                    <input type="text" name="shipping_date" id="shipping_date" autocomplete="off"
                           placeholder="请选择日期" class="layui-input">
                </div>
            </div>

            <div class="layui-form-item">
                <label class="layui-form-label">收货人</label>
                <div class="layui-input-inline">
                    <input type="text" name="receiver_name" id="receiver_name" autocomplete="off"
                           placeholder="请输入收货人" class="layui-input">
                </div>
            </div>

            <div class="layui-form-item">
                <label class="layui-form-label">收货联系电话</label>
                <div class="layui-input-inline">
                    <input type="text" name="receiver_phone" id="receiver_phone" autocomplete="off"
                           placeholder="请输入联系电话" class="layui-input">
                </div>
            </div>

            <div class="layui-form-item">
                <label class="layui-form-label">收货地址</label>
                <div class="layui-input-block" style="max-width: 620px;">
                    <textarea name="receiver_address" id="receiver_address" placeholder="请输入收货地址"
                              class="layui-textarea"></textarea>
                </div>
            </div>

            <div class="layui-form-item">
                <label class="layui-form-label">发货方式</label>
                <div class="layui-input-inline">
                    <input type="text" name="shipping_method" id="shipping_method" autocomplete="off"
                           placeholder="如：物流、快递、自提等" class="layui-input">
                </div>
            </div>

            <div class="layui-form-item">
                <label class="layui-form-label">发货备注</label>
                <div class="layui-input-block" style="max-width: 620px;">
                    <textarea name="shipping_remark" id="shipping_remark" placeholder="请输入发货备注"
                              class="layui-textarea"></textarea>
                </div>
            </div>
        </div>

        <div class="create-card" style="padding-bottom: 18px;">
            <div class="layui-form-item" style="margin-bottom: 0;">
                <div class="layui-input-block">
                    <button type="button" class="layui-btn" id="btn-save-draft" lay-submit lay-filter="ship-save-draft">保存草稿</button>
                    <button type="button" class="layui-btn layui-btn-normal" id="btn-submit-apply">提交审核</button>
                    <button type="button" class="layui-btn layui-btn-normal" id="btn-save-rejected" style="display:none;">保存修改</button>
                    <button type="button" class="layui-btn layui-btn-warm" id="btn-retry-submit" style="display:none;">使用原请求重新确认</button>
                    <button type="button" class="layui-btn layui-btn-primary" id="btn-reopen-draft" style="display:none;">重新打开本草稿</button>
                    <button type="button" class="layui-btn layui-btn-primary" id="btn-back">返回</button>
                </div>
            </div>
            <div id="submit-intent-banner" class="ship-warn-banner" style="display:none; margin-top:12px;"></div>
        </div>
    </form>
</div>

<script>
layui.use(['form', 'layer', 'table', 'laydate'], function () {
    var form = layui.form;
    var layer = layui.layer;
    var table = layui.table;
    var laydate = layui.laydate;
    var $ = layui.$;

    var apiUrl = '{:url("Ship/createShip")}';
    var submitApiUrl = '{:url("Ship/submitApply")}';
    var saveRejectedUrl = {$saveRejectedUrlJson|default='""'|raw};
    var pageMode = {$pageModeJson|default='"create"'|raw};
    var pageSessionAid = {$sessionAidJson|default=0|raw};
    var pageCsrfToken = {$submitCsrfTokenJson|default='""'|raw};
    var rejectedEditCsrfToken = {$rejectedEditCsrfTokenJson|default='""'|raw};
    var orderSourceItems = [];
    var shippingLines = [];
    var factoryOptions = [];
    var factoriesLoaded = false;
    var productTableRendered = false;
    var shippingTableRendered = false;
    var rowKeySeq = 1;
    var savingDraft = false;
    var savingRejected = false;
    var submittingApply = false;
    var isRejectedEditMode = (pageMode === 'rejected_edit');
    var formLockedAfterSubmit = false;
    var currentOrderMoney = null;
    var draftOrderAmount = null;
    var orderAmountChanged = false;
    var orderAmountConfirmed = false;
    var confirmedOrderAmount = null;
    var draftEditUrl = '';
    var draftBoxUrl = '{:url("Ship/draftShip")}';
    var isLegitimateDraftEdit = false;
    var draftBaselineSnapshot = null;
    var activeSubmitIntent = null;
    var submitLoadIndex = null;
    var submitChannel = null;

    laydate.render({
        elem: '#shipping_date',
        type: 'date',
        trigger: 'click'
    });

    function escapeHtml(str) {
        return String(str == null ? '' : str)
            .replace(/&/g, '&amp;')
            .replace(/</g, '&lt;')
            .replace(/>/g, '&gt;')
            .replace(/"/g, '&quot;')
            .replace(/'/g, '&#39;');
    }

    function escapeAttr(str) {
        return escapeHtml(str);
    }

    function nextClientRowKey() {
        return 'tmp_' + Date.now() + '_' + (rowKeySeq++);
    }

    /** 已确认的本次金额（非空字符串）；空/null 表示未填写，不得用建议值冒充 */
    function hasConfirmedMoney(v) {
        return v !== null && v !== undefined && String(v).trim() !== '';
    }

    function moneyPreview(qty, unitPrice) {
        if (!isStrictNonNegIntString(String(qty)) || parseInt(String(qty), 10) <= 0) {
            return '';
        }
        if (unitPrice === null || unitPrice === undefined || String(unitPrice).trim() === '') {
            return '';
        }
        if (!isStrictMoneyString(String(unitPrice).trim())) {
            return '金额格式错误';
        }
        // 仅前端预览；落库以服务端 BCMath 为准
        var q = parseInt(String(qty), 10);
        var parts = String(unitPrice).trim().split('.');
        var yuan = parseInt(parts[0], 10) || 0;
        var fen = parts[1] ? (parts[1] + '00').slice(0, 2) : '00';
        var totalFen = q * (yuan * 100 + parseInt(fen, 10));
        var sign = totalFen < 0 ? '-' : '';
        totalFen = Math.abs(totalFen);
        var fenStr = String(totalFen % 100);
        if (fenStr.length < 2) {
            fenStr = '0' + fenStr;
        }
        return sign + Math.floor(totalFen / 100) + '.' + fenStr;
    }

    function isStrictNonNegIntString(raw) {
        return /^(?:0|[1-9]\d*)$/.test(String(raw == null ? '' : raw).trim());
    }

    function isStrictMoneyString(raw) {
        return /^(?:0|[1-9]\d*)(?:\.\d{1,2})?$/.test(String(raw == null ? '' : raw).trim());
    }

    function parseStrictNonNegInt(raw, fieldLabel) {
        var text = String(raw == null ? '' : raw).trim();
        if (text === '') {
            return { ok: true, value: 0 };
        }
        if (!isStrictNonNegIntString(text)) {
            return { ok: false, msg: fieldLabel + '必须是大于等于0的整数，不能是小数、科学计数法或混合字符。' };
        }
        var n = parseInt(text, 10);
        if (!isFinite(n) || n < 0) {
            return { ok: false, msg: fieldLabel + '必须是大于等于0的整数。' };
        }
        return { ok: true, value: n };
    }

    function parseStrictOptionalMoney(raw, fieldLabel) {
        var text = String(raw == null ? '' : raw).trim();
        if (text === '') {
            return { ok: true, value: null };
        }
        if (!isStrictMoneyString(text)) {
            return { ok: false, msg: fieldLabel + '格式不正确（非负，最多两位小数）。' };
        }
        return { ok: true, value: text };
    }

    function showWarnBanner(messages) {
        var list = [];
        if (Object.prototype.toString.call(messages) === '[object Array]') {
            list = messages;
        } else if (messages) {
            list = [String(messages)];
        }
        if (!list.length) {
            $('#ship-warn-banner').hide().html('');
            return;
        }
        var html = list.map(function (m) {
            return '<div>' + escapeHtml(m) + '</div>';
        }).join('');
        $('#ship-warn-banner').html(html).show();
    }

    /** 经理异常状态短文案（与后端 manager_status 对齐） */
    function managerStatusLabel(status) {
        switch (String(status || '')) {
            case 'missing':
                return '原产品经理不存在';
            case 'disabled':
                return '原产品经理已停用';
            case 'invalid_id':
                return '产品经理ID非法';
            default:
                return '';
        }
    }

    function formatPmSubstituteTip(d) {
        d = d || {};
        var tip = d.pm_substitute_tip || '';
        if (tip) {
            return tip;
        }
        var status = String(d.pm_substitute_display_status || '');
        if (status === 'authorized' && d.substitute_manager_name) {
            return '已指定替代产品经理：' + d.substitute_manager_name;
        }
        if (status === 'need_authorize' || (!status && d.manager_invalid)) {
            return '原产品经理异常，尚未指定替代经理，请联系超级管理员处理';
        }
        if (status === 'revoked') {
            return '替代授权已撤销，请重新联系超级管理员';
        }
        if (status === 'original_restored') {
            return '原产品经理已恢复，替代授权不再生效';
        }
        if (status === 'substitute_unavailable') {
            return '替代产品经理当前不可用，授权暂不可用';
        }
        return '';
    }

    function formatManagerDisplayHtml(d) {
        d = d || {};
        var name = d.product_manager_name || '';
        var html = escapeHtml(name || (d.manager_invalid ? '—' : ''));
        if (d.manager_invalid) {
            var tip = managerStatusLabel(d.manager_status) || '产品经理异常';
            html += '<div class="ship-invalid-tip">' + escapeHtml(tip) + '</div>';
            var subTip = formatPmSubstituteTip(d);
            if (subTip) {
                html += '<div class="ship-invalid-tip">' + escapeHtml(subTip) + '</div>';
            }
        } else if (String(d.pm_substitute_display_status || '') === 'original_restored') {
            var restoredTip = formatPmSubstituteTip(d);
            if (restoredTip) {
                html += '<div class="ship-invalid-tip">' + escapeHtml(restoredTip) + '</div>';
            }
        }
        return html || '—';
    }

    function pickManagerFieldsFromSource(source) {
        source = source || {};
        return {
            product_manager_id: source.product_manager_id != null && source.product_manager_id !== ''
                ? source.product_manager_id
                : null,
            product_manager_name: source.product_manager_name || '',
            manager_invalid: !!source.manager_invalid,
            manager_invalid_reason: source.manager_invalid_reason || '',
            manager_status: source.manager_status || (source.manager_invalid ? 'missing' : 'valid'),
            pm_substitute_display_status: source.pm_substitute_display_status || '',
            pm_substitute_tip: source.pm_substitute_tip || '',
            pm_substitute_effective: !!source.pm_substitute_effective,
            substitute_manager_id: source.substitute_manager_id != null && source.substitute_manager_id !== ''
                ? source.substitute_manager_id
                : null,
            substitute_manager_name: source.substitute_manager_name || ''
        };
    }

    function fillOrderDisplay(order, fillReceiverIfEmpty) {
        order = order || {};
        $('#display_order_no').val(order.order_no || '');
        $('#display_cname').val(order.cname || '');
        $('#display_pr_user').val(order.pr_user || '');
        $('#display_team_name').val(order.team_name || '');
        $('#display_order_time').val(order.order_time || '');
        $('#display_money').val(order.money !== undefined && order.money !== null ? order.money : '');
        $('#display_amount_received').val(order.amount_received || '');
        currentOrderMoney = order.money !== undefined && order.money !== null ? String(order.money) : null;
        if (fillReceiverIfEmpty !== false) {
            if ($('#receiver_phone').val() === '' && order.default_receiver_phone) {
                $('#receiver_phone').val(order.default_receiver_phone);
            }
            if ($('#receiver_address').val() === '' && order.default_receiver_address) {
                $('#receiver_address').val(order.default_receiver_address);
            }
        }
        $('#selected-order-tip').text('已选择订单：' + (order.order_no || ''));

    function findOrderSourceItem(orderItemId) {
        orderItemId = parseInt(orderItemId, 10) || 0;
        for (var i = 0; i < orderSourceItems.length; i++) {
            if (parseInt(orderSourceItems[i].order_item_id, 10) === orderItemId) {
                return orderSourceItems[i];
            }
        }
        return null;
    }

    function buildFactorySelectHtml(selectedId) {
        // lay-ignore：保留原生 select，避免表格内 Layui 自定义下拉被单元格 overflow 裁切
        var html = '<select class="layui-input line-factory-select" lay-ignore>';
        html += '<option value="">请选择厂家（草稿可空）</option>';
        for (var i = 0; i < factoryOptions.length; i++) {
            var f = factoryOptions[i];
            var selected = (selectedId && parseInt(selectedId, 10) === parseInt(f.factory_id, 10)) ? ' selected' : '';
            html += '<option value="' + escapeAttr(f.factory_id) + '"' + selected + '>'
                + escapeHtml(f.factory_name) + '</option>';
        }
        html += '</select>';
        return html;
    }

    function syncLineInputsFromDom() {
        $('#shipping-line-table-wrap tr[data-row-key]').each(function () {
            var $tr = $(this);
            var key = $tr.attr('data-row-key');
            var line = getShippingLineByKey(key);
            if (!line) {
                return;
            }
            line.apply_product_name = $.trim($tr.find('.line-apply-product-name').val() || '');
            line.apply_spec_model = $.trim($tr.find('.line-apply-spec-model').val() || '');
            line.apply_qty = $.trim($tr.find('.line-apply-qty').val() || '');
            // 仅读取输入框正式值；建议价不在输入框内，未填写保持空→保存为 NULL
            line.apply_unit_price = $.trim($tr.find('.line-apply-unit-price').val() || '');
            line.apply_purchase_unit_price = $.trim($tr.find('.line-apply-purchase-unit-price').val() || '');
            line.remark = $.trim($tr.find('.line-remark').val() || '');
            var factoryVal = $tr.find('.line-factory-select').val();
            line.factory_id = factoryVal ? parseInt(factoryVal, 10) : null;
            if (!line.factory_id) {
                line.factory_id = null;
                line.factory_name = '';
            } else {
                var optText = $tr.find('.line-factory-select option:selected').text();
                line.factory_name = optText || '';
            }
            refreshLineSuggestFlags(line);
        });
    }

    /** 正式价为空时才展示建议标识；不把建议值写入正式字段 */
    function refreshLineSuggestFlags(line) {
        if (!line) {
            return;
        }
        var hasSale = hasConfirmedMoney(line.apply_unit_price);
        var hasPurchase = hasConfirmedMoney(line.apply_purchase_unit_price);
        var saleSuggest = line.unit_price != null && line.unit_price !== '' ? line.unit_price : null;
        var purchaseSuggest = line.suggest_purchase_unit_price != null && line.suggest_purchase_unit_price !== ''
            ? line.suggest_purchase_unit_price
            : null;
        line.is_suggest_unit_price = !hasSale && saleSuggest != null;
        line.is_suggest_purchase_unit_price = !hasPurchase && purchaseSuggest != null;
        line.display_apply_unit_price = hasSale ? line.apply_unit_price : saleSuggest;
        line.display_apply_purchase_unit_price = hasPurchase ? line.apply_purchase_unit_price : purchaseSuggest;
    }

    function getShippingLineByKey(key) {
        for (var i = 0; i < shippingLines.length; i++) {
            if (shippingLines[i].client_row_key === key) {
                return shippingLines[i];
            }
        }
        return null;
    }

    function createLineFromSource(source, overrides) {
        source = source || {};
        overrides = overrides || {};
        var qtyDefault = overrides.apply_qty !== undefined ? overrides.apply_qty : 0;
        // 正式本次单价仅来自 overrides 或留空；建议价不得预填进正式字段

            product_name: source.product_name || '',
            spec_model: source.spec_model || '',
            unit: source.unit || '',
            order_qty: source.order_qty || 0,
            applied_qty: source.applied_qty || 0,
            remaining_qty: source.remaining_qty || 0,
            unit_price: source.unit_price != null ? source.unit_price : '',
            total_price: source.total_price != null ? source.total_price : '',
            order_purchase_amount: source.order_purchase_amount != null ? source.order_purchase_amount : null,
            supplier_id: source.supplier_id || '',
            supplier_name: source.supplier_name || '',
            product_manager_id: managerFields.product_manager_id,
            product_manager_name: managerFields.product_manager_name,
            manager_invalid: managerFields.manager_invalid,
            manager_invalid_reason: managerFields.manager_invalid_reason,
            manager_status: managerFields.manager_status,
            pm_substitute_display_status: managerFields.pm_substitute_display_status,
            pm_substitute_tip: managerFields.pm_substitute_tip,
            pm_substitute_effective: managerFields.pm_substitute_effective,
            substitute_manager_id: managerFields.substitute_manager_id,
            substitute_manager_name: managerFields.substitute_manager_name,
            apply_product_name: overrides.apply_product_name != null ? overrides.apply_product_name : (source.product_name || ''),
            apply_spec_model: overrides.apply_spec_model != null ? overrides.apply_spec_model : (source.spec_model || ''),
            apply_qty: qtyDefault,
            apply_unit_price: applyUnitPrice,
            apply_purchase_unit_price: applyPurchaseUnitPrice,
            display_apply_unit_price: null,
            display_apply_purchase_unit_price: null,
            is_suggest_unit_price: false,
            is_suggest_purchase_unit_price: false,
            suggest_purchase_unit_price: source.suggest_purchase_unit_price != null ? source.suggest_purchase_unit_price : null,
            apply_sales_amount: null,
            apply_purchase_amount: null,
            factory_id: overrides.factory_id !== undefined ? overrides.factory_id : null,

        };
        refreshLineSuggestFlags(line);
        return line;
    }

            });

        } else {
            table.reload('shipping-line-table', {
                data: shippingLines,
                cols: cols,
                done: doneBind

    function updateAmountPreviews() {
        $('#shipping-line-table-wrap tr[data-row-key]').each(function () {
            var $tr = $(this);
            var key = $tr.attr('data-row-key');
            var line = getShippingLineByKey(key);
            var qty = $.trim($tr.find('.line-apply-qty').val() || '');
            var sale = $.trim($tr.find('.line-apply-unit-price').val() || '');
            var purchase = $.trim($tr.find('.line-apply-purchase-unit-price').val() || '');
            var saleFormal = sale !== '';
            var purchaseFormal = purchase !== '';
            if (!saleFormal && line) {
                var saleSuggest = line.display_apply_unit_price != null && line.display_apply_unit_price !== ''
                    ? line.display_apply_unit_price
                    : (line.unit_price != null && line.unit_price !== '' ? line.unit_price : null);
                if (saleSuggest != null) {
                    sale = String(saleSuggest);
                }
            }
            if (!purchaseFormal && line) {
                var purchaseSuggest = line.suggest_purchase_unit_price != null && line.suggest_purchase_unit_price !== ''
                    ? line.suggest_purchase_unit_price
                    : (line.display_apply_purchase_unit_price != null && line.display_apply_purchase_unit_price !== ''
                        ? line.display_apply_purchase_unit_price
                        : null);
                if (purchaseSuggest != null) {
                    purchase = String(purchaseSuggest);
                }
            }
            var salesAmt = moneyPreview(qty, sale);
            var purchaseAmt = moneyPreview(qty, purchase);
            var saleHtml = (saleFormal || !salesAmt)
                ? ('销:' + escapeHtml(salesAmt || '-'))
                : ('<span class="ship-preview-only">销(预览):' + escapeHtml(salesAmt) + '</span>');
            var purchaseHtml = (purchaseFormal || !purchaseAmt)
                ? ('采:' + escapeHtml(purchaseAmt || '-'))
                : ('<span class="ship-preview-only">采(预览):' + escapeHtml(purchaseAmt) + '</span>');
            $tr.find('.ship-amount-preview').html(saleHtml + '<br>' + purchaseHtml);
        });
    }

    function ensureFactories(callback) {
        if (factoriesLoaded) {
            if (typeof callback === 'function') {
                callback(true);
            }
            return;
        }
        $.post(apiUrl, { op: 'list_factories' }, function (res) {
            if (!res || res.code !== 0) {
                layer.msg((res && res.msg) ? res.msg : '厂家列表加载失败', { icon: 2 });
                factoryOptions = [];
                factoriesLoaded = false;
                if (typeof callback === 'function') {
                    callback(false);
                }
                return;
            }
            factoryOptions = res.data || [];
            factoriesLoaded = true;
            if (typeof callback === 'function') {
                callback(true);
            }
        }, 'json').fail(function () {
            layer.msg('厂家列表加载失败，请稍后重试', { icon: 2 });
            if (typeof callback === 'function') {
                callback(false);
            }
        });
    }

    function resetShippingState() {
        shippingLines = [];
        orderAmountChanged = false;
        orderAmountConfirmed = false;
        confirmedOrderAmount = null;
        draftOrderAmount = null;
        draftEditUrl = '';
        showWarnBanner([]);
        renderShippingLineTable();
        $('#btn-reopen-draft').hide();
    }

    function loadOrderDetail(orderId, callback, options) {
        options = options || {};
        if (!orderId) {
            return;
        }
        var loadIndex = layer.load(2);
        $.post(apiUrl, { op: 'get_order_detail', order_id: orderId }, function (res) {
            layer.close(loadIndex);
            if (!res || res.code !== 0) {
                layer.msg((res && res.msg) ? res.msg : '加载订单详情失败', { icon: 2 });
                return;
            }
            var data = res.data || {};
            $('#order_id').val(orderId);
            fillOrderDisplay(data.order || {}, options.fillReceiverIfEmpty !== false);
            renderProductTable(data.items || []);
            if (!options.keepShippingLines) {
                resetShippingState();
            }
            // 经理异常等汇总进横幅，避免 layer.msg 刷屏；切换订单时由 reset 清空后再写入
            showWarnBanner(data.warnings || []);
            if (typeof callback === 'function') {
                callback(data);
            }
        }, 'json').fail(function () {
            layer.close(loadIndex);
            layer.msg('网络异常，请稍后重试', { icon: 2 });
        });
    }

    function openOrderSelectLayer() {
        if (isRejectedEditMode) {
            layer.msg('审核失败编辑期间禁止切换关联订单', { icon: 0 });
            return;
        }
        var currentApplyId = parseInt($('#apply_id').val(), 10) || 0;
        if (currentApplyId > 0) {
            layer.msg('草稿编辑期间禁止切换关联订单', { icon: 0 });
            return;
        }
        var contentHtml = $('#order-select-tpl').html();
        var layerIndex = layer.open({
            type: 1,
            title: '选择订单',
            area: ['900px', '560px'],
            content: contentHtml,
            success: function () {
                table.render({
                    elem: '#order-select-table',
                    id: 'order-select-table',
                    url: apiUrl,
                    method: 'post',
                    where: { op: 'search_orders' },
                    page: true,
                    limit: 10,
                    limits: [10, 20, 50],
                    parseData: function (res) {
                        return {
                            code: res.code === 0 ? 0 : 1,
                            msg: res.msg || '',
                            count: res.count || 0,
                            data: res.data || []
                        };
                    },
                    cols: [[
                        { field: 'order_no', title: '订单编号', minWidth: 140 },
                        { field: 'cname', title: '客户名称', minWidth: 120 },
                        { field: 'pr_user', title: '业务员', width: 100 },
                        { field: 'team_name', title: '团队', width: 100 },
                        { field: 'money', title: '订单金额', width: 110 },
                        { field: 'order_time', title: '成交时间', width: 160 },
                        { title: '操作', width: 80, align: 'center', toolbar: '#orderSelectBarTpl' }
                    ]]
                });

                $('#order-search-btn').on('click', function () {
                    table.reload('order-select-table', {
                        where: {
                            op: 'search_orders',
                            keyword: $.trim($('#order-search-keyword').val())
                        },
                        page: { curr: 1 }
                    });
                });

                $('#order-search-keyword').on('keydown', function (e) {
                    if (e.keyCode === 13) {
                        $('#order-search-btn').click();
                    }
                });

                table.on('tool(order-select-table)', function (obj) {
                    if (obj.event === 'select') {
                        var row = obj.data || {};
                        layer.close(layerIndex);
                        loadOrderDetail(row.id);
                    }
                });
            }
        });
    }

    function openRebindDialog(line) {
        if (!orderSourceItems.length) {
            layer.msg('当前订单没有可重选的产品明细', { icon: 2 });
            return;
        }
        var optionsHtml = orderSourceItems.map(function (item) {
            return '<option value="' + escapeAttr(item.order_item_id) + '">'
                + escapeHtml(item.product_name + ' / ' + (item.spec_model || '-') + '（剩余' + item.remaining_qty + '）')
                + '</option>';
        }).join('');

        layer.open({

    function collectShippingItemsForSave() {
        syncLineInputsFromDom();
        var items = [];
        for (var i = 0; i < shippingLines.length; i++) {
            var line = shippingLines[i];
            if (line.is_invalid_order_item) {
                return { ok: false, msg: '存在原订单产品行已失效的发货行，请先重选有效产品后再保存。' };
            }
            var qtyRes = parseStrictNonNegInt(line.apply_qty, '本次发货数量');
            if (!qtyRes.ok) {
                return { ok: false, msg: qtyRes.msg };
            }
            var saleRes = parseStrictOptionalMoney(line.apply_unit_price, '本次销售单价');
            if (!saleRes.ok) {
                return { ok: false, msg: saleRes.msg };
            }
            var purchaseRes = parseStrictOptionalMoney(line.apply_purchase_unit_price, '本次采购单价');
            if (!purchaseRes.ok) {
                return { ok: false, msg: purchaseRes.msg };
            }
            items.push({
                order_item_id: parseInt(line.order_item_id, 10) || 0,
                apply_qty: qtyRes.value,
                apply_product_name: line.apply_product_name || '',
                apply_spec_model: line.apply_spec_model || '',
                apply_unit_price: saleRes.value,
                apply_purchase_unit_price: purchaseRes.value,
                factory_id: line.factory_id ? parseInt(line.factory_id, 10) : null,
                remark: line.remark || ''
            });
        }
        var hasPositive = false;
        for (var j = 0; j < items.length; j++) {
            if (items[j].apply_qty > 0) {
                hasPositive = true;
                break;
            }
        }
        if (!hasPositive) {
            return { ok: false, msg: '至少需要一条正整数数量的发货行。' };
        }
        return { ok: true, items: items };
    }

    /** 共用表单载荷（草稿宽松规则）；正式提交另做强校验 */
    function buildShippingFormData(extra) {
        extra = extra || {};
        var orderId = parseInt($('#order_id').val(), 10) || 0;
        if (!orderId) {
            return { ok: false, msg: '请先选择有效订单' };
        }
        var collected = collectShippingItemsForSave();
        if (!collected.ok) {
            return collected;
        }
        if (collected.items.length > 200) {
            return { ok: false, msg: '发货明细行数超过限制' };
        }
        var data = {
            order_id: orderId,
            apply_id: parseInt($('#apply_id').val(), 10) || 0,
            shipping_date: $.trim($('#shipping_date').val()),
            receiver_name: $.trim($('#receiver_name').val()),
            receiver_phone: $.trim($('#receiver_phone').val()),
            receiver_address: $.trim($('#receiver_address').val()),
            shipping_method: $.trim($('#shipping_method').val()),
            shipping_remark: $.trim($('#shipping_remark').val()),
            items: collected.items
        };
        if (extra.order_amount_confirmed) {
            data.order_amount_confirmed = 1;
            data.confirmed_order_amount = String(extra.confirmed_order_amount);
        } else if (orderAmountConfirmed && confirmedOrderAmount != null) {
            data.order_amount_confirmed = 1;
            data.confirmed_order_amount = String(confirmedOrderAmount);
        }
        if (extra.shipping_date_history_confirmed) {
            data.shipping_date_history_confirmed = 1;
        }
        return { ok: true, data: data };
    }

    function doSaveDraft(extra) {
        extra = extra || {};
        if (isRejectedEditMode) {
            layer.msg('审核失败编辑请使用「保存修改」，不能保存草稿。', { icon: 0 });
            return;
        }
        if (formLockedAfterSubmit) {
            layer.msg('该发货申请已提交审核，不能再保存草稿。', { icon: 0 });
            return;
        }
        if (submittingApply) {
            layer.msg('正在提交审核，请稍候。', { icon: 0 });
            return;
        }
        if (savingDraft) {
            return;
        }
        if (activeSubmitIntent && (activeSubmitIntent.state === 'sending' || activeSubmitIntent.state === 'uncertain')) {
            layer.msg('存在尚未确认结果的正式提交，请先处理后再保存草稿。', { icon: 0 });
            return;
        }

        var built = buildShippingFormData(extra);
        if (!built.ok) {
            layer.msg(built.msg, { icon: 2 });
            return;
        }

        var postData = {
            op: 'save_draft',
            order_id: built.data.order_id,
            apply_id: built.data.apply_id,
            shipping_date: built.data.shipping_date,
            receiver_name: built.data.receiver_name,
            receiver_phone: built.data.receiver_phone,
            receiver_address: built.data.receiver_address,
            shipping_method: built.data.shipping_method,
            shipping_remark: built.data.shipping_remark,
            items: JSON.stringify(built.data.items)
        };
        if (built.data.order_amount_confirmed === 1) {
            postData.order_amount_confirmed = 1;
            postData.confirmed_order_amount = built.data.confirmed_order_amount;
        }

        savingDraft = true;
        var $btn = $('#btn-save-draft');
        $btn.addClass('layui-btn-disabled').prop('disabled', true).text('保存中...');
        var loadIndex = layer.load(2);
        $.post(apiUrl, postData, function (res) {
            layer.close(loadIndex);
            savingDraft = false;
            if (!formLockedAfterSubmit) {
                $btn.removeClass('layui-btn-disabled').prop('disabled', false).text('保存草稿');
            }

            if (!res || res.code !== 0) {
                var msg = (res && res.msg) ? res.msg : '草稿保存失败，请稍后重试。';
                if (msg.indexOf('原订单金额已发生变化') >= 0 && currentOrderMoney != null) {
                    layer.confirm(escapeHtml(msg) + '<br><br>确认已重新核对当前订单金额 '
                        + escapeHtml(currentOrderMoney) + ' 元后继续保存？', {
                        icon: 0,
                        title: '原订单金额变化确认'
                    }, function (idx) {
                        layer.close(idx);
                        orderAmountConfirmed = true;
                        confirmedOrderAmount = String(currentOrderMoney);
                        doSaveDraft({
                            order_amount_confirmed: 1,
                            confirmed_order_amount: confirmedOrderAmount
                        });
                    });
                    return;
                }
                layer.msg(msg, { icon: 2 });
                return;
            }

            var data = res.data || {};
            if (data.apply_id) {
                $('#apply_id').val(data.apply_id);
            }
            if (data.apply_no) {
                $('#apply_no_display').text(data.apply_no);
            }
            if (data.edit_url) {
                draftEditUrl = data.edit_url;
                $('#btn-reopen-draft').show();
            } else if (data.apply_id) {
                draftEditUrl = apiUrl + (apiUrl.indexOf('?') >= 0 ? '&' : '?') + 'id=' + encodeURIComponent(data.apply_id);
                $('#btn-reopen-draft').show();
            }

            orderAmountChanged = false;
            orderAmountConfirmed = false;
            confirmedOrderAmount = null;
            draftOrderAmount = currentOrderMoney;

            layer.msg((res.msg || '草稿保存成功') + (data.apply_no ? ('：' + data.apply_no) : ''), { icon: 1 }, function () {
                if (data.apply_id) {
                    // 删除旧明细后重新插入，必须重新打开以获取最新行 ID
                    window.location.href = draftEditUrl || (apiUrl + (apiUrl.indexOf('?') >= 0 ? '&' : '?') + 'id=' + encodeURIComponent(data.apply_id));
                }
            });
        }, 'json').fail(function () {
            layer.close(loadIndex);
            savingDraft = false;
            if (!formLockedAfterSubmit) {
                $btn.removeClass('layui-btn-disabled').prop('disabled', false).text('保存草稿');
            }
            layer.msg('网络异常，请稍后重试', { icon: 2 });
        });
    }

    // =========================
    var SUBMIT_INTENT_FULL_KEY = 'yg_crm_ship_submit_full_v1';
    var SUBMIT_INTENT_INDEX_KEY = 'yg_crm_ship_submit_index_v1';
    var SUBMIT_CHANNEL_NAME = 'yg_crm_ship_submit_v1';

    function generateSecureSubmitToken() {
        if (!window.crypto || typeof window.crypto.getRandomValues !== 'function') {
            return { ok: false, msg: '当前浏览器不支持安全随机数，无法正式提交。请更换现代浏览器后重试。' };
        }
        var bytes = new Uint8Array(24);
        window.crypto.getRandomValues(bytes);
        var hex = '';
        for (var i = 0; i < bytes.length; i++) {
            var h = bytes[i].toString(16);
            hex += (h.length < 2 ? '0' : '') + h;
        }
        // 48 hex chars，符合 8～64 / [A-Za-z0-9_-]
        if (!/^[A-Za-z0-9_-]{8,64}$/.test(hex)) {
            return { ok: false, msg: '提交标识生成失败，请刷新页面后重试。' };
        }
        return { ok: true, token: hex };
    }

    function getShanghaiTodayYmd() {
        try {
            var parts = new Intl.DateTimeFormat('en-CA', {
                timeZone: 'Asia/Shanghai',
                year: 'numeric',
                month: '2-digit',
                day: '2-digit'
            }).formatToParts(new Date());
            var y = '', m = '', d = '';
            for (var i = 0; i < parts.length; i++) {
                if (parts[i].type === 'year') y = parts[i].value;
                if (parts[i].type === 'month') m = parts[i].value;
                if (parts[i].type === 'day') d = parts[i].value;
            }
            if (y && m && d) {
                return y + '-' + m + '-' + d;
            }
        } catch (e) { /* fallback below */ }
        var now = new Date();
        var utc = now.getTime() + now.getTimezoneOffset() * 60000;
        var sh = new Date(utc + 8 * 3600000);
        var mm = sh.getMonth() + 1;
        var dd = sh.getDate();
        return sh.getFullYear() + '-' + (mm < 10 ? '0' : '') + mm + '-' + (dd < 10 ? '0' : '') + dd;
    }
