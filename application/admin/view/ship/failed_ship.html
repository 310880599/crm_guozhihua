    .failed-ship-delete-dialog .failed-ship-delete-tip {

    <a class="layui-btn layui-btn-xs failed-ship-detail-btn" lay-event="viewDetail">查看详情</a>
    {{# if (d.can_edit_rejected == 1) { }}
    <a class="layui-btn layui-btn-xs failed-ship-edit-btn" lay-event="editRejected">编辑</a>
    {{# } else { }}
    <span class="failed-ship-edit-disabled" title="尚未完成历史审批数据保护，暂时不能编辑">不可编辑</span>
    {{# } }}
    {{# if (d.can_delete == 1) { }}
    <a class="layui-btn layui-btn-xs failed-ship-delete-btn" lay-event="deleteRejected">删除</a>
    {{# } }}
</script>

{include file="common/foot"/}
<script>
layui.use(['table', 'form', 'layer', 'laydate'], function () {
    var table = layui.table;
    var layer = layui.layer;
    var form = layui.form;
    var laydate = layui.laydate;
    var $ = layui.$;

    var listUrl = '{:url("Ship/failedShip")}';
    var detailUrlBase = '{:url("Ship/applyDetail")}';
    var editRejectedUrlBase = '{:url("Ship/editRejectedShip")}';
    var deleteRejectedUrl = {$deleteRejectedUrlJson|default='""'|raw};
    var deleteRejectedCsrfToken = {$deleteRejectedCsrfTokenJson|default='""'|raw};
    var isDesignatedFailedAdmin = parseInt('{$isDesignatedFailedAdmin|default="0"}', 10) === 1;
    var deletingRejected = false;

    function escapeHtml(str) {
        return String(str == null ? '' : str)
            .replace(/&/g, '&amp;')
            .replace(/</g, '&lt;')
            .replace(/>/g, '&gt;')
            .replace(/"/g, '&quot;')
            .replace(/'/g, '&#39;');
    }

    function formatAmount(v) {
        var n = parseFloat(v);
        if (isNaN(n)) {
            return '0.00';
        }
        return n.toFixed(2);
    }

    function buildWhere() {
        return {
            op: 'list',
            keyword: $.trim($('#keyword').val() || ''),
            status: $('#status').val() || '',
            start_time: $.trim($('#start_time').val() || ''),
            end_time: $.trim($('#end_time').val() || '')
        };
    }

    function notifyParentFailedShipBadgeRefresh() {
        var win = window;
        var depth = 0;
        while (win && depth < 8) {
            try {
                if (typeof win.crmRefreshFailedShipBadge === 'function') {
                    win.crmRefreshFailedShipBadge();
                    return;
                }
            } catch (ignoreLevel) {}
            try {
                if (!win.parent || win.parent === win) {
                    break;
                }
                win = win.parent;
            } catch (crossOrigin) {
                break;
            }
            depth++;
        }
    }

    function openDetail(id) {
        id = parseInt(id, 10);
        if (!id || id <= 0) {
            layer.msg('申请ID无效', { icon: 2 });
            return;
        }
        var url = detailUrlBase + (detailUrlBase.indexOf('?') >= 0 ? '&' : '?') + 'id=' + id;
        layer.open({
            type: 2,
            title: '发货申请详情',
            area: ['92%', '92%'],
            maxmin: true,
            shadeClose: true,
            content: url
        });
    }

    function openEditRejected(id) {
        id = parseInt(id, 10);
        if (!id || id <= 0) {
            layer.msg('申请ID无效', { icon: 2 });
            return;
        }
        var url = editRejectedUrlBase + (editRejectedUrlBase.indexOf('?') >= 0 ? '&' : '?') + 'id=' + id;
        layer.open({
            type: 2,
            title: '编辑审核失败发货申请',
            area: ['96%', '96%'],
            maxmin: true,
            shadeClose: false,
            content: url
        });
    }

    function openDeleteRejected(row) {
        if (!isDesignatedFailedAdmin || parseInt(row.can_delete, 10) !== 1) {
            layer.msg('无权删除该发货申请', { icon: 2 });
            return;
        }
        if (deletingRejected) {
            return;
        }
        var applyId = parseInt(row.id, 10);
        var applyNo = String(row.apply_no || '');
        if (!applyId || applyId <= 0 || String(applyId) !== String(row.id)) {
            layer.msg('申请ID无效', { icon: 2 });
            return;
        }
        if (!deleteRejectedUrl || !deleteRejectedCsrfToken) {
            layer.msg('删除权限未就绪，请刷新页面后重试', { icon: 2 });
            return;
        }

        var dialogHtml = ''
            + '<div class="failed-ship-delete-dialog" style="padding:16px 18px 8px;">'
            + '<p class="failed-ship-delete-tip">即将软删除发货申请 <span class="failed-ship-delete-apply-no">'
            + escapeHtml(applyNo) + '</span>。</p>'
            + '<p class="failed-ship-delete-tip">软删除后列表不再显示；历史审批记录、Round 快照与明细仍保留，不会物理删除。</p>'
            + '<p class="failed-ship-delete-tip">请填写删除原因（必填，1～200 字）：</p>'
            + '<textarea id="failed-ship-delete-reason" class="layui-textarea" maxlength="200" placeholder="请输入删除原因"></textarea>'
            + '</div>';

        layer.open({
            type: 1,
            title: '确认软删除',
            area: ['480px', '360px'],
            shadeClose: false,
            content: dialogHtml,
            btn: ['确认删除', '取消'],
            yes: function (index) {
                if (deletingRejected) {
                    return false;
                }
                var reason = $.trim($('#failed-ship-delete-reason').val() || '');
                if (!reason) {
                    layer.msg('请填写删除原因', { icon: 0 });
                    return false;
                }
                if (reason.length > 200) {
                    layer.msg('删除原因不能超过200个字符', { icon: 0 });
                    return false;
                }
                layer.confirm(
                    '确认软删除发货申请「' + escapeHtml(applyNo) + '」吗？此操作不可在本页撤销。',
                    { icon: 3, title: '二次确认' },
                    function (confirmIndex) {
                        layer.close(confirmIndex);
                        doDeleteRejected(applyId, reason, index);
                    }
                );
                return false;
            }
        });
    }

    function doDeleteRejected(applyId, reason, dialogIndex) {
        if (deletingRejected) {
            return;
        }
        deletingRejected = true;
        var loadingIndex = layer.load(1, { shade: [0.15, '#000'] });
        $.ajax({
            url: deleteRejectedUrl,
            type: 'POST',
            dataType: 'json',
            data: {
                apply_id: applyId,
                delete_reason: reason,
                csrf_token: deleteRejectedCsrfToken
            }
        }).done(function (res) {
            var code = res && typeof res.code !== 'undefined' ? parseInt(res.code, 10) : -1;
            var data = res && res.data && typeof res.data === 'object' ? res.data : {};
            var uncertain = data.result_uncertain === true || data.result_uncertain === 1 || data.result_uncertain === '1';
            if (code === 0) {
                layer.close(dialogIndex);
                layer.msg((res && res.msg) ? res.msg : '删除成功', { icon: 1 });
                reloadTable(false);
                try {
                    notifyParentFailedShipBadgeRefresh();
                } catch (ignoreBadge) {}
                return;
            }
            if (uncertain) {
                layer.msg((res && res.msg) ? res.msg : '删除结果待确认，请刷新后核验', { icon: 0, time: 4000 });
                return;
            }
            layer.msg((res && res.msg) ? res.msg : '删除失败', { icon: 2 });
        }).fail(function () {
            layer.msg('删除请求失败，请稍后重试', { icon: 2 });
        }).always(function () {
            deletingRejected = false;
            layer.close(loadingIndex);
        });
    }

    laydate.render({
        elem: '#start_time',
        type: 'date',
        format: 'yyyy-MM-dd',
        done: function () {
            // 筛选变更由查询按钮统一触发，避免输入过程连发
        }
    });
    laydate.render({
        elem: '#end_time',
        type: 'date',
        format: 'yyyy-MM-dd'
    });

    var cols = [
        {
            field: 'apply_no',
            title: '发货申请编号',
            minWidth: 160,
            templet: function (d) {
                var no = escapeHtml(d.apply_no || '');
                return '<a class="failed-ship-apply-no-link" lay-event="viewDetail" title="查看详情">' + no + '</a>';
            }
        },
        {
            field: 'order_no',
            title: '原订单编号',
            minWidth: 150,
            templet: function (d) { return escapeHtml(d.order_no || ''); }
        },
        {
            field: 'customer_name',
            title: '客户名称',
            minWidth: 130,
            templet: function (d) { return escapeHtml(d.customer_name || ''); }
        }
    ];
    if (isDesignatedFailedAdmin) {
        cols.push({
            field: 'applicant_name',
            title: '申请人',
            minWidth: 110,
            templet: function (d) { return escapeHtml(d.applicant_name || ''); }
        });
    }
    cols = cols.concat([
        {
            field: 'order_amount',
            title: '原订单总金额',
            width: 120,
            templet: function (d) { return escapeHtml(formatAmount(d.order_amount)); }
        },
        {
            field: 'product_summary',
            title: '发货产品摘要',
            minWidth: 200,
            templet: function (d) {
                var text = d.product_summary || '';
                return '<span class="failed-ship-product-summary" title="' + escapeHtml(text) + '">'
                    + escapeHtml(text) + '</span>';
            }
        },
        {
            field: 'shipping_date',
            title: '预计发货日期',
            width: 120,
            templet: function (d) { return escapeHtml(d.shipping_date || ''); }
        },
        {
            field: 'submit_time',
            title: '正式提交时间',
            width: 170,
            templet: function (d) { return escapeHtml(d.submit_time || ''); }
        },
        {
            field: 'status_text',
            title: '审核失败状态',
            width: 140,
            templet: function (d) { return escapeHtml(d.status_text || ''); }
        },
        {
            title: '操作',
            width: isDesignatedFailedAdmin ? 260 : 180,
            fixed: 'right',
            toolbar: '#failed-ship-action-tpl'
        }
    ]);

    var tableIns = table.render({
        elem: '#failed-ship-table',
        id: 'failed-ship-table',
        url: listUrl,
        method: 'post',
        page: true,
        limit: 10,
        limits: [10, 20, 50],
        text: { none: '暂无审核失败的发货申请' },
        where: buildWhere(),
        cols: [cols],
        done: function (res) {
            if (res && typeof res.code !== 'undefined' && parseInt(res.code, 10) !== 0) {
                layer.msg(res.msg || '加载失败', { icon: 2 });
            }
        }
    });

    function reloadTable(resetPage) {
        var opts = { where: buildWhere() };
        if (resetPage) {
            opts.page = { curr: 1 };
        }
        tableIns.reload(opts);
    }

    /** 供编辑弹层保存成功后刷新列表 */
    window.refreshFailedShipList = function () {
        reloadTable(false);
    };

    $('#btn-search').on('click', function () {
        reloadTable(true);
    });

    $('#btn-reset').on('click', function () {
        $('#keyword').val('');
        $('#status').val('');
        $('#start_time').val('');
        $('#end_time').val('');
        form.render('select');
        reloadTable(true);
    });

    $('#keyword').on('keydown', function (e) {
        if (e.keyCode === 13) {
            e.preventDefault();
            reloadTable(true);
        }
    });

    table.on('tool(failed-ship-table)', function (obj) {
        var id = parseInt(obj.data && obj.data.id, 10);
        if (!id || id <= 0 || String(id) !== String(obj.data.id)) {
            layer.msg('申请ID无效', { icon: 2 });
            return;
        }
        if (obj.event === 'viewDetail') {
            openDetail(id);
        } else if (obj.event === 'editRejected') {
            if (parseInt(obj.data.can_edit_rejected, 10) !== 1) {
                layer.msg('该申请尚未完成历史审批数据保护，暂时不能编辑', { icon: 0 });
                return;
            }
            openEditRejected(id);
        } else if (obj.event === 'deleteRejected') {
            openDeleteRejected(obj.data || {});
        }
    });
});
</script>
