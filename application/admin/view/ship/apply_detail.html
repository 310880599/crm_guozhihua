        padding: 12px 16px 24px;

    .apply-progress-stage:last-child {
        border-left-color: transparent;
        padding-bottom: 0;
    }
    .apply-progress-stage::before {
        content: '';
        position: absolute;
        left: -6px;
        top: 4px;
        width: 10px;
        height: 10px;
        border-radius: 50%;
        background: #c2c2c2;
    }
    .apply-progress-stage.is-done::before {
        background: #5FB878;
    }
    .apply-progress-stage.is-active::before {

    .apply-progress-stage.is-rejected::before {
        background: #FF5722;

    .apply-detail-toolbar {

</style>

{include file="common/foot"/}
<script>
layui.use(['layer'], function () {
    var layer = layui.layer;
    var $ = layui.$;

    // 服务端已 json_encode（含 JSON_HEX_*），直接作为 JS 对象表达式嵌入，避免二次字符串转义
    var detailPayload = null;
    try {
        detailPayload = {$detailJson|default='null'|raw};
        if (!detailPayload || typeof detailPayload !== 'object') {
            detailPayload = null;
        }
    } catch (e) {
        detailPayload = null;
    }

    function escapeHtml(str) {
        return String(str == null ? '' : str)
            .replace(/&/g, '&amp;')
            .replace(/</g, '&lt;')
            .replace(/>/g, '&gt;')
            .replace(/"/g, '&quot;')
            .replace(/'/g, '&#39;');
    }

    function formatAmount(v) {
        if (v === null || typeof v === 'undefined' || v === '') {
            return '-';
        }
        var n = parseFloat(v);
        if (isNaN(n)) {
            return '-';
        }
        return n.toFixed(2);
    }

    function kv(label, value) {
        return '<p class="apply-detail-kv"><span class="k">' + escapeHtml(label)
            + '</span><span class="v">' + escapeHtml(value == null || value === '' ? '-' : value) + '</span></p>';
    }

    function renderFail(msg) {
        $('#apply-detail-root').html(
            '<div class="layui-card"><div class="layui-card-body apply-detail-empty">'
            + escapeHtml(msg || '无权查看或记录不存在')
            + '</div></div>'
        );
    }

    if (!detailPayload || !detailPayload.apply) {
        renderFail('无权查看或记录不存在');
        return;
    }

    // 本轮只读：即使载荷被篡改也不展示审批按钮
    var canApprove = false;
    if (canApprove) {
        // reserved for M4-2B
    }

    var apply = detailPayload.apply || {};
    var items = detailPayload.items || [];
    var progress = detailPayload.approval_progress || {};
    var logs = detailPayload.approval_logs || [];

    var basicHtml = ''
        + '<div class="layui-col-md4">' + kv('发货申请编号', apply.apply_no) + '</div>'
        + '<div class="layui-col-md4">' + kv('原订单编号', apply.order_no) + '</div>'
        + '<div class="layui-col-md4">' + kv('客户名称', apply.customer_name) + '</div>'
        + '<div class="layui-col-md4">' + kv('申请人', apply.applicant_name) + '</div>'
        + '<div class="layui-col-md4">' + kv('正式提交时间', apply.submit_time) + '</div>'
        + '<div class="layui-col-md4">' + kv('原订单总金额', formatAmount(apply.order_amount)) + '</div>'
        + '<div class="layui-col-md4">' + kv('审批阈值快照', formatAmount(apply.approval_threshold)) + '</div>'
        + '<div class="layui-col-md4">' + kv('审批路线', apply.approval_route_text) + '</div>'
        + '<div class="layui-col-md4">' + kv('当前状态', apply.status_text) + '</div>'
        + '<div class="layui-col-md4">' + kv('审批轮次', apply.approval_round) + '</div>';
    $('#sec-basic').html(basicHtml);

    var shippingHtml = ''
        + '<div class="layui-col-md4">' + kv('预计发货日期', apply.shipping_date) + '</div>'
        + '<div class="layui-col-md4">' + kv('发货方式', apply.shipping_method) + '</div>'
        + '<div class="layui-col-md4">' + kv('收货人', apply.receiver_name) + '</div>'
        + '<div class="layui-col-md4">' + kv('联系电话', apply.receiver_phone) + '</div>'
        + '<div class="layui-col-md8">' + kv('收货地址', apply.receiver_address) + '</div>'
        + '<div class="layui-col-md12">' + kv('发货备注', apply.shipping_remark) + '</div>';
    $('#sec-shipping').html(shippingHtml);

    var itemHtml = '';
    if (!items.length) {
        itemHtml = '<tr><td colspan="10" class="apply-detail-empty">暂无产品明细</td></tr>';
    } else {
        for (var i = 0; i < items.length; i++) {
            var row = items[i] || {};
            var purchaseUnit = parseInt(row.purchase_price_masked, 10) === 1
                ? '<span class="apply-detail-mask">无权限</span>'
                : escapeHtml(formatAmount(row.apply_purchase_unit_price));
            var purchaseAmt = parseInt(row.purchase_price_masked, 10) === 1
                ? '<span class="apply-detail-mask">无权限</span>'
                : escapeHtml(formatAmount(row.apply_purchase_amount));
            itemHtml += '<tr>'
                + '<td>' + escapeHtml(row.source_product_name || '-') + '</td>'
                + '<td>' + escapeHtml(row.apply_product_name || '-') + '</td>'
                + '<td>' + escapeHtml(row.apply_spec_model || '-') + '</td>'
                + '<td>' + escapeHtml(String(row.apply_qty == null ? '-' : row.apply_qty)) + '</td>'
                + '<td>' + escapeHtml(formatAmount(row.apply_unit_price)) + '</td>'
                + '<td>' + escapeHtml(formatAmount(row.apply_sales_amount)) + '</td>'
                + '<td>' + purchaseUnit + '</td>'
                + '<td>' + purchaseAmt + '</td>'
                + '<td>' + escapeHtml(row.factory_name || '-') + '</td>'
                + '<td>' + escapeHtml(row.remark || '-') + '</td>'
                + '</tr>';
        }
    }
    $('#sec-items').html(itemHtml);

    var stages = (progress && progress.stages) ? progress.stages : [];
    var progressHtml = '';
    if (!stages.length) {
        progressHtml = '<div class="apply-detail-empty">暂无审批进度</div>';
    } else {
        for (var s = 0; s < stages.length; s++) {
            var stage = stages[s] || {};
            var cls = 'apply-progress-stage';
            if (stage.rejected) {
                cls += ' is-rejected';
            } else if (stage.active) {
                cls += ' is-active';
            } else if (stage.done) {
                cls += ' is-done';
            }
            progressHtml += '<div class="' + cls + '">';
            progressHtml += '<div class="apply-progress-title">' + escapeHtml(stage.title || '') + '</div>';
            var nodes = stage.nodes || [];
            if (!nodes.length && stage.key === 'finished') {
                progressHtml += '<div class="apply-progress-node">'
                    + (stage.done ? '已完成' : '尚未完成')
                    + '</div>';
            } else if (!nodes.length) {
                progressHtml += '<div class="apply-progress-node">暂无节点</div>';
            } else {
                for (var n = 0; n < nodes.length; n++) {
                    var node = nodes[n] || {};
                    var name = node.approver_name || '';
                    var st = node.status_text || '';
                    var time = node.time || node.activate_time || node.audit_time || '';
                    var line = escapeHtml(name || '—') + '：' + escapeHtml(st || '-');
                    if (time) {
                        line += '（' + escapeHtml(time) + '）';
                    }
                    progressHtml += '<div class="apply-progress-node">' + line + '</div>';
                }
            }
            progressHtml += '</div>';
        }
    }
    $('#sec-progress').html(progressHtml);

    var logHtml = '';
    if (!logs.length) {
        logHtml = '<tr><td colspan="5" class="apply-detail-empty">暂无历史操作</td></tr>';
    } else {
        for (var l = 0; l < logs.length; l++) {
            var log = logs[l] || {};
            var statusChange = '';
            if (log.before_status_text || log.after_status_text) {
                statusChange = escapeHtml(log.before_status_text || '-')
                    + ' → '
                    + escapeHtml(log.after_status_text || '-');
            } else {
                statusChange = '-';
            }
            logHtml += '<tr>'
                + '<td>' + escapeHtml(log.create_time || '-') + '</td>'
                + '<td>' + escapeHtml(log.action_text || log.action || '-') + '</td>'
                + '<td>' + escapeHtml(log.operator_name || '-') + '</td>'
                + '<td>' + statusChange + '</td>'
                + '<td>' + escapeHtml(log.opinion_text || '-') + '</td>'
                + '</tr>';
        }
    }
    $('#sec-logs').html(logHtml);

    $('#btn-close-detail').on('click', function () {
        try {
            if (parent && parent.layer && typeof parent.layer.getFrameIndex === 'function') {
                var index = parent.layer.getFrameIndex(window.name);
                parent.layer.close(index);
                return;
            }
        } catch (e2) {}
        window.history.back();
    });
});
</script>
</body>
</html>
