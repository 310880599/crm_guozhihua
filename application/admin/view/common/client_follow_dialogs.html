<!-- 公共客户跟进弹窗：我的客户 / 我的订单 共用，避免长期维护两套 -->
<style>
    .follow-container {
        padding: 20px;
        background: #fff;
    }
    .follow-header {
        border-bottom: 2px solid #4285f4;
        padding-bottom: 15px;
        margin-bottom: 20px;
    }
    .follow-header h3 {
        margin: 0;
        color: #333;
        font-size: 18px;
        font-weight: 600;
    }
    .follow-content {
        display: flex;
        gap: 30px;
    }
    .follow-info {
        flex: 1;
        padding-right: 20px;
        border-right: 1px solid #e0e0e0;
    }
    .follow-history {
        flex: 1;
        padding-left: 20px;
    }
    .follow-action-panel {
        margin-top: 16px;
        padding: 12px;
        background: #fafafa;
        border: 1px solid #e8e8e8;
        border-radius: 6px;
    }
    .follow-action-panel h4 { margin-bottom: 12px; }
    .follow-action-panel .layui-form-label {
        width: 100px;
        padding-left: 0;
    }
    .follow-action-panel .layui-input-block { margin-left: 100px; }
    .follow-action-btns {
        text-align: right;
        margin-bottom: 0 !important;
    }
    .follow-history h4 {
        margin: 0 0 15px 0;
        color: #333;
        font-size: 16px;
        font-weight: 600;
        padding-bottom: 10px;
        border-bottom: 1px solid #e0e0e0;
    }
    /* 跟进历史时间轴/头像：与「我的客户」正常展示对齐，作用域限定写跟进弹窗 */
    #follow-dialog .timeline-item {
        margin-bottom: 20px;
        padding: 12px;
        background: #f8f9fa;
        border-radius: 6px;
        border-left: 3px solid #4285f4;
    }
    #follow-dialog .timeline-title {
        color: #4285f4;
        font-size: 13px;
        font-weight: 600;
        margin-bottom: 8px;
    }
    #follow-dialog .timeline-content {
        margin-left: 0;
        color: #333;
        font-size: 14px;
        line-height: 1.6;
    }
    #follow-dialog .timeline-content strong {
        color: #4285f4;
        margin-right: 5px;
    }
    #follow-dialog img.avatar {
        width: 30px;
        height: 30px;
        max-width: 30px;
        max-height: 30px;
        border-radius: 50%;
        margin-right: 5px;
        vertical-align: middle;
        object-fit: cover;
    }
    #follow-dialog #follow-history-list {
        max-height: 240px;
        overflow-y: auto;
        padding-right: 10px;
    }
    .info-item {
        margin-bottom: 15px;
        padding: 8px 0;
        border-bottom: 1px solid #f5f5f5;
    }
    .info-item:last-child { border-bottom: none; }
    .info-label {
        font-weight: 600;
        display: inline-block;
        width: 100px;
        color: #666;
        font-size: 14px;
    }
    .info-item span:not(.info-label) {
        color: #333;
        font-size: 14px;
    }
    #follow-rank-row { white-space: nowrap; }
    #follow-rank-display,
    #follow-rank-editor { vertical-align: middle; }
    .follow-rank-select {
        height: 26px;
        line-height: 26px;
        padding: 0 8px;
        font-size: 13px;
        border: 1px solid #d2d6de;
        border-radius: 4px;
        outline: none;
        vertical-align: middle;
        max-width: 160px;
        background: #fff;
        color: #555;
    }
    #follow-rank-row .follow-rank-btn {
        display: inline-block;
        height: 26px;
        line-height: 24px;
        padding: 0 12px;
        font-size: 12px;
        border-radius: 4px;
        border: 1px solid transparent;
        cursor: pointer;
        vertical-align: middle;
        box-sizing: border-box;
    }
    #follow-rank-row .follow-rank-btn-edit {
        color: #4285f4;
        background: #f0f5ff;
        border-color: #bad3fb;
        margin-left: 6px;
    }
    #follow-rank-row .follow-rank-btn-save {
        color: #fff;
        background: #4285f4;
        border-color: #4285f4;
        margin-left: 6px;
    }
    #follow-rank-row .follow-rank-btn-cancel {
        color: #7b8a9e;
        background: #f5f7fa;
        border-color: #d2d6de;
        margin-left: 4px;
    }
    .follow-mask {
        position: fixed;
        left: 0;
        top: 0;
        width: 100vw;
        height: 100vh;
        background: rgba(0, 0, 0, .3);
        display: none;
    }
    .follow-role-badge {
        display: inline-block;
        margin-left: 4px;
        color: #666;
        font-size: 12px;
    }
    #all-follow-dialog .layui-table-view .layui-table-body tr { height: auto !important; }
    #all-follow-dialog .layui-table-view .layui-table-body td { height: auto !important; }
    #all-follow-dialog .layui-table-view td[data-field="reply_msg"] .layui-table-cell {
        height: auto !important;
        line-height: 22px !important;
        white-space: normal !important;
        overflow: visible !important;
        text-overflow: clip !important;
        padding-top: 8px;
        padding-bottom: 8px;
    }
    #all-follow-dialog .layui-table-view .af-reply-msg-cell {
        white-space: pre-wrap;
        word-break: break-word;
        line-height: 22px;
    }
    @media (max-width: 992px) {
        .follow-content { flex-direction: column; }
        .follow-info {
            padding-right: 0;
            border-right: none;
            border-bottom: 1px solid #e0e0e0;
            padding-bottom: 16px;
            margin-bottom: 16px;
        }
        .follow-history { padding-left: 0; }
    }
</style>

<div id="follow-dialog" style="display: none;">
    <div class="follow-container">
        <div class="follow-header">
            <h3>客户跟进</h3>
        </div>
        <div class="follow-content">
            <div class="follow-info">
                <div class="info-item">
                    <span class="info-label">客户ID:</span>
                    <span id="follow-client-id"></span>
                </div>
                <div class="info-item">
                    <span class="info-label">客户名称:</span>
                    <span id="follow-client-name"></span>
                </div>
                <div class="info-item">
                    <span class="info-label">联系人:</span>
                    <span id="follow-contact"></span>
                </div>
                <div class="info-item">
                    <span class="info-label">主电话:</span>
                    <span id="follow-main-phone"></span>
                </div>
                <div class="info-item">
                    <span class="info-label">辅助电话:</span>
                    <span id="follow-aux-phone"></span>
                </div>
                <div class="info-item">
                    <span class="info-label">地区:</span>
                    <span id="follow-area"></span>
                </div>
                <div class="info-item">
                    <span class="info-label">所属渠道:</span>
                    <span id="follow-source"></span>
                </div>
                <div class="info-item">
                    <span class="info-label">运营端口:</span>
                    <span id="follow-source-port"></span>
                </div>
                <div class="info-item" id="follow-rank-row">
                    <span class="info-label">客户级别:</span>
                    <span id="follow-rank-display">
                        <span id="follow-rank"></span>
                        <button type="button" class="follow-rank-btn follow-rank-btn-edit" id="follow-rank-edit-btn">修改</button>
                    </span>
                    <span id="follow-rank-editor" style="display:none;">
                        <select id="follow-rank-select" class="follow-rank-select"></select>
                        <button type="button" class="follow-rank-btn follow-rank-btn-save" id="follow-rank-save-btn">保存</button>
                        <button type="button" class="follow-rank-btn follow-rank-btn-cancel" id="follow-rank-cancel-btn">取消</button>
                    </span>
                </div>
                <div class="info-item">
                    <span class="info-label">负责人:</span>
                    <span id="follow-user"></span>
                </div>
                <div class="info-item">
                    <span class="info-label">协同人:</span>
                    <span id="follow-joint-person"></span>
                </div>
                <div class="info-item">
                    <span class="info-label">当前操作人:</span>
                    <span id="follow-current-operator"></span>
                </div>
                <div class="info-item">
                    <span class="info-label">当前身份:</span>
                    <span id="follow-current-role"></span>
                </div>
                <div class="info-item">
                    <span class="info-label">创建时间:</span>
                    <span id="follow-create-time"></span>
                </div>
                <div class="info-item">
                    <span class="info-label">最后跟进:</span>
                    <span id="follow-last-time"></span>
                </div>
                <div class="info-item">
                    <span class="info-label">下次跟进时间:</span>
                    <span id="follow-next-time"></span>
                </div>
                <div class="info-item">
                    <span class="info-label">跟进记录:</span>
                    <textarea id="follow-last-record" class="layui-textarea" readonly style="height: 80px;"></textarea>
                </div>
            </div>
            <div class="follow-history">
                <h4>跟进历史</h4>
                <div id="follow-history-list" style="max-height: 240px; overflow-y: auto;"></div>
                <div class="follow-action-panel" id="follow-write-panel">
                    <h4>新增跟进</h4>
                    <div class="layui-form">
                        <div class="layui-form-item layui-form-text">
                            <textarea name="reply_msg" id="reply_msg" required lay-verify="required"
                                placeholder="请输入跟进内容" class="layui-textarea" style="height: 96px;"></textarea>
                        </div>
                        <div class="layui-form-item">
                            <label class="layui-form-label">下次跟进</label>
                            <div class="layui-input-block">
                                <input type="text" name="next_up_time" id="next_up_time" placeholder="请选择下次跟进时间（选填）"
                                    autocomplete="off" class="layui-input">
                            </div>
                        </div>
                        <div class="layui-form-item follow-action-btns">
                            <input type="hidden" name="leads_id" id="leads_id" value="">
                            <button type="button" class="layui-btn layui-btn-normal" id="submit-comment">保存跟进</button>
                        </div>
                    </div>
                </div>
                <div id="follow-write-denied" style="display:none;margin-top:16px;color:#999;">当前身份无权写入跟进</div>
            </div>
        </div>
    </div>
</div>
<div id="follow-mask" class="follow-mask" style="display:none;"></div>

<div id="all-follow-dialog" style="display: none;">
    <div class="follow-container">
        <div class="follow-header">
            <h3>全部跟进记录</h3>
        </div>
        <div style="padding: 15px 0; border-bottom: 1px solid #e0e0e0; margin-bottom: 20px;">
            <div style="display: flex; flex-wrap: wrap; gap: 20px;">
                <div class="info-item" style="margin-bottom: 0;">
                    <span class="info-label">客户名称:</span>
                    <span id="af-kh-name"></span>
                </div>
                <div class="info-item" style="margin-bottom: 0;">
                    <span class="info-label">产品名称:</span>
                    <span id="af-product-name"></span>
                </div>
                <div class="info-item" style="margin-bottom: 0;">
                    <span class="info-label">主电话:</span>
                    <span id="af-main-phone"></span>
                </div>
                <div class="info-item" style="margin-bottom: 0;">
                    <span class="info-label">辅助电话:</span>
                    <span id="af-aux-phone"></span>
                </div>
            </div>
        </div>
        <div class="layui-form" style="margin-bottom: 20px;">
            <div class="layui-form-item" style="margin-bottom: 15px;">
                <div class="layui-inline">
                    <label class="layui-form-label" style="width: 120px;">关键字搜索:</label>
                    <div class="layui-input-inline" style="width: 200px;">
                        <input type="text" id="af-keyword" name="keyword" placeholder="输入跟进内容关键字" class="layui-input">
                    </div>
                </div>
                <div class="layui-inline">
                    <label class="layui-form-label" style="width: 100px;">时间范围:</label>
                    <div class="layui-input-inline" style="width: 300px;">
                        <input type="text" id="af-date-range" name="date_range" placeholder="选择时间范围" class="layui-input">
                    </div>
                </div>
                <div class="layui-inline">
                    <button type="button" class="layui-btn" id="af-search-btn"><i class="layui-icon">&#xe615;</i>查询</button>
                    <button type="button" class="layui-btn layui-btn-primary" id="af-reset-btn"><i class="layui-icon">&#xe669;</i>重置</button>
                </div>
            </div>
        </div>
        <table id="af-table" lay-filter="af-table"></table>
    </div>
</div>
