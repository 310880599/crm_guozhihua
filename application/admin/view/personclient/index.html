{include file="common/head"/}
<link rel="stylesheet" href="/static/admin/css/select.css" media="all">
<style>
    /* 个人客户列表页面样式优化 - 撑满页面 */
    body {
        background: #f5f7fa !important;
    }
    
    .personclient-list-container {
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        padding: 20px;
        background: #f5f7fa;
        overflow: auto;
    }
    
    .filtrate-warp {
        margin-bottom: 10px;
    }

    .filtrate-warp .title {
        padding: 5px 12px 7px 12px;
        font-size: 14px;
        font-weight: normal;
        text-align: left;
        cursor: pointer;
        width: 90px;
        background-color: transparent !important;
        color: #333 !important;
    }

    .filtrate-warp .title:hover {
        color: #4285f4;
    }

    .filtrate-warp .flag {
        padding: 6px 12px 6px 12px;
        cursor: pointer;
    }

    .filtrate-warp .flag:hover {
        color: #4285f4;
    }

    .filtrate-warp .layui-badge:hover {
        color: white !important;
    }
    
    /* 查询区域样式优化 */
    .wukong-search-card {
        background: #fff;
        border-radius: 8px;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
        padding: 20px;
        margin-bottom: 20px;
        display: block !important;
        visibility: visible !important;
    }
    
    .wukong-search-card .layui-form {
        display: flex !important;
    }
    .layui-table-view .layui-table td .layui-btn-xs{
        color: #fff !important;
    }
    .wukong-search-card .layui-form-item {
        margin-bottom: 15px;
        display: block !important;
    }
    .layui-table-view .layui-table td, .layui-table-view .layui-table th{
        background-color: #fff !important;
    }
    .wukong-search-card .layui-form-label {
        width: 100px;
        color: #333;
        font-weight: 500;
        background-color: transparent !important;
        display: inline-block !important;
    }
    
    .wukong-search-card .layui-inline {
        display: inline-block !important;
        margin-right: 15px;
        margin-bottom: 15px;
        vertical-align: top;
    }
    
    .wukong-search-card .layui-input-inline {
        display: inline-block !important;
    }
    
    .wukong-search-card .layui-input,
    .wukong-search-card .layui-select {
        border-radius: 6px;
        border: 1px solid #e0e0e0;
        transition: all 0.3s ease;
    }
    
    .wukong-search-card .layui-input:focus,
    .wukong-search-card .layui-select:focus {
        border-color: #4285f4;
        box-shadow: 0 0 0 3px rgba(66, 133, 244, 0.1);
    }
    
    .wukong-search-card .layui-btn {
        border-radius: 6px;
        background: #4285f4;
        border-color: #4285f4;
        transition: all 0.3s ease;
    }
    
    .wukong-search-card .layui-btn:hover {
        background: #3367d6;
        border-color: #3367d6;
        transform: translateY(-1px);
        box-shadow: 0 4px 12px rgba(66, 133, 244, 0.3);
    }

    /* 高级查询折叠（对齐待审核页结构，配色沿用本页蓝色） */
    /* 不用 overflow:hidden，避免高级查询内 layui 下拉 dl / 自定义下拉被裁切；圆角由 header/body 各自样式承担 */
    #advancedSearchFieldset.wukong-search-card {
        margin: 0 0 20px 0;
        padding: 0;
        border: none;
        min-width: 0;
        border-radius: 8px;
        overflow: visible;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
        position: relative;
        /* 必须高于下方 .layui-table-view / 固定列 / 工具栏，否则下拉仅提高 dl 仍处在低层叠上下文中，会被表格层整体盖住 */
        z-index: 1200;
    }
    #advancedSearchFieldset.wukong-search-card > .layui-form {
        display: block !important;
    }
    .advanced-search-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 10px 15px;
        background: #4285f4;
        border-radius: 8px 8px 0 0;
        color: #fff;
    }
    .advanced-search-title {
        font-size: 16px;
        font-weight: 600;
    }
    #toggleAdvancedSearch {
        border-color: rgba(255, 255, 255, 0.35);
        color: #fff;
        background: rgba(255, 255, 255, 0.12);
    }
    #toggleAdvancedSearch:hover {
        background: rgba(255, 255, 255, 0.22);
        border-color: rgba(255, 255, 255, 0.45);
        color: #fff;
    }
    .advanced-search-collapsed .advanced-search-header {
        border-radius: 8px;
    }
    .advanced-search-collapsed #advancedSearchBody {
        display: none !important;
    }
    #advancedSearchBody {
        padding: 20px;
        padding-top: 16px;
        overflow: visible;
        position: relative;
        z-index: 1;
    }
    /* 高级查询内部先建立低层基线，避免同级表单项互相压盖 */
    #advancedSearchFieldset .layui-form-item,
    #advancedSearchFieldset .layui-inline,
    #advancedSearchFieldset .layui-input-inline {
        overflow: visible;
        position: relative;
        z-index: 1;
    }
    #advancedSearchFieldset .layui-form-select {
        position: relative;
        z-index: 1;
    }
    /* 高级查询内：谁打开谁置顶（含 layui select 与 EditableSelect，二者共用 .select-open-top） */
    #advancedSearchFieldset .select-open-top {
        z-index: 4000 !important;
    }
    #advancedSearchFieldset .select-open-top .layui-form-select,
    #advancedSearchFieldset .layui-form-selected {
        z-index: 4000 !important;
    }
    /* EditableSelect 面板须高于同区其它 .layui-inline / 日期输入（跟进时间等保持默认 z-index:1） */
    #advancedSearchFieldset .select-open-top .layui-form-select dl,
    #advancedSearchFieldset .layui-form-select dl,
    #advancedSearchFieldset .layui-form-select.custom-select dl {
        z-index: 4001 !important;
    }
    #advancedSearchBody .layui-form-item:last-child {
        margin-bottom: 0;
    }
    
    /* 表格容器样式 */
    .personclient-table-wrapper {
        background: #fff;
        border-radius: 8px;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
        overflow: visible;
        padding: 0;
        height: calc(100vh - 280px);
        display: flex;
        flex-direction: column;
    }
    
     /* 主列表表格：层叠低于高级查询 fieldset（弹窗内表格勿用此条，故只作用在列表容器下） */
     .personclient-list-container > .layui-table-view {
         z-index: 0;
     }
     .layui-table-view {
         flex: 1;
         display: flex;
         flex-direction: column;
         height: 100%;
         border: none !important;
         overflow: visible !important;
         position: relative;
     }
     
     .layui-table-box {
         overflow-x: auto !important;
         overflow-y: auto !important;
         width: 100%;
         flex: 1;
     }
     
     .layui-table-main {
         overflow-x: auto !important;
         overflow-y: auto !important;
         width: 100%;
     }
     
     .layui-table-body {
         overflow-x: auto !important;
         overflow-y: auto !important;
         width: 100%;
     }
     
     /* ✅表格宽度严格按列宽总和，不强制撑满 */
     .layui-table {
        width: max-content !important;
        min-width: 0 !important;
        table-layout: fixed !important;
    }
     
    /* ✅ 默认：所有列单行显示 + 省略号（利于拖拽列宽） */
    .layui-table-view .layui-table-cell{
        white-space: nowrap !important;
        overflow: hidden !important;
        text-overflow: ellipsis !important;
    }
     

    /* ✅ 仅「产品名称」：最多两行，多的省略 */
    .layui-table-view td[data-field="product_name"] .layui-table-cell{
        white-space: normal !important;
        overflow: hidden !important;
        text-overflow: ellipsis !important;
        display: -webkit-box;
        -webkit-line-clamp: 2;      /* 最多 2 行 */
        -webkit-box-orient: vertical;
        word-break: break-word !important;
    }

    /* ✅「最新跟进记录」：单行省略（tooltip 展示全文，见 .pc-last-record-cell） */
    .layui-table-view td[data-field="last_up_records"] .layui-table-cell{
        white-space: nowrap !important;
        overflow: hidden !important;
        text-overflow: ellipsis !important;
    }
    .layui-table-view td[data-field="last_up_records"] .pc-last-record-wrap{
        display: block;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        max-width: 100%;
    }
    .layui-table-view td[data-field="last_up_records"] .pc-last-record-cell{
        display: block;
        width: 100%;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        box-sizing: border-box;
    }

    /* 最新跟进记录：悬浮完整内容（由 JS 定位到 body） */
    #pc-last-record-tooltip.pc-last-record-tooltip{
        position: fixed;
        z-index: 2000000000;
        max-width: 380px;
        min-width: 120px;
        padding: 8px 12px;
        background: #fff;
        border: 1px solid #d9d9d9;
        border-radius: 6px;
        box-shadow: 0 4px 16px rgba(0, 0, 0, 0.12);
        font-size: 13px;
        line-height: 1.55;
        color: #333;
        word-break: break-word;
        white-space: pre-wrap;
        pointer-events: none;
        box-sizing: border-box;
    }

     /* 表头单元格 */
     .layui-table th {
         white-space: nowrap !important;
     }
    
    /* 固定列仅需在表头/表格内部叠在滚动区域之上，勿用过高 z-index（否则会盖过高级查询整块区域） */
    .personclient-list-container .layui-table-fixed-l,
    .personclient-list-container .layui-table-fixed-r {
        z-index: 99 !important;
    }
    
    /* LayUI 表格工具栏样式优化 */
    .layui-table-tool {
        background: #fff !important;
        padding: 16px 20px !important;
        border-bottom: 1px solid #e0e0e0 !important;
        margin: 0 !important;
        flex-shrink: 0;
        display: flex;
        align-items: center;
        flex-wrap: wrap;
        gap: 8px;
    }
    /* 主列表工具栏层叠压低，避免盖过高级查询下拉（外观仍由上条全局样式控制） */
    .personclient-list-container .layui-table-tool {
        position: relative;
        z-index: 1;
    }
    
    .layui-table-tool .layui-btn {
        border-radius: 6px !important;
        transition: all 0.3s ease !important;
        vertical-align: middle !important;
        display: inline-flex !important;
        align-items: center !important;
        gap: 6px;
    }
    
    .layui-table-tool .layui-btn-primary {
        background: #4285f4 !important;
        border-color: #4285f4 !important;
        color: #fff !important;
    }
    
    .layui-table-tool .layui-btn-primary:hover {
        background: #3367d6 !important;
        border-color: #3367d6 !important;
        transform: translateY(-1px);
        box-shadow: 0 4px 12px rgba(66, 133, 244, 0.3);
    }
    
    .layui-table-tool .layui-btn-normal {
        background: #34a853 !important;
        border-color: #34a853 !important;
        color: #fff !important;
    }
    
    .layui-table-tool .layui-btn-normal:hover {
        background: #2d8f47 !important;
        border-color: #2d8f47 !important;
    }
    
    .layui-table-tool .layui-btn-danger {
        background: #ea4335 !important;
        border-color: #ea4335 !important;
        color: #fff !important;
    }
    
    .layui-table-tool .layui-btn-danger:hover {
        background: #d33b2c !important;
        border-color: #d33b2c !important;
    }
    
    /* 操作按钮样式优化 */
    .layui-table-view .layui-table td {
        vertical-align: middle !important;
    }
    
    .layui-table-view .layui-table td .layui-btn-xs {
        border-radius: 4px !important;
        padding: 4px 12px !important;
        font-size: 12px !important;
        transition: all 0.3s ease !important;
        margin: 0 4px !important;
        vertical-align: middle !important;
        display: inline-flex !important;
        align-items: center !important;
        gap: 4px;
        line-height: 1.5 !important;
    }
    
    .layui-table-view .layui-table td .layui-btn-xs:hover {
        transform: translateY(-1px);
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.15);
    }
    
    /* 操作列图标按钮紧凑样式（只影响操作列的图标按钮） */
    .layui-table-view .layui-table td .action-icon-btn {
        padding: 4px 6px !important;
        min-width: 30px !important;
        justify-content: center !important;
        gap: 0 !important;
    }
    
    /* 操作列单元格保持一行显示（针对固定列） */
    .layui-table-fixed-r .layui-table td {
        white-space: nowrap !important;
    }
    
    .layui-table-view .layui-table td .layui-btn-primary {
        background: #4285f4 !important;
        border-color: #4285f4 !important;
        color: #fff !important;
    }
    
    .layui-table-view .layui-table td .layui-btn-primary:hover {
        background: #3367d6 !important;
        border-color: #3367d6 !important;
    }
    
    /* 客户名称链接样式 */
    .layui-table-view .layui-table td a {
        color: #4285f4 !important;
        text-decoration: none;
        transition: all 0.3s ease;
    }
    
    .layui-table-view .layui-table td a:hover {
        color: #3367d6 !important;
        text-decoration: underline;
    }
    
    /* 分页栏样式 */
    .layui-table-page {
        flex-shrink: 0;
        background: #fff !important;
        border-top: 1px solid #e0e0e0 !important;
        padding: 12px 20px !important;
    }
    
    /* 固定列白色背景 */
    .layui-table-fixed-l {
        background: #fff !important;
    }
    
    .layui-table-fixed-l .layui-table {
        background: #fff !important;
    }
    
    .layui-table-fixed-l .layui-table thead {
        background: #fff !important;
    }
    
    .layui-table-fixed-l .layui-table tbody {
        background: #fff !important;
    }
    
    .layui-table-fixed-l .layui-table tbody tr {
        background: #fff !important;
    }
    
    .layui-table-fixed-l .layui-table tbody tr:hover {
        background: #f8f9fa !important;
    }
    
    .layui-table-fixed-l .layui-table-cell {
        background: #fff !important;
    }
    
    .layui-table-fixed-r {
        background: #fff !important;
    }
    
    .layui-table-fixed-r .layui-table {
        background: #fff !important;
    }
    
    .layui-table-fixed-r .layui-table thead {
        background: #fff !important;
    }
    
    .layui-table-fixed-r .layui-table tbody {
        background: #fff !important;
    }
    
    .layui-table-fixed-r .layui-table tbody tr {
        background: #fff !important;
    }
    
    .layui-table-fixed-r .layui-table tbody tr:hover {
        background: #f8f9fa !important;
    }
    
    .layui-table-fixed-r .layui-table-cell {
        background: #fff !important;
    }
    
    /* ✅ 确保固定列行高可动态调整（不写死高度） */
    .layui-table-fixed-l tbody tr,
    .layui-table-fixed-r tbody tr {
        height: auto !important;
        min-height: auto !important;
    }
    
    .layui-table-fixed-l tbody td,
    .layui-table-fixed-r tbody td {
        height: auto !important;
        vertical-align: middle !important;
    }
    
    /* ===============================
       【新增】A) CSS：让 fixed 操作列单元格"可被拉伸并居中"
       =============================== */
    /* 让 fixed 右侧每个 td 内部 .layui-table-cell 高度可以 100% 撑满，并用 flex 垂直居中 */
    .layui-table-fixed-r td .layui-table-cell {
        display: flex !important;
        align-items: center !important;
        justify-content: center !important;
        flex-wrap: wrap !important; /* 允许按钮换行（如果空间不足） */
        gap: 4px !important; /* 按钮间距 */
        padding: 4px 8px !important; /* 保留适当 padding，确保按钮不贴边 */
        box-sizing: border-box !important;
    }
    
    /* 左侧固定列也做同样处理（如果存在） */
    .layui-table-fixed-l td .layui-table-cell {
        display: flex !important;
        align-items: center !important;
        justify-content: center !important;
        flex-wrap: wrap !important;
        gap: 4px !important;
        padding: 4px 8px !important;
        box-sizing: border-box !important;
    }
    
    /* 操作列按钮容器：不允许把高度"撑坏"或"缩小"，确保按钮容器不改变行高，只负责居中 */
    .layui-table-fixed-r td .layui-table-cell .layui-btn-xs,
    .layui-table-fixed-l td .layui-table-cell .layui-btn-xs {
        height: 26px !important; /* 保持按钮紧凑高度，不改变行高 */
        line-height: 26px !important;
        margin: 0 !important; /* 使用 gap 替代 margin，避免间距问题 */
        flex-shrink: 0 !important; /* 不允许按钮被压缩 */
    }
    
    /* 确保 fixed 列的 td 高度也能被拉伸 */
    .layui-table-fixed-r tbody td,
    .layui-table-fixed-l tbody td {
        height: 100% !important;
        box-sizing: border-box !important;
    }
    
    /* 跟进弹窗样式 */
    .follow-container {
        padding: 20px;
        background: #fff;
    }
    
    .follow-header {
        border-bottom: 2px solid #4285f4;
        padding-bottom: 15px;
        margin-bottom: 20px;
    }
    
    .follow-header h3 {
        margin: 0;
        color: #333;
        font-size: 18px;
        font-weight: 600;
    }
    
    .follow-content {
        display: flex;
        gap: 30px;
    }
    
    .follow-info {
        flex: 1;
        padding-right: 20px;
        border-right: 1px solid #e0e0e0;
    }
    
    .follow-history {
        flex: 1;
        padding-left: 20px;
    }
    
    .follow-history h4 {
        margin: 0 0 15px 0;
        color: #333;
        font-size: 16px;
        font-weight: 600;
        padding-bottom: 10px;
        border-bottom: 1px solid #e0e0e0;
    }
    
    .info-item {
        margin-bottom: 15px;
        padding: 8px 0;
        border-bottom: 1px solid #f5f5f5;
    }
    
    .info-item:last-child {
        border-bottom: none;
    }
    
    .info-label {
        font-weight: 600;
        display: inline-block;
        width: 100px;
        color: #666;
        font-size: 14px;
    }
    
    .info-item span:not(.info-label) {
        color: #333;
        font-size: 14px;
    }

    #follow-rank-row { white-space: nowrap; }
    #follow-rank-display,
    #follow-rank-editor { vertical-align: middle; }
    .follow-rank-select {
        height: 24px;
        line-height: 24px;
        padding: 0 6px;
        font-size: 13px;
        border: 1px solid #d2d2d2;
        border-radius: 2px;
        outline: none;
        vertical-align: middle;
        max-width: 160px;
    }

    .timeline-item {
        margin-bottom: 20px;
        padding: 12px;
        background: #f8f9fa;
        border-radius: 6px;
        border-left: 3px solid #4285f4;
    }
    
    .timeline-title {
        color: #4285f4;
        font-size: 13px;
        font-weight: 600;
        margin-bottom: 8px;
    }
    
    .timeline-content {
        margin-left: 0;
        color: #333;
        font-size: 14px;
        line-height: 1.6;
    }
    
    .timeline-content strong {
        color: #4285f4;
        margin-right: 5px;
    }
    
    #follow-history-list {
        max-height: 300px;
        overflow-y: auto;
        padding-right: 10px;
    }
    
    #follow-history-list::-webkit-scrollbar {
        width: 6px;
    }
    
    #follow-history-list::-webkit-scrollbar-track {
        background: #f1f1f1;
        border-radius: 3px;
    }
    
    #follow-history-list::-webkit-scrollbar-thumb {
        background: #4285f4;
        border-radius: 3px;
    }
    
    #follow-history-list::-webkit-scrollbar-thumb:hover {
        background: #3367d6;
    }
    
    #follow-last-record {
        border: 1px solid #e0e0e0;
        border-radius: 6px;
        padding: 10px;
        font-size: 14px;
        line-height: 1.6;
        resize: none;
    }
    
    #reply_msg {
        border: 1px solid #e0e0e0;
        border-radius: 6px;
        padding: 10px;
        font-size: 14px;
        line-height: 1.6;
        transition: all 0.3s ease;
    }
    
    #reply_msg:focus {
        border-color: #4285f4;
        box-shadow: 0 0 0 3px rgba(66, 133, 244, 0.1);
        outline: none;
    }
    
    #submit-comment {
        background: #4285f4;
        border-color: #4285f4;
        color: #fff;
        border-radius: 6px;
        padding: 8px 24px;
        font-size: 14px;
        transition: all 0.3s ease;
    }
    
    #submit-comment:hover {
        background: #3367d6;
        border-color: #3367d6;
        transform: translateY(-1px);
        box-shadow: 0 4px 12px rgba(66, 133, 244, 0.3);
    }
    
    .layui-form-item {
        margin-bottom: 15px;
    }
    
    .layui-form-item:last-child {
        margin-bottom: 0;
        text-align: right;
    }
    
    @media (max-width: 992px) {
        .follow-content {
            flex-direction: column;
            gap: 20px;
        }
        
        .follow-info {

    <button type="button" class="layui-btn layui-btn-primary layui-btn-radius layui-btn-sm" id="chengjiaoAll" lay-event="chengjiaoAll"><i class="layui-icon">&#xe63c;</i>客户成交</button>
    {if session('aid') eq 1}
    <button type="button" class="layui-btn layui-btn-danger layui-btn-radius layui-btn-sm" id="delAlls" lay-event="delAlls"><i class="layui-icon">&#xe640;</i>选中删除</button>
    {/if}
</script>

{include file="common/foot"/}
<script>
layui.use(['table','form','upload','util','laydate','layer'], function () {
    var table = layui.table, form = layui.form, laydate = layui.laydate, $ = layui.jquery, upload = layui.upload, layer = layui.layer;
    var followIndex = null; // 记住"写跟进弹窗"的 layer index
    var isMobile = $(window).width() < 768;
    var currentUsername = "{$Think.session.username}" || "default";
    var tableId = "table-list";
    // 生成 page_key：使用 location.pathname（不要 replace 下划线，否则和数据库存的不一致）
    var pageKey = location.pathname;
    // localStorage 的 key（用于兜底）
    var columnWidthKey = "crm_colwidth_" + currentUsername + "_" + pageKey.replace(/[^\w]/g, '_') + "_" + tableId;

    // ================= 高级查询：折叠/展开 + localStorage 记忆 =================
    var PERSONCLIENT_ADVANCED_SEARCH_KEY = 'personclient_mycustomer_advanced_search_expanded';

    function readAdvancedSearchState() {
        try {
            return localStorage.getItem(PERSONCLIENT_ADVANCED_SEARCH_KEY) === '1';
        } catch (e) {
            return false;
        }
    }

    function saveAdvancedSearchState(expanded) {
        try {
            localStorage.setItem(PERSONCLIENT_ADVANCED_SEARCH_KEY, expanded ? '1' : '0');
        } catch (e) {}
    }

    /**
     * @param {boolean} expanded
     * @param {{ animate?: boolean }} [options]
     */
    function applyAdvancedSearchState(expanded, options) {
        options = options || {};
        var animate = !!options.animate;
        var $fs = $('#advancedSearchFieldset');
        var $body = $('#advancedSearchBody');
        var $btn = $('#toggleAdvancedSearch');
        if (!$fs.length || !$body.length || !$btn.length) return;

        if (expanded) {
            if (animate) {
                $fs.removeClass('advanced-search-collapsed');
                $body.stop(true, true).slideDown(200);
            } else {
                $fs.removeClass('advanced-search-collapsed');
                $body.stop(true, true).css('display', '').show();
            }
            $btn.text('收起');
        } else {
            $btn.text('展开');
            if (animate) {
                $body.stop(true, true).slideUp(200, function () {
                    $fs.addClass('advanced-search-collapsed');
                });
            } else {
                $body.stop(true, true).hide();
                $fs.addClass('advanced-search-collapsed');
            }
        }
    }

    function initAdvancedSearchToggle() {
        applyAdvancedSearchState(readAdvancedSearchState(), { animate: false });
        $('#toggleAdvancedSearch')
            .off('click.pCAdvSearch')
            .on('click.pCAdvSearch', function (e) {
                e.preventDefault();
                var expanded = !$('#advancedSearchFieldset').hasClass('advanced-search-collapsed');
                var next = !expanded;
                saveAdvancedSearchState(next);
                applyAdvancedSearchState(next, { animate: true });
            });
    }

    function bindPersonclientAdvancedSelectLayerFix() {
        var $scope = $('#advancedSearchFieldset');
        if (!$scope.length) return;

        function clearSelectOpenTop() {
            $scope.find('.select-open-top').removeClass('select-open-top');
        }

        /** layui 原生：layui-form-selected；EditableSelect：无该类，仅 dl 为 display:block */
        function isSelectDropdownOpen($selectWrap) {
            if (!$selectWrap || !$selectWrap.length) return false;
            if ($selectWrap.hasClass('layui-form-selected')) return true;
            var $dl = $selectWrap.children('dl').first();
            if (!$dl.length) return false;
            try {
                return $dl.css('display') === 'block';
            } catch (e) {
                return false;
            }
        }

        function raiseCurrentSelect($selectWrap) {
            clearSelectOpenTop();
            $selectWrap.closest('.layui-input-inline, .layui-input-4').addClass('select-open-top');
            $selectWrap.closest('.layui-inline').addClass('select-open-top');
            $selectWrap.closest('.layui-form-item').addClass('select-open-top');
        }

        function syncSelectOpenTopFromDom() {
            setTimeout(function () {
                var hasLayui = $scope.find('.layui-form-select.layui-form-selected').length > 0;
                var hasEditableOrDlOpen = false;
                $scope.find('.layui-form-select').each(function () {
                    var $w = $(this);
                    if (isSelectDropdownOpen($w)) {
                        hasEditableOrDlOpen = true;
                        return false;
                    }
                });
                if (!hasLayui && !hasEditableOrDlOpen) {
                    clearSelectOpenTop();
                }
            }, 0);
        }

        $scope.off('click.personclientSelectTop', '.layui-form-select .layui-select-title')
            .on('click.personclientSelectTop', '.layui-form-select .layui-select-title', function () {
                var $selectWrap = $(this).closest('.layui-form-select');
                setTimeout(function () {
                    if (isSelectDropdownOpen($selectWrap)) {
                        raiseCurrentSelect($selectWrap);
                    } else {
                        clearSelectOpenTop();
                    }
                }, 0);
            });

        /* EditableSelect：输入过滤时也会展开 dl，需同步置顶（不依赖 layui-form-selected） */
        $scope.off('input.personclientSelectTop', '.layui-form-select .layui-select-title input.layui-input')
            .on('input.personclientSelectTop', '.layui-form-select .layui-select-title input.layui-input', function () {
                var $selectWrap = $(this).closest('.layui-form-select');
                setTimeout(function () {
                    if (isSelectDropdownOpen($selectWrap)) {
                        raiseCurrentSelect($selectWrap);
                    }
                }, 0);
            });

        $(document).off('click.personclientSelectTopDoc').on('click.personclientSelectTopDoc', function () {
            syncSelectOpenTopFromDom();
        });

        $(document).off('keydown.personclientSelectTopEsc').on('keydown.personclientSelectTopEsc', function (e) {
            if (e.key === 'Escape') {
                syncSelectOpenTopFromDom();
            }
        });
    }

    initAdvancedSearchToggle();
    bindPersonclientAdvancedSelectLayerFix();
    window.initPersonclientAdvancedSearchToggle = initAdvancedSearchToggle;

    /** 最新跟进记录列：HTML 转义（防 XSS） */
    function personclientEscapeHtml(s) {
        if (s == null) return '';
        return String(s)
            .replace(/&/g, '&amp;')
            .replace(/</g, '&lt;')
            .replace(/>/g, '&gt;')
            .replace(/"/g, '&quot;');
    }
    /** data-* 属性值转义 */
    function personclientEncodeAttr(s) {
        if (s == null) return '';
        return String(s)
            .replace(/&/g, '&amp;')
            .replace(/"/g, '&quot;')
            .replace(/</g, '&lt;')
            .replace(/>/g, '&gt;');
    }

    /** 最新跟进记录：悬浮层（仅截断时显示，挂到 body，避免被表格遮挡） */
    function ensureLastRecordTooltipEl() {
        var $t = $('#pc-last-record-tooltip');
        if (!$t.length) {
            $('body').append('<div id="pc-last-record-tooltip" class="pc-last-record-tooltip" style="display:none;"></div>');
            $t = $('#pc-last-record-tooltip');
        }
        return $t;
    }
    function hideLastRecordTooltip() {
        $('#pc-last-record-tooltip').hide().empty().css({ visibility: '' });
    }
    function positionLastRecordTooltip($tip, anchorEl) {
        var rect = anchorEl.getBoundingClientRect();
        var margin = 8;
        var maxW = 380;
        $tip.css({
            maxWidth: maxW + 'px',
            display: 'block',
            visibility: 'hidden',
            left: 0,
            top: 0
        });
        var tw = $tip.outerWidth();
        var th = $tip.outerHeight();
        var vw = window.innerWidth || document.documentElement.clientWidth;
        var vh = window.innerHeight || document.documentElement.clientHeight;
        var left = rect.left;
        if (left + tw > vw - margin) {
            left = Math.max(margin, vw - tw - margin);
        }
        var top = rect.bottom + margin;
        if (top + th > vh - margin && rect.top > th + margin) {
            top = rect.top - th - margin;
        }
        if (top + th > vh - margin) {
            top = Math.max(margin, vh - th - margin);
        }
        if (left < margin) {
            left = margin;
        }
        $tip.css({ left: left + 'px', top: top + 'px', visibility: 'visible' });
    }
    function bindLastRecordTooltip() {
        var $view = $('#' + tableId).next('.layui-table-view');
        $(document).off('mouseenter.pcLastRecTip mouseleave.pcLastRecTip', '.layui-table-view td[data-field="last_up_records"] .pc-last-record-cell');
        $(document).on('mouseenter.pcLastRecTip', '.layui-table-view td[data-field="last_up_records"] .pc-last-record-cell', function () {
            var el = this;
            var full = $(el).attr('data-pc-full');
            if (full == null || full === '') {
                return;
            }
            if (el.scrollWidth <= el.clientWidth + 1) {
                return;
            }
            var $tip = ensureLastRecordTooltipEl();
            $tip.text(full);
            positionLastRecordTooltip($tip, el);
        });
        $(document).on('mouseleave.pcLastRecTip', '.layui-table-view td[data-field="last_up_records"] .pc-last-record-cell', function () {
            hideLastRecordTooltip();
        });
        if ($view.length) {
            $view.find('.layui-table-main, .layui-table-fixed-r .layui-table-body, .layui-table-fixed-l .layui-table-body')
                .off('scroll.pcLastRecTip')
                .on('scroll.pcLastRecTip', function () {
                    hideLastRecordTooltip();
                });
        }
    }
    $(window).off('resize.pcLastRecTip').on('resize.pcLastRecTip', function () {
        hideLastRecordTooltip();
    });

     // 列定义
     var cols = [[
         { type: 'checkbox',  width: 50 },
         { field: 'id', title: 'ID',  width: 120, fixed: true, hide: true },
         { field: 'kh_name', title: '客户名称',  width: 120, sort: true, templet: function(res){
             return "<a href='{:url('dialogue')}?id=" + res.id + "'>" + (res.kh_name || '') + "</a>";
         }},
         { field: 'product_name', title: '产品名称',  width: 120 }, 
         { field: 'main_phone', title: '主电话', width: 120 },
         { field: 'last_up_records', title: '最新跟进记录', width: 120, templet: function (d) {
             var raw = d.last_up_records;
             if (raw == null) {
                 return '';
             }
             var text = String(raw);
             if (text.trim() === '') {
                 return '';
             }
             var safe = personclientEscapeHtml(text);
             var attr = personclientEncodeAttr(text);
             return '<div class="pc-last-record-wrap"><span class="pc-last-record-cell" data-pc-full="' + attr + '">' + safe + '</span></div>';
         }},
         { field: 'last_up_time', title: '最新跟进时间', width: 120 },
         { field: 'aux_phone', title: '辅助电话', width: 120 },
         { field: 'inquiry_name', title: '所属渠道', width: 120},     // 原"询盘来源"列
         { field: 'port_name', title: '运营端口', width: 120 },       // 原"来源端口"列
         { field: 'joint_person_names', title: '协同人', width: 120 },
         { field: 'issuccess', title: '成交状态', width: 120, templet: function(res){ return res.issuccess == 1 ? '已成交' : '未成交'; } },
         { field: 'pr_user', title: '负责人', width: 120 },
         { field: 'kh_rank_name', title: '客户级别', width: 120, templet: function(res){ return res.kh_rank_name || ''; } },
         { field: 'at_time', title: '创建时间', width: 120, sort: true },
         { field: 'ut_time', title: '更新于', width: 120, sort: true },
         { field: 'original_creation_time', title: '原来创建时间', width: 120, hide: false,
             templet: function(d){
             var v = d.original_creation_time;
             if (!v) return '';
             // 如果是纯数字（秒级时间戳）
             if (/^\d+$/.test(v)) return layui.util.toDateString(v * 1000);
             // 已经是 'YYYY-MM-DD HH:mm:ss' 字符串，直接显示
             return v;
             }
         },
         { field: 'original_modification_time', title: '原来修改时间', width: 120, hide: false,
             templet: function(d){
             var v = d.original_modification_time;
             if (!v) return '';
             // 如果是纯数字（秒级时间戳）
             if (/^\d+$/.test(v)) return layui.util.toDateString(v * 1000);
             // 已经是 'YYYY-MM-DD HH:mm:ss' 字符串，直接显示
             return v;
             }
         },
         { fixed: 'right', title: '操作', width: isMobile ? 130 : 220, align: 'center', toolbar: '#action' }
     ]];

    /**
     * ✅ 批量收窄默认列宽：不会覆盖数据库/本地记忆（记忆在 restoreColWidth 里优先级更高）
     */
    function shrinkDefaultWidths(colArr){
        var map = {
            kh_name: 120,
            product_name: 160,
            last_up_records: 200,
            main_phone: 120,
            aux_phone: 120,
            last_up_time: 140,
            at_time: 150,
            ut_time: 150,
            inquiry_name: 120,
            port_name: 120,
            joint_person_names: 120,
            pr_user: 100,
            issuccess: 90,
            original_creation_time: 150,
            original_modification_time: 150
        };

        colArr.forEach(function(c){
            if(!c) return;
            if(!c.field) return; // checkbox/操作列等
            // 统一更窄的默认值
            c.width = map[c.field] || 90;
        });
    }

    /**
     * 恢复列宽（在渲染前执行）
     * 优先级：数据库 > localStorage > 默认值
     * 如果数据库无数据/请求失败，仍然走 localStorage 兜底，确保表格能正常渲染
     * 
     * 验收方式：
     * 1. 登录 A 用户，拖拽"产品名称"列宽到 300，刷新页面：列宽仍为 300
     * 2. 换 B 用户登录：列宽不受影响（仍是默认或 B 自己的）
     * 3. 数据表 crm_table_colwidth 能看到对应记录更新 updated_at
     */
    function restoreColWidth(colArr) {
        var dbWidths = {}; // 存储从数据库读取的列宽
        
        // 先从数据库读取列宽
        $.ajax({
            url: "{:url('Client/getColWidths')}",
            type: 'GET',
            data: {
                page_key: pageKey,
                table_id: tableId
            },
            async: false, // 同步请求，确保在表格渲染前完成
            success: function(res) {
                if (res.code === 0 && res.data && Object.keys(res.data).length > 0) {
                    dbWidths = res.data;
                    console.log('✅ 从数据库恢复列宽:', dbWidths);
                } else if (res.code === 401) {
                    console.warn('⚠️ 未登录，无法从数据库恢复列宽');
                }
            },
            error: function(xhr, status, error) {
                // 如果请求失败，静默处理，继续使用 localStorage 兜底
                console.warn('⚠️ 从数据库读取列宽失败，使用 localStorage 兜底:', error);
            }
        });

        // 应用列宽：优先使用数据库，其次使用 localStorage
        try {
            var saved = JSON.parse(localStorage.getItem(columnWidthKey) || '{}');
            
            // ✅ 同步写回 localStorage：如果数据库有值，以数据库为准覆盖 localStorage（确保两边一致）
            var finalWidths = saved; // 默认使用 localStorage
            if (Object.keys(dbWidths).length > 0) {
                finalWidths = Object.assign({}, saved, dbWidths); // 以数据库为准覆盖
                localStorage.setItem(columnWidthKey, JSON.stringify(finalWidths));
                console.log('✅ 列宽已同步到 localStorage:', finalWidths);
            }
            
            colArr.forEach(function (c) {
                // 只处理有 field 的列，checkbox/操作列也可以按需处理
                if (c.field) {
                    // 优先使用数据库中的列宽，否则使用 localStorage 中的列宽（作为兜底）
                    if (finalWidths[c.field] && finalWidths[c.field] > 0) {
                        c.width = finalWidths[c.field];
                    }
                }
            });
        } catch (e) {
            console.warn('恢复列宽失败:', e);
        }
    }
    
    // 先设置更窄的默认宽度
    shrinkDefaultWidths(cols[0]);
    
    // 再用数据库/本地记忆覆盖默认宽度（保持优先级：数据库 > localStorage > 默认）
    restoreColWidth(cols[0]);

    // 列表初始化（注意：根据你的实际路由改这里）
    var tableIns = table.render({
        elem: '#' + tableId,
        id: tableId,
        url: "{:url('perClilist')}",   // 若你的路由为 perCliList，请改成 perCliList
        method: 'post',
        toolbar: '#topBtn',
        defaultToolbar: ['filter'],
        page: true,
        cols: cols,
        limit: 8,
        page: { limits: [5,8,10, 20, 50, 100, 200, 500] },
        done: function(res, curr, count) {
            // 表格每次 reload/done 后按 localStorage 恢复高级查询展开状态（避免与其它逻辑冲突）
            applyAdvancedSearchState(readAdvancedSearchState(), { animate: false });

            // 绑定列宽拖拽保存监听（每次 done 都会执行，先 off 再 on 避免重复绑定）
            bindResizeSave();

            bindLastRecordTooltip();
            
            // ===============================
            // 【修改】同步固定列行高 - 升级版（解决 Layui fixed 列晚生成问题）
            // ===============================
            // ✅ 更稳：同步 3 次（下一帧 + 60ms + 180ms），每次都跑最新算法
            requestAnimationFrame(function () {
                syncFixedRowHeights();
                // 再补一次：防止 fixed 列刚生成/图片刚加载导致高度再次变化
                setTimeout(syncFixedRowHeights, 0);
            });

            setTimeout(function () {
                syncFixedRowHeights();
                setTimeout(syncFixedRowHeights, 0);
            }, 60);

            setTimeout(function () {
                syncFixedRowHeights();
                setTimeout(syncFixedRowHeights, 0);
            }, 180);

            
            // ===============================
            // 【新增】表格 body 滚动时触发行高同步（节流处理）
            // ===============================
            var $view = $('#' + tableId).next('.layui-table-view');
            if ($view.length) {
                var $tableMain = $view.find('.layui-table-main');
                if ($tableMain.length) {
                    // 先解绑旧的监听，避免重复绑定
                    $tableMain.off('scroll.syncRowHeight');
                    // 绑定新的滚动监听（节流处理）
                    var scrollSyncTimer = null;
                    $tableMain.on('scroll.syncRowHeight', function() {
                        if (scrollSyncTimer) {
                            clearTimeout(scrollSyncTimer);
                        }
                        scrollSyncTimer = setTimeout(function() {
                            syncFixedRowHeights();
                        }, 100);
                    });
                }
            }
        }
    });
    
 // 点击写跟进按钮打开弹窗
    $(document).on('click', '.follow-btn, .client-link', function() {
        var clientId = $(this).data('id');
        openFollowDialog(clientId);
    });

    // ✅新增：全部跟进按钮点击事件
    var allFollowIndex = null; // 记住"全部跟进弹窗"的 layer index
    var afTableIns = null; // 全部跟进表格实例
    var currentLeadsId = null; // 当前查看的客户ID

    $(document).on('click', '.all-follow-btn', function() {
        var clientId = $(this).data('id');
        openAllFollowDialog(clientId);
    });

    // ✅新增：打开全部跟进弹窗
    function openAllFollowDialog(clientId) {
        currentLeadsId = clientId;
        var loading = layer.load(1, {shade: 0});
        
        // 获取客户信息
        $.ajax({
            url: "{:url('Client/getClientDetailAndComments')}",
            method: 'GET',
            data: {id: clientId},
            success: function(res) {
                layer.close(loading);
                if (res.code === 0) {
                    var clientData = res.data.client;
                    
                    // 填充客户基本信息
                    $('#af-kh-name').text(clientData.kh_name || '');
                    $('#af-product-name').text(clientData.product_name || '暂无');
                    $('#af-main-phone').text(clientData.main_phone || '暂无');
                    $('#af-aux-phone').text(clientData.aux_phone || '暂无');
                    
                    // 如果上一次弹窗没关干净，先强制关闭
                    if (allFollowIndex !== null) {
                        layer.close(allFollowIndex);
                        allFollowIndex = null;
                    }
                    
                    // 显示弹窗
                    allFollowIndex = layer.open({
                        type: 1,
                        title: '全部跟进 - ' + clientData.kh_name,
                        area: ['90%', '80%'],
                        content: $('#all-follow-dialog'),
                        closeBtn: 1,
                        shade: 0,
                        shadeClose: false,
                        key: true,
                        anim: -1,
                        success: function(layero, index) {
                            $('#all-follow-dialog').show();
                            
                            // 让弹窗置顶
                            layer.setTop(layero);
                            
                            // 显示自定义遮罩
                            showFollowMaskUnderLayer(layero);
                            
                            // 接管右上角 X
                            $(layero).find('.layui-layer-close').off('click.allfollow').on('click.allfollow', function(e) {
                                e.preventDefault();
                                e.stopPropagation();
                                layer.close(index);
                            });
                            
                            // ✅新增：初始化日期选择器
                            laydate.render({
                                elem: '#af-date-range',
                                type: 'date',
                                range: true,
                                trigger: 'click'
                            });
                            
                            // ✅新增：初始化表格（只在弹窗打开后渲染）
                            initAllFollowTable(clientId);
                        },
                        end: function() {
                            // 把 DOM 放回去
                            $('#all-follow-dialog').hide().appendTo('body');
                            
                            // 移除自定义遮罩
                            hideFollowMask();
                            
                            // 清理残留的 layui 遮罩
                            $('.layui-layer-shade').remove();
                            
                            // 清空筛选条件
                            $('#af-keyword').val('');
                            $('#af-date-range').val('');
                            
                            // ✅清理表格实例和DOM
                            if (afTableIns) {
                                try {
                                    var $table = $('#af-table');
                                    if ($table.length && $table.next('.layui-table-view').length) {
                                        $table.next('.layui-table-view').remove();
                                    }
                                } catch(e) {
                                    console.warn('清理表格失败:', e);
                                }
                                afTableIns = null;
                            }
                            
                            allFollowIndex = null;
                            currentLeadsId = null;
                        }

    /**
     * ✅ 同步主表与固定列（右/左）的每一行高度 —— 像素级对齐版
     * 核心改进：
     * 1) 同步前先 reset 高度（否则测量会被上一次写入的高度污染）
     * 2) 统一写入：主表/固定列 的 tr + td + .layui-table-cell 全部写同一个高度
     * 3) 取三者最大高度作为最终高度（主表、fixed-r、fixed-l）
     */
     function syncFixedRowHeights() {
            try {
                var $view = $('#' + tableId).next('.layui-table-view');
                if (!$view.length) return;

                var $mainRows = $view.find('.layui-table-main tbody tr');
                if (!$mainRows.length) return;

                var $fixRRows = $view.find('.layui-table-fixed-r tbody tr');
                var $fixLRows = $view.find('.layui-table-fixed-l tbody tr');

                // ✅ 写入 height:xxxpx!important
                function setHImportant(el, h) {
                    if (!el) return;
                    el.style.setProperty('height', h + 'px', 'important');
                }

                // ✅ 清空 height 的 important（恢复测量用）
                function resetHImportant(el) {
                    if (!el) return;
                    el.style.removeProperty('height');
                }

                // =========================
                // ① 同步前：reset（避免上一次写入污染测量）
                // =========================
                $mainRows.each(function () {
                    resetHImportant(this);
                    $(this).find('td').each(function(){ resetHImportant(this); });
                    $(this).find('td .layui-table-cell').each(function(){ resetHImportant(this); });
                });

                if ($fixRRows.length) {
                    $fixRRows.each(function () {
                        resetHImportant(this);
                        $(this).find('td').each(function(){ resetHImportant(this); });
                        $(this).find('td .layui-table-cell').each(function(){ resetHImportant(this); });
                    });
                }

                if ($fixLRows.length) {
                    $fixLRows.each(function () {
                        resetHImportant(this);
                        $(this).find('td').each(function(){ resetHImportant(this); });
                        $(this).find('td .layui-table-cell').each(function(){ resetHImportant(this); });
                    });
                }

                // =========================
                // ② 逐行计算最大高度 -> 写入 important
                // =========================
                $mainRows.each(function (index) {
                    var mainRow = this;
                    var fixRRow = ($fixRRows.length > index) ? $fixRRows.get(index) : null;
                    var fixLRow = ($fixLRows.length > index) ? $fixLRows.get(index) : null;

                    var hMain = $(mainRow).outerHeight() || 0;
                    var hR = fixRRow ? ($(fixRRow).outerHeight() || 0) : 0;
                    var hL = fixLRow ? ($(fixLRow).outerHeight() || 0) : 0;

                    var h = Math.max(hMain, hR, hL);
                    if (h <= 0) return;

                    // 主表
                    setHImportant(mainRow, h);
                    $(mainRow).find('td').each(function(){ setHImportant(this, h); });
                    $(mainRow).find('td .layui-table-cell').each(function(){ setHImportant(this, h); });

                    // 右 fixed
                    if (fixRRow) {
                        setHImportant(fixRRow, h);
                        $(fixRRow).find('td').each(function(){ setHImportant(this, h); });
                        $(fixRRow).find('td .layui-table-cell').each(function(){ setHImportant(this, h); });
                    }

                    // 左 fixed
                    if (fixLRow) {
                        setHImportant(fixLRow, h);
                        $(fixLRow).find('td').each(function(){ setHImportant(this, h); });
                        $(fixLRow).find('td .layui-table-cell').each(function(){ setHImportant(this, h); });
                    }
                });

            } catch (e) {
                console.warn('同步固定列行高失败:', e);
            }
        }

    function reloadKeepColWidth() {
        // 1) 先快照当前列宽（不丢你刚做好的列宽记忆）
        var snapshot = {};
        if (typeof getCurrentWidthsSnapshot === 'function') {
            snapshot = getCurrentWidthsSnapshot() || {};
        }

        // 2) 把快照回写到当前 tableIns 的 cols（避免 reload 后宽度被默认值覆盖）
        if (window.tableIns && tableIns.config && tableIns.config.cols && tableIns.config.cols[0]) {
            tableIns.config.cols[0].forEach(function (col) {
                if (!col || !col.field) return;
                if (snapshot && Object.prototype.hasOwnProperty.call(snapshot, col.field)) {
                    col.width = snapshot[col.field];
                }
            });
        }

        // 3) 同步兜底到 localStorage（可选，但建议保留）
        if (snapshot && Object.keys(snapshot).length && typeof columnWidthKey !== 'undefined') {
            localStorage.setItem(columnWidthKey, JSON.stringify(snapshot));
        }

        // 4) 关键：刷新列表（两种写法二选一）
        // 写法A：用实例 reload（推荐）
        if (window.tableIns) {
            tableIns.reload();
            return;
        }

        // 写法B：用 table.reload（如果你某些页面 tableIns 作用域拿不到）
        layui.table.reload(tableId);
    }

            var $view = $('#' + tableId).next('.layui-table-view');
            if (!$view.length) return;

            // ✅只取主表头（不取 fixed 的那套）
            var $headerTable = $view.find('.layui-table-header table').eq(0);
            var $ths = $headerTable.find('thead tr th');

            $ths.each(function () {
                var $th = $(this);
                var field = $th.attr('data-field');
                if (!field || field === '0') return;

                var w = parseInt($th.width(), 10); // ✅只取内容宽度（不含 padding/border）
                // ✅合理边界检查，防止极小/极大异常值
                if (w >= 30 && w <= 3000) {
                    widths[field] = w;
                }
            });

            // 没取到就直接跳过
            if (!Object.keys(widths).length) {
                console.warn('[colwidth] widths empty, skip save');
                return;
            }

            // ✅localStorage 兜底
            localStorage.setItem(columnWidthKey, JSON.stringify(widths));

            // ✅保存到数据库
            $.ajax({
                url: "{:url('Client/saveColWidths')}",
                type: 'POST',
                dataType: 'json',
                data: {
                    page_key: pageKey,
                    table_id: tableId,
                    widths: JSON.stringify(widths)
                },
                success: function(res) {
                    if (res.code === 0) {
                        console.log('✅ 列宽已保存到数据库', widths);
                    } else {
                        layer.msg(res.msg || '保存列宽失败', { icon: 2, time: 2000 });
                        console.error('❌ 列宽保存失败:', res);
                    }
                },
                error: function(xhr, status, error) {
                    layer.msg('保存列宽失败：网络错误', { icon: 2, time: 2000 });
                    console.error('❌ 列宽保存失败（网络错误）:', error);
                }
            });

        } catch (e) {
            console.warn('保存列宽失败:', e);
        }
    }


    /**
     * 获取当前列宽快照
     * 读取 #table-list 对应的 .layui-table-view
     * 找到主表头：$view.find('.layui-table-header table')
     * 遍历 thead tr th 与 colgroup col，生成 {field: width} 的对象（跳过 data-field="0"）
     * 返回对象（空对象也返回）
     */
     function getCurrentWidthsSnapshot() {
        var snapshot = {};
        try {
            var $view = $('#' + tableId).next('.layui-table-view');
            if (!$view.length) return snapshot;

            // ✅只取主表头（不取 fixed 的那套）
            var $headerTable = $view.find('.layui-table-header table').eq(0);
            var $ths = $headerTable.find('thead tr th');

            $ths.each(function () {
                var $th = $(this);
                var field = $th.attr('data-field');
                if (!field || field === '0') return; // 跳过 checkbox / 空字段

                // ✅只取内容宽度（不含 padding/border），统一口径
                var w = parseInt($th.width(), 10);
                // ✅合理边界检查，防止极小/极大异常值
                if (w >= 30 && w <= 3000) {
                    snapshot[field] = w;
                }
            });
        } catch (e) {
            console.warn('获取列宽快照失败:', e);
        }
        return snapshot;
    }


    /**
     * 绑定列宽拖拽保存监听
     * 策略：监听 document 的 mouseup/touchend，对比快照变化后保存
     */
     function bindResizeSave() {
        var $view = $('#' + tableId).next('.layui-table-view');
        if (!$view.length) return;

        // 防止 done 多次绑定
        $(document).off('mouseup.colwidth_auto touchend.colwidth_auto');

        lastSnapshot = getCurrentWidthsSnapshot();
        // console.log('[colwidth] listener bound', lastSnapshot); // ✅降低日志噪音

        $(document).on('mouseup.colwidth_auto touchend.colwidth_auto', function(e) {
            // console.log('[colwidth] mouseup fired', e && e.target); // ✅降低日志噪音

            setTimeout(function() {
                var newSnapshot = getCurrentWidthsSnapshot();
                // console.log('[colwidth] snapshot after mouseup', newSnapshot); // ✅降低日志噪音

                if (Object.keys(newSnapshot).length === 0) return;

                if (JSON.stringify(newSnapshot) !== JSON.stringify(lastSnapshot)) {
                    console.log('[colwidth] changed -> saving', newSnapshot); // ✅保留真正保存时的日志
                    saveWidths();
                    lastSnapshot = newSnapshot;
                }
            }, 120);
        });
    }

                    });

                });

            case 'chengjiaoAll':

                    $.post("{:url('Client/chengjiao')}", { ids: ids3 }, function(res){

                    });

    // 行内事件
    table.on('tool(table-list)', function (obj) {
        var layEvent = obj.event, id = obj.data.id;
        lineEvent(layEvent, id);
    });
    // 弹层内按钮事件委托
    $('body').on('click', '.layui-layer-content [lay-event]', function(){
        var layEvent = $(this).attr('lay-event');
        var id = $(this).data('id');
        lineEvent(layEvent, id);
    });
    // 行内事件处理
    function lineEvent(event, id) {
        if (event === 'del') {
            layer.confirm('确定要删除这个客户吗？', function(index){
                var loading = layer.load(1, { shade: [0.1,'#fff'] });
                $.post("{:url('del')}", { ids: [id] }, function(res){
                    layer.close(loading);
                    if (res.code === 0) {
                        layer.msg(res.msg, { time: 1000, icon: 1 });
                        tableIns.reload();
                    } else {
                        layer.msg('操作失败！', { time: 1000, icon: 2 });
                    }
                });
                layer.close(index);
            });
        } else if (event === 'edit') {
            layer_add("编辑客户", "{:url('Client/edit')}?id=" + id);
        } else if (event === 'alter') {
            layer_add("转移客户", "{:url('Client/alterPrUserPri')}?ids=" + id);
        } else if (event === 'chengjiao') {
            layer.confirm('确定这个客户已成交吗？', function(index){
                $.post("{:url('Client/chengjiao')}", { ids: id }, function(res){
                    layer.close(index);
                    if (res.code === 0) {
                        layer.msg(res.msg, { time: 1000, icon: 1 });
                        tableIns.reload();
                    } else {
                        layer.msg('操作失败！', { time: 1000, icon: 2 });
                    }
                });
            });
        }
    }

    // 搜索表单提交
    form.on('submit(LAY-app-contlist-search)', function (data) {

        // 【新增】跟进类型 + 跟进时间：联合使用轻提示（不拦截查询）
        try{
            var followType = (data.field.follow_filter || '').toString().trim();
            var followDaysRaw = (data.field.follow_days || '').toString().trim();
            var followDays = followDaysRaw === '' ? null : parseInt(followDaysRaw, 10);

            var msgShown = false;

            // 情况1：只选了类型，没填时间/<=0
            if (followType && (!followDays || followDays <= 0)) {
                layer.msg('【跟进类型】与【跟进时间】需同时选择才会生效', {icon:0});
                msgShown = true;
            }

            // 情况2：只填了时间（>0），没选类型
            if (!msgShown && (!followType) && (followDays && followDays > 0)) {
                layer.msg('【跟进类型】与【跟进时间】需同时选择才会生效', {icon:0});
                msgShown = true;
            }

            // 情况3：输入了 0/负数（且尚未提示联合规则），提示天数必须>0（仍不拦截）
            if (!msgShown && followDaysRaw !== '' && (isNaN(followDays) || followDays <= 0)) {
                layer.msg('请填写大于 0 的天数', {icon:0});
                msgShown = true;
            }
        }catch(e){
            console.warn('follow filter tip error:', e);
        }

        data.field.kh_rank = (data.field.kh_rank || '').toString().trim();
        table.reload('table-list', {
            url: "{:url('Client/personClientSearch')}",
            where: { keyword: data.field },
            page: { curr: 1 }
        });
        return false;
    });

    function fillSourcePortBySourceName(sourceName) {
        var shops = shopList[sourceName] || [];
        var $sourcePort = $('#source_port');
        $sourcePort.empty();
        if (shops.length > 0) {
            $sourcePort.append('<option value="">请选择来源端口</option>');
            $.each(shops, function (index, shop) {
                $sourcePort.append('<option value="' + shop.id + '">' + shop.name + '</option>');

            $sourcePort.append('<option value="">该来源暂无店铺数据</option>');

    // 当选择所属渠道后，请求对应的运营端口列表并填充下拉框
    form.on('select(inquiry_id)', function (data) {
        var inquiryId = data.value;
        var $portSelect = $('#port_id');
        $portSelect.empty();
        if (!inquiryId) {
            // 未选择渠道时，提示先选择渠道
            $portSelect.append('<option value="">请先选择所属渠道</option>');
            form.render('select');
            return;
        }
        // AJAX获取选定渠道的运营端口列表
        $.ajax({
            url: "{:url('Client/getPortsByInquiry')}",
            type: 'GET',
            data: { inquiry_id: inquiryId },
            success: function (res) {
                if (res.code === 0 && res.data) {
                    $portSelect.append('<option value="">请选择运营端口</option>');
                    $.each(res.data, function(index, port) {
                        $portSelect.append('<option value="' + port.id + '">' + port.port_name + '</option>');
                    });
                } else {
                    $portSelect.append('<option value="">该渠道暂无端口数据</option>');
                }
                form.render('select');  // 刷新下拉框渲染
            },
            error: function () {
                $portSelect.append('<option value="">获取端口失败</option>');
                form.render('select');
            }
        });
    });


    // 批量导入

    upload.render({
        elem: '#toAll',
        url: "{:url('Client/xlsUpload')}",
        accept: 'file',
        field: 'xlsFile',
        exts: 'xls|xlsx',
        before: function(){

        },
        done: function(res){
            layer.close(indexMsg);
            if(res.code === 0){
                // 导入任务提交成功，提示并在回调中刷新页面
