{include file="common/head"/}
<link rel="stylesheet" href="/static/admin/css/select.css" media="all">
<style>
    /* 个人客户列表页面样式优化 - 撑满页面 */
    body {
        background: #f5f7fa !important;
    }
    
    .personclient-list-container {
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        padding: 20px;
        background: #f5f7fa;
        overflow: auto;
    }
    
    .filtrate-warp {
        margin-bottom: 10px;
    }

    .filtrate-warp .title {
        padding: 5px 12px 7px 12px;
        font-size: 14px;
        font-weight: normal;
        text-align: left;
        cursor: pointer;
        width: 90px;
        background-color: transparent !important;
        color: #333 !important;
    }

    .filtrate-warp .title:hover {
        color: #4285f4;
    }

    .filtrate-warp .flag {
        padding: 6px 12px 6px 12px;
        cursor: pointer;
    }

    .filtrate-warp .flag:hover {
        color: #4285f4;
    }

    .filtrate-warp .layui-badge:hover {
        color: white !important;
    }
    
    /* 查询区域样式优化 */
    .wukong-search-card {
        background: #fff;
        border-radius: 8px;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
        padding: 20px;
        margin-bottom: 20px;
        display: block !important;
        visibility: visible !important;
    }
    
    .wukong-search-card .layui-form {
        display: flex !important;
    }
    .layui-table-view .layui-table td .layui-btn-xs{
        color: #fff !important;
    }
    .wukong-search-card .layui-form-item {
        margin-bottom: 15px;
        display: block !important;
    }
    .layui-table-view .layui-table td, .layui-table-view .layui-table th{
        background-color: #fff !important;
    }
    .wukong-search-card .layui-form-label {
        width: 100px;
        color: #333;
        font-weight: 500;
        background-color: transparent !important;
        display: inline-block !important;
    }
    
    .wukong-search-card .layui-inline {
        display: inline-block !important;
        margin-right: 15px;
        margin-bottom: 15px;
        vertical-align: top;
    }
    
    .wukong-search-card .layui-input-inline {
        display: inline-block !important;
    }
    
    .wukong-search-card .layui-input,
    .wukong-search-card .layui-select {
        border-radius: 6px;
        border: 1px solid #e0e0e0;
        transition: all 0.3s ease;
    }
    
    .wukong-search-card .layui-input:focus,
    .wukong-search-card .layui-select:focus {
        border-color: #4285f4;
        box-shadow: 0 0 0 3px rgba(66, 133, 244, 0.1);
    }
    
    .wukong-search-card .layui-btn {
        border-radius: 6px;
        background: #4285f4;
        border-color: #4285f4;
        transition: all 0.3s ease;
    }
    
    .wukong-search-card .layui-btn:hover {
        background: #3367d6;
        border-color: #3367d6;
        transform: translateY(-1px);
        box-shadow: 0 4px 12px rgba(66, 133, 244, 0.3);
    }

    /* 高级查询折叠（对齐待审核页结构，配色沿用本页蓝色） */
    /* 不用 overflow:hidden，避免高级查询内 layui 下拉 dl / 自定义下拉被裁切；圆角由 header/body 各自样式承担 */
    #advancedSearchFieldset.wukong-search-card {
        margin: 0 0 20px 0;
        padding: 0;
        border: none;
        min-width: 0;
        border-radius: 8px;
        overflow: visible;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
        position: relative;
        /* 必须高于下方 .layui-table-view / 固定列 / 工具栏，否则下拉仅提高 dl 仍处在低层叠上下文中，会被表格层整体盖住 */
        z-index: 1200;
    }
    #advancedSearchFieldset.wukong-search-card > .layui-form {
        display: block !important;
    }
    .advanced-search-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 10px 15px;
        background: #4285f4;
        border-radius: 8px 8px 0 0;
        color: #fff;
    }
    .advanced-search-title {
        font-size: 16px;
        font-weight: 600;
    }
    #toggleAdvancedSearch {
        border-color: rgba(255, 255, 255, 0.35);
        color: #fff;
        background: rgba(255, 255, 255, 0.12);
    }
    #toggleAdvancedSearch:hover {
        background: rgba(255, 255, 255, 0.22);
        border-color: rgba(255, 255, 255, 0.45);
        color: #fff;
    }
    .advanced-search-collapsed .advanced-search-header {
        border-radius: 8px;
    }
    .advanced-search-collapsed #advancedSearchBody {
        display: none !important;
    }
    #advancedSearchBody {
        padding: 20px;
        padding-top: 16px;
        overflow: visible;
        position: relative;
        z-index: 1;
    }
    /* 高级查询内部先建立低层基线，避免同级表单项互相压盖 */
    #advancedSearchFieldset .layui-form-item,
    #advancedSearchFieldset .layui-inline,
    #advancedSearchFieldset .layui-input-inline {
        overflow: visible;
        position: relative;
        z-index: 1;
    }
    #advancedSearchFieldset .layui-form-select {
        position: relative;
        z-index: 1;
    }
    /* 高级查询内：谁打开谁置顶（含 layui select 与 EditableSelect，二者共用 .select-open-top） */
    #advancedSearchFieldset .select-open-top {
        z-index: 4000 !important;
    }
    #advancedSearchFieldset .select-open-top .layui-form-select,
    #advancedSearchFieldset .layui-form-selected {
        z-index: 4000 !important;
    }
    /* EditableSelect 面板须高于同区其它 .layui-inline / 日期输入（跟进时间等保持默认 z-index:1） */
    #advancedSearchFieldset .select-open-top .layui-form-select dl,
    #advancedSearchFieldset .layui-form-select dl,
    #advancedSearchFieldset .layui-form-select.custom-select dl {
        z-index: 4001 !important;
    }
    #advancedSearchBody .layui-form-item:last-child {
        margin-bottom: 0;
    }
    
    /* 表格容器样式 */
    .personclient-table-wrapper {
        background: #fff;
        border-radius: 8px;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
        overflow: visible;
        padding: 0;
        height: calc(100vh - 280px);
        display: flex;
        flex-direction: column;
    }
    
     /* 主列表表格：层叠低于高级查询 fieldset（弹窗内表格勿用此条，故只作用在列表容器下） */
     .personclient-list-container > .layui-table-view {
         z-index: 0;
     }
     .layui-table-view {
         flex: 1;
         display: flex;
         flex-direction: column;
         height: 100%;
         border: none !important;
         overflow: visible !important;
         position: relative;
     }
     
     .layui-table-box {
         overflow-x: auto !important;
         overflow-y: auto !important;
         width: 100%;
         flex: 1;
     }
     
     .layui-table-main {
         overflow-x: auto !important;
         overflow-y: auto !important;
         width: 100%;
     }
     
     .layui-table-body {
         overflow-x: auto !important;
         overflow-y: auto !important;
         width: 100%;
     }
     
     /* ✅表格宽度严格按列宽总和，不强制撑满 */
     .layui-table {
        width: max-content !important;
        min-width: 0 !important;
        table-layout: fixed !important;
    }
     
    /* ✅ 默认：所有列单行显示 + 省略号（利于拖拽列宽） */
    .layui-table-view .layui-table-cell{
        white-space: nowrap !important;
        overflow: hidden !important;
        text-overflow: ellipsis !important;
    }
     

    /* ✅ 仅「产品名称」：最多两行，多的省略 */
    .layui-table-view td[data-field="product_name"] .layui-table-cell{
        white-space: normal !important;
        overflow: hidden !important;
        text-overflow: ellipsis !important;
        display: -webkit-box;
        -webkit-line-clamp: 2;      /* 最多 2 行 */
        -webkit-box-orient: vertical;
        word-break: break-word !important;
    }

    /* ✅「最新跟进记录」：单行省略（tooltip 展示全文，见 .pc-last-record-cell） */
    .layui-table-view td[data-field="last_up_records"] .layui-table-cell{
        white-space: nowrap !important;
        overflow: hidden !important;
        text-overflow: ellipsis !important;
    }
    .layui-table-view td[data-field="last_up_records"] .pc-last-record-wrap{
        display: block;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        max-width: 100%;
    }
    .layui-table-view td[data-field="last_up_records"] .pc-last-record-cell{
        display: block;
        width: 100%;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        box-sizing: border-box;
    }

    /* 最新跟进记录：悬浮完整内容（由 JS 定位到 body） */
    /* 申请成交弹窗 */
    .pc-apply-success-dlg {
        padding: 12px 18px 4px;
        max-height: 72vh;
        overflow-y: auto;
        box-sizing: border-box;
    }
    .pc-apply-success-dlg .pc-apply-info {
        background: #f8f9fa;
        border: 1px solid #eee;
        border-radius: 4px;
        padding: 10px 12px;
        margin-bottom: 14px;
    }
    .pc-apply-success-dlg .pc-apply-info-title {
        font-size: 13px;
        font-weight: 600;
        color: #333;
        margin-bottom: 8px;
    }
    .pc-apply-success-dlg .pc-apply-info-row {
        display: flex;
        line-height: 1.75;
        font-size: 13px;
    }
    .pc-apply-success-dlg .pc-apply-info-row .pc-label {
        flex: 0 0 92px;
        color: #666;
    }
    .pc-apply-success-dlg .pc-apply-info-row .pc-value {
        flex: 1;
        color: #333;
        word-break: break-word;
    }
    .pc-apply-success-dlg .pc-apply-info-row.pc-apply-follow .pc-value {
        max-height: 80px;
        overflow-y: auto;
    }
    .pc-apply-success-dlg .pc-required {
        color: #ff5722;
        margin-right: 2px;
    }
    .pc-apply-success-dlg .pc-proof-preview img {
        max-width: 220px;
        max-height: 150px;
        border: 1px solid #e6e6e6;
        border-radius: 2px;
        display: block;
    }
    .pc-apply-success-dlg .pc-proof-del {
        display: inline-block;
        margin-top: 6px;
        color: #ff5722;
        font-size: 12px;
        cursor: pointer;
    }
    .pc-apply-success-dlg .pc-proof-del:hover {
        text-decoration: underline;
    }

    #pc-last-record-tooltip.pc-last-record-tooltip{
        position: fixed;
        z-index: 2000000000;
        max-width: 380px;
        min-width: 120px;
        padding: 8px 12px;
        background: #fff;
        border: 1px solid #d9d9d9;
        border-radius: 6px;
        box-shadow: 0 4px 16px rgba(0, 0, 0, 0.12);
        font-size: 13px;
        line-height: 1.55;
        color: #333;
        word-break: break-word;
        white-space: pre-wrap;
        pointer-events: none;
        box-sizing: border-box;
    }

     /* 表头单元格 */
     .layui-table th {
         white-space: nowrap !important;
     }
    
    /* 固定列仅需在表头/表格内部叠在滚动区域之上，勿用过高 z-index（否则会盖过高级查询整块区域） */
    .personclient-list-container .layui-table-fixed-l,
    .personclient-list-container .layui-table-fixed-r {
        z-index: 99 !important;
    }
    
    /* LayUI 表格工具栏样式优化 */
    .layui-table-tool {
        background: #fff !important;
        padding: 16px 20px !important;
        border-bottom: 1px solid #e0e0e0 !important;
        margin: 0 !important;
        flex-shrink: 0;
        display: flex;
        align-items: center;
        flex-wrap: wrap;
        gap: 8px;
    }
    /* 主列表工具栏层叠压低，避免盖过高级查询下拉（外观仍由上条全局样式控制） */
    .personclient-list-container .layui-table-tool {
        position: relative;
        z-index: 1;
    }
    
    .layui-table-tool .layui-btn {
        border-radius: 6px !important;
        transition: all 0.3s ease !important;
        vertical-align: middle !important;
        display: inline-flex !important;
        align-items: center !important;
        gap: 6px;
    }
    
    .layui-table-tool .layui-btn-primary {
        background: #4285f4 !important;
        border-color: #4285f4 !important;
        color: #fff !important;
    }
    
    .layui-table-tool .layui-btn-primary:hover {
        background: #3367d6 !important;
        border-color: #3367d6 !important;
        transform: translateY(-1px);
        box-shadow: 0 4px 12px rgba(66, 133, 244, 0.3);
    }
    
    .layui-table-tool .layui-btn-normal {
        background: #34a853 !important;
        border-color: #34a853 !important;
        color: #fff !important;
    }
    
    .layui-table-tool .layui-btn-normal:hover {
        background: #2d8f47 !important;
        border-color: #2d8f47 !important;
    }
    
    .layui-table-tool .layui-btn-danger {
        background: #ea4335 !important;
        border-color: #ea4335 !important;
        color: #fff !important;
    }
    
    .layui-table-tool .layui-btn-danger:hover {
        background: #d33b2c !important;
        border-color: #d33b2c !important;
    }
    
    /* 操作按钮样式优化 */
    .layui-table-view .layui-table td {
        vertical-align: middle !important;
    }
    
    .layui-table-view .layui-table td .layui-btn-xs {
        border-radius: 4px !important;
        padding: 4px 12px !important;
        font-size: 12px !important;
        transition: all 0.3s ease !important;
        margin: 0 4px !important;
        vertical-align: middle !important;
        display: inline-flex !important;
        align-items: center !important;
        gap: 4px;
        line-height: 1.5 !important;
    }
    
    .layui-table-view .layui-table td .layui-btn-xs:hover {
        transform: translateY(-1px);
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.15);
    }
    
    /* 操作列图标按钮紧凑样式（只影响操作列的图标按钮） */
    .layui-table-view .layui-table td .action-icon-btn {
        padding: 4px 6px !important;
        min-width: 30px !important;
        justify-content: center !important;
        gap: 0 !important;
    }
    
    /* 操作列单元格保持一行显示（针对固定列） */
    .layui-table-fixed-r .layui-table td {
        white-space: nowrap !important;
    }
    
    .layui-table-view .layui-table td .layui-btn-primary {
        background: #4285f4 !important;
        border-color: #4285f4 !important;
        color: #fff !important;
    }
    
    .layui-table-view .layui-table td .layui-btn-primary:hover {
        background: #3367d6 !important;
        border-color: #3367d6 !important;
    }
    
    /* 客户名称链接样式 */
    .layui-table-view .layui-table td a {
        color: #4285f4 !important;
        text-decoration: none;
        transition: all 0.3s ease;
    }
    
    .layui-table-view .layui-table td a:hover {
        color: #3367d6 !important;
        text-decoration: underline;
    }
    
    /* 分页栏样式 */
    .layui-table-page {
        flex-shrink: 0;
        background: #fff !important;
        border-top: 1px solid #e0e0e0 !important;
        padding: 12px 20px !important;
    }
    
    /* 固定列白色背景 */
    .layui-table-fixed-l {
        background: #fff !important;
    }
    
    .layui-table-fixed-l .layui-table {
        background: #fff !important;
    }
    
    .layui-table-fixed-l .layui-table thead {
        background: #fff !important;
    }
    
    .layui-table-fixed-l .layui-table tbody {
        background: #fff !important;
    }
    
    .layui-table-fixed-l .layui-table tbody tr {
        background: #fff !important;
    }
    
    .layui-table-fixed-l .layui-table tbody tr:hover {
        background: #f8f9fa !important;
    }
    
    .layui-table-fixed-l .layui-table-cell {
        background: #fff !important;
    }
    
    .layui-table-fixed-r {
        background: #fff !important;
    }
    
    .layui-table-fixed-r .layui-table {
        background: #fff !important;
    }
    
    .layui-table-fixed-r .layui-table thead {
        background: #fff !important;
    }
    
    .layui-table-fixed-r .layui-table tbody {
        background: #fff !important;
    }
    
    .layui-table-fixed-r .layui-table tbody tr {
        background: #fff !important;
    }
    
    .layui-table-fixed-r .layui-table tbody tr:hover {
        background: #f8f9fa !important;
    }
    
    .layui-table-fixed-r .layui-table-cell {
        background: #fff !important;
    }
    
    /* ✅ 确保固定列行高可动态调整（不写死高度） */
    .layui-table-fixed-l tbody tr,
    .layui-table-fixed-r tbody tr {
        height: auto !important;
        min-height: auto !important;
    }
    
    .layui-table-fixed-l tbody td,
    .layui-table-fixed-r tbody td {
        height: auto !important;
        vertical-align: middle !important;
    }
    
    /* ===============================
       【新增】A) CSS：让 fixed 操作列单元格"可被拉伸并居中"
       =============================== */
    /* 让 fixed 右侧每个 td 内部 .layui-table-cell 高度可以 100% 撑满，并用 flex 垂直居中 */
    .layui-table-fixed-r td .layui-table-cell {
        display: flex !important;
        align-items: center !important;
        justify-content: center !important;
        flex-wrap: wrap !important; /* 允许按钮换行（如果空间不足） */
        gap: 4px !important; /* 按钮间距 */
        padding: 4px 8px !important; /* 保留适当 padding，确保按钮不贴边 */
        box-sizing: border-box !important;
    }
    
    /* 左侧固定列也做同样处理（如果存在） */
    .layui-table-fixed-l td .layui-table-cell {
        display: flex !important;
        align-items: center !important;
        justify-content: center !important;
        flex-wrap: wrap !important;
        gap: 4px !important;
        padding: 4px 8px !important;
        box-sizing: border-box !important;
    }
    
    /* 操作列按钮容器：不允许把高度"撑坏"或"缩小"，确保按钮容器不改变行高，只负责居中 */
    .layui-table-fixed-r td .layui-table-cell .layui-btn-xs,
    .layui-table-fixed-l td .layui-table-cell .layui-btn-xs {
        height: 26px !important; /* 保持按钮紧凑高度，不改变行高 */
        line-height: 26px !important;
        margin: 0 !important; /* 使用 gap 替代 margin，避免间距问题 */
        flex-shrink: 0 !important; /* 不允许按钮被压缩 */
    }
    
    /* 确保 fixed 列的 td 高度也能被拉伸 */
    .layui-table-fixed-r tbody td,
    .layui-table-fixed-l tbody td {
        height: 100% !important;
        box-sizing: border-box !important;
    }
    
    /* 跟进弹窗样式 */
    .follow-container {
        padding: 20px;
        background: #fff;
    }
    
    .follow-header {
        border-bottom: 2px solid #4285f4;
        padding-bottom: 15px;
        margin-bottom: 20px;
    }
    
    .follow-header h3 {
        margin: 0;
        color: #333;
        font-size: 18px;
        font-weight: 600;
    }
    
    .follow-content {
        display: flex;
        gap: 30px;
    }
    
    .follow-info {
        flex: 1;
        padding-right: 20px;
        border-right: 1px solid #e0e0e0;
    }
    
    .follow-history {
        flex: 1;
        padding-left: 20px;
    }

    .follow-action-panel {
        margin-top: 16px;
        padding: 12px;
        background: #fafafa;
        border: 1px solid #e8e8e8;
        border-radius: 6px;
    }

    .follow-action-panel h4 {
        margin-bottom: 12px;
    }

    .follow-action-panel .layui-form-label {
        width: 100px;
        padding-left: 0;
    }

    .follow-action-panel .layui-input-block {
        margin-left: 100px;
    }

    .follow-action-btns {
        text-align: right;
        margin-bottom: 0 !important;
    }
    
    .follow-history h4 {
        margin: 0 0 15px 0;
        color: #333;
        font-size: 16px;
        font-weight: 600;
        padding-bottom: 10px;
        border-bottom: 1px solid #e0e0e0;
    }
    
    .info-item {
        margin-bottom: 15px;
        padding: 8px 0;
        border-bottom: 1px solid #f5f5f5;
    }
    
    .info-item:last-child {
        border-bottom: none;
    }
    
    .info-label {
        font-weight: 600;
        display: inline-block;
        width: 100px;
        color: #666;
        font-size: 14px;
    }
    
    .info-item span:not(.info-label) {
        color: #333;
        font-size: 14px;
    }

    #follow-rank-row { white-space: nowrap; }
    #follow-rank-display,
    #follow-rank-editor { vertical-align: middle; }
    .follow-rank-select {
        height: 26px;
        line-height: 26px;
        padding: 0 8px;
        font-size: 13px;
        border: 1px solid #d2d6de;
        border-radius: 4px;
        outline: none;
        vertical-align: middle;
        max-width: 160px;
        background: #fff;
        color: #555;
        transition: border-color .2s;
    }
    .follow-rank-select:focus {
        border-color: #4285f4;

<script>
layui.use(['table','form','upload','util','laydate','layer'], function () {
    var table = layui.table, form = layui.form, laydate = layui.laydate, $ = layui.jquery, upload = layui.upload, layer = layui.layer;
    var followIndex = null; // 记住"写跟进弹窗"的 layer index
    var isMobile = $(window).width() < 768;
    var currentUsername = "{$Think.session.username}" || "default";
    var tableId = "table-list";
    // 生成 page_key：使用 location.pathname（不要 replace 下划线，否则和数据库存的不一致）
    var pageKey = location.pathname;
    // localStorage 的 key（用于兜底）
    var columnWidthKey = "crm_colwidth_" + currentUsername + "_" + pageKey.replace(/[^\w]/g, '_') + "_" + tableId;

    // ================= 高级查询：折叠/展开 + localStorage 记忆 =================
    var PERSONCLIENT_ADVANCED_SEARCH_KEY = 'personclient_mycustomer_advanced_search_expanded';

    function readAdvancedSearchState() {
        try {
            return localStorage.getItem(PERSONCLIENT_ADVANCED_SEARCH_KEY) === '1';
        } catch (e) {
            return false;
        }
    }

    function saveAdvancedSearchState(expanded) {
        try {
            localStorage.setItem(PERSONCLIENT_ADVANCED_SEARCH_KEY, expanded ? '1' : '0');
        } catch (e) {}
    }

    /**
     * @param {boolean} expanded
     * @param {{ animate?: boolean }} [options]
     */
    function applyAdvancedSearchState(expanded, options) {
        options = options || {};
        var animate = !!options.animate;
        var $fs = $('#advancedSearchFieldset');
        var $body = $('#advancedSearchBody');
        var $btn = $('#toggleAdvancedSearch');
        if (!$fs.length || !$body.length || !$btn.length) return;

        if (expanded) {
            if (animate) {
                $fs.removeClass('advanced-search-collapsed');
                $body.stop(true, true).slideDown(200);
            } else {
                $fs.removeClass('advanced-search-collapsed');
                $body.stop(true, true).css('display', '').show();
            }
            $btn.text('收起');
        } else {
            $btn.text('展开');
            if (animate) {
                $body.stop(true, true).slideUp(200, function () {
                    $fs.addClass('advanced-search-collapsed');
                });
            } else {
                $body.stop(true, true).hide();
                $fs.addClass('advanced-search-collapsed');
            }
        }
    }

    function initAdvancedSearchToggle() {
        applyAdvancedSearchState(readAdvancedSearchState(), { animate: false });
        $('#toggleAdvancedSearch')
            .off('click.pCAdvSearch')
            .on('click.pCAdvSearch', function (e) {
                e.preventDefault();
                var expanded = !$('#advancedSearchFieldset').hasClass('advanced-search-collapsed');
                var next = !expanded;
                saveAdvancedSearchState(next);
                applyAdvancedSearchState(next, { animate: true });
            });
    }

    function bindPersonclientAdvancedSelectLayerFix() {
        var $scope = $('#advancedSearchFieldset');
        if (!$scope.length) return;

        function clearSelectOpenTop() {
            $scope.find('.select-open-top').removeClass('select-open-top');
        }

        /** layui 原生：layui-form-selected；EditableSelect：无该类，仅 dl 为 display:block */
        function isSelectDropdownOpen($selectWrap) {
            if (!$selectWrap || !$selectWrap.length) return false;
            if ($selectWrap.hasClass('layui-form-selected')) return true;
            var $dl = $selectWrap.children('dl').first();
            if (!$dl.length) return false;
            try {
                return $dl.css('display') === 'block';
            } catch (e) {
                return false;
            }
        }

        function raiseCurrentSelect($selectWrap) {
            clearSelectOpenTop();
            $selectWrap.closest('.layui-input-inline, .layui-input-4').addClass('select-open-top');
            $selectWrap.closest('.layui-inline').addClass('select-open-top');
            $selectWrap.closest('.layui-form-item').addClass('select-open-top');
        }

        function syncSelectOpenTopFromDom() {
            setTimeout(function () {
                var hasLayui = $scope.find('.layui-form-select.layui-form-selected').length > 0;
                var hasEditableOrDlOpen = false;
                $scope.find('.layui-form-select').each(function () {
                    var $w = $(this);
                    if (isSelectDropdownOpen($w)) {
                        hasEditableOrDlOpen = true;
                        return false;
                    }
                });
                if (!hasLayui && !hasEditableOrDlOpen) {
                    clearSelectOpenTop();
                }
            }, 0);
        }

        $scope.off('click.personclientSelectTop', '.layui-form-select .layui-select-title')
            .on('click.personclientSelectTop', '.layui-form-select .layui-select-title', function () {
                var $selectWrap = $(this).closest('.layui-form-select');
                setTimeout(function () {
                    if (isSelectDropdownOpen($selectWrap)) {
                        raiseCurrentSelect($selectWrap);
                    } else {
                        clearSelectOpenTop();
                    }
                }, 0);
            });

        /* EditableSelect：输入过滤时也会展开 dl，需同步置顶（不依赖 layui-form-selected） */
        $scope.off('input.personclientSelectTop', '.layui-form-select .layui-select-title input.layui-input')
            .on('input.personclientSelectTop', '.layui-form-select .layui-select-title input.layui-input', function () {
                var $selectWrap = $(this).closest('.layui-form-select');
                setTimeout(function () {
                    if (isSelectDropdownOpen($selectWrap)) {
                        raiseCurrentSelect($selectWrap);
                    }
                }, 0);
            });

        $(document).off('click.personclientSelectTopDoc').on('click.personclientSelectTopDoc', function () {
            syncSelectOpenTopFromDom();
        });

        $(document).off('keydown.personclientSelectTopEsc').on('keydown.personclientSelectTopEsc', function (e) {
            if (e.key === 'Escape') {
                syncSelectOpenTopFromDom();
            }
        });
    }

    initAdvancedSearchToggle();
    bindPersonclientAdvancedSelectLayerFix();
    window.initPersonclientAdvancedSearchToggle = initAdvancedSearchToggle;

    /** 最新跟进记录列：HTML 转义（防 XSS） */
    function personclientEscapeHtml(s) {
        if (s == null) return '';
        return String(s)
            .replace(/&/g, '&amp;')
            .replace(/</g, '&lt;')
            .replace(/>/g, '&gt;')
            .replace(/"/g, '&quot;');
    }
    /** data-* 属性值转义 */
    function personclientEncodeAttr(s) {
        if (s == null) return '';
        return String(s)
            .replace(/&/g, '&amp;')
            .replace(/"/g, '&quot;')
            .replace(/</g, '&lt;')
            .replace(/>/g, '&gt;');
    }

    /** 从表格缓存取当前页行数据 */
    function getPersonclientRowById(id) {
        var list = table.cache[tableId];
        if (!list || !list.length) {
            return null;
        }
        var nid = parseInt(id, 10);
        if (!nid) {
            return null;
        }
        for (var i = 0; i < list.length; i++) {
            if (parseInt(list[i].id, 10) === nid) {
                return list[i];
            }
        }
        return null;
    }

    /**
     * 打开「申请成交」弹窗：展示客户信息 + 凭证上传 + 申请说明
     * @param {object} row 表格行数据
     * @param {function} onSuccess 提交成功回调（通常 tableIns.reload）
     */
    function openApplySuccessClientDialog(row, onSuccess) {
        if (!row || !row.id) {
            layer.msg('客户数据无效', { icon: 2 });
            return;
        }
        var leadsId = parseInt(row.id, 10);
        var uid = 'pcApply_' + leadsId + '_' + Date.now();
        var uploadBtnId = 'pcProofUploadBtn_' + uid;
        var proofInputId = 'pcProofInput_' + uid;
        var proofPreviewId = 'pcProofPreview_' + uid;
        var uploadSlotId = 'pcProofUploadSlot_' + uid;
        var remarkId = 'pcApplyRemark_' + uid;

        function infoRow(label, value, extraClass) {
            var cls = 'pc-apply-info-row' + (extraClass ? ' ' + extraClass : '');

    /** 下次跟进时间展示归一（空值统一返回占位） */
    function normalizeNextUpTimeDisplay(value, emptyText) {
        var fallback = (emptyText == null) ? '' : String(emptyText);
        if (value == null) {
            return fallback;
        }
        var text = String(value).trim();
        if (text === '' || text === 'null' || text === 'undefined') {
            return fallback;
        }
        return text;
    }
    var NEXT_UP_TIME_DEFAULT_CLOCK = '09:00:00';
    /**
     * 下次跟进时间输入归一：
     * 1) 仅日期 -> 自动补 09:00:00
     * 2) 00:00:00 -> 自动改为 09:00:00
     * 3) 其他时间保持用户选择
     */
    function normalizeNextUpTimeInput(value) {
        var text = $.trim(value || '');
        if (text === '') {
            return '';
        }
        var dateOnlyMatch = text.match(/^(\d{4}-\d{2}-\d{2})$/);
        if (dateOnlyMatch) {
            return dateOnlyMatch[1] + ' ' + NEXT_UP_TIME_DEFAULT_CLOCK;
        }
        var dateTimeMatch = text.match(/^(\d{4}-\d{2}-\d{2})\s+(\d{2}):(\d{2}):(\d{2})$/);
        if (dateTimeMatch && dateTimeMatch[2] === '00' && dateTimeMatch[3] === '00' && dateTimeMatch[4] === '00') {
            return dateTimeMatch[1] + ' ' + NEXT_UP_TIME_DEFAULT_CLOCK;
        }
        return text;
    }
    function shouldApplyNextUpDefaultClock(value) {
        var text = $.trim(value || '');
        if (text === '') {
            return true;
        }
        if (/^\d{4}-\d{2}-\d{2}$/.test(text)) {
            return true;
        }
        return /^\d{4}-\d{2}-\d{2}\s+00:00:00$/.test(text);
    }
    function applyNextUpTimeDefault(value) {
        var normalized = normalizeNextUpTimeInput(value);
        if ($.trim($('#next_up_time').val()) !== normalized) {
            $('#next_up_time').val(normalized);
        }
        return normalized;
    }
    /**
     * laydate 点击“确定”时，先等组件把最终值回写到 input，再做默认时间归一。
     * 避免 done(value) 时序过早导致 input 又被写回 00:00:00。
     */
    function syncNextUpTimeAfterLaydateDone(doneValue) {
        setTimeout(function () {
            var finalValue = $.trim($('#next_up_time').val());
            if (finalValue === '') {
                finalValue = $.trim(doneValue || '');
            }
            applyNextUpTimeDefault(finalValue);
        }, 0);
    }
    function initFollowNextUpTimeDefault(rawValue) {
        var text = $.trim(rawValue || '');
        if (text === '') {
            $('#next_up_time').val('');
            return '';
        }
        return applyNextUpTimeDefault(text);
    }
    function applyLaydatePanelDefaultClockIfNeeded(value) {
        if (!shouldApplyNextUpDefaultClock(value)) {
            return;
        }
        var parts = NEXT_UP_TIME_DEFAULT_CLOCK.split(':');
        if (parts.length !== 3) {
            return;
        }
        setTimeout(function () {
            var $panel = $('.layui-laydate:visible').last();
            if (!$panel.length) {
                return;
            }

            // 同步底部时分秒输入框，确保面板打开时默认显示 09:00:00。
            var $timeInputs = $panel.find('.laydate-time-text input');
            if ($timeInputs.length >= 3) {
                $timeInputs.eq(0).val(parts[0]).trigger('keyup').trigger('blur');
                $timeInputs.eq(1).val(parts[1]).trigger('keyup').trigger('blur');
                $timeInputs.eq(2).val(parts[2]).trigger('keyup').trigger('blur');
            }

            // 尝试同步高亮时间列表（不同 layui 版本 DOM 结构有差异，因此做兼容选择器）。
            var $timeCols = $panel.find('.laydate-time-list ol');
            if (!$timeCols.length) {
                $timeCols = $panel.find('.laydate-time-list li ol');
            }
            if ($timeCols.length >= 3) {
                $.each(parts, function (idx, part) {
                    var $col = $timeCols.eq(idx);
                    var $target = $col.children('li').filter(function () {
                        return $.trim($(this).text()) === part;
                    }).first();
                    if ($target.length) {
                        $target.trigger('click');
                    }
                });
            }
        }, 0);
    }

    /** 最新跟进记录：悬浮层（仅截断时显示，挂到 body，避免被表格遮挡） */
    function ensureLastRecordTooltipEl() {
        var $t = $('#pc-last-record-tooltip');
        if (!$t.length) {
            $('body').append('<div id="pc-last-record-tooltip" class="pc-last-record-tooltip" style="display:none;"></div>');
            $t = $('#pc-last-record-tooltip');
        }
        return $t;
    }
    function hideLastRecordTooltip() {
        $('#pc-last-record-tooltip').hide().empty().css({ visibility: '' });
    }
    function positionLastRecordTooltip($tip, anchorEl) {
        var rect = anchorEl.getBoundingClientRect();
        var margin = 8;
        var maxW = 380;
        $tip.css({
            maxWidth: maxW + 'px',
            display: 'block',
            visibility: 'hidden',
            left: 0,
            top: 0
        });
        var tw = $tip.outerWidth();
        var th = $tip.outerHeight();
        var vw = window.innerWidth || document.documentElement.clientWidth;
        var vh = window.innerHeight || document.documentElement.clientHeight;
        var left = rect.left;
        if (left + tw > vw - margin) {
            left = Math.max(margin, vw - tw - margin);
        }
        var top = rect.bottom + margin;
        if (top + th > vh - margin && rect.top > th + margin) {
            top = rect.top - th - margin;
        }
        if (top + th > vh - margin) {
            top = Math.max(margin, vh - th - margin);
        }
        if (left < margin) {
            left = margin;
        }
        $tip.css({ left: left + 'px', top: top + 'px', visibility: 'visible' });
    }

    /**
     * 恢复列宽（在渲染前执行）
     * 优先级：数据库 > localStorage > 默认值
     * 如果数据库无数据/请求失败，仍然走 localStorage 兜底，确保表格能正常渲染
     * 
     * 验收方式：
     * 1. 登录 A 用户，拖拽"产品名称"列宽到 300，刷新页面：列宽仍为 300
     * 2. 换 B 用户登录：列宽不受影响（仍是默认或 B 自己的）
     * 3. 数据表 crm_table_colwidth 能看到对应记录更新 updated_at
     */
    function restoreColWidth(colArr) {
        var dbWidths = {}; // 存储从数据库读取的列宽
        
        // 先从数据库读取列宽
        $.ajax({
            url: "{:url('Client/getColWidths')}",
            type: 'GET',
            data: {
                page_key: pageKey,
                table_id: tableId
            },
            async: false, // 同步请求，确保在表格渲染前完成
            success: function(res) {
                if (res.code === 0 && res.data && Object.keys(res.data).length > 0) {
                    dbWidths = res.data;
                    console.log('✅ 从数据库恢复列宽:', dbWidths);
                } else if (res.code === 401) {
                    console.warn('⚠️ 未登录，无法从数据库恢复列宽');
                }
            },
            error: function(xhr, status, error) {
                // 如果请求失败，静默处理，继续使用 localStorage 兜底
                console.warn('⚠️ 从数据库读取列宽失败，使用 localStorage 兜底:', error);
            }
        });

        // 应用列宽：优先使用数据库，其次使用 localStorage
        try {
            var saved = JSON.parse(localStorage.getItem(columnWidthKey) || '{}');
            
            // ✅ 同步写回 localStorage：如果数据库有值，以数据库为准覆盖 localStorage（确保两边一致）
            var finalWidths = saved; // 默认使用 localStorage
            if (Object.keys(dbWidths).length > 0) {
                finalWidths = Object.assign({}, saved, dbWidths); // 以数据库为准覆盖
                localStorage.setItem(columnWidthKey, JSON.stringify(finalWidths));
                console.log('✅ 列宽已同步到 localStorage:', finalWidths);
            }
            
            colArr.forEach(function (c) {
                // 只处理有 field 的列，checkbox/操作列也可以按需处理
                if (c.field) {
                    // 优先使用数据库中的列宽，否则使用 localStorage 中的列宽（作为兜底）
                    if (finalWidths[c.field] && finalWidths[c.field] > 0) {
                        c.width = finalWidths[c.field];
                    }
                }
            });
        } catch (e) {
            console.warn('恢复列宽失败:', e);
        }
    }

    function quickFollowEscapeHtml(val) {
        var s = val == null ? '' : String(val);
        return s
            .replace(/&/g, '&amp;')
            .replace(/</g, '&lt;')
            .replace(/>/g, '&gt;')
            .replace(/"/g, '&quot;')

    function sanitizeAvatarSrc(src) {
        var val = $.trim(String(src || ''));
        if (!val) return '/static/admin/images/0.jpg';
        if (/^(https?:)?\/\//i.test(val) || /^\//.test(val)) {
            return val.replace(/"/g, '%22').replace(/'/g, '%27');
        }
        return '/static/admin/images/0.jpg';

    function clearFollowHistoryCache(leadsId) {

        return '<span class="batch-follow-history-hover" data-leads-id="' + quickFollowEscapeHtml(leadsId) + '">' + quickFollowEscapeHtml(text) + '</span>';
    }

    function parseFollowHistoryTimestamp(timeText) {
        var text = $.trim(String(timeText || ''));
        if (!text) return 0;
        if (/^\d{10,13}$/.test(text)) {
            var num = parseInt(text, 10);
            if (text.length === 13) {
                return num;
            }
            return num * 1000;
        }
        var ts = Date.parse(text.replace(/-/g, '/'));
        return isNaN(ts) ? 0 : ts;
    }

    function padFollowTimeNum(num) {
        return String(num).padStart(2, '0');
    }

    function formatFollowHistoryTime(rawTime) {
        var text = $.trim(String(rawTime == null ? '' : rawTime));
        if (!text) return '';
        var ts = parseFollowHistoryTimestamp(text);
        if (!ts && /年|月|日/.test(text)) {
            var normalizedText = text.replace(/年/g, '-').replace(/月/g, '-').replace(/日/g, ' ').replace(/\s+/g, ' ').trim();
            ts = parseFollowHistoryTimestamp(normalizedText);
        }
        if (!ts) {
            return text;
        }
        var d = new Date(ts);
        if (isNaN(d.getTime())) {
            return text;
        }
        var y = d.getFullYear();
        var m = padFollowTimeNum(d.getMonth() + 1);
        var day = padFollowTimeNum(d.getDate());
        var hh = padFollowTimeNum(d.getHours());
        var mm = padFollowTimeNum(d.getMinutes());
        var ss = padFollowTimeNum(d.getSeconds());
        return y + '-' + m + '-' + day + ' ' + hh + ':' + mm + ':' + ss;
    }

    function normalizeFollowHistoryRecords(records) {
        var list = [];
        $.each(records || [], function (_, item) {
            item = item || {};
            var timeVal = item.time || item.create_date || item.created_at || item.create_time || item.add_time || '';
            list.push({
                time: formatFollowHistoryTime(timeVal),
                user: item.user || item.username || item.user_name || item.realname || item.oper_user || item.create_user || '系统',
                content: item.content || item.reply_msg || item.comment || '',
                avatar: item.avatar || ''
            });
        });
        list.sort(function (a, b) {
            return parseFollowHistoryTimestamp(b.time) - parseFollowHistoryTimestamp(a.time);
        });
        return list;
    }

    function ensureFollowHistoryTooltipEl() {
        var $tip = $('#quick-follow-history-tooltip');
        if (!$tip.length) {
            $('body').append('<div id="quick-follow-history-tooltip" class="quick-follow-history-tooltip" style="display:none;"></div>');
            $tip = $('#quick-follow-history-tooltip');
        }
        return $tip;
    }

    function updateFollowHistoryTooltipPosition(target) {
        var $tip = ensureFollowHistoryTooltipEl();
        if (!$tip.is(':visible')) return;
        var margin = 12;
        var offset = 14;
        var viewportW = window.innerWidth || document.documentElement.clientWidth;
        var viewportH = window.innerHeight || document.documentElement.clientHeight;
        var tipW = $tip.outerWidth();
        var tipH = $tip.outerHeight();
        var x = followHistoryMousePos.x || 0;
        var y = followHistoryMousePos.y || 0;

        if ((!x || !y) && target && target.getBoundingClientRect) {
            var rect = target.getBoundingClientRect();
            x = rect.left + 8;
            y = rect.bottom;
        }

        var left = x + offset;
        var top = y + offset;
        if (left + tipW > viewportW - margin) {
            left = x - tipW - offset;
        }
        if (left < margin) {
            left = Math.max(margin, viewportW - tipW - margin);
        }
        if (top + tipH > viewportH - margin) {
            top = y - tipH - offset;
        }
        if (top < margin) {
            top = Math.max(margin, viewportH - tipH - margin);
        }
        $tip.css({ left: left + 'px', top: top + 'px' });
    }

    function showFollowHistoryTooltip(target, html) {
        var $tip = ensureFollowHistoryTooltipEl();
        $tip.html(html || '').show();
        updateFollowHistoryTooltipPosition(target);
    }

    function hideFollowHistoryTooltip() {
        clearTimeout(followHistoryHoverTimer);

        followHistoryHoverTarget = null;
        $('#quick-follow-history-tooltip').hide().empty();
    }

    function getFollowHistory(leadsId) {
        var key = String(leadsId || '');
        var cached = followHistoryCache[key];
        if (!key) {
            return $.Deferred().resolve([]).promise();
        }
        if (cached) {
            return $.Deferred().resolve(cached).promise();
        }
        if (followHistoryRequestMap[key]) {
            return followHistoryRequestMap[key];
        }
        var dfd = $.Deferred();
        followHistoryRequestMap[key] = dfd.promise();
        $.ajax({
            url: "{:url('Client/getClientDetailAndComments')}",
            method: 'GET',
            data: { id: key, leads_id: key },
            success: function (res) {
                if (res && parseInt(res.code, 10) === 0) {
                    var payload = res.data || {};
                    var comments = payload.comments || payload.comment_list || payload.commentList || [];
                    var normalized = normalizeFollowHistoryRecords(comments);
                    followHistoryCache[key] = normalized;
                    dfd.resolve(normalized);
                    return;
                }
                dfd.resolve([]);
            },
            error: function () {
                dfd.reject();
            },
            complete: function () {
                delete followHistoryRequestMap[key];
            }
        });
        return followHistoryRequestMap[key];
    }

    function bindQuickFollowHistoryHover() {
        var selector = '#quick-follow-dialog .batch-follow-history-hover';
        $(document)
            .off('mouseenter.quickFollowHistory mouseleave.quickFollowHistory mousemove.quickFollowHistory', selector)
            .on('mouseenter.quickFollowHistory', selector, function (e) {
                var target = this;
                var leadsId = String($(target).data('leads-id') || '');
                if (!leadsId) return;
                followHistoryMousePos.x = e.clientX || 0;
                followHistoryMousePos.y = e.clientY || 0;
                followHistoryHoverTarget = target;
                clearTimeout(followHistoryHoverTimer);
                followHistoryHoverTimer = setTimeout(function () {
                    if (followHistoryHoverTarget !== target) return;
                    showFollowHistoryTooltip(target, '<div class="qf-history-loading">加载中...</div>');
                    getFollowHistory(leadsId).done(function (records) {
                        if (followHistoryHoverTarget !== target) return;
                        showFollowHistoryTooltip(target, renderFollowHistory(records, { forTooltip: true }));
                    }).fail(function () {
                        if (followHistoryHoverTarget !== target) return;
                        showFollowHistoryTooltip(target, '<div class="qf-history-empty">获取跟进记录失败，请稍后重试</div>');
                    });
                }, FOLLOW_HISTORY_HOVER_DELAY);
            })
            .on('mousemove.quickFollowHistory', selector, function (e) {
                if (followHistoryHoverTarget !== this) return;
                followHistoryMousePos.x = e.clientX || 0;
                followHistoryMousePos.y = e.clientY || 0;
                updateFollowHistoryTooltipPosition(this);
            })
            .on('mouseleave.quickFollowHistory', selector, function () {
                if (followHistoryHoverTarget === this) {
                    hideFollowHistoryTooltip();
                }
            });

        var $view = $('#quick-follow-table').next('.layui-table-view');
        if ($view.length) {
            $view.find('.layui-table-main, .layui-table-fixed-r .layui-table-body, .layui-table-fixed-l .layui-table-body')
                .off('scroll.quickFollowHistory')
                .on('scroll.quickFollowHistory', function () {
                    hideFollowHistoryTooltip();
                });
        }
    }
    $(window).off('resize.quickFollowHistory').on('resize.quickFollowHistory', function () {
        hideFollowHistoryTooltip();
    });

    function getQuickFollowDraft(leadsId) {
        var key = String(leadsId || '');
        if (!key) return { content: '', next_up_time: '' };
        if (!quickFollowDraftMap[key]) {
            var saved = null;
            try {
                saved = JSON.parse(localStorage.getItem(QUICK_FOLLOW_DRAFT_PREFIX + key) || 'null');
            } catch (e) {
                saved = null;
            }
            quickFollowDraftMap[key] = {
                content: normalizeQuickFollowText(saved && saved.content),
                next_up_time: normalizeQuickFollowText(saved && saved.next_up_time)
            };
        }
        return quickFollowDraftMap[key];
    }

    function saveQuickFollowDraftToStorage(leadsId, draft) {
        var key = String(leadsId || '');
        if (!key) return;
        var payload = {
            content: normalizeQuickFollowText(draft && draft.content),
            next_up_time: normalizeQuickFollowText(draft && draft.next_up_time)
        };
        try {
            localStorage.setItem(QUICK_FOLLOW_DRAFT_PREFIX + key, JSON.stringify(payload));
        } catch (e) {}
    }

    function clearQuickFollowDraftStorage(leadsId) {
        var key = String(leadsId || '');
        if (!key) return;
        try {
            localStorage.removeItem(QUICK_FOLLOW_DRAFT_PREFIX + key);
        } catch (e) {}
    }

    function setQuickFollowStatus(leadsId, status, extra) {
        var key = String(leadsId || '');
        if (!key) return;
        var payload = $.extend({ status: status, time: '', msg: '' }, extra || {});
        quickFollowStatusMap[key] = payload;
        updateQuickFollowStatusCell(key);
    }

    function getQuickFollowStatusRender(leadsId) {
        var key = String(leadsId || '');
        var draft = getQuickFollowDraft(key);
        var content = $.trim(draft.content || '');
        var st = quickFollowStatusMap[key];

        if (!st || !st.status) {
            if (!content && !$.trim(draft.next_up_time || '')) {
                return '<span class="quick-follow-status quick-follow-status-empty">未填写</span>';
            }
            return '<span class="quick-follow-status quick-follow-status-saved">已保存草稿</span>';
        }

        if (st.status === 'empty') {
            return '<span class="quick-follow-status quick-follow-status-empty">未填写</span>';
        }
        if (st.status === 'draft') {
            return '<span class="quick-follow-status quick-follow-status-saved">已保存草稿</span>';
        }
        if (st.status === 'saving') {
            return '<span class="quick-follow-status quick-follow-status-saving">保存中...</span>';
        }
        if (st.status === 'saved') {
            var t = st.time || '';
            return '<span class="quick-follow-status quick-follow-status-saved">跟进记录已保存' + (t ? ' ' + quickFollowEscapeHtml(t) : '') + '</span>';
        }
        if (st.status === 'failed') {
            return '<span class="quick-follow-status quick-follow-status-failed quick-follow-retry" data-leads-id="' + key + '">保存失败，点击重试</span>';
        }

        return '<span class="quick-follow-status quick-follow-status-empty">未填写</span>';
    }

    function resetQuickFollowRuntime() {
        quickFollowDraftMap = {};
        quickFollowStatusMap = {};

        quickFollowForceClose = false;

    function normalizeQuickFollowText(s) {
        return $.trim(String(s == null ? '' : s));
    }

    function buildNowDateTimeText() {
        var now = new Date();
        var y = String(now.getFullYear());
        var m = String(now.getMonth() + 1).padStart(2, '0');
        var d = String(now.getDate()).padStart(2, '0');
        var hh = String(now.getHours()).padStart(2, '0');
        var mm = String(now.getMinutes()).padStart(2, '0');
        var ss = String(now.getSeconds()).padStart(2, '0');
        return y + '-' + m + '-' + d + ' ' + hh + ':' + mm + ':' + ss;
    }

    function buildNowClockText() {
        var now = new Date();
        var hh = String(now.getHours()).padStart(2, '0');
        var mm = String(now.getMinutes()).padStart(2, '0');
        var ss = String(now.getSeconds()).padStart(2, '0');
        return hh + ':' + mm + ':' + ss;
    }

    function updateQuickFollowStatusCell(leadsId) {

    function bindQuickFollowRowWidgets() {
        $('#quick-follow-dialog .quick-follow-content-input').each(function () {
            var $this = $(this);
            var leadsId = String($this.data('leads-id') || '');
            if (!leadsId) return;
            var draft = getQuickFollowDraft(leadsId);
            if ($this.val() !== draft.content) {
                $this.val(draft.content);
            }
        });

        $('#quick-follow-dialog .quick-follow-next-input').each(function () {
            var $input = $(this);
            var leadsId = String($input.data('leads-id') || '');
            if (!leadsId) return;
            var draft = getQuickFollowDraft(leadsId);
            if ($input.val() !== draft.next_up_time) {

            $input.off('focus.quickFollowDate').on('focus.quickFollowDate', function () {
                laydate.render({

                        if (!id) return;
                        var d = getQuickFollowDraft(id);
                        d.next_up_time = $.trim(value || '');
                        saveQuickFollowDraftToStorage(id, d);
                        if ($.trim(d.content || '') !== '' || $.trim(d.next_up_time || '') !== '') {
                            setQuickFollowStatus(id, 'draft');
                        } else {
                            setQuickFollowStatus(id, 'empty');

    function collectQuickFollowSearchKeyword() {
        return {
            kh_name: $.trim($('#quick-follow-kh-name').val() || ''),

        };

    function hasQuickFollowPendingChange() {
        var statusKeys = Object.keys(quickFollowStatusMap);
        for (var i = 0; i < statusKeys.length; i++) {
            var st = quickFollowStatusMap[statusKeys[i]] || {};
            if (st.status === 'draft' || st.status === 'saving' || st.status === 'failed') {
                return true;
            }
        }
        var draftKeys = Object.keys(quickFollowDraftMap);
        for (var j = 0; j < draftKeys.length; j++) {
            var draft = quickFollowDraftMap[draftKeys[j]] || {};
            if (normalizeQuickFollowText(draft.content) !== '' || normalizeQuickFollowText(draft.next_up_time) !== '') {
                return true;
            }
        }
        return false;
    }

    function confirmQuickFollowPendingAction(onConfirm) {
        if (!hasQuickFollowPendingChange()) {
            if (typeof onConfirm === 'function') onConfirm();
            return;
        }
        layer.confirm('存在未提交草稿，确认继续吗？', { icon: 0, title: '提示' }, function (idx) {
            layer.close(idx);
            if (typeof onConfirm === 'function') onConfirm();

        if (!$textarea.length) return;

        $tr.find('td[data-field="last_up_records"] .layui-table-cell').html(buildQuickFollowLastRecordCell({
            id: key,
            leads_id: key,
            last_up_records: savedContent
        }));

        if ($nextInput.length) {
            $nextInput.val(nextText);
        }

    function applyQuickFollowWidthsToCols(cols, widths) {
        if (!cols || !cols.length || !widths) return;
        cols.forEach(function (col) {
            if (!col || !col.field) return;
            var w = parseInt(widths[col.field], 10);
            if (!isNaN(w) && w >= 30 && w <= 3000) {
                col.width = w;
            }
        });
    }

    function readQuickFollowHeaderWidths() {
        var widths = {};
        try {
            var $view = $('#quick-follow-table').next('.layui-table-view');
            if (!$view.length) return widths;
            var $headerTable = $view.find('.layui-table-header table').eq(0);
            if (!$headerTable.length) return widths;
            $headerTable.find('thead tr th').each(function () {
                var $th = $(this);
                var field = $.trim($th.attr('data-field') || '');
                if (!field || field === '0') return;
                var w = parseInt($th.width(), 10);
                if (!isNaN(w) && w >= 30 && w <= 3000) {
                    widths[field] = w;
                }
            });
        } catch (e) {
            console.warn('读取批量跟进表头列宽失败:', e);
        }
        return widths;
    }

    function loadQuickFollowWidths() {
        var dbWidths = {};
        $.ajax({
            url: "{:url('Client/getColWidths')}",
            type: 'GET',
            dataType: 'json',
            data: {
                page_key: quickFollowPageKey,
                table_id: quickFollowTableId
            },
            async: false,
            success: function (res) {
                if (res && parseInt(res.code, 10) === 0 && res.data && Object.keys(res.data).length > 0) {
                    dbWidths = res.data;
                }
            },
            error: function () {}
        });

        var localWidths = {};
        try {
            localWidths = JSON.parse(localStorage.getItem(quickFollowColumnWidthKey) || '{}');
        } catch (e) {
            localWidths = {};
        }

        var finalWidths = localWidths;
        if (Object.keys(dbWidths).length > 0) {
            finalWidths = Object.assign({}, localWidths, dbWidths);
            try {
                localStorage.setItem(quickFollowColumnWidthKey, JSON.stringify(finalWidths));
            } catch (e) {}
        }
        return finalWidths;
    }

    function saveQuickFollowWidths() {
        var widths = readQuickFollowHeaderWidths();
        if (!widths || !Object.keys(widths).length) return;

        quickFollowLastWidthSnapshot = $.extend({}, widths);
        try {
            localStorage.setItem(quickFollowColumnWidthKey, JSON.stringify(widths));
        } catch (e) {}

        $.ajax({
            url: "{:url('Client/saveColWidths')}",
            type: 'POST',
            dataType: 'json',
            data: {
                page_key: quickFollowPageKey,
                table_id: quickFollowTableId,
                widths: JSON.stringify(widths)
            }
        });
    }

    function bindQuickFollowResizeSave() {
        quickFollowLastWidthSnapshot = readQuickFollowHeaderWidths();
        $(document).off('mouseup.quickFollowColWidth').on('mouseup.quickFollowColWidth', function () {
            var $view = $('#quick-follow-table').next('.layui-table-view');
            if (!$view.length) return;
            setTimeout(function () {
                var latest = readQuickFollowHeaderWidths();
                if (!latest || !Object.keys(latest).length) return;
                if (JSON.stringify(latest) !== JSON.stringify(quickFollowLastWidthSnapshot || {})) {
                    saveQuickFollowWidths();
                }
            }, 200);
        });
    }

    function getQuickFollowTableHeight() {
        if (quickFollowIsFull) {
            var $search = $('#quick-follow-dialog .quick-follow-search');
            var viewportHeight = $(window).height();
            var searchHeight = $search.outerHeight(true) || 0;
            var reserveHeight = 210;
            var fiveRowsHeight = 490;
            var availableHeight = viewportHeight - searchHeight - reserveHeight;

            return Math.max(420, Math.min(fiveRowsHeight, availableHeight));
        }

        return Math.max(320, Math.floor($(window).height() * 0.85) - 250);
    }

    function submitQuickFollowRow(leadsId) {
        var key = String(leadsId || '');
        if (!key) return;
        var draft = getQuickFollowDraft(key);
        draft.content = normalizeQuickFollowText(draft.content || '');
        draft.next_up_time = normalizeQuickFollowText(draft.next_up_time || '');

        if (quickFollowSavingMap[key]) {
            layer.msg('正在保存中，请稍候', { icon: 0, time: 1000 });
            return;
        }

        if (!draft.content) {
            setQuickFollowStatus(key, 'empty');
            layer.msg('请输入本次跟进内容', { icon: 0, time: 1200 });
            return;
        }
        if (draft.content.length < 2) {
            setQuickFollowStatus(key, 'draft');
            layer.msg('内容太短', { icon: 0, time: 1200 });
            return;
        }

        quickFollowSavingMap[key] = true;
        setQuickFollowStatus(key, 'saving');

        $.ajax({
            url: "{:url('Client/quickSaveFollow')}",
            type: 'post',
            dataType: 'json',
            data: {
                leads_id: key,
                content: draft.content,
                next_up_time: draft.next_up_time
            },
            success: function (res) {
                if (res && parseInt(res.code, 10) === 0) {
                    var savedNextTime = normalizeQuickFollowText((res.data && res.data.next_up_time) || draft.next_up_time);
                    updateQuickFollowRowAfterSuccess(key, draft.content, savedNextTime);
                    clearFollowHistoryCache(key);
                    clearQuickFollowDraftStorage(key);
                    draft.content = '';
                    draft.next_up_time = '';
                    var $textarea = $('#quick-follow-dialog .quick-follow-content-input[data-leads-id="' + key + '"]');
                    if ($textarea.length) {
                        $textarea.val('');
                    }
                    var $nextInput = $('#quick-follow-dialog .quick-follow-next-input[data-leads-id="' + key + '"]');
                    if ($nextInput.length) {
                        $nextInput.val('');
                    }
                    setQuickFollowStatus(key, 'saved', { time: buildNowClockText() });
                    layer.msg('跟进记录已保存', { icon: 1, time: 1000 });
                } else {
                    setQuickFollowStatus(key, 'failed', { msg: (res && res.msg) || '保存失败' });
                    layer.msg((res && res.msg) || '保存失败', { icon: 2, time: 1500 });
                }
            },
            error: function () {
                setQuickFollowStatus(key, 'failed', { msg: '网络错误' });
                layer.msg('网络错误，保存失败', { icon: 2, time: 1500 });
            },
            complete: function () {
                quickFollowSavingMap[key] = false;
            }
        });
    }

        var areaW = Math.floor($(window).width() * 0.9) + 'px';
        var areaH = Math.floor($(window).height() * 0.85) + 'px';

        if (quickFollowLayerIndex !== null) {
            layer.close(quickFollowLayerIndex);
            quickFollowLayerIndex = null;
            quickFollowIsFull = false;
            restoreQuickFollowParentFullMode();
            $('#quick-follow-fullscreen-btn').html('<i class="layui-icon layui-icon-screen-full"></i>全屏');
            $('#quickFollowFullScreenWrapper').removeClass('full-screen-active');
            $('#quick-follow-dialog .quick-follow-dialog').removeClass('full-screen-mode');
        }

        resetQuickFollowRuntime();
        $('#quick-follow-kh-name').val('');
        $('#quick-follow-phone').val('');
        $('#quick-follow-product-name').val('');
        $('#quick-follow-inquiry-id').val('');
        $('#quick-follow-kh-rank').val('');
        form.render('select');

        quickFollowLayerIndex = layer.open({
            type: 1,
            title: '批量添加跟进记录',
            area: [areaW, areaH],
            content: $('#quick-follow-dialog'),

            maxmin: true,
            cancel: function (index) {

                    layer.close(idx);
                    layer.close(index);
                });
                return false;
            },
            success: function (layero, index) {
                $('#quick-follow-dialog').show();
                renderQuickFollowTable();
                quickFollowLayerIndex = index;
                quickFollowIsFull = false;
                $('#quick-follow-fullscreen-btn').html('<i class="layui-icon layui-icon-screen-full"></i>全屏');
                $('#quickFollowFullScreenWrapper').removeClass('full-screen-active');
                $('#quick-follow-dialog .quick-follow-dialog').removeClass('full-screen-mode');

                    if(!quickFollowIsFull){
                        applyQuickFollowParentFullMode();
                        layer.full(quickFollowLayerIndex);
                        $(this).html('<i class="layui-icon layui-icon-screen-restore"></i>退出全屏');
                        quickFollowIsFull = true;
                        $('#quickFollowFullScreenWrapper').addClass('full-screen-active');
                        $('#quick-follow-dialog .quick-follow-dialog').addClass('full-screen-mode');

                            refreshQuickFollowTableForViewport();

                            if (typeof syncQuickFollowFixedRowHeights === 'function') {
                                syncQuickFollowFixedRowHeights();

                        restoreQuickFollowParentFullMode();
                        $(this).html('<i class="layui-icon layui-icon-screen-full"></i>全屏');
                        quickFollowIsFull = false;
                        $('#quickFollowFullScreenWrapper').removeClass('full-screen-active');
                        $('#quick-follow-dialog .quick-follow-dialog').removeClass('full-screen-mode');
                        setTimeout(function () {
                            refreshQuickFollowTableForViewport();
                            table.resize('quick-follow-table');
                            if (typeof syncQuickFollowFixedRowHeights === 'function') {
                                syncQuickFollowFixedRowHeights();
                            }
                        }, 300);
                    }
                });
            },
            end: function () {
                $('#quick-follow-dialog').hide().appendTo('body');
                restoreQuickFollowParentFullMode();
                quickFollowLayerIndex = null;
                quickFollowIsFull = false;
                $('#quick-follow-fullscreen-btn').html('<i class="layui-icon layui-icon-screen-full"></i>全屏');

    /**
     * ✅ 同步主表与固定列（右/左）的每一行高度 —— 像素级对齐版
     * 核心改进：
     * 1) 同步前先 reset 高度（否则测量会被上一次写入的高度污染）
     * 2) 统一写入：主表/固定列 的 tr + td + .layui-table-cell 全部写同一个高度
     * 3) 取三者最大高度作为最终高度（主表、fixed-r、fixed-l）
     */
     function syncFixedRowHeights() {
            try {
                var $view = $('#' + tableId).next('.layui-table-view');
                if (!$view.length) return;

                var $mainRows = $view.find('.layui-table-main tbody tr');
                if (!$mainRows.length) return;

                var $fixRRows = $view.find('.layui-table-fixed-r tbody tr');
                var $fixLRows = $view.find('.layui-table-fixed-l tbody tr');

                // ✅ 写入 height:xxxpx!important
                function setHImportant(el, h) {
                    if (!el) return;
                    el.style.setProperty('height', h + 'px', 'important');
                }

                // ✅ 清空 height 的 important（恢复测量用）
                function resetHImportant(el) {
                    if (!el) return;
                    el.style.removeProperty('height');
                }

                // =========================
                // ① 同步前：reset（避免上一次写入污染测量）
                // =========================
                $mainRows.each(function () {
                    resetHImportant(this);
                    $(this).find('td').each(function(){ resetHImportant(this); });
                    $(this).find('td .layui-table-cell').each(function(){ resetHImportant(this); });
                });

                if ($fixRRows.length) {
                    $fixRRows.each(function () {
                        resetHImportant(this);
                        $(this).find('td').each(function(){ resetHImportant(this); });
                        $(this).find('td .layui-table-cell').each(function(){ resetHImportant(this); });
                    });
                }

                if ($fixLRows.length) {
                    $fixLRows.each(function () {
                        resetHImportant(this);
                        $(this).find('td').each(function(){ resetHImportant(this); });
                        $(this).find('td .layui-table-cell').each(function(){ resetHImportant(this); });
                    });
                }

                // =========================
                // ② 逐行计算最大高度 -> 写入 important
                // =========================
                $mainRows.each(function (index) {
                    var mainRow = this;
                    var fixRRow = ($fixRRows.length > index) ? $fixRRows.get(index) : null;
                    var fixLRow = ($fixLRows.length > index) ? $fixLRows.get(index) : null;

                    var hMain = $(mainRow).outerHeight() || 0;
                    var hR = fixRRow ? ($(fixRRow).outerHeight() || 0) : 0;
                    var hL = fixLRow ? ($(fixLRow).outerHeight() || 0) : 0;

                    var h = Math.max(hMain, hR, hL);
                    if (h <= 0) return;

                    // 主表
                    setHImportant(mainRow, h);
                    $(mainRow).find('td').each(function(){ setHImportant(this, h); });
                    $(mainRow).find('td .layui-table-cell').each(function(){ setHImportant(this, h); });

                    // 右 fixed
                    if (fixRRow) {
                        setHImportant(fixRRow, h);
                        $(fixRRow).find('td').each(function(){ setHImportant(this, h); });
                        $(fixRRow).find('td .layui-table-cell').each(function(){ setHImportant(this, h); });
                    }

                    // 左 fixed
                    if (fixLRow) {
                        setHImportant(fixLRow, h);
                        $(fixLRow).find('td').each(function(){ setHImportant(this, h); });
                        $(fixLRow).find('td .layui-table-cell').each(function(){ setHImportant(this, h); });
                    }
                });

            } catch (e) {
                console.warn('同步固定列行高失败:', e);
            }
        }

    function reloadKeepColWidth() {
        // 1) 先快照当前列宽（不丢你刚做好的列宽记忆）
        var snapshot = {};
        if (typeof getCurrentWidthsSnapshot === 'function') {
            snapshot = getCurrentWidthsSnapshot() || {};
        }

        // 2) 把快照回写到当前 tableIns 的 cols（避免 reload 后宽度被默认值覆盖）
        if (window.tableIns && tableIns.config && tableIns.config.cols && tableIns.config.cols[0]) {
            tableIns.config.cols[0].forEach(function (col) {
                if (!col || !col.field) return;
                if (snapshot && Object.prototype.hasOwnProperty.call(snapshot, col.field)) {
                    col.width = snapshot[col.field];
                }
            });
        }

        // 3) 同步兜底到 localStorage（可选，但建议保留）
        if (snapshot && Object.keys(snapshot).length && typeof columnWidthKey !== 'undefined') {
            localStorage.setItem(columnWidthKey, JSON.stringify(snapshot));
        }

        // 4) 关键：刷新列表（两种写法二选一）
        // 写法A：用实例 reload（推荐）
        if (window.tableIns) {
            tableIns.reload();
            return;
        }

        // 写法B：用 table.reload（如果你某些页面 tableIns 作用域拿不到）
        layui.table.reload(tableId);
    }

    function requestFollowDialogData(clientId, options) {

        }

        $.ajax({
            url: "{:url('Client/getClientDetailAndComments')}",
            method: 'GET',
            data: {id: clientId},
            success: function(res) {
                if (loading !== null) {
                    layer.close(loading);

                    if (typeof options.onError === 'function') {
                        options.onError(res.msg || '获取客户信息失败');
                    } else {
                        layer.msg(res.msg || '获取客户信息失败', {icon: 2});
                    }
                    return;

                    options.onSuccess(res.data);
                }
            },

                if (loading !== null) {
                    layer.close(loading);
                }
                if (typeof options.onError === 'function') {
                    options.onError('网络错误，获取客户信息失败');

    var lastSnapshot = {}; // 全局变量：保存上一次的列宽快照

    /**
     * 读表头 colgroup 的真实宽度（Layui 改的是 col 的 width）
     * 保存逻辑：先保存到 localStorage（兜底），再保存到数据库
     * 保存失败要提示（layer.msg）
     */
     function saveWidths() {
        try {
            var widths = {};
            var $view = $('#' + tableId).next('.layui-table-view');
            if (!$view.length) return;

            // ✅只取主表头（不取 fixed 的那套）
            var $headerTable = $view.find('.layui-table-header table').eq(0);
            var $ths = $headerTable.find('thead tr th');

            $ths.each(function () {
                var $th = $(this);
                var field = $th.attr('data-field');
                if (!field || field === '0') return;

                var w = parseInt($th.width(), 10); // ✅只取内容宽度（不含 padding/border）
                // ✅合理边界检查，防止极小/极大异常值
                if (w >= 30 && w <= 3000) {
                    widths[field] = w;
                }
            });

            // 没取到就直接跳过
            if (!Object.keys(widths).length) {
                console.warn('[colwidth] widths empty, skip save');
                return;
            }

            // ✅localStorage 兜底
            localStorage.setItem(columnWidthKey, JSON.stringify(widths));

            // ✅保存到数据库
            $.ajax({
                url: "{:url('Client/saveColWidths')}",
                type: 'POST',
                dataType: 'json',
                data: {
                    page_key: pageKey,
                    table_id: tableId,
                    widths: JSON.stringify(widths)
                },
                success: function(res) {
                    if (res.code === 0) {
                        console.log('✅ 列宽已保存到数据库', widths);
                    } else {
                        layer.msg(res.msg || '保存列宽失败', { icon: 2, time: 2000 });
                        console.error('❌ 列宽保存失败:', res);
                    }
                },
                error: function(xhr, status, error) {
                    layer.msg('保存列宽失败：网络错误', { icon: 2, time: 2000 });
                    console.error('❌ 列宽保存失败（网络错误）:', error);
                }
            });

        } catch (e) {
            console.warn('保存列宽失败:', e);
        }
    }


    /**
     * 获取当前列宽快照
     * 读取 #table-list 对应的 .layui-table-view
     * 找到主表头：$view.find('.layui-table-header table')
     * 遍历 thead tr th 与 colgroup col，生成 {field: width} 的对象（跳过 data-field="0"）
     * 返回对象（空对象也返回）
     */
     function getCurrentWidthsSnapshot() {
        var snapshot = {};
        try {
            var $view = $('#' + tableId).next('.layui-table-view');
            if (!$view.length) return snapshot;

            // ✅只取主表头（不取 fixed 的那套）
            var $headerTable = $view.find('.layui-table-header table').eq(0);
            var $ths = $headerTable.find('thead tr th');

            $ths.each(function () {
                var $th = $(this);
                var field = $th.attr('data-field');
                if (!field || field === '0') return; // 跳过 checkbox / 空字段

                // ✅只取内容宽度（不含 padding/border），统一口径
                var w = parseInt($th.width(), 10);
                // ✅合理边界检查，防止极小/极大异常值
                if (w >= 30 && w <= 3000) {
                    snapshot[field] = w;
                }
            });
        } catch (e) {
            console.warn('获取列宽快照失败:', e);
        }
        return snapshot;
    }


    /**
     * 绑定列宽拖拽保存监听
     * 策略：监听 document 的 mouseup/touchend，对比快照变化后保存
     */
     function bindResizeSave() {
        var $view = $('#' + tableId).next('.layui-table-view');
        if (!$view.length) return;

        // 防止 done 多次绑定
        $(document).off('mouseup.colwidth_auto touchend.colwidth_auto');

        lastSnapshot = getCurrentWidthsSnapshot();
        // console.log('[colwidth] listener bound', lastSnapshot); // ✅降低日志噪音

        $(document).on('mouseup.colwidth_auto touchend.colwidth_auto', function(e) {
            // console.log('[colwidth] mouseup fired', e && e.target); // ✅降低日志噪音

            setTimeout(function() {
                var newSnapshot = getCurrentWidthsSnapshot();
                // console.log('[colwidth] snapshot after mouseup', newSnapshot); // ✅降低日志噪音

                if (Object.keys(newSnapshot).length === 0) return;

                if (JSON.stringify(newSnapshot) !== JSON.stringify(lastSnapshot)) {
                    console.log('[colwidth] changed -> saving', newSnapshot); // ✅保留真正保存时的日志
                    saveWidths();
                    lastSnapshot = newSnapshot;
                }
            }, 120);
        });
    }






    // 添加按钮
    $('#add').on('click', function () {
        layer.open({
            type: 2,

    // 顶部工具栏事件
    table.on('toolbar(table-list)', function (obj) {
        var checkStatus = table.checkStatus(obj.config.id), data = checkStatus.data;
        switch (obj.event) {
            case 'quickFollowBatch':
                openQuickFollowDialog();
                break;
            case 'moveGh':
                if (data.length === 0) { layer.msg('请选择要操作的数据'); return; }
                var ids1 = data.map(function(it){ return it.id; });
                layer.confirm('确定将 ' + data.length + ' 个客户转入公海？', function(index){
                    layer.open({
                        type: 2, title: '移入公海', area: ['100%','86%'],
                        content: "{:url('Client/toMoveGh')}?ids=" + ids1.join(',')
                    });
                    layer.close(index);
                });
                break;
            case 'alterAll':
                if (data.length === 0) { layer.msg('请选择要操作的数据'); return; }
                var ids2 = data.map(function(it){ return it.id; });
                layer.confirm('确定要转移选中的 ' + data.length + ' 个客户吗？', function(index){
                    layer.open({
                        type: 2, title: '转移客户', area: ['100%','86%'],

                    });
                    layer.close(index);
                });

            case 'chengjiaoAll':
                layer.msg('成交客户已改为申请审核流程，暂不支持批量直接成交，请逐个客户提交成交申请。', { icon: 0, time: 3000 });
                break;
            case 'delAlls':
                if (data.length === 0) { layer.msg('请先选择要删除的客户'); return; }
                var ids4 = data.map(function(it){ return it.id; });
                layer.confirm('确定删除选中的 ' + ids4.length + ' 个客户吗？', function(index){
                    var loading = layer.load(1, { shade: [0.1,'#fff'] });
                    $.post("{:url('del')}", { ids: ids4 }, function(res){
                        layer.close(loading);
                        if (res.code === 0) {
                            layer.msg(res.msg, { time: 1000, icon: 1 });

                            layer.msg(res.msg || '删除失败', { time: 1500, icon: 2 });
