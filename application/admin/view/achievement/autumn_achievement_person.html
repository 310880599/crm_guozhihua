                <div class="layui-card-body jq-card-body" id="jq-left-card-body">
                    <div id="jq-challenger-container"></div>
                </div>
                <div class="jq-card-foot" id="jq-left-card-foot">共 — 名挑战者 · 手动滚动查看全部</div>
            </div>
        </div>

        <!-- 右栏：押注人奖励与回款榜 -->
        <div class="jq-card-col jq-col-right">
            <div class="layui-card jq-card jq-card-right">
                <div class="layui-card-header jq-card-head">
                    <div class="jq-card-head-main">
                        <div class="jq-card-head-title">
                            <span class="jq-card-head-icon" aria-hidden="true"><i class="layui-icon layui-icon-diamond"></i></span>
                            押注人奖励与回款榜
                        </div>
                        <div class="jq-card-head-desc">按当前奖励金额降序 · 实时按被押注人完成率计算</div>
                    </div>
                </div>
                <div class="layui-card-body jq-card-body" id="jq-right-card-body">
                    <div id="jq-bettor-container"></div>
                </div>
                <div class="jq-card-foot" id="jq-right-card-foot">共 — 名押注人 · 手动滚动查看全部</div>
            </div>
        </div>
    </div>
</div>

<script>
    console.log('[JQ] 金秋大战个人页脚本已加载');
    (function() {
        // ========== 金秋大战个人看板 · 心跳轮询（无自动滚动） ==========
        var jqHeartbeatUrl = "<?php echo url('Achievement/autumnAchievementPersonHeartbeat'); ?>";
        var jqDataUrl = "<?php echo url('Achievement/autumnAchievementPersonData'); ?>";
        console.log('[JQ] heartbeat url:', jqHeartbeatUrl);
        console.log('[JQ] data url:', jqDataUrl);

        var achievementTimer = null;
        var achievementLastStamp = '<?php echo isset($jqStamp) ? addslashes($jqStamp) : ''; ?>';
        var achievementFailCount = 0;
        var achievementIsPolling = false;

        /* ---------- Fullscreen API ---------- */
        var jqFullscreenRootSelector = '.jq-dashboard-container';
        var jqFullscreenEventsBound = false;

        function jqGetFullscreenElement() {
            return document.fullscreenElement
                || document.webkitFullscreenElement
                || document.mozFullScreenElement
                || document.msFullscreenElement
                || null;
        }

        function jqRequestFullscreen(el) {
            if (!el) {
                return Promise.reject(new Error('[JQ-Fullscreen] 目标元素不存在'));
            }
            try {
                var req = el.requestFullscreen
                    || el.webkitRequestFullscreen
                    || el.mozRequestFullScreen
                    || el.msRequestFullscreen;
                if (!req) {
                    return Promise.reject(new Error('[JQ-Fullscreen] 浏览器不支持全屏 API'));
                }
                var ret = req.call(el);
                if (ret && typeof ret.then === 'function') {
                    return ret;
                }
                return Promise.resolve();
            } catch (e) {
                console.warn('[JQ-Fullscreen] requestFullscreen 异常', e);
                return Promise.reject(e);
            }
        }

        function jqExitFullscreen() {
            try {
                var d = document;
                if (d.exitFullscreen) return d.exitFullscreen();
                if (d.webkitExitFullscreen) return d.webkitExitFullscreen();
                if (d.mozCancelFullScreen) return d.mozCancelFullScreen();
                if (d.msExitFullscreen) return d.msExitFullscreen();
                return Promise.reject(new Error('[JQ-Fullscreen] 无可用退出接口'));
            } catch (e) {
                console.warn('[JQ-Fullscreen] exitFullscreen 异常', e);
                return Promise.reject(e);
            }
        }

        function jqUpdateFullscreenButtonState() {
            var elActive = jqGetFullscreenElement();
            var inFs = !!elActive;
            var root = document.querySelector(jqFullscreenRootSelector);
            var btn = document.getElementById('jq-fullscreen-toggle');
            var htmlEl = document.documentElement;

            try {
                if (document.body) {
                    if (inFs) document.body.classList.add('jq-is-fullscreen');
                    else document.body.classList.remove('jq-is-fullscreen');
                }
                if (htmlEl) {
                    if (inFs) htmlEl.classList.add('jq-is-fullscreen');
                    else htmlEl.classList.remove('jq-is-fullscreen');
                }
                if (root) {
                    if (inFs) root.classList.add('jq-is-fullscreen');
                    else root.classList.remove('jq-is-fullscreen');
                }
            } catch (e) {
                console.warn('[JQ-Fullscreen] 同步 class 失败', e);
            }

            if (!btn) return;
            var textSpan = btn.querySelector('.jq-fullscreen-btn-text');
            var iconEnter = btn.querySelector('.jq-fs-icon-enter');
            var iconExit = btn.querySelector('.jq-fs-icon-exit');
            if (inFs) {
                btn.classList.add('is-fullscreen');
                btn.setAttribute('aria-pressed', 'true');
                btn.setAttribute('title', '退出全屏');
                if (textSpan) textSpan.textContent = '退出全屏';
                if (iconEnter) iconEnter.style.display = 'none';
                if (iconExit) iconExit.style.display = 'block';
            } else {
                btn.classList.remove('is-fullscreen');
                btn.setAttribute('aria-pressed', 'false');
                btn.setAttribute('title', '进入全屏');
                if (textSpan) textSpan.textContent = '进入全屏';
                if (iconEnter) iconEnter.style.display = 'block';
                if (iconExit) iconExit.style.display = 'none';
            }
        }

        function jqBindFullscreenEvents() {
            if (jqFullscreenEventsBound) return;
            jqFullscreenEventsBound = true;
            var fsTypes = ['fullscreenchange', 'webkitfullscreenchange', 'mozfullscreenchange', 'MSFullscreenChange'];
            for (var fi = 0; fi < fsTypes.length; fi++) {
                document.addEventListener(fsTypes[fi], function() {
                    jqUpdateFullscreenButtonState();
                });
            }
            document.addEventListener('click', function(ev) {
                var t = ev.target;
                if (!t || typeof t.closest !== 'function') return;
                if (!t.closest('#jq-fullscreen-toggle')) return;
                ev.preventDefault();
                try {
                    if (jqGetFullscreenElement()) {
                        var pExit = jqExitFullscreen();
                        if (pExit && typeof pExit.then === 'function') {
                            pExit.catch(function(err) {
                                console.warn('[JQ-Fullscreen] 退出全屏失败', err);
                            });
                        }
                        return;
                    }
                    var rootEl = document.querySelector(jqFullscreenRootSelector);
                    if (!rootEl) {
                        console.warn('[JQ-Fullscreen] 未找到根容器', jqFullscreenRootSelector);
                        return;
                    }
                    jqRequestFullscreen(rootEl).catch(function(err1) {
                        console.warn('[JQ-Fullscreen] 根容器全屏失败，尝试 documentElement 降级', err1);
                        return jqRequestFullscreen(document.documentElement);
                    }).catch(function(err2) {
                        console.warn('[JQ-Fullscreen] 全屏不可用（可能被 iframe 或策略限制）', err2);
                    });
                } catch (e) {
                    console.warn('[JQ-Fullscreen] 点击处理异常', e);
                }
            }, false);
        }

        function getAchievementNextDelay() {
            if (achievementFailCount === 0) {
                return 8000 + Math.floor(Math.random() * 2000) - 1000; // ~7–9s，约 8–10s 区间
            } else if (achievementFailCount === 1) {
                return 15000;
            } else if (achievementFailCount === 2) {
                return 30000;
            }
            return 60000;
        }

        /** XSS：渲染前转义文本 */
        function escapeHtml(str) {
            return (str == null ? '' : String(str))
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#39;');
        }

        /** 金额千分位，保留 2 位小数 */
        function formatAmount(n) {
            var num = parseFloat(n);
            if (!isFinite(num)) num = 0;
            var fixed = num.toFixed(2);
            return fixed.replace(/\B(?=(\d{3})+(?!\d))/g, ',');
        }

        /**
         * 双色标题：金秋大战（金）+ · 押注战况（亮白）
         * 避免 $('.jq-dashboard-main-title').text() 冲掉内部 span
         */
        function updateDashboardTitle(title) {
            var el = document.querySelector('.jq-dashboard-main-title');
            if (!el || title == null || title === '') return;
            var t = String(title);
            var idx = t.search(/[·•]/);
            var left;
            var right;
            if (idx >= 0) {
                left = t.slice(0, idx).replace(/\s+$/, '');
                right = ' ' + t.slice(idx).replace(/^\s+/, '');
            } else {
                left = t;
                right = '';
            }
            var html = '<span class="jq-title-gold">' + escapeHtml(left) + '</span>';
            if (right) {
                html += '<span class="jq-title-light">' + escapeHtml(right) + '</span>';
            }
            el.innerHTML = html;
        }

        function getRankBadgeClass(rank) {
            if (rank === 1) return 'jq-rank-badge-1';
            if (rank === 2) return 'jq-rank-badge-2';
            if (rank === 3) return 'jq-rank-badge-3';
            return 'jq-rank-badge-n';
        }

        function getRowTopClass(rank) {
            if (rank === 1) return 'jq-row-top3';
            if (rank === 2) return 'jq-row-top3 jq-row-2';
            if (rank === 3) return 'jq-row-top3 jq-row-3';
            return '';
        }

        /** 保存左右面板滚动位置 */
        function savePanelScrollTops() {
            var leftBody = document.getElementById('jq-left-card-body');
            var rightBody = document.getElementById('jq-right-card-body');
            return {
                left: leftBody ? leftBody.scrollTop : 0,
                right: rightBody ? rightBody.scrollTop : 0
            };
        }

        /** 恢复左右面板滚动位置 */
        function restorePanelScrollTops(pos) {
            if (!pos) return;
            var leftBody = document.getElementById('jq-left-card-body');
            var rightBody = document.getElementById('jq-right-card-body');
            if (leftBody) leftBody.scrollTop = pos.left || 0;
            if (rightBody) rightBody.scrollTop = pos.right || 0;
        }

        function updateKpiFromSummary(summary) {
            var s = summary && typeof summary === 'object' ? summary : {};
            var challengerCount = parseInt(s.challenger_count || 0, 10) || 0;
            var bettorCount = parseInt(s.bettor_count || 0, 10) || 0;
            var betTotal = parseFloat(s.bet_total || 0) || 0;
            var actualTotal = parseFloat(s.actual_total || 0) || 0;

            var elC = document.getElementById('jq-kpi-challenger-count');
            var elB = document.getElementById('jq-kpi-bettor-count');
            var elBet = document.getElementById('jq-kpi-bet-total');
            var elAct = document.getElementById('jq-kpi-actual-total');
            if (elC) elC.textContent = String(challengerCount);
            if (elB) elB.textContent = String(bettorCount);
            if (elBet) elBet.textContent = formatAmount(betTotal);
            if (elAct) elAct.textContent = formatAmount(actualTotal);

            var footL = document.getElementById('jq-left-card-foot');
            var footR = document.getElementById('jq-right-card-foot');
            if (footL) footL.textContent = '共 ' + challengerCount + ' 名挑战者 · 手动滚动查看全部';
            if (footR) footR.textContent = '共 ' + bettorCount + ' 名押注人 · 手动滚动查看全部';
        }

        /** 完成率：文本可 >100%；进度条宽度上限 100%；≥100% 金色 over class；待配置/待核对时条宽 0 */
        function buildCompletionRateHtml(item) {
            var rateText = item.completion_rate_text != null ? String(item.completion_rate_text) : '';
            var rate = item.completion_rate;
            var isPendingText = (rateText === '待配置' || rateText === '待核对');
            var rateNum = (!isPendingText && rate != null && isFinite(parseFloat(rate))) ? parseFloat(rate) : null;
            var barWidth = 0;
            if (rateNum != null) {
                barWidth = Math.min(Math.max(rateNum, 0), 100);
            }
            var isOver = (rateNum != null && rateNum >= 100);
            var wrapClass = 'jq-progress' + (isOver ? ' jq-progress-over' : '');
            var textClass = 'jq-progress-text';
            if (isPendingText) {
                textClass += ' is-pending';
            } else if (isOver) {
                textClass += ' jq-completion-over';
            }
            var html = '<div class="' + wrapClass + '">';
            html += '<div class="' + textClass + '">' + escapeHtml(rateText || '—') + '</div>';
            if (isPendingText) {
                html += '<div class="jq-progress-track"><div class="jq-progress-fill" style="width:0%"></div></div>';
            } else {
                html += '<div class="jq-progress-track"><div class="jq-progress-fill" style="width:' + barWidth + '%"></div></div>';
            }
            html += '</div>';
            return html;
        }

        function renderChallengerRankList(list) {
            var $container = $('#jq-challenger-container');
            if (!$container.length) return;
            var html = '';
            if (!list || !list.length) {
                html = '<div class="jq-empty-state"><div class="jq-empty-state-icon">📊</div><div>暂无被押注人数据</div><small>等待配置或检查活动名单</small></div>';
                $container.html(html);
                return;
            }

            html += '<div class="jq-board"><table class="jq-board-table"><thead><tr>';
            html += '<th class="jq-col-rank">排名</th>';
            html += '<th class="jq-col-name">被押注人</th>';
            html += '<th class="jq-col-target">目标业绩</th>';
            html += '<th class="jq-col-actual">实际业绩</th>';
            html += '<th class="jq-col-rate">完成率</th>';
            html += '<th class="jq-col-bet">押注金额</th>';
            html += '<th class="jq-col-bettors">押注人数</th>';
            html += '</tr></thead><tbody>';

            for (var i = 0; i < list.length; i++) {
                var item = list[i] || {};
                var rank = parseInt(item.rank || (i + 1), 10) || (i + 1);
                var displayName = item.display_name != null ? String(item.display_name) : '';
                var excelName = item.excel_name != null ? String(item.excel_name) : '';
                var nameTitle = (excelName && excelName !== displayName) ? (' title="' + escapeHtml(excelName) + '"') : '';
                var status = item.achievement_status || 'ok';
                var targetAmount = item.target_amount;
                var actualAmount = item.actual_amount;
                var betAmount = parseFloat(item.bet_amount || 0) || 0;
                var betCount = parseInt(item.bet_count || 0, 10) || 0;

                var targetHtml;
                if (targetAmount === null || targetAmount === '' || typeof targetAmount === 'undefined') {
                    targetHtml = '<span class="jq-pending-text">待配置</span>';
                } else {
                    var tNum = parseFloat(targetAmount) || 0;
                    targetHtml = (tNum > 0
                        ? '<span class="jq-amount-target">' + formatAmount(tNum) + '</span>'
                        : '<span class="jq-amount-zero">0.00</span>') + '<span class="jq-amount-unit">元</span>';
                }

                var actualHtml;
                if (status === 'pending_match') {
                    // 待核对：不展示 0，避免误导
                    actualHtml = '<span class="jq-pending-text">待核对</span>';
                } else if (actualAmount === null || typeof actualAmount === 'undefined') {
                    actualHtml = '<span class="jq-pending-text">待核对</span>';
                } else {
                    var aNum = parseFloat(actualAmount) || 0;
                    actualHtml = (aNum > 0
                        ? '<span class="jq-amount-actual">' + formatAmount(aNum) + '</span>'
                        : '<span class="jq-amount-zero">0.00</span>') + '<span class="jq-amount-unit">元</span>';
                }

                var betHtml = (betAmount > 0
                    ? '<span class="jq-amount-bet jq-amount-highlight jq-amount-primary">' + formatAmount(betAmount) + '</span>'
                    : '<span class="jq-amount-zero">0.00</span>') + '<span class="jq-amount-unit">元</span>';

                html += '<tr class="' + getRowTopClass(rank) + '">';
                html += '<td class="jq-col-rank"><span class="jq-rank-badge ' + getRankBadgeClass(rank) + '">' + rank + '</span></td>';
                html += '<td class="jq-col-name"><span class="jq-person-name"' + nameTitle + '>' + escapeHtml(displayName) + '</span></td>';
                html += '<td class="jq-col-target">' + targetHtml + '</td>';
                html += '<td class="jq-col-actual">' + actualHtml + '</td>';
                html += '<td class="jq-col-rate">' + buildCompletionRateHtml(item) + '</td>';
                html += '<td class="jq-col-bet">' + betHtml + '</td>';
                html += '<td class="jq-col-bettors">' + betCount + '</td>';
                html += '</tr>';
            }

            html += '</tbody></table></div>';
            $container.html(html);
        }

        function getRewardBadgeClass(code, summary) {
            var c = code != null ? String(code) : '';
            var s = summary != null ? String(summary) : '';
            if (c === 'no_reward' || s === '无奖励') return 'is-no-reward';
            if (c === 'win_1' || s === '赢1倍') return 'is-win-1';
            if (c === 'win_1_5' || s === '赢1.5倍') return 'is-win-1-5';
            if (c === 'win_2' || s === '赢2倍') return 'is-win-2';
            if (c === 'win_3' || s === '赢3倍') return 'is-win-3';
            if (c === 'mixed' || s === '混合档位') return 'is-mixed';
            return 'is-pending';
        }

        /** 由 reward_details 拼 tooltip；字段缺失时安全降级 */
        function buildRewardDetailTitle(details) {
            if (!details || !details.length) return '';
            var lines = [];
            for (var i = 0; i < details.length; i++) {
                var d = details[i] || {};
                var name = d.target_name != null ? String(d.target_name) : '未知对象';
                var principal = (d.principal_amount != null && isFinite(parseFloat(d.principal_amount)))
                    ? formatAmount(d.principal_amount) : '—';
                var tierText = d.tier_text != null ? String(d.tier_text) : '待核对';
                var ratePart = (d.completion_rate != null && isFinite(parseFloat(d.completion_rate)))
                    ? ('完成率' + formatAmount(d.completion_rate) + '%')
                    : '完成率待核对';
                var returnPart = (d.return_amount != null && isFinite(parseFloat(d.return_amount)))
                    ? ('预计返' + formatAmount(d.return_amount))
                    : '预计返待核对';
                lines.push(name + '：本金' + principal + '，' + ratePart + '，' + tierText + '，' + returnPart);
            }
            return lines.join('\n');
        }

        function renderBettorRankList(list) {
            var $container = $('#jq-bettor-container');
            if (!$container.length) return;
            var html = '';
            if (!list || !list.length) {
                html = '<div class="jq-empty-state"><div class="jq-empty-state-icon">💰</div><div>暂无押注人数据</div><small>等待配置或检查押注明细</small></div>';
                $container.html(html);
                return;
            }

            html += '<div class="jq-board"><table class="jq-board-table"><thead><tr>';
            html += '<th class="jq-col-rank">排名</th>';
            html += '<th class="jq-col-name">押注人</th>';
            html += '<th class="jq-col-bet">投入金额</th>';
            html += '<th class="jq-col-targets">押注对象</th>';
            html += '<th class="jq-col-reward">当前奖励</th>';
            html += '<th class="jq-col-return">预计拿回（含本金）</th>';
            html += '</tr></thead><tbody>';

            for (var i = 0; i < list.length; i++) {
                var item = list[i] || {};
                var rank = parseInt(item.rank || (i + 1), 10) || (i + 1);
                var displayName = item.display_name != null ? String(item.display_name) : '';
                var excelName = item.excel_name != null ? String(item.excel_name) : '';
                // 押注人优先展示正式 display_name；缺失时再回退 Excel 原名
                var showName = displayName || excelName;
                var nameTitle = '';
                if (excelName && displayName && excelName !== displayName) {
                    nameTitle = ' title="' + escapeHtml('原始Excel姓名：' + excelName) + '"';
                }
                var principalRaw = (item.principal_amount != null && item.principal_amount !== '')
                    ? item.principal_amount
                    : item.bet_amount;
                var principalAmount = parseFloat(principalRaw || 0) || 0;
                var targetsText = item.target_names_text != null ? String(item.target_names_text) : '';
                var rewardSummary = item.reward_tier_summary != null && String(item.reward_tier_summary) !== ''
                    ? String(item.reward_tier_summary)
                    : '待核对';
                var rewardCode = item.reward_tier_code != null ? String(item.reward_tier_code) : '';
                var detailTitle = buildRewardDetailTitle(item.reward_details);
                var titleAttr = detailTitle ? (' title="' + escapeHtml(detailTitle).replace(/\n/g, '&#10;') + '"') : '';
                var hasPending = !!item.has_pending_reward || !!item.has_data_error;
                var expectedReturn = item.expected_return_amount;

                var betHtml = (principalAmount > 0
                    ? '<span class="jq-amount-bet jq-amount-highlight jq-amount-primary">' + formatAmount(principalAmount) + '</span>'
                    : '<span class="jq-amount-zero">0.00</span>') + '<span class="jq-amount-unit">元</span>';

                var returnHtml;
                if (hasPending || expectedReturn === null || typeof expectedReturn === 'undefined' || expectedReturn === '') {
                    returnHtml = '<span class="jq-pending-text"' + titleAttr + '>待核对</span>';
                } else {
                    var rNum = parseFloat(expectedReturn);
                    if (!isFinite(rNum)) {
                        returnHtml = '<span class="jq-pending-text"' + titleAttr + '>待核对</span>';
                    } else {
                        returnHtml = (rNum > 0
                            ? '<span class="jq-amount-return"' + titleAttr + '>' + formatAmount(rNum) + '</span>'
                            : '<span class="jq-amount-zero"' + titleAttr + '>0.00</span>')
                            + '<span class="jq-amount-unit">元</span>';
                    }
                }

                html += '<tr class="' + getRowTopClass(rank) + '">';
                html += '<td class="jq-col-rank"><span class="jq-rank-badge ' + getRankBadgeClass(rank) + '">' + rank + '</span></td>';
                html += '<td class="jq-col-name"><span class="jq-person-name"' + nameTitle + '>' + escapeHtml(showName) + '</span></td>';
                html += '<td class="jq-col-bet">' + betHtml + '</td>';
                html += '<td class="jq-col-targets" title="' + escapeHtml(targetsText) + '">' + escapeHtml(targetsText || '—') + '</td>';
                html += '<td class="jq-col-reward"><span class="jq-reward-badge ' + getRewardBadgeClass(rewardCode, rewardSummary) + '"' + titleAttr + '>' + escapeHtml(rewardSummary) + '</span></td>';
                html += '<td class="jq-col-return">' + returnHtml + '</td>';
                html += '</tr>';
            }

            html += '</tbody></table></div>';
            $container.html(html);
        }

        /** 统一渲染入口（首屏 / Ajax 共用）；成功后由调用方更新 stamp */
        function renderAllFromData(data) {
            if (!data) return false;
            try {
                if (data.dashboardTitle) {
                    updateDashboardTitle(data.dashboardTitle);
                }
                if (data.periodText) {
                    $('.jq-period-value').text(data.periodText);
                }
                updateKpiFromSummary(data.summary || {});
                renderChallengerRankList(data.challengerRankList || []);
                renderBettorRankList(data.bettorRankList || []);
                return true;
            } catch (e) {
                console.warn('[JQ] 渲染失败', e);
                return false;
            }
        }

        /**
         * 拉取完整数据并渲染。
         * 关键：仅在请求成功且渲染成功后，才把 achievementLastStamp 设为 data.stamp；
         * 失败时保留旧 stamp 与旧 DOM，不清空。
         */
        function loadAchievementDataAndRender($, done) {
            var scrollPos = savePanelScrollTops();
            $.ajax({
                url: jqDataUrl + (jqDataUrl.indexOf('?') >= 0 ? '&' : '?') + '_t=' + Date.now(),
                type: 'GET',
                dataType: 'json',
                cache: false,
                timeout: 15000,
                success: function (res) {
                    if (!res || res.code != 1 || !res.data) {
                        console.warn('[JQ] autumnAchievementPersonData 返回异常', res ? res.msg : '');
                        if (typeof done === 'function') done(false);
                        return;
                    }
                    var data = res.data;
                    var ok = renderAllFromData(data);
                    if (ok) {
                        // 仅在完整数据 + 渲染成功后更新 stamp
                        achievementLastStamp = data.stamp || achievementLastStamp;
                        restorePanelScrollTops(scrollPos);
                        console.log('[JQ] 完整数据拉取成功，DOM 已刷新，stamp=', achievementLastStamp);
                        if (typeof done === 'function') done(true);
                    } else {
                        // 渲染失败：不改 stamp，不恢复滚动（DOM 可能半成品，尽量保持）
                        console.warn('[JQ] 渲染未成功，保留旧 stamp');
                        if (typeof done === 'function') done(false);
                    }
                },
                error: function (xhr, status, error) {
                    console.warn('[JQ] autumnAchievementPersonData 请求失败', status, error);
                    // 失败保留旧 stamp 与旧 DOM
                    if (typeof done === 'function') done(false);
                }
            });
        }

        function pollAchievementOnce($) {
            if (document.visibilityState !== 'visible') return;
            if (achievementIsPolling) return;
            achievementIsPolling = true;

            var heartbeatUrl = jqHeartbeatUrl + (jqHeartbeatUrl.indexOf('?') >= 0 ? '&' : '?') + '_t=' + Date.now();
            console.log('[JQ] heartbeat request send', heartbeatUrl);

            $.ajax({
                url: heartbeatUrl,
                type: 'GET',
                dataType: 'json',
                cache: false,
                timeout: 8000,
                success: function (res) {
                    console.log('[JQ] heartbeat success:', res);
                    if (!res || res.code != 1) {
                        achievementIsPolling = false;
                        achievementFailCount++;
                        scheduleNextAchievementPoll($);
                        return;
                    }
                    var stamp = (res.data && res.data.stamp) ? res.data.stamp : '';
                    var changed = stamp !== achievementLastStamp;
                    console.log('[JQ] stamp 是否变化:', changed ? '是' : '否', '远端 stamp=', stamp, '本地 stamp=', achievementLastStamp);

                    if (!changed) {
                        // 心跳变化但本地已同步：不拉全量，也不因心跳改 stamp
                        achievementIsPolling = false;
                        achievementFailCount = 0;
                        scheduleNextAchievementPoll($);
                        return;
                    }

                    // 关键：心跳发现变化时，不要提前写 achievementLastStamp
                    loadAchievementDataAndRender($, function(ok) {
                        achievementIsPolling = false;
                        if (ok) {
                            achievementFailCount = 0;
                        } else {
                            achievementFailCount++;
                        }
                        scheduleNextAchievementPoll($);
                    });
                },
                error: function (xhr, status, error) {
                    achievementIsPolling = false;
                    achievementFailCount++;
                    console.warn('[JQ] heartbeat error:', status, error);
                    scheduleNextAchievementPoll($);
                }
            });
        }

        function scheduleNextAchievementPoll($) {
            if (document.visibilityState !== 'visible') return;
            if (achievementTimer != null) {
                clearTimeout(achievementTimer);
                achievementTimer = null;
            }
            var delay = getAchievementNextDelay();
            achievementTimer = setTimeout(function() {
                pollAchievementOnce($);
            }, delay);
        }

        function startAchievementPolling($) {
            stopAchievementPolling();
            pollAchievementOnce($);
        }

        function stopAchievementPolling() {
            if (achievementTimer != null) {
                clearTimeout(achievementTimer);
                achievementTimer = null;
            }
            achievementIsPolling = false;
        }

        document.addEventListener('visibilitychange', function() {
            if (document.visibilityState === 'hidden') {
                stopAchievementPolling();
            } else if (document.visibilityState === 'visible' && typeof layui !== 'undefined') {
                layui.use(['jquery'], function() {
                    var $ = layui.jquery;
                    startAchievementPolling($);
                });
            }
        });
        window.addEventListener('beforeunload', function() {
            stopAchievementPolling();
        });

        jqBindFullscreenEvents();
        jqUpdateFullscreenButtonState();

        if (typeof layui === 'undefined') {
            console.error('[JQ] 未找到 layui，轮询将不启动。请确保本页已引入 /static/plugins/layui/layui.js');
            return;
        }

        layui.use(['jquery'], function() {
            var $ = layui.jquery;
            if (!$ || !$.ajax) {
                console.error('[JQ] jQuery 不可用，轮询将不启动');
                return;
            }
            console.log('[JQ] jQuery ready，开始首屏渲染与轮询');
            jqUpdateFullscreenButtonState();

            try {
                var initialChallengerRankList = <?php echo json_encode($challengerRankList, JSON_UNESCAPED_UNICODE | JSON_UNESCAPED_SLASHES); ?>;
                var initialBettorRankList = <?php echo json_encode($bettorRankList, JSON_UNESCAPED_UNICODE | JSON_UNESCAPED_SLASHES); ?>;
                var initialSummary = <?php echo json_encode($summary, JSON_UNESCAPED_UNICODE | JSON_UNESCAPED_SLASHES); ?>;
                renderAllFromData({
                    dashboardTitle: <?php echo json_encode($dashboardTitle, JSON_UNESCAPED_UNICODE | JSON_UNESCAPED_SLASHES); ?>,
                    periodText: <?php echo json_encode($periodText, JSON_UNESCAPED_UNICODE | JSON_UNESCAPED_SLASHES); ?>,
                    challengerRankList: initialChallengerRankList || [],
                    bettorRankList: initialBettorRankList || [],
                    summary: initialSummary || {}
                });
            } catch (e) {
                console.warn('[JQ] 首屏渲染失败（不影响轮询）', e);
            }

            startAchievementPolling($);
        });
    })();
</script>
