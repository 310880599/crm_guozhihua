        function wcGetFullscreenElement() {
            return document.fullscreenElement
                || document.webkitFullscreenElement
                || document.mozFullScreenElement
                || document.msFullscreenElement
                || null;
        }

        /** 对指定元素请求全屏 */
        function wcRequestFullscreen(el) {
            if (!el) {
                return Promise.reject(new Error('[WC-Fullscreen] 目标元素不存在'));
            }
            try {
                var req = el.requestFullscreen
                    || el.webkitRequestFullscreen
                    || el.mozRequestFullScreen
                    || el.msRequestFullscreen;
                if (!req) {
                    return Promise.reject(new Error('[WC-Fullscreen] 浏览器不支持全屏 API'));
                }
                var ret = req.call(el);
                if (ret && typeof ret.then === 'function') {
                    return ret;
                }
                return Promise.resolve();
            } catch (e) {
                console.warn('[WC-Fullscreen] requestFullscreen 异常', e);
                return Promise.reject(e);
            }
        }

        /** 退出全屏（ESC 会触发原生退出，此处供按钮调用） */
        function wcExitFullscreen() {
            try {
                var d = document;
                if (d.exitFullscreen) {
                    return d.exitFullscreen();
                }
                if (d.webkitExitFullscreen) {
                    return d.webkitExitFullscreen();
                }
                if (d.mozCancelFullScreen) {
                    return d.mozCancelFullScreen();
                }
                if (d.msExitFullscreen) {
                    return d.msExitFullscreen();
                }
                return Promise.reject(new Error('[WC-Fullscreen] 无可用退出接口'));
            } catch (e) {
                console.warn('[WC-Fullscreen] exitFullscreen 异常', e);
                return Promise.reject(e);
            }
        }

        /** 根据真实全屏状态同步按钮文案、图标、body/html/根容器 class */
        function wcUpdateFullscreenButtonState() {
            var elActive = wcGetFullscreenElement();
            var inFs = !!elActive;
            var root = document.querySelector(wcFullscreenRootSelector);
            var btn = document.getElementById('wc-fullscreen-toggle');
            var htmlEl = document.documentElement;

            try {
                if (document.body) {
                    if (inFs) {
                        document.body.classList.add('wc-is-fullscreen');
                    } else {
                        document.body.classList.remove('wc-is-fullscreen');
                    }
                }
                if (htmlEl) {
                    if (inFs) {
                        htmlEl.classList.add('wc-is-fullscreen');
                    } else {
                        htmlEl.classList.remove('wc-is-fullscreen');
                    }
                }
                if (root) {
                    if (inFs) {
                        root.classList.add('wc-is-fullscreen');
                    } else {
                        root.classList.remove('wc-is-fullscreen');
                    }
                }
            } catch (e) {
                console.warn('[WC-Fullscreen] 同步 class 失败', e);
            }

            if (!btn) {
                return;
            }
            var textSpan = btn.querySelector('.wc-fullscreen-btn-text');
            var iconEnter = btn.querySelector('.wc-fs-icon-enter');
            var iconExit = btn.querySelector('.wc-fs-icon-exit');
            if (inFs) {
                btn.classList.add('is-fullscreen');
                btn.setAttribute('aria-pressed', 'true');
                btn.setAttribute('title', '退出全屏');
                if (textSpan) {
                    textSpan.textContent = '退出全屏';
                }
                if (iconEnter) {
                    iconEnter.style.display = 'none';
                }
                if (iconExit) {
                    iconExit.style.display = 'block';
                }
            } else {
                btn.classList.remove('is-fullscreen');
                btn.setAttribute('aria-pressed', 'false');
                btn.setAttribute('title', '进入全屏');
                if (textSpan) {
                    textSpan.textContent = '进入全屏';
                }
                if (iconEnter) {
                    iconEnter.style.display = 'block';
                }
                if (iconExit) {
                    iconExit.style.display = 'none';
                }
            }
        }

        /** 绑定全屏状态事件与按钮点击（只绑定一次，避免重复监听） */
        function wcBindFullscreenEvents() {
            if (wcFullscreenEventsBound) {
                return;
            }
            wcFullscreenEventsBound = true;
            var fsTypes = ['fullscreenchange', 'webkitfullscreenchange', 'mozfullscreenchange', 'MSFullscreenChange'];
            for (var fi = 0; fi < fsTypes.length; fi++) {
                document.addEventListener(fsTypes[fi], function() {
                    wcUpdateFullscreenButtonState();
                });
            }
            document.addEventListener('click', function(ev) {
                var t = ev.target;
                if (!t || typeof t.closest !== 'function') {
                    return;
                }
                if (!t.closest('#wc-fullscreen-toggle')) {
                    return;
                }
                ev.preventDefault();
                try {
                    if (wcGetFullscreenElement()) {
                        var pExit = wcExitFullscreen();
                        if (pExit && typeof pExit.then === 'function') {
                            pExit.catch(function(err) {
                                console.warn('[WC-Fullscreen] 退出全屏失败', err);
                            });
                        }
                        return;
                    }
                    var rootEl = document.querySelector(wcFullscreenRootSelector);
                    if (!rootEl) {
                        console.warn('[WC-Fullscreen] 未找到根容器', wcFullscreenRootSelector);
                        return;
                    }
                    wcRequestFullscreen(rootEl).catch(function(err1) {
                        console.warn('[WC-Fullscreen] 根容器全屏失败，尝试 documentElement 降级', err1);
                        return wcRequestFullscreen(document.documentElement);
                    }).catch(function(err2) {
                        console.warn('[WC-Fullscreen] 全屏不可用（可能被 iframe 或策略限制）', err2);
                    });
                } catch (e) {
                    console.warn('[WC-Fullscreen] 点击处理异常', e);
                }
            }, false);
        }

        function getAchievementNextDelay() {
            if (achievementFailCount === 0) {
                return 8000 + Math.floor(Math.random() * 2000) - 1000;
            } else if (achievementFailCount === 1) {
                return 15000;
            } else if (achievementFailCount === 2) {
                return 30000;
            } else {
                return 60000;
            }
        }

        function wcEscapeHtml(str) {
            return (str == null ? '' : String(str))
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#39;');
        }

        function wcFormatAmount(n) {
            var num = parseFloat(n || 0);
            if (!isFinite(num)) num = 0;
            var fixed = num.toFixed(2);
            // 千分位
            return fixed.replace(/\B(?=(\d{3})+(?!\d))/g, ',');
        }

        function updateKpiFromData($, groupAvgRankList, memberRankGroupList) {
            var groups = Array.isArray(groupAvgRankList) ? groupAvgRankList : [];
            var groupCount = groups.length;
            var memberCount = 0;
            var totalAmount = 0;
            for (var i = 0; i < groups.length; i++) {
                var it = groups[i] || {};
                memberCount += parseInt(it.member_count || 0, 10) || 0;
                totalAmount += parseFloat(it.total_amount || 0) || 0;
            }
            var avgAll = memberCount > 0 ? (totalAmount / memberCount) : 0;

            $('#wc-kpi-group-count').text(groupCount);
            $('#wc-kpi-member-count').text(memberCount);
            $('#wc-kpi-total-amount').text(wcFormatAmount(totalAmount));
            $('#wc-kpi-avg-amount').text(wcFormatAmount(avgAll));
        }

        function renderGroupAvgRankList($, list) {
            var $container = $('#wc-left-rank-container');
            if (!$container.length) return;
            var html = '';
            if (!list || !list.length) {
                html = '<div class="wc-empty-state"><div class="wc-empty-state-icon">📊</div><div>暂无排名数据</div><small>等待产生业绩数据或检查统计周期配置</small></div>';
                $container.html(html);
                return;
            }
            var totalGroupAmount = 0;
            var totalMemberCount = 0;

            html += '<div class="wc-left-board">';
            html += '<table class="wc-board-table"><thead><tr>';
            html += '<th class="wc-col-rank">排名</th>';
            html += '<th class="wc-col-name">小组</th>';
            html += '<th class="wc-col-total">小组总业绩</th>';
            html += '<th class="wc-col-num">人数</th>';
            html += '<th class="wc-col-avg">人均业绩</th>';
            html += '</tr></thead><tbody>';
            for (var i = 0; i < list.length; i++) {
                var item = list[i] || {};
                var rank = parseInt(item.rank || (i + 1), 10);
                var badgeClass = rank === 1 ? 'wc-rank-badge-1' : (rank === 2 ? 'wc-rank-badge-2' : (rank === 3 ? 'wc-rank-badge-3' : 'wc-rank-badge-n'));
                var totalAmount = parseFloat(item.total_amount || 0);
                var avgAmount = parseFloat(item.avg_amount || 0);
                var groupName = wcEscapeHtml(item.group_name || '');
                var memberCount = parseInt(item.member_count || 0, 10);
                var rowClass = rank === 1 ? 'wc-row-top3' : (rank === 2 ? 'wc-row-top3 wc-row-2' : (rank === 3 ? 'wc-row-top3 wc-row-3' : ''));
                if (!(totalAmount > 0) && !(avgAmount > 0)) {
                    rowClass += (rowClass ? ' ' : '') + 'wc-row-zero';
                }

                totalGroupAmount += totalAmount;
                totalMemberCount += memberCount;

                html += '<tr class="' + rowClass + '">';
                html += '<td class="wc-col-rank"><span class="wc-rank-badge ' + badgeClass + '">' + rank + '</span></td>';
                html += '<td class="wc-col-name"><span class="wc-group-name">' + groupName + '</span></td>';
                html += '<td class="wc-col-total">' + (totalAmount > 0 ? '<span class="wc-amount-highlight">' + wcFormatAmount(totalAmount) + '</span>' : '<span class="wc-amount-zero">0.00</span>') + '<span class="wc-amount-unit">元</span></td>';
                html += '<td class="wc-col-num">' + memberCount + '</td>';
                html += '<td class="wc-col-avg">' + (avgAmount > 0 ? '<span class="wc-amount-highlight wc-amount-primary">' + wcFormatAmount(avgAmount) + '</span>' : '<span class="wc-amount-zero">0.00</span>') + '<span class="wc-amount-unit">元</span></td>';
                html += '</tr>';
            }
            html += '<tr class="wc-row-total">';
            html += '<td class="wc-col-rank"></td>';
            html += '<td class="wc-col-name"><span class="wc-group-name">合计</span></td>';
            html += '<td class="wc-col-total"><span class="wc-amount-highlight wc-amount-primary">' + wcFormatAmount(totalGroupAmount) + '</span><span class="wc-amount-unit">元</span></td>';
            html += '<td class="wc-col-num"><span class="wc-amount-highlight">' + (totalMemberCount || 0) + '</span></td>';
            var allAvg = totalMemberCount > 0 ? (totalGroupAmount / totalMemberCount) : 0;
            html += '<td class="wc-col-avg"><span class="wc-amount-highlight wc-amount-primary">' + wcFormatAmount(allAvg) + '</span><span class="wc-amount-unit">元</span></td>';
            html += '</tr>';

            html += '</tbody></table>';
            html += '</div>';
            $container.html(html);
        }

        function renderMemberRankGroupList($, groupList) {
            var $container = $('#wc-right-group-container');
            if (!$container.length) return;
            var html = '';
            if (!groupList || !groupList.length) {
                html = '<div class="wc-empty-state"><div class="wc-empty-state-icon">📋</div><div>暂无成员业绩数据</div><small>等待产生业绩数据或检查成员配置</small></div>';
                $container.html(html);
                return;
            }
            html += '<div class="wc-right-board">';
            for (var i = 0; i < groupList.length; i++) {
                var group = groupList[i] || {};
                var gName = wcEscapeHtml(group.group_name || '');
                var gTotal = parseFloat(group.total_amount || 0);
                var gAvg = parseFloat(group.avg_amount || 0);
                var members = group.members || [];
                html += '<div class="wc-group-block"><div class="wc-group-block-head">';
                html += '<div class="wc-group-block-title">' + gName + '</div>';
                html += '<div class="wc-group-block-meta">';
                html += '<span class="wc-meta-amount">小组总业绩：<strong>' + wcFormatAmount(gTotal) + '</strong><span class="wc-amount-unit">元</span></span>';
                html += '<span class="wc-meta-avg">人均：<strong>' + wcFormatAmount(gAvg) + '</strong><span class="wc-amount-unit">元</span></span>';
                html += '</div></div>';
                if (members.length) {
                    html += '<table class="wc-member-table"><thead><tr><th class="wc-mcol-rank">排名</th><th class="wc-mcol-name">成员姓名</th><th class="wc-mcol-amount">总业绩</th></tr></thead><tbody>';
                    for (var j = 0; j < members.length; j++) {
                        var m = members[j] || {};
                        var mRank = parseInt(m.rank || (j + 1), 10);
                        var mAmount = parseFloat(m.amount || 0);
                        var mName = wcEscapeHtml(m.name || '');
                        var rowClass = mRank === 1 ? 'wc-member-row-first' : (mAmount <= 0 ? 'wc-member-row-zero' : '');
                        var badgeClass = mRank === 1 ? 'wc-rank-badge-1' : (mRank === 2 ? 'wc-rank-badge-2' : (mRank === 3 ? 'wc-rank-badge-3' : 'wc-rank-badge-n'));
                        html += '<tr class="' + rowClass + '"><td class="wc-mcol-rank"><span class="wc-rank-badge ' + badgeClass + '">' + mRank + '</span></td>';
                        html += '<td class="wc-mcol-name"><span class="wc-member-name">' + mName + '</span></td>';
                        html += '<td class="wc-mcol-amount">' + (mAmount > 0 ? '<span class="wc-amount-highlight">' + wcFormatAmount(mAmount) + '</span>' : '<span class="wc-amount-zero">0.00</span>') + '<span class="wc-amount-unit">元</span></td></tr>';
                    }
                    html += '</tbody></table>';
                } else {
                    html += '<div class="wc-empty-state" style="padding: 24px;"><div class="wc-empty-state-icon">👥</div><div>暂无成员业绩数据</div><small>该小组暂未产生业绩</small></div>';
                }
                html += '</div>';
            }
            html += '</div>';
            $container.html(html);
        }

        function renderGlobalMemberRankList($, list) {
            var $container = $('#wc-global-rank-container');
            if (!$container.length) return;
            var html = '';
            if (!list || !list.length) {
                html = '<div class="wc-empty-state"><div class="wc-empty-state-icon">🏆</div><div>暂无成员总业绩数据</div><small>等待产生业绩数据或检查成员配置</small></div>';
                $container.html(html);
                return;
            }

            html += '<div class="wc-left-board">';
            html += '<table class="wc-board-table"><thead><tr>';
            html += '<th class="wc-col-rank">排名</th>';
            html += '<th class="wc-col-name">成员姓名</th>';
            html += '<th class="wc-col-group">所属小组</th>';
            html += '<th class="wc-col-total">总业绩</th>';
            html += '</tr></thead><tbody>';

            for (var i = 0; i < list.length; i++) {
                var item = list[i] || {};
                var rank = parseInt(item.rank || (i + 1), 10);
                var badgeClass = rank === 1 ? 'wc-rank-badge-1' : (rank === 2 ? 'wc-rank-badge-2' : (rank === 3 ? 'wc-rank-badge-3' : 'wc-rank-badge-n'));

                var amount = parseFloat(item.amount || 0);
                var name = wcEscapeHtml(item.name || '');
                var groupName = wcEscapeHtml(item.group_name || '');

                var rowClass = rank === 1 ? 'wc-row-top3' : (rank === 2 ? 'wc-row-top3 wc-row-2' : (rank === 3 ? 'wc-row-top3 wc-row-3' : ''));
                if (!(amount > 0)) {
                    rowClass += (rowClass ? ' ' : '') + 'wc-row-zero';
                }

                html += '<tr class="' + rowClass + '">';
                html += '<td class="wc-col-rank"><span class="wc-rank-badge ' + badgeClass + '">' + rank + '</span></td>';
                html += '<td class="wc-col-name"><span class="wc-group-name">' + name + '</span></td>';
                html += '<td class="wc-col-group"><span class="wc-group-name">' + groupName + '</span></td>';
                html += '<td class="wc-col-total">' + (amount > 0 ? '<span class="wc-amount-highlight">' + wcFormatAmount(amount) + '</span>' : '<span class="wc-amount-zero">0.00</span>') + '<span class="wc-amount-unit">元</span></td>';
                html += '</tr>';
            }

            html += '</tbody></table>';
            html += '</div>';
            $container.html(html);
        }

        function loadAchievementDataAndRender($) {
            $.ajax({
                url: wcDataUrl + (wcDataUrl.indexOf('?') >= 0 ? '&' : '?') + '_t=' + Date.now(),
                type: 'GET',
                dataType: 'json',
                cache: false,
                timeout: 15000,
                success: function (res) {
                    if (!res || res.code != 1 || !res.data) {
                        console.warn('[WC] temporaryAchievementData 返回异常', res ? res.msg : '');
                        return;
                    }
                    var data = res.data;
                    if (data.dashboardTitle) $('.wc-dashboard-main-title').text(data.dashboardTitle);
                    if (data.periodText) $('.wc-period-value').text(data.periodText);
                    achievementLastStamp = data.stamp || achievementLastStamp;
                    updateKpiFromData($, data.groupAvgRankList || [], data.memberRankGroupList || []);
                    renderGroupAvgRankList($, data.groupAvgRankList || []);
                    renderMemberRankGroupList($, data.memberRankGroupList || []);
                    renderGlobalMemberRankList($, data.globalMemberRankList || []);
                    console.log('[WC] 完整数据拉取成功，DOM 已刷新');
                },
                error: function (xhr, status, error) {
                    console.warn('[WC] temporaryAchievementData 请求失败', status, error);
                }
            });
        }

        function pollAchievementOnce($) {
            if (document.visibilityState !== 'visible') return;
            if (achievementIsPolling) return;
            achievementIsPolling = true;
            var heartbeatUrl = wcHeartbeatUrl + (wcHeartbeatUrl.indexOf('?') >= 0 ? '&' : '?') + '_t=' + Date.now();
            console.log('[WC] heartbeat request send', heartbeatUrl);
            $.ajax({
                url: heartbeatUrl,
                type: 'GET',
                dataType: 'json',
                cache: false,
                timeout: 8000,
                success: function (res) {
                    achievementIsPolling = false;
                    console.log('[WC] heartbeat success:', res);
                    if (!res || res.code != 1) {
                        achievementFailCount++;
                        scheduleNextAchievementPoll($);
                        return;
                    }
                    var stamp = (res.data && res.data.stamp) ? res.data.stamp : '';
                    var changed = stamp !== achievementLastStamp;
                    console.log('[WC] stamp 是否变化:', changed ? '是' : '否', '当前 stamp=', stamp);
                    if (!changed) {
                        achievementFailCount = 0;
                        scheduleNextAchievementPoll($);
                        return;
                    }
                    achievementLastStamp = stamp;
                    achievementFailCount = 0;
                    loadAchievementDataAndRender($);
                    scheduleNextAchievementPoll($);
                },
                error: function (xhr, status, error) {
                    achievementIsPolling = false;
                    achievementFailCount++;
                    console.warn('[WC] heartbeat error:', status, error);
                    scheduleNextAchievementPoll($);
                }
            });
        }

        function scheduleNextAchievementPoll($) {
            if (document.visibilityState !== 'visible') return;
            if (achievementTimer != null) {
                clearTimeout(achievementTimer);
                achievementTimer = null;
            }
            var delay = getAchievementNextDelay();
            achievementTimer = setTimeout(function() { pollAchievementOnce($); }, delay);
        }

        function startAchievementPolling($) {
            stopAchievementPolling();
            pollAchievementOnce($);
        }

        function stopAchievementPolling() {
            if (achievementTimer != null) {
                clearTimeout(achievementTimer);
                achievementTimer = null;
            }
            achievementIsPolling = false;
        }

        document.addEventListener('visibilitychange', function() {
            if (document.visibilityState === 'hidden') stopAchievementPolling();
            else if (document.visibilityState === 'visible' && typeof layui !== 'undefined') {
                layui.use(['jquery'], function() {
                    var $ = layui.jquery;
                    startAchievementPolling($);
                });
            }
        });
        window.addEventListener('beforeunload', function() { stopAchievementPolling(); });

        /* 全屏：不依赖 layui，脚本底部执行时 DOM 已就绪 */
        wcBindFullscreenEvents();
        wcUpdateFullscreenButtonState();

        if (typeof layui === 'undefined') {
            console.error('[WC] 未找到 layui，轮询将不启动。请确保本页已引入 /static/plugins/layui/layui.js');
            return;
        }
        layui.use(['jquery'], function() {
            var $ = layui.jquery;
            if (!$ || !$.ajax) {
                console.error('[WC] jQuery 不可用，轮询将不启动');
                return;
            }
            console.log('[WC] jQuery ready');
            console.log('[WC] start polling');

            /* 与 layui 同帧再同步一次全屏按钮（防止极端情况下时序问题） */
            wcUpdateFullscreenButtonState();

            // 首屏渲染：使用与 Ajax 同一套渲染函数，确保结构一致
            try {
                var initialGroupAvgRankList = <?php echo json_encode($groupAvgRankList, JSON_UNESCAPED_UNICODE | JSON_UNESCAPED_SLASHES); ?>;
                var initialMemberRankGroupList = <?php echo json_encode($memberRankGroupList, JSON_UNESCAPED_UNICODE | JSON_UNESCAPED_SLASHES); ?>;
                var initialGlobalMemberRankList = <?php echo json_encode($globalMemberRankList, JSON_UNESCAPED_UNICODE | JSON_UNESCAPED_SLASHES); ?>;
                updateKpiFromData($, initialGroupAvgRankList || [], initialMemberRankGroupList || []);
                renderGroupAvgRankList($, initialGroupAvgRankList || []);
                renderMemberRankGroupList($, initialMemberRankGroupList || []);
                renderGlobalMemberRankList($, initialGlobalMemberRankList || []);
            } catch (e) {
                console.warn('[WC] 首屏渲染失败（不影响轮询）', e);
            }

            startAchievementPolling($);
        });
    })();
</script>
