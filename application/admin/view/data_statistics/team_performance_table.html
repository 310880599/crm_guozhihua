{include file="common/head"/}
<style>
    html, body { height: 100%; margin: 0; padding: 0; overflow: hidden; }
    #dsTeamSplitLayout {
        display: flex;
        position: fixed;
        top: 0; left: 0; right: 0; bottom: 0;
        background: #f6f8fb;
        z-index: 1000;
    }
    .split-wrap { display: flex; height: 100%; width: 100%; overflow: hidden; }
    .split-left, .split-mid, .split-right { transition: width 0.3s ease; overflow: hidden; }
    .split-left.hidden, .split-mid.hidden, .split-right.hidden { display: none !important; }
    .split-left.collapsed, .split-mid.collapsed, .split-right.collapsed {
        width: 64px !important;
        border: none !important;
    }
    .split-left.collapsed #teamPane,
    .split-mid.collapsed #memberPane,
    .split-right.collapsed #memberDetailPane { display: none !important; }
    .split-left.collapsed .pane-header,
    .split-mid.collapsed .pane-header,
    .split-right.collapsed .pane-header {
        flex-direction: column !important;
        align-items: center !important;
        justify-content: center !important;
        padding: 10px 5px !important;
        height: 100% !important;
    }
    .split-left.collapsed .pane-header > span,
    .split-mid.collapsed .pane-header > span,
    .split-right.collapsed .pane-header > span {
        writing-mode: vertical-rl;
        text-orientation: mixed;
        margin-bottom: 10px;
    }
    .split-left.collapsed .pane-header > div,
    .split-mid.collapsed .pane-header > div,
    .split-right.collapsed .pane-header > div {
        display: flex !important;
        flex-direction: column !important;
        gap: 5px;
    }
    .split-left.maximized, .split-mid.maximized, .split-right.maximized { width: 100% !important; }
    /* 筛选栏 */
    .split-first-filter-bar {
        padding: 8px 15px 6px;
        gap: 6px;
        margin-bottom: 0;
        align-items: flex-start;
        border-bottom: 1px solid #e9ecef;
        display: flex;
        flex-wrap: wrap;
        flex-shrink: 0;
    }
    .split-first-filter-bar .split-first-filter-main {
        width: 100%;
        display: flex;
        align-items: center;
        gap: 8px;
        flex-wrap: wrap;
    }
    .split-first-filter-bar .split-first-time-label { margin: 0; white-space: nowrap; }
    .split-first-filter-bar .split-first-time-filter { width: auto; min-width: 80px; }
    .split-first-month-shortcut { width: 100%; }
    /* 月份快捷 */
    .month-quick-select { width: 100%; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
    .month-quick-select-label { margin: 0; white-space: nowrap; font-weight: 600; }
    .month-quick-select-buttons {
        display: flex; flex-wrap: nowrap; gap: 6px; flex: 1;
        min-width: 0; overflow-x: auto; white-space: nowrap; align-items: center;
    }
    .month-quick-select-btn {
        margin: 0; padding: 2px 8px; min-width: auto; border-radius: 4px; font-size: 12px;
        line-height: 1.2; flex: 0 0 auto; border: 1px solid #dcdfe6;
        background: #fff; color: #606266; cursor: pointer;
    }
    .month-quick-select-btn.active { background: #4f7cff; color: #fff; border-color: #4f7cff; }
    /* 表头 */
    .pane-header {
        padding: 15px;
        background: linear-gradient(90deg, #4f7cff, #6fa1ff);
        color: #fff;
        display: flex;
        align-items: center;
        justify-content: space-between;
        flex-shrink: 0;
    }
    /* 底部合计 */
    .pane-summary {
        padding: 10px 20px;
        border-top: 1px solid #e9ecef;
        background: #fafafa;
        flex-shrink: 0;
        font-weight: 600;
        color: #333;
    }
    /* 空状态 */
    .pane-empty { text-align: center; padding: 60px 20px; color: #6c757d; }
    .pane-empty .empty-icon { font-size: 48px; margin-bottom: 15px; display: block; }
    /* 表格 */
    .wukong-table { width: 100%; border-collapse: collapse; font-size: 13px; }
    .wukong-table th, .wukong-table td { padding: 8px 10px; border: 1px solid #e9ecef; }
    .wukong-table thead th { background: #f8f9fa; font-weight: 600; }
    .wukong-table tbody tr:hover { background: #eff6ff; }
    /* 团队行点击 */
    #teamPerformanceTableBody tr.team-row { cursor: pointer; transition: background-color 0.2s; }
    #teamPerformanceTableBody tr.team-row:hover { background-color: #f5faff; }
    #teamPerformanceTableBody tr.team-row.is-active { background-color: #e8f1ff !important; }
    /* 成员名称可点击 */
    .member-name-clickable {
        color: #4f7cff; cursor: pointer; font-weight: 600;
        text-decoration: none; transition: all 0.2s;
    }
    .member-name-clickable:hover { color: #6fa1ff; text-decoration: underline; }
    .member-name-clickable.is-active {
        background-color: #e8f1ff; padding: 4px 8px; border-radius: 4px;
    }
    /* 内联 collapsed 样式补丁（部分浏览器需要） */
    .split-left.collapsed #teamPerformanceTimeFilterBar { display: none !important; }
</style>

<div id="dsTeamSplitLayout">
    <div class="split-wrap" style="display:flex;height:100%;width:100%;overflow:hidden;">

        <!-- 左列：团队列表 + 筛选 -->
        <div class="split-left" style="width:36%;background:#fff;border-right:1px solid #e9ecef;display:flex;flex-direction:column;overflow:hidden;">
            <div class="pane-header">
                <span style="font-size:16px;font-weight:600;">🧩 团队列表 / 团队业绩排行榜</span>
                <div>
                    <button class="btn btn-sm btn-light" id="dsTeamSplitLeftMaximize" title="最大化/恢复">
                        <i class="bi bi-arrows-angle-expand"></i>
                    </button>
                    <button class="btn btn-sm btn-light" id="dsTeamSplitLeftCollapse" title="收起/展开">
                        <i class="bi bi-chevron-left"></i>
                    </button>
                    <a class="btn btn-sm btn-light" href="{:url('DataStatistics/index')}" title="返回数据统计" style="margin-left:8px;">
                        <i class="bi bi-arrow-left"></i> 返回
                    </a>
                </div>
            </div>
            <!-- 筛选栏 -->
            <div class="split-first-filter-bar" id="teamPerformanceTimeFilterBar">
                <div class="split-first-filter-main">
                    <label class="split-first-time-label">时间筛选：</label>
                    <select id="teamPerformanceTimeFilter" class="form-select split-first-time-filter">
                        <option value="today">今天</option>
                        <option value="yesterday">昨天</option>
                        <option value="week">本周</option>
                        <option value="month" selected>本月</option>
                        <option value="year">本年</option>
                        <option value="custom">自定义</option>
                    </select>
                    <div id="teamPerformanceCustomTimeRange" style="display:none;gap:8px;align-items:center;">
                        <input type="date" id="teamPerformanceStartDate" class="form-control" style="width:150px;">
                        <span>至</span>
                        <input type="date" id="teamPerformanceEndDate" class="form-control" style="width:150px;">
                    </div>
                    <button type="button" class="btn btn-primary btn-sm" id="teamPerformanceFilterBtn">
                        <i class="bi bi-search"></i> 筛选
                    </button>
                    <button type="button" class="btn btn-secondary btn-sm" id="teamPerformanceResetBtn">
                        <i class="bi bi-arrow-counterclockwise"></i> 重置
                    </button>
                    <button type="button" class="btn btn-success btn-sm" id="teamPerformanceExportBtn">
                        <i class="bi bi-download"></i> 导出
                    </button>
                </div>
                <div id="teamPerformanceMonthShortcutWrap" class="split-first-month-shortcut"></div>
            </div>
            <!-- 团队列表 -->
            <div id="teamPane" style="flex:1;overflow-y:auto;padding:12px 16px 16px;">
                <table class="wukong-table" id="teamPerformanceTable" style="width:100%;">
                    <thead>
                        <tr>
                            <th style="width:60px;text-align:center;">排名</th>
                            <th>团队名称</th>
                            <th style="text-align:right;">总利润</th>
                            <th style="text-align:right;">利润率</th>
                        </tr>
                    </thead>
                    <tbody id="teamPerformanceTableBody">
                        <tr><td colspan="4" style="text-align:center;padding:30px;color:#6c757d;">加载中...</td></tr>
                    </tbody>
                </table>
            </div>
            <div id="teamPaneSummary" class="pane-summary">合计：总利润 0.00 ｜ 总金额 0.00 ｜ 利润率 0.00%</div>
        </div>

        <!-- 中列：成员业绩排名 -->
        <div class="split-mid" style="width:29%;background:#fff;border-right:1px solid #e9ecef;display:flex;flex-direction:column;overflow:hidden;">
            <div class="pane-header">
                <span style="font-size:16px;font-weight:600;" id="memberPaneTitle">👥 成员业绩排名</span>
                <div>
                    <button class="btn btn-sm btn-light" id="dsTeamSplitMidRefresh" title="刷新">
                        <i class="bi bi-arrow-repeat"></i> 刷新
                    </button>
                    <button class="btn btn-sm btn-light" id="dsTeamSplitMidMaximize" title="最大化/恢复">
                        <i class="bi bi-arrows-angle-expand"></i>
                    </button>
                    <button class="btn btn-sm btn-light" id="dsTeamSplitMidCollapse" title="收起/展开">
                        <i class="bi bi-chevron-right"></i>
                    </button>
                </div>
            </div>
            <div id="memberPane" style="flex:1;overflow-y:auto;padding:20px;">
                <div class="pane-empty">
                    <i class="bi bi-inbox empty-icon"></i>
                    <p>请选择团队查看成员业绩排名</p>
                </div>
            </div>
            <div id="memberPaneSummary" class="pane-summary">合计：总利润 0.00 ｜ 总金额 0.00 ｜ 利润率 0.00%</div>
        </div>

        <!-- 右列：个人业绩清单 -->
        <div class="split-right" style="width:35%;background:#fff;display:flex;flex-direction:column;overflow:hidden;">
            <div class="pane-header">
                <span style="font-size:16px;font-weight:600;" id="memberDetailPaneTitle">📋 个人业绩清单</span>
                <div>
                    <button class="btn btn-sm btn-light" id="dsTeamSplitRightRefresh" title="刷新">
                        <i class="bi bi-arrow-repeat"></i> 刷新
                    </button>
                    <button class="btn btn-sm btn-light" id="dsTeamSplitRightMaximize" title="最大化/恢复">
                        <i class="bi bi-arrows-angle-expand"></i>
                    </button>
                    <button class="btn btn-sm btn-light" id="dsTeamSplitRightCollapse" title="收起/展开">
                        <i class="bi bi-chevron-right"></i>
                    </button>
                </div>
            </div>
            <div id="memberDetailPane" style="flex:1;overflow-y:auto;padding:20px;">
                <div class="pane-empty">
                    <i class="bi bi-inbox empty-icon"></i>
                    <p>请点击业务员名称查看个人业绩清单</p>
                </div>
            </div>
            <div id="memberDetailPaneSummary" class="pane-summary">合计：实际业绩 0.00</div>
        </div>

    </div>
</div>

<template id="monthQuickSelectTemplate">
    <div class="month-quick-select">
        <label class="month-quick-select-label">月份快捷：</label>
        <div class="month-quick-select-buttons">
            <button type="button" class="month-quick-select-btn" data-month="1">1</button>
            <button type="button" class="month-quick-select-btn" data-month="2">2</button>
            <button type="button" class="month-quick-select-btn" data-month="3">3</button>
            <button type="button" class="month-quick-select-btn" data-month="4">4</button>
            <button type="button" class="month-quick-select-btn" data-month="5">5</button>
            <button type="button" class="month-quick-select-btn" data-month="6">6</button>
            <button type="button" class="month-quick-select-btn" data-month="7">7</button>
            <button type="button" class="month-quick-select-btn" data-month="8">8</button>
            <button type="button" class="month-quick-select-btn" data-month="9">9</button>
            <button type="button" class="month-quick-select-btn" data-month="10">10</button>
            <button type="button" class="month-quick-select-btn" data-month="11">11</button>
            <button type="button" class="month-quick-select-btn" data-month="12">12</button>
        </div>
    </div>
</template>

<script>
(function () {
    // ================================================================
    // 月份快捷选择
    // ================================================================
    var monthState = { selectedMonths: [] };

    function renderMonthQuickSelect($wrap) {
        if (!$wrap || !$wrap.length) return;
        if ($wrap.find('.month-quick-select').length) return;
        var tpl = $('#monthQuickSelectTemplate').html() || '';
        if (tpl) $wrap.html(tpl);
    }

    function syncMonthQuickState() {
        var sel = {};
        $.each(monthState.selectedMonths, function (_, m) { sel[m] = true; });
        $('#teamPerformanceMonthShortcutWrap .month-quick-select-btn').each(function () {
            var m = parseInt($(this).attr('data-month'), 10);
            $(this).toggleClass('active', !!sel[m]);
        });
    }

    function getMonthKeys() {
        if (!monthState.selectedMonths.length) return '';
        var year = new Date().getFullYear();
        return monthState.selectedMonths.map(function (m) {
            return year + '-' + (m < 10 ? '0' + m : String(m));
        }).join(',');
    }

    function clearMonthQuickState() {
        monthState.selectedMonths = [];
        syncMonthQuickState();
    }

    // ================================================================
    // 时间参数
    // ================================================================
    function getTimeParams() {
        var month_keys = getMonthKeys();
        if (month_keys) return { timebucket: '', at_time: '', month_keys: month_keys };
        var timeFilter = ($('#teamPerformanceTimeFilter').val() || 'month').trim();
        if (timeFilter === 'custom') {
            var s = ($('#teamPerformanceStartDate').val() || '').trim();
            var e = ($('#teamPerformanceEndDate').val() || '').trim();
            if (s && e) return { timebucket: '', at_time: s + ',' + e, month_keys: '' };
            layer.msg('请选择开始日期和结束日期', { icon: 2 });
            return null;
        }
        return { timebucket: timeFilter || 'month', at_time: '', month_keys: '' };
    }

    // ================================================================
    // 工具函数
    // ================================================================
    function esc(str) {
        if (str == null) return '';
        return String(str).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    }

    function normalizeTeamName(teamName) {
        teamName = $.trim(teamName || '');
        return teamName ? teamName : '未分组';
    }

    function formatTimeDisplay(timebucket, at_time) {
        if (at_time && at_time.indexOf(',') !== -1) {
            var parts = at_time.split(',');
            return parts[0].trim() + ' 至 ' + parts[1].trim();
        }
        var map = { today: '今天', yesterday: '昨天', week: '本周', month: '本月', year: '本年' };
        return map[timebucket] || timebucket || '本月';
    }

    // ================================================================
    // 底部合计更新
    // ================================================================
    function updateTeamPaneSummary(summary) {
        var s = summary || {};
        $('#teamPaneSummary').html(
            '合计：总利润 ' + (s.total_profit || '0.00') +
            ' ｜ 总金额 ' + (s.total_money || '0.00') +
            ' ｜ 利润率 ' + (s.profit_rate || '0.00') + '%'
        );
    }

    function updateMemberPaneSummary(summary) {
        var s = summary || {};
        $('#memberPaneSummary').html(
            '合计：总利润 ' + (s.total_profit || '0.00') +
            ' ｜ 总金额 ' + (s.total_money || '0.00') +
            ' ｜ 利润率 ' + (s.profit_rate || '0.00') + '%'
        );
    }

    function updateMemberDetailPaneSummary(summary) {
        var s = summary || {};
        $('#memberDetailPaneSummary').html(
            '合计：实际业绩 ' + (s.total_split_profit || s.total_profit || '0.00')
        );
    }

    // ================================================================
    // 状态保存（选中团队 / 成员）
    // ================================================================
    var TeamState = {
        lastTeamId: null,
        lastTeamName: null,
        lastMemberName: null,
        lastTimebucket: 'month',
        lastAtTime: '',
        lastMonthKeys: ''
    };

    // ================================================================
    // 渲染左屏团队列表
    // ================================================================
    function renderTeamTable(data) {
        var $tbody = $('#teamPerformanceTableBody');
        $tbody.empty();
        if (!data || !data.length) {
            $tbody.append('<tr><td colspan="4" style="text-align:center;padding:30px;color:#6c757d;">暂无数据</td></tr>');
            return;
        }
        $.each(data, function (idx, item) {
            var teamName = normalizeTeamName(item.team_name);
            var row = '<tr class="team-row" data-team="' + esc(teamName) + '">' +
                '<td style="text-align:center;">' + (item.rank || (idx + 1)) + '</td>' +
                '<td><strong style="color:#4f7cff;">' + esc(teamName) + '</strong></td>' +
                '<td style="text-align:right;color:#28a745;">' + esc(item.profit || '0.00') + '</td>' +
                '<td style="text-align:right;">' + esc(item.profit_rate || '0.00') + '%</td>' +
                '</tr>';
            $tbody.append(row);
        });
        // 恢复之前选中的团队高亮
        if (TeamState.lastTeamId) {
            $('#teamPerformanceTableBody tr.team-row').each(function () {
                if (normalizeTeamName($(this).data('team')) === TeamState.lastTeamId) {
                    $(this).addClass('is-active');
                }
            });
        }
    }

    // ================================================================
    // 加载左屏团队数据
    // ================================================================
    function loadTeamData(timebucket, at_time, month_keys, successCb, errorCb) {
        var $filterBtn = $('#teamPerformanceFilterBtn');
        var $resetBtn  = $('#teamPerformanceResetBtn');
        var origFilter = $filterBtn.html();
        var origReset  = $resetBtn.html();
        $filterBtn.prop('disabled', true).html('<i class="bi bi-hourglass-split"></i> 加载中...');
        $resetBtn.prop('disabled', true);

        // 更新状态
        TeamState.lastTimebucket = month_keys ? '' : (timebucket || 'month');
        TeamState.lastAtTime     = at_time || '';
        TeamState.lastMonthKeys  = month_keys || '';

        $.ajax({
            url: '{:url("DataStatistics/getTeamPerformanceData")}',
            type: 'POST',
            data: { timebucket: timebucket || '', at_time: at_time || '', month_keys: month_keys || '' },
            dataType: 'json',
            timeout: 30000,
            success: function (res) {
                $filterBtn.prop('disabled', false).html(origFilter);
                $resetBtn.prop('disabled', false).html(origReset);

                if (res.code === 0 || res.code === 200) {
                    var allData = res.data || [];
                    renderTeamTable(allData);
                    updateTeamPaneSummary(res.summary);

                    // 联动：检查当前选中团队是否还在新数据里
                    if (TeamState.lastTeamId) {
                        var exists = false;
                        $.each(allData, function (_, t) {
                            if (normalizeTeamName(t.team_name) === TeamState.lastTeamId) {
                                exists = true;
                                return false;
                            }
                        });
                        if (exists) {
                            renderMemberRank(TeamState.lastTeamId, TeamState.lastTeamName, timebucket, at_time, month_keys);
                        } else {
                            // 团队在新时间范围内没有数据，清空中右屏
                            clearMidPane('当前时间范围无该团队数据');
                            clearRightPane();
                            TeamState.lastTeamId   = null;
                            TeamState.lastTeamName = null;
                            TeamState.lastMemberName = null;
                            updateMemberPaneSummary(null);
                            updateMemberDetailPaneSummary(null);
                        }
                    }

                    if (successCb) successCb();
                } else {
                    updateTeamPaneSummary(null);
                    layer.msg(res.msg || '获取团队业绩数据失败', { icon: 2 });
                    if (errorCb) errorCb();
                }
            },
            error: function (xhr, status) {
                $filterBtn.prop('disabled', false).html(origFilter);
                $resetBtn.prop('disabled', false).html(origReset);
                updateTeamPaneSummary(null);
                layer.msg(status === 'timeout' ? '请求超时，请稍后重试' : '网络错误，获取数据失败', { icon: 2 });
                if (errorCb) errorCb();
            }
        });
    }

    // ================================================================
    // 空状态辅助
    // ================================================================
    function clearMidPane(msg) {
        $('#memberPane').html('<div class="pane-empty"><i class="bi bi-inbox empty-icon"></i><p>' + esc(msg || '请选择团队查看成员业绩排名') + '</p></div>');
        $('#memberPaneTitle').html('👥 成员业绩排名');
    }

    function clearRightPane(msg) {
        $('#memberDetailPane').html('<div class="pane-empty"><i class="bi bi-inbox empty-icon"></i><p>' + esc(msg || '请点击业务员名称查看个人业绩清单') + '</p></div>');
        $('#memberDetailPaneTitle').html('📋 个人业绩清单');
        updateMemberDetailPaneSummary(null);
    }

    // ================================================================
    // 渲染中屏：成员业绩排名
    // ================================================================
    function renderMemberRank(teamId, teamName, timebucket, at_time, month_keys) {
        teamName = normalizeTeamName(teamName);
        teamId   = normalizeTeamName(teamId);

        TeamState.lastTeamId      = teamId;
        TeamState.lastTeamName    = teamName;
        TeamState.lastTimebucket  = timebucket || 'month';
        TeamState.lastAtTime      = at_time || '';
        TeamState.lastMonthKeys   = month_keys || '';

        var timeDisplay = formatTimeDisplay(timebucket, at_time);
        $('#memberPaneTitle').html('👥 团队：' + esc(teamName) + ' - 成员业绩排名 <small style="font-size:12px;opacity:0.8;">(' + esc(timeDisplay) + ')</small>');

        var $pane = $('#memberPane');
        $pane.html('<div class="text-center" style="padding:60px 20px;color:#6c757d;"><i class="bi bi-hourglass-split" style="font-size:24px;display:block;margin-bottom:15px;"></i><p>加载中...</p></div>');

        $.ajax({
            url: '{:url("DataStatistics/getTeamMemberPerformanceData")}',
            type: 'POST',
            data: { team_name: teamName, timebucket: timebucket || '', at_time: at_time || '', month_keys: month_keys || '' },
            dataType: 'json',
            timeout: 30000,
            success: function (res) {
                if (res.code === 200 && res.data && res.data.length > 0) {
                    renderMemberTable($pane, res.data, teamName, timeDisplay);
                    updateMemberPaneSummary(res.summary);

                    // 联动：检查当前选中成员是否还在新数据里
                    var memberExists = false;
                    if (TeamState.lastMemberName) {
                        $.each(res.data, function (_, m) {
                            if (m.username === TeamState.lastMemberName) { memberExists = true; return false; }
                        });
                    }
                    if (TeamState.lastMemberName && memberExists) {
                        renderMemberDetail(TeamState.lastMemberName, timebucket || TeamState.lastTimebucket, at_time || TeamState.lastAtTime, month_keys || TeamState.lastMonthKeys);
                    } else if (TeamState.lastMemberName && !memberExists) {
                        clearRightPane('当前时间范围无该成员数据');
                        TeamState.lastMemberName = null;
                        updateMemberDetailPaneSummary(null);
                    }
                } else {
                    updateMemberPaneSummary(null);
                    $pane.html('<div class="pane-empty"><i class="bi bi-inbox empty-icon"></i><p>暂无数据</p></div>');
                    if (TeamState.lastMemberName) {
                        clearRightPane('当前时间范围无数据');
                        TeamState.lastMemberName = null;
                        updateMemberDetailPaneSummary(null);
                    }
                }
            },
            error: function (xhr, status) {
                updateMemberPaneSummary(null);
                var msg = status === 'timeout' ? '请求超时，请稍后重试' : '数据加载失败，请稍后重试';
                $pane.html('<div class="text-center" style="padding:60px 20px;color:#dc3545;"><i class="bi bi-exclamation-triangle" style="font-size:48px;display:block;margin-bottom:15px;"></i><p>' + esc(msg) + '</p></div>');
            }
        });
    }

    function renderMemberTable($container, data, teamName, timeDisplay) {
        var html = '<div style="background:#fff;border-radius:8px;overflow:hidden;">' +
            '<div style="padding:12px 16px;border-bottom:1px solid #e9ecef;background:#f8f9fa;">' +
            '<span style="margin-right:20px;color:#495057;">团队名称：<strong style="color:#212529;">' + esc(teamName) + '</strong></span>' +
            '<span style="color:#495057;">时间口径：<strong style="color:#212529;">' + esc(timeDisplay) + '</strong></span>' +
            '</div>' +
            '<div style="overflow-x:auto;">' +
            '<table class="wukong-table" style="width:100%;">' +
            '<thead><tr>' +
            '<th style="width:60px;text-align:center;">排名</th>' +
            '<th>业务员名称</th>' +
            '<th style="text-align:right;">总利润</th>' +
            '<th style="text-align:right;">利润率</th>' +
            '</tr></thead><tbody>';

        $.each(data, function (idx, item) {
            var uname = item.username || '';
            var rateText = item.profit_rate || '0.00';
            var rateDisplay = (rateText === '--') ? '--' : (rateText + '%');
            html += '<tr style="border-bottom:1px solid #dee2e6;">' +
                '<td style="text-align:center;">' + (item.rank || (idx + 1)) + '</td>' +
                '<td><a href="javascript:void(0);" class="member-name-clickable" data-username="' + encodeURIComponent(uname) + '">' + esc(uname) + '</a></td>' +
                '<td style="text-align:right;color:#28a745;">' + esc(item.profit || '0.00') + '</td>' +
                '<td style="text-align:right;">' + esc(rateDisplay) + '</td>' +
                '</tr>';
        });

        html += '</tbody></table></div></div>';
        $container.html(html);
        bindMemberNameClick();
    }

    function bindMemberNameClick() {
        $(document).off('click.dsTeamMember', '.member-name-clickable')
            .on('click.dsTeamMember', '.member-name-clickable', function (e) {
                e.preventDefault();
                $('.member-name-clickable').removeClass('is-active');
                $(this).addClass('is-active');
                var raw = $(this).attr('data-username') || $(this).text().trim();
                var username = raw;
                try { username = decodeURIComponent(raw); } catch (ex) { username = raw; }
                username = (username || '').trim();
                if (!username) return;
                var tp = getTimeParams();
                if (tp) {
                    renderMemberDetail(username, tp.timebucket, tp.at_time, tp.month_keys);
                } else {
                    renderMemberDetail(username, TeamState.lastTimebucket, TeamState.lastAtTime, TeamState.lastMonthKeys);
                }
            });
    }

    // ================================================================
    // 渲染右屏：个人业绩清单
    // ================================================================
    function renderMemberDetail(username, timebucket, at_time, month_keys) {
        TeamState.lastMemberName = username;
        TeamState.lastTimebucket = timebucket || TeamState.lastTimebucket || 'month';
        TeamState.lastAtTime     = at_time || TeamState.lastAtTime || '';
        TeamState.lastMonthKeys  = month_keys || TeamState.lastMonthKeys || '';

        var timeDisplay = formatTimeDisplay(timebucket || TeamState.lastTimebucket, at_time || TeamState.lastAtTime);
        $('#memberDetailPaneTitle').html('📋 ' + esc(username) + ' - 个人业绩清单 <small style="font-size:12px;opacity:0.8;">(' + esc(timeDisplay) + ')</small>');

        var $pane = $('#memberDetailPane');
        $pane.html('<div class="text-center" style="padding:60px 20px;color:#6c757d;"><i class="bi bi-hourglass-split" style="font-size:24px;display:block;margin-bottom:15px;"></i><p>加载中...</p></div>');

        $.ajax({
            url: '{:url("DataStatistics/getMemberPerformanceDetail")}',
            type: 'POST',
            data: {
                username: username,
                team_name: normalizeTeamName(TeamState.lastTeamName || ''),
                timebucket: timebucket || '',
                at_time: at_time || '',
                month_keys: month_keys || TeamState.lastMonthKeys || ''
            },
            dataType: 'json',
            timeout: 30000,
            success: function (res) {
                if (res.code === 403) {
                    updateMemberDetailPaneSummary(null);
                    $pane.html('<div class="text-center" style="padding:60px 20px;color:#dc3545;"><i class="bi bi-shield-exclamation" style="font-size:48px;display:block;margin-bottom:15px;"></i><p>' + esc(res.msg || '无权限查看该成员数据') + '</p></div>');
                    layer.msg(res.msg || '无权限查看该成员数据', { icon: 2 });
                    return;
                }
                if (res.code === 200 && res.data && res.data.length > 0) {
                    renderMemberDetailTable($pane, res.data, username, timeDisplay);
                    updateMemberDetailPaneSummary(res.summary);
                } else {
                    updateMemberDetailPaneSummary(null);
                    $pane.html('<div class="pane-empty"><i class="bi bi-inbox empty-icon"></i><p>暂无数据</p></div>');
                }
            },
            error: function (xhr, status) {
                updateMemberDetailPaneSummary(null);
                var msg = status === 'timeout' ? '请求超时，请稍后重试' : '数据加载失败，请稍后重试';
                $pane.html('<div class="text-center" style="padding:60px 20px;color:#dc3545;"><i class="bi bi-exclamation-triangle" style="font-size:48px;display:block;margin-bottom:15px;"></i><p>' + esc(msg) + '</p></div>');
            }
        });
    }

    function renderMemberDetailTable($container, data, username, timeDisplay) {
        var html = '<div style="background:#fff;border-radius:8px;overflow:hidden;">' +
            '<div style="padding:12px 16px;border-bottom:1px solid #e9ecef;background:#f8f9fa;">' +
            '<span style="margin-right:20px;color:#495057;">业务员：<strong style="color:#212529;">' + esc(username) + '</strong></span>' +
            '<span style="color:#495057;">时间口径：<strong style="color:#212529;">' + esc(timeDisplay) + '</strong></span>' +
            '</div>' +
            '<div style="overflow-x:auto;">' +
            '<table class="wukong-table" style="width:100%;">' +
            '<thead><tr>' +
            '<th>成交日期</th>' +
            '<th>客户名称</th>' +
            '<th style="text-align:center;">角色</th>' +
            '<th style="text-align:right;">占比</th>' +
            '<th style="text-align:right;">实际业绩</th>' +
            '</tr></thead><tbody>';

        $.each(data, function (_, item) {
            var rateDisplay = item.rate_display || (((item.rate || '0.00') + '').replace('%', '') + '%');
            html += '<tr style="border-bottom:1px solid #dee2e6;">' +
                '<td>' + esc(item.deal_time || item.order_time || item.deal_date || '') + '</td>' +
                '<td>' + esc(item.cname || item.client_name || item.customer_name || '') + '</td>' +
                '<td style="text-align:center;">' + esc(item.role_type || '') + '</td>' +
                '<td style="text-align:right;">' + esc(rateDisplay) + '</td>' +
                '<td style="text-align:right;color:#28a745;">' + esc(item.split_profit || item.profit || '0.00') + '</td>' +
                '</tr>';
        });

        html += '</tbody></table></div></div>';
        $container.html(html);
    }

    // ================================================================
    // 导出
    // ================================================================
    function buildExportFallbackName(prefix) {
        var now = new Date();
        var pad = function (n) { n = parseInt(n, 10) || 0; return n < 10 ? '0' + n : String(n); };
        var ts = now.getFullYear() + pad(now.getMonth() + 1) + pad(now.getDate()) + '_' +
                 pad(now.getHours()) + pad(now.getMinutes()) + pad(now.getSeconds());
        return (prefix || '导出') + '_' + ts + '.xlsx';
    }

    function parseDownloadFilename(disposition, fallback) {
        if (!disposition) return fallback;
        var m1 = disposition.match(/filename\*\s*=\s*UTF-8''([^;]+)/i);
        if (m1 && m1[1]) { try { return decodeURIComponent(m1[1].trim()); } catch (e) {} }
        var m2 = disposition.match(/filename\s*=\s*"([^"]+)"/i) || disposition.match(/filename\s*=\s*([^;]+)/i);
        if (m2 && m2[1]) return m2[1].replace(/^["']|["']$/g, '').trim() || fallback;
        return fallback;
    }

    function triggerDownload(blob, filename) {
        var url = window.URL.createObjectURL(blob);
        var a = document.createElement('a');
        a.style.display = 'none';
        a.href = url;
        a.download = filename;
        document.body.appendChild(a);
        a.click();
        setTimeout(function () { window.URL.revokeObjectURL(url); document.body.removeChild(a); }, 0);
    }

    function doExport() {
        var tp = getTimeParams();
        if (!tp) return;
        var $btn = $('#teamPerformanceExportBtn');
        if ($btn.data('exporting') === 1) return;
        var origHtml = $btn.html();
        $btn.data('exporting', 1).prop('disabled', true).html('<i class="bi bi-hourglass-split"></i> 导出中');
        var loading = layer.msg('正在导出，请稍候...', { icon: 16, shade: 0.2, time: 0 });
        var teamName = $.trim(TeamState.lastTeamName || '');
        var memberName = $.trim(TeamState.lastMemberName || '');
        fetch('{:url("DataStatistics/exportTeamPerformanceSummary")}', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/x-www-form-urlencoded; charset=UTF-8',
                'X-Requested-With': 'XMLHttpRequest'
            },
            body: $.param({ timebucket: tp.timebucket || '', at_time: tp.at_time || '', month_keys: tp.month_keys || '', team_name: teamName, username: memberName }),
            credentials: 'same-origin'
        }).then(function (response) {
            var ct = (response.headers.get('content-type') || '').toLowerCase();
            if (ct.indexOf('application/json') !== -1) {
                return response.json().then(function (j) { throw new Error((j && j.msg) ? j.msg : '导出失败'); });
            }
            if (!response.ok) throw new Error('导出失败，请稍后重试');
            return response.blob().then(function (blob) {
                return { blob: blob, disposition: response.headers.get('content-disposition') || '' };
            });
        }).then(function (result) {
            if (!result || !result.blob || result.blob.size <= 0) throw new Error('导出失败：生成文件为空');
            var filename = parseDownloadFilename(result.disposition, buildExportFallbackName('团队业绩表'));
            triggerDownload(result.blob, filename);
            layer.msg('导出成功', { icon: 1 });
        }).catch(function (err) {
            layer.msg((err && err.message) ? err.message : '导出失败，请稍后重试', { icon: 2, time: 4000 });
        }).finally(function () {
            layer.close(loading);
            $btn.data('exporting', 0).prop('disabled', false).html(origHtml);
        });
    }

    // ================================================================
    // 分栏折叠 / 最大化 / 刷新按钮事件
    // ================================================================
    function bindSplitEvents() {
        var DEFAULT = { left: '36%', mid: '29%', right: '35%' };
        var COLLAPSED = '64px';

        function getPanels() {
            return {
                $left:  $('#dsTeamSplitLayout .split-left').first(),
                $mid:   $('#dsTeamSplitLayout .split-mid').first(),
                $right: $('#dsTeamSplitLayout .split-right').first()
            };
        }

        // 左列最大化
        $('#dsTeamSplitLeftMaximize').off('click').on('click', function () {
            var p = getPanels();
            if (p.$left.hasClass('maximized')) {
                p.$left.removeClass('maximized').css('width', DEFAULT.left);
                p.$mid.removeClass('hidden').css('width', DEFAULT.mid);
                p.$right.css('width', DEFAULT.right);
            } else {
                p.$left.addClass('maximized').css('width', '100%');
                p.$mid.addClass('hidden').css('width', '0');
                p.$right.css('width', '0');
            }
        });

        // 左列折叠
        $('#dsTeamSplitLeftCollapse').off('click').on('click', function () {
            var p = getPanels();
            if (p.$left.hasClass('collapsed')) {
                p.$left.removeClass('collapsed').css('width', DEFAULT.left);
                p.$mid.css('width', DEFAULT.mid);
                p.$right.css('width', DEFAULT.right);
            } else {
                p.$left.addClass('collapsed').css('width', COLLAPSED);
                p.$mid.css('width', 'calc((100% - 64px) * 0.453)');
                p.$right.css('width', 'calc((100% - 64px) * 0.547)');
            }
        });

        // 中列最大化
        $('#dsTeamSplitMidMaximize').off('click').on('click', function () {
            var p = getPanels();
            if (p.$mid.hasClass('maximized')) {
                p.$mid.removeClass('maximized').css('width', DEFAULT.mid);
                p.$right.css('width', DEFAULT.right);
                p.$left.removeClass('hidden').css('width', DEFAULT.left);
            } else {
                p.$mid.addClass('maximized').css('width', '100%');
                p.$right.css('width', '0');
                p.$left.addClass('hidden').css('width', '0');
            }
        });

        // 中列折叠
        $('#dsTeamSplitMidCollapse').off('click').on('click', function () {
            var p = getPanels();
            if (p.$mid.hasClass('collapsed')) {
                p.$mid.removeClass('collapsed').css('width', DEFAULT.mid);
                p.$right.css('width', DEFAULT.right);
                p.$left.css('width', DEFAULT.left);
            } else {
                p.$mid.addClass('collapsed').css('width', COLLAPSED);
                p.$left.css('width', 'calc((100% - 64px) * 0.507)');
                p.$right.css('width', 'calc((100% - 64px) * 0.493)');
            }
        });

        // 右列最大化
        $('#dsTeamSplitRightMaximize').off('click').on('click', function () {
            var p = getPanels();
            if (p.$right.hasClass('maximized')) {
                p.$right.removeClass('maximized').css('width', DEFAULT.right);
                p.$left.removeClass('hidden').css('width', DEFAULT.left);
                p.$mid.css('width', DEFAULT.mid);
            } else {
                p.$right.addClass('maximized').css('width', '100%');
                p.$left.addClass('hidden').css('width', '0');
                p.$mid.css('width', '0');
            }
        });

        // 右列折叠
        $('#dsTeamSplitRightCollapse').off('click').on('click', function () {
            var p = getPanels();
            if (p.$right.hasClass('collapsed')) {
                p.$right.removeClass('collapsed').css('width', DEFAULT.right);
                p.$mid.css('width', DEFAULT.mid);
                p.$left.css('width', DEFAULT.left);
            } else {
                p.$right.addClass('collapsed').css('width', COLLAPSED);
                p.$left.css('width', 'calc((100% - 64px) * 0.554)');
                p.$mid.css('width', 'calc((100% - 64px) * 0.446)');
            }
        });

        // 中列刷新
        $('#dsTeamSplitMidRefresh').off('click').on('click', function () {
            if (TeamState.lastTeamId) {
                var tp = getTimeParams() || { timebucket: TeamState.lastTimebucket, at_time: TeamState.lastAtTime, month_keys: TeamState.lastMonthKeys };
                renderMemberRank(TeamState.lastTeamId, TeamState.lastTeamName, tp.timebucket, tp.at_time, tp.month_keys);
            } else {
                layer.msg('请先选择团队', { icon: 2 });
            }
        });

        // 右列刷新
        $('#dsTeamSplitRightRefresh').off('click').on('click', function () {
            if (TeamState.lastMemberName) {
                renderMemberDetail(TeamState.lastMemberName, TeamState.lastTimebucket, TeamState.lastAtTime, TeamState.lastMonthKeys);
            } else {
                layer.msg('请先选择业务员', { icon: 2 });
            }
        });
    }

    // ================================================================
    // 绑定筛选 / 重置 / 导出 / 月份快捷事件
    // ================================================================
    function bindFilterEvents() {
        // 月份快捷初始化
        renderMonthQuickSelect($('#teamPerformanceMonthShortcutWrap'));

        $(document).on('click', '#teamPerformanceMonthShortcutWrap .month-quick-select-btn', function () {
            var month = parseInt($(this).attr('data-month'), 10);
            if (isNaN(month) || month < 1 || month > 12) return;
            var idx = monthState.selectedMonths.indexOf(month);
            if (idx > -1) {
                monthState.selectedMonths.splice(idx, 1);
            } else {
                monthState.selectedMonths.push(month);
            }
            monthState.selectedMonths.sort(function (a, b) { return a - b; });
            syncMonthQuickState();
            if (monthState.selectedMonths.length) {
                $('#teamPerformanceStartDate').val('');
                $('#teamPerformanceEndDate').val('');
                $('#teamPerformanceCustomTimeRange').css('display', 'none');
                if (($('#teamPerformanceTimeFilter').val() || '').trim() === 'custom') {
                    $('#teamPerformanceTimeFilter').val('month');
                }
            }
        });

        // 时间筛选下拉变化
        $('#teamPerformanceTimeFilter').on('change', function () {
            clearMonthQuickState();
            if ($(this).val() === 'custom') {
                $('#teamPerformanceCustomTimeRange').css('display', 'flex');
            } else {
                $('#teamPerformanceCustomTimeRange').css('display', 'none');
            }
        });

        // 自定义日期输入时清除月份快捷
        $('#teamPerformanceStartDate, #teamPerformanceEndDate').on('change', function () {
            clearMonthQuickState();
        });

        // 筛选按钮
        $('#teamPerformanceFilterBtn').on('click', function () {
            var tp = getTimeParams();
            if (!tp) return;
            loadTeamData(tp.timebucket, tp.at_time, tp.month_keys);
        });

        // 重置按钮
        $('#teamPerformanceResetBtn').on('click', function () {
            $('#teamPerformanceTimeFilter').val('month');
            $('#teamPerformanceStartDate').val('');
            $('#teamPerformanceEndDate').val('');
            $('#teamPerformanceCustomTimeRange').css('display', 'none');
            clearMonthQuickState();
            loadTeamData('month', '', '');
        });

        // 导出按钮
        $('#teamPerformanceExportBtn').on('click', function () {
            doExport();
        });
    }

    // ================================================================
    // 团队行点击（左屏）
    // ================================================================
    function bindTeamRowClick() {
        $(document).off('click.dsTeamRow', '#teamPerformanceTableBody tr.team-row')
            .on('click.dsTeamRow', '#teamPerformanceTableBody tr.team-row', function () {
                $('#teamPerformanceTableBody tr.team-row').removeClass('is-active');
                $(this).addClass('is-active');
                var teamName = normalizeTeamName($(this).data('team') || $(this).find('td').eq(1).text().trim());
                var tp = getTimeParams();
                if (!tp) return;
                renderMemberRank(teamName, teamName, tp.timebucket, tp.at_time, tp.month_keys);
            });
    }

    // ================================================================
    // 初始化
    // ================================================================
    $(document).ready(function () {
        bindFilterEvents();
        bindSplitEvents();
        bindTeamRowClick();

        // 页面加载时默认加载本月团队数据
        loadTeamData('month', '', '');
    });

})();
</script>
