{include file="common/head"/}
<style>
    #teamPerf-wrap { padding: 20px; }
    #teamPerf-filter { display:flex; flex-wrap:wrap; gap:10px; align-items:center; margin-bottom:16px; }
    #teamPerf-filter select, #teamPerf-filter input { height:34px; padding:0 8px; border:1px solid #ccc; border-radius:4px; font-size:13px; }
    #teamPerf-filter button { height:34px; padding:0 16px; border:none; border-radius:4px; cursor:pointer; font-size:13px; }
    #teamPerf-btn-search { background:#4f7cff; color:#fff; }
    #teamPerf-btn-back   { background:#6c757d; color:#fff; }
    #teamPerf-summary { display:flex; gap:20px; flex-wrap:wrap; margin-bottom:14px; }
    .teamPerf-summary-card { background:#fff; border:1px solid #dee2e6; border-radius:6px; padding:12px 20px; min-width:140px; text-align:center; }
    .teamPerf-summary-card .label { font-size:12px; color:#6c757d; margin-bottom:4px; }
    .teamPerf-summary-card .value { font-size:18px; font-weight:600; color:#212529; }
    #teamPerf-table-wrap { background:#fff; border-radius:6px; border:1px solid #dee2e6; overflow-x:auto; }
    #teamPerf-table { width:100%; border-collapse:collapse; font-size:13px; }
    #teamPerf-table thead th { background:#f8f9fa; padding:10px 12px; text-align:left; font-weight:600; color:#495057; border-bottom:2px solid #dee2e6; white-space:nowrap; }
    #teamPerf-table tbody td { padding:10px 12px; border-bottom:1px solid #f0f0f0; }
    #teamPerf-table tbody tr:hover { background:#f8f9fa; }
    .text-right { text-align:right; }
    .text-center { text-align:center; }
    .profit-pos { color:#28a745; }
    .team-name-link { color:#4f7cff; cursor:pointer; font-weight:600; text-decoration:none; }
    .team-name-link:hover { color:#6fa1ff; text-decoration:underline; }
    .custom-range-row { display:none; align-items:center; gap:6px; }
    .custom-range-row.show { display:flex; }
</style>

<div id="teamPerf-wrap">
    <div style="display:flex; align-items:center; margin-bottom:16px; gap:12px;">
        <button id="teamPerf-btn-back" onclick="history.back()">← 返回</button>
        <h4 style="margin:0;">团队业绩表</h4>
    </div>

    <div id="teamPerf-filter">
        <select id="teamPerf-timebucket" onchange="onTeamPerfTimebucketChange()">
            <option value="month">本月</option>
            <option value="last_month">上月</option>
            <option value="week">本周</option>
            <option value="year">本年</option>
            <option value="custom">自定义</option>
        </select>
        <div class="custom-range-row" id="teamPerf-custom-range-row">
            <input type="date" id="teamPerf-date-start" />
            <span>至</span>
            <input type="date" id="teamPerf-date-end" />
        </div>
        <button id="teamPerf-btn-search" onclick="loadTeamPerfData()">查询</button>
    </div>

    <div id="teamPerf-summary">
        <div class="teamPerf-summary-card">
            <div class="label">总利润</div>
            <div class="value profit-pos" id="teamPerf-sum-profit">—</div>
        </div>
        <div class="teamPerf-summary-card">
            <div class="label">总金额</div>
            <div class="value" id="teamPerf-sum-money">—</div>
        </div>
        <div class="teamPerf-summary-card">
            <div class="label">综合利润率</div>
            <div class="value" id="teamPerf-sum-rate">—</div>
        </div>
    </div>

    <div id="teamPerf-table-wrap">
        <table id="teamPerf-table">
            <thead>
                <tr>
                    <th class="text-center">排名</th>
                    <th>团队名称</th>
                    <th class="text-right">利润</th>
                    <th class="text-right">总金额</th>
                    <th class="text-right">利润率(%)</th>
                </tr>
            </thead>
            <tbody id="teamPerf-tbody">
                <tr><td colspan="5" style="text-align:center;color:#6c757d;padding:30px;">请点击【查询】加载数据</td></tr>
            </tbody>
        </table>
    </div>
</div>

<script>
function onTeamPerfTimebucketChange() {
    var v = document.getElementById('teamPerf-timebucket').value;
    var row = document.getElementById('teamPerf-custom-range-row');
    if (v === 'custom') { row.classList.add('show'); } else { row.classList.remove('show'); }
}

function loadTeamPerfData() {
    var timebucket = document.getElementById('teamPerf-timebucket').value;
    var at_time = '';
    if (timebucket === 'custom') {
        var ds = document.getElementById('teamPerf-date-start').value;
        var de = document.getElementById('teamPerf-date-end').value;
        if (!ds || !de) { alert('请选择自定义日期范围'); return; }
        at_time = ds + ',' + de;
        timebucket = '';
    }

    var tbody = document.getElementById('teamPerf-tbody');
    tbody.innerHTML = '<tr><td colspan="5" style="text-align:center;padding:30px;color:#6c757d;">加载中...</td></tr>';
    document.getElementById('teamPerf-sum-profit').textContent = '—';
    document.getElementById('teamPerf-sum-money').textContent  = '—';
    document.getElementById('teamPerf-sum-rate').textContent   = '—';

    var params = 'timebucket=' + encodeURIComponent(timebucket) + '&at_time=' + encodeURIComponent(at_time);
    var xhr = new XMLHttpRequest();
    xhr.open('POST', '{:url("DataStatistics/getTeamPerformanceData")}', true);
    xhr.setRequestHeader('Content-Type', 'application/x-www-form-urlencoded');
    xhr.onreadystatechange = function() {
        if (xhr.readyState !== 4) return;
        if (xhr.status !== 200) {
            tbody.innerHTML = '<tr><td colspan="5" style="text-align:center;padding:20px;color:#dc3545;">请求失败（HTTP ' + xhr.status + '）</td></tr>';
            return;
        }
        try {
            var res = JSON.parse(xhr.responseText);
            if (res.code !== 0 && res.code !== 200) {
                tbody.innerHTML = '<tr><td colspan="5" style="text-align:center;padding:20px;color:#dc3545;">' + esc(res.msg || '获取失败') + '</td></tr>';
                return;
            }
            renderTeamPerfTable(res.data || [], res.summary || {});
        } catch(e) {
            tbody.innerHTML = '<tr><td colspan="5" style="text-align:center;padding:20px;color:#dc3545;">响应解析失败</td></tr>';
        }
    };
    xhr.send(params);
}

function renderTeamPerfTable(rows, summary) {
    document.getElementById('teamPerf-sum-profit').textContent = summary.total_profit !== undefined ? summary.total_profit : '—';
    document.getElementById('teamPerf-sum-money').textContent  = summary.total_money  !== undefined ? summary.total_money  : '—';
    document.getElementById('teamPerf-sum-rate').textContent   = summary.profit_rate  !== undefined ? (summary.profit_rate + '%') : '—';

    var tbody = document.getElementById('teamPerf-tbody');
    if (!rows.length) {
        tbody.innerHTML = '<tr><td colspan="5" style="text-align:center;padding:30px;color:#6c757d;">暂无数据</td></tr>';
        return;
    }
    var html = '';
    for (var i = 0; i < rows.length; i++) {
        var r = rows[i];
        var teamName = esc(r.team_name);
        var timebucket = document.getElementById('teamPerf-timebucket').value;
        var at_time_val = document.getElementById('teamPerf-date-start') ? (document.getElementById('teamPerf-date-start').value || '') : '';
        var at_time_e   = document.getElementById('teamPerf-date-end')   ? (document.getElementById('teamPerf-date-end').value   || '') : '';
        var at_time = (timebucket === 'custom' && at_time_val && at_time_e) ? (at_time_val + ',' + at_time_e) : '';
        var memberUrl = '{:url("DataStatistics/teamMemberPerformancePage")}'
            + '?team_name=' + encodeURIComponent(r.team_name || '')
            + '&timebucket=' + encodeURIComponent(timebucket === 'custom' ? '' : timebucket)
            + '&at_time=' + encodeURIComponent(at_time);
        html += '<tr>'
            + '<td class="text-center">' + (r.rank || (i+1)) + '</td>'
            + '<td><a href="' + memberUrl + '" target="_blank" class="team-name-link">' + teamName + '</a></td>'
            + '<td class="text-right profit-pos">' + esc(r.profit) + '</td>'
            + '<td class="text-right">' + esc(r.total_money) + '</td>'
            + '<td class="text-right">' + esc(r.profit_rate) + '%</td>'
            + '</tr>';
    }
    tbody.innerHTML = html;
}

function esc(s) {
    if (s === null || s === undefined) return '';
    return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

loadTeamPerfData();
</script>
{include file="common/foot"/}
