{include file="common/head"/}
<style>
    html, body { height: 100%; margin: 0; padding: 0; overflow: hidden; }
    #orderProductSummarySplitLayout {
        display: flex;
        position: fixed;
        top: 0; left: 0; right: 0; bottom: 0;
        background: #f6f8fb;
        z-index: 1000;
    }
    .split-wrap { display: flex; height: 100%; width: 100%; overflow: hidden; }
    .split-left, .split-mid, .split-right { transition: width 0.3s ease; overflow: hidden; }
    .split-left.hidden, .split-mid.hidden, .split-right.hidden { display: none !important; }
    .split-left.collapsed, .split-mid.collapsed, .split-right.collapsed { width: 64px !important; border: none !important; }
    .split-left.maximized, .split-mid.maximized, .split-right.maximized { width: 100% !important; }
    /* 选中高亮（青绿色） */
    #orderProductSummarySplitLayout .order-product-team-clickable.is-active,
    #orderProductSummarySplitLayout .order-product-user-clickable.is-active {
        background-color: #ccfbf1;
        color: #0f766e !important;
        padding: 2px 6px;
        border-radius: 4px;
    }
    .split-first-filter-bar {
        padding: 8px 15px 6px;
        gap: 6px;
        margin-bottom: 0;
        align-items: flex-start;
        border-bottom: 1px solid #e9ecef;
        display: flex;
        flex-wrap: wrap;
        flex-shrink: 0;
    }
    .split-first-filter-bar .split-first-filter-main {
        width: 100%;
        display: flex;
        align-items: center;
        gap: 8px;
        flex-wrap: wrap;
    }
    .split-first-filter-bar .split-first-time-label { margin: 0; white-space: nowrap; }
    .split-first-filter-bar .split-first-time-filter { width: auto; min-width: 80px; }
    .split-first-month-shortcut { width: 100%; }
    .month-quick-select { width: 100%; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
    .month-quick-select-label { margin: 0; white-space: nowrap; font-weight: 600; }
    .month-quick-select-buttons { display: flex; flex-wrap: nowrap; gap: 6px; flex: 1; min-width: 0; overflow-x: auto; white-space: nowrap; align-items: center; }
    .month-quick-select-btn {
        margin: 0; padding: 2px 8px; min-width: auto; border-radius: 4px; font-size: 12px;
        line-height: 1.2; flex: 0 0 auto; border: 1px solid #dcdfe6; background: #fff; color: #606266; cursor: pointer;
    }
    .month-quick-select-btn.active { background: #0f766e; color: #fff; border-color: #0f766e; }
    .wukong-table { width: 100%; border-collapse: collapse; font-size: 13px; }
    .wukong-table th, .wukong-table td { padding: 8px 10px; border: 1px solid #e9ecef; }
    .wukong-table thead th { background: #f8f9fa; font-weight: 600; }
    .wukong-table tbody tr:hover { background: #f0fdf4; }
</style>

<div id="orderProductSummarySplitLayout">
    <div class="split-wrap order-product-split-wrap" style="display:flex;height:100%;width:100%;overflow:hidden;">
        <div class="split-left order-product-split-left" style="width:30%;background:#ffffff;border-right:1px solid #e9ecef;display:flex;flex-direction:column;overflow:hidden;">
            <div class="pane-header" style="padding:15px;background:linear-gradient(90deg,#0f766e,#14b8a6);color:#fff;display:flex;align-items:center;justify-content:space-between;flex-shrink:0;">
                <span style="font-size:16px;font-weight:600;">📦 公司产品利润/销量排行</span>
                <div>
                    <button class="btn btn-sm btn-light" id="orderProductSplitLeftMaximize" title="最大化/恢复"><i class="bi bi-arrows-angle-expand"></i></button>
                    <button class="btn btn-sm btn-light" id="orderProductSplitLeftCollapse" title="收起/展开"><i class="bi bi-chevron-left"></i></button>
                    <a class="btn btn-sm btn-light" href="{:url('DataStatistics/index')}" title="返回" style="margin-left:8px;"><i class="bi bi-arrow-left"></i> 返回</a>
                </div>
            </div>
            <div class="filter-bar split-first-filter-bar" id="orderProductSummaryTimeFilterBar">
                <div class="split-first-filter-main">
                    <label class="split-first-time-label">时间筛选：</label>
                    <select id="orderProductSummaryTimeFilter" class="form-select split-first-time-filter">
                        <option value="today">今天</option>
                        <option value="yesterday">昨天</option>
                        <option value="week">本周</option>
                        <option value="month" selected>本月</option>
                        <option value="year">本年</option>
                        <option value="custom">自定义</option>
                    </select>
                    <div id="orderProductSummaryCustomTimeRange" style="display:none;gap:8px;align-items:center;">
                        <input type="date" id="orderProductSummaryStartDate" class="form-control" style="width:150px;">
                        <span>至</span>
                        <input type="date" id="orderProductSummaryEndDate" class="form-control" style="width:150px;">
                    </div>
                    <button type="button" class="btn btn-primary btn-sm split-first-filter-btn" id="orderProductSummaryFilterBtn">
                        <i class="bi bi-search"></i> 筛选
                    </button>
                    <button type="button" class="btn btn-secondary btn-sm split-first-reset-btn" id="orderProductSummaryResetBtn">
                        <i class="bi bi-arrow-counterclockwise"></i> 重置
                    </button>
                    <button type="button" class="btn btn-success btn-sm" id="orderProductSummaryExportBtn">
                        <i class="bi bi-download"></i> 导出
                    </button>
                </div>
                <div id="orderProductSummaryMonthShortcutWrap" class="split-first-month-shortcut"></div>
            </div>
            <div id="orderProductCompanyPane" style="flex:1;overflow-y:auto;padding:12px 20px 16px;"></div>
            <div id="orderProductCompanyPaneSummary" style="padding:10px 20px;border-top:1px solid #e9ecef;background:#fafafa;flex-shrink:0;color:#333;font-weight:600;">合计：产品种类 0 ｜ 总利润 0.00 ｜ 总销量 0</div>
        </div>

        <div class="split-mid order-product-split-mid" style="width:35%;background:#ffffff;border-right:1px solid #e9ecef;display:flex;flex-direction:column;overflow:hidden;">
            <div class="pane-header" style="padding:15px;background:linear-gradient(90deg,#0f766e,#14b8a6);color:#fff;display:flex;align-items:center;justify-content:space-between;flex-shrink:0;">
                <span style="font-size:16px;font-weight:600;" id="orderProductTeamPaneTitle">👥 团队成员列表</span>
                <div>
                    <button class="btn btn-sm btn-light" id="orderProductSplitMidRefresh" title="刷新"><i class="bi bi-arrow-repeat"></i> 刷新</button>
                    <button class="btn btn-sm btn-light" id="orderProductSplitMidMaximize" title="最大化/恢复"><i class="bi bi-arrows-angle-expand"></i></button>
                    <button class="btn btn-sm btn-light" id="orderProductSplitMidCollapse" title="收起/展开"><i class="bi bi-chevron-right"></i></button>
                </div>
            </div>
            <div id="orderProductTeamPane" style="flex:1;overflow-y:auto;padding:20px;">
                <div class="empty" style="text-align:center;padding:60px 20px;color:#6c757d;">
                    <i class="bi bi-inbox" style="font-size:48px;margin-bottom:15px;display:block;"></i>
                    <p style="font-size:16px;margin:0;">请选择团队展开成员列表</p>
                </div>
            </div>
            <div id="orderProductTeamPaneSummary" style="padding:10px 20px;border-top:1px solid #e9ecef;background:#fafafa;flex-shrink:0;color:#333;font-weight:600;">合计：团队数 0 ｜ 成员数 0</div>
        </div>

        <div class="split-right order-product-split-right" style="width:35%;background:#ffffff;display:flex;flex-direction:column;overflow:hidden;">
            <div class="pane-header" style="padding:15px;background:linear-gradient(90deg,#0f766e,#14b8a6);color:#fff;display:flex;align-items:center;justify-content:space-between;flex-shrink:0;">
                <span style="font-size:16px;font-weight:600;" id="orderProductUserPaneTitle">📦 产品利润/销量排行</span>
                <div>
                    <button class="btn btn-sm btn-light" id="orderProductSplitRightRefresh" title="刷新"><i class="bi bi-arrow-repeat"></i> 刷新</button>
                    <button class="btn btn-sm btn-light" id="orderProductSplitRightMaximize" title="最大化/恢复"><i class="bi bi-arrows-angle-expand"></i></button>
                    <button class="btn btn-sm btn-light" id="orderProductSplitRightCollapse" title="收起/展开"><i class="bi bi-chevron-right"></i></button>
                </div>
            </div>
            <div id="orderProductUserPane" style="flex:1;overflow-y:auto;padding:20px;">
                <div class="empty" style="text-align:center;padding:60px 20px;color:#6c757d;">
                    <i class="bi bi-inbox" style="font-size:48px;margin-bottom:15px;display:block;"></i>
                    <p style="font-size:16px;margin:0;">请点击团队或团队成员查看产品利润/销量排行</p>
                </div>
            </div>
            <div id="orderProductUserPaneSummary" style="padding:10px 20px;border-top:1px solid #e9ecef;background:#fafafa;flex-shrink:0;color:#333;font-weight:600;">合计：产品种类 0 ｜ 总利润 0.00 ｜ 总销量 0</div>
        </div>
    </div>
</div>

<template id="monthQuickSelectTemplate">
    <div class="month-quick-select">
        <label class="month-quick-select-label">月份快捷：</label>
        <div class="month-quick-select-buttons">
            <button type="button" class="month-quick-select-btn" data-month="1">1</button>
            <button type="button" class="month-quick-select-btn" data-month="2">2</button>
            <button type="button" class="month-quick-select-btn" data-month="3">3</button>
            <button type="button" class="month-quick-select-btn" data-month="4">4</button>
            <button type="button" class="month-quick-select-btn" data-month="5">5</button>
            <button type="button" class="month-quick-select-btn" data-month="6">6</button>
            <button type="button" class="month-quick-select-btn" data-month="7">7</button>
            <button type="button" class="month-quick-select-btn" data-month="8">8</button>
            <button type="button" class="month-quick-select-btn" data-month="9">9</button>
            <button type="button" class="month-quick-select-btn" data-month="10">10</button>
            <button type="button" class="month-quick-select-btn" data-month="11">11</button>
            <button type="button" class="month-quick-select-btn" data-month="12">12</button>
        </div>
    </div>
</template>

<script>
(function () {
    // ---- 月份快捷选择 ----
    var monthQuickStateMap = {};

    function renderMonthQuickSelect($wrap) {
        if (!$wrap || !$wrap.length) return;
        if ($wrap.find('.month-quick-select').length) return;
        var tpl = $('#monthQuickSelectTemplate').html() || '';
        if (tpl) { $wrap.html(tpl); }
    }

    function initMonthQuickSelect(opts) {
        var options = opts || {};
        var key = options.key;
        var wrapSelector = options.wrapSelector;
        if (!key || !wrapSelector) return;
        if (!monthQuickStateMap[key]) { monthQuickStateMap[key] = {selectedMonths: []}; }
        $(wrapSelector).each(function () { renderMonthQuickSelect($(this)); });
        $(document)
            .off('click.monthQuickSelect.' + key, wrapSelector + ' .month-quick-select-btn')
            .on('click.monthQuickSelect.' + key, wrapSelector + ' .month-quick-select-btn', function () {
                var state = monthQuickStateMap[key] || {selectedMonths: []};
                var month = parseInt(($(this).attr('data-month') || '').trim(), 10);
                if (isNaN(month) || month < 1 || month > 12) return;
                var idx = state.selectedMonths.indexOf(month);
                if (idx > -1) { state.selectedMonths.splice(idx, 1); } else { state.selectedMonths.push(month); }
                state.selectedMonths.sort(function (a, b) { return a - b; });
                monthQuickStateMap[key] = state;
                syncMonthQuickSelectState(key, wrapSelector);
                if (state.selectedMonths.length) {
                    if (options.startDateSelector) $(options.startDateSelector).val('');
                    if (options.endDateSelector) $(options.endDateSelector).val('');
                    if (options.customRangeSelector) $(options.customRangeSelector).css('display', 'none');
                    if (options.timeFilterSelector && ($(options.timeFilterSelector).val() || '').trim() === 'custom') {
                        $(options.timeFilterSelector).val('month');
                    }
                }
            });
    }

    function syncMonthQuickSelectState(key, wrapSelector) {
        var state = monthQuickStateMap[key] || {selectedMonths: []};
        var selectedMap = {};
        $.each(state.selectedMonths, function (_, month) { selectedMap[month] = true; });
        $(wrapSelector + ' .month-quick-select-btn').each(function () {
            var month = parseInt(($(this).attr('data-month') || '').trim(), 10);
            $(this).toggleClass('active', !!selectedMap[month]);
        });
    }

    function clearMonthQuickSelect(key, wrapSelector) {
        if (!monthQuickStateMap[key]) { monthQuickStateMap[key] = {selectedMonths: []}; }
        monthQuickStateMap[key].selectedMonths = [];
        syncMonthQuickSelectState(key, wrapSelector);
    }

    function getMonthKeys(key) {
        var state = monthQuickStateMap[key] || {selectedMonths: []};
        var selectedMonths = (state.selectedMonths || []).slice();
        if (!selectedMonths.length) return '';
        var year = new Date().getFullYear();
        return selectedMonths.map(function (m) {
            return year + '-' + (m < 10 ? '0' + m : String(m));
        }).join(',');
    }

    // ---- 工具函数 ----
    function escapeHtml(str) {
        if (str == null) return '';
        return String(str)
            .replace(/&/g, '&amp;')
            .replace(/</g, '&lt;')
            .replace(/>/g, '&gt;')
            .replace(/"/g, '&quot;');
    }

    function normalizeTeamName(teamName) {
        teamName = $.trim(teamName || '');
        return teamName ? teamName : '未分组';
    }

    function buildAjaxErrorMessage(xhr, status, fallbackMsg) {
        if (status === 'timeout') { return '请求超时（30秒），请稍后重试'; }
        var jsonMsg = xhr && xhr.responseJSON && xhr.responseJSON.msg ? String(xhr.responseJSON.msg).trim() : '';
        if (jsonMsg) { return jsonMsg; }
        var textMsg = xhr && xhr.responseText ? String(xhr.responseText).replace(/\s+/g, ' ').trim() : '';
        if (textMsg) { return (fallbackMsg || '请求失败') + '：' + textMsg.substr(0, 160); }
        return fallbackMsg || '请求失败，请稍后重试';
    }

    // ---- 时间参数 ----
    function clearOrderProductSummaryMonthShortcutSelection() {
        clearMonthQuickSelect('orderProductSummary', '#orderProductSummaryMonthShortcutWrap');
    }

    function getOrderProductSummaryTimeParams() {
        var timeFilter = ($('#orderProductSummaryTimeFilter').val() || 'month').trim();
        var month_keys = getMonthKeys('orderProductSummary');
        if (month_keys) { return {timebucket: '', at_time: '', month_keys: month_keys}; }
        if (timeFilter === 'custom') {
            var startDate = ($('#orderProductSummaryStartDate').val() || '').trim();
            var endDate = ($('#orderProductSummaryEndDate').val() || '').trim();
            if (startDate && endDate) {
                return {timebucket: '', at_time: startDate + ',' + endDate, month_keys: ''};
            } else {
                layer.msg('请选择开始日期和结束日期', {icon: 2});
                return null;
            }
        }
        return {timebucket: timeFilter || 'month', at_time: '', month_keys: ''};
    }

    // ===== [开始] 订单产品汇总第一屏利润/销量排序改造 =====
    function toOrderProductNumber(val) {
        if (typeof val === 'number') { return isFinite(val) ? val : 0; }
        if (val === null || val === undefined) return 0;
        var parsed = parseFloat(String(val).replace(/,/g, ''));
        return isNaN(parsed) ? 0 : parsed;
    }

    function formatOrderProductAmount2(val) {
        var n = toOrderProductNumber(val);
        var parts = n.toFixed(2).split('.');
        parts[0] = parts[0].replace(/\B(?=(\d{3})+(?!\d))/g, ',');
        return parts.join('.');
    }

    function formatOrderProductQty(val) {
        var n = toOrderProductNumber(val);
        if (Math.abs(n - Math.round(n)) < 0.0000001) { return String(Math.round(n)); }
        return String(parseFloat(n.toFixed(4)));
    }

    function getOrderProductCompanySortValue(item, field) {
        if (field === 'total_profit') {
            if (item.total_profit_raw !== undefined && item.total_profit_raw !== null) {
                return toOrderProductNumber(item.total_profit_raw);
            }
            return toOrderProductNumber(item.total_profit);
        }
        if (item.sale_qty_raw !== undefined && item.sale_qty_raw !== null) {
            return toOrderProductNumber(item.sale_qty_raw);
        }
        return toOrderProductNumber(item.sale_qty);
    }

    function sortOrderProductCompanyRows(data, sortField, sortOrder) {
        var rows = Array.isArray(data) ? data.slice() : [];
        rows.sort(function (a, b) {
            var orderSign = sortOrder === 'asc' ? 1 : -1;
            var aPrimary = getOrderProductCompanySortValue(a, sortField);
            var bPrimary = getOrderProductCompanySortValue(b, sortField);
            if (aPrimary !== bPrimary) { return (aPrimary - bPrimary) * orderSign; }
            var aProfit = getOrderProductCompanySortValue(a, 'total_profit');
            var bProfit = getOrderProductCompanySortValue(b, 'total_profit');
            var aQty = getOrderProductCompanySortValue(a, 'sale_qty');
            var bQty = getOrderProductCompanySortValue(b, 'sale_qty');
            if (sortField === 'total_profit') { if (aQty !== bQty) return bQty - aQty; }
            else { if (aProfit !== bProfit) return bProfit - aProfit; }
            var aName = $.trim((a && a.product_name) ? String(a.product_name) : '');
            var bName = $.trim((b && b.product_name) ? String(b.product_name) : '');
            return aName.localeCompare(bName, 'zh-CN');
        });
        return rows;
    }

    function buildOrderProductSortIndicator(field, currentSortField, currentSortOrder) {
        var split = window.OrderProductSummarySplit = window.OrderProductSummarySplit || {};
        var activeSortField = currentSortField || split.companySortField || 'total_profit';
        var activeSortOrder = currentSortOrder || split.companySortOrder || 'desc';
        if (activeSortField !== field) { return '<span style="opacity:.45;margin-left:4px;">↕</span>'; }
        return activeSortOrder === 'asc'
            ? '<span style="margin-left:4px;">↑</span>'
            : '<span style="margin-left:4px;">↓</span>';
    }

    function updateOrderProductPaneSummary(selector, summary) {
        if (selector === '#orderProductCompanyPaneSummary') {
            var companyKinds = summary && summary.total_product_count ? summary.total_product_count : 0;
            var companyProfitRaw = summary && summary.total_profit_raw !== undefined ? summary.total_profit_raw : 0;
            var companyQty = summary && summary.total_sales_qty !== undefined ? summary.total_sales_qty : 0;
            $(selector).html('合计：产品种类 ' + companyKinds + ' ｜ 总利润 ' + formatOrderProductAmount2(companyProfitRaw) + ' ｜ 总销量 ' + formatOrderProductQty(companyQty));
            return;
        }
        if (selector === '#orderProductTeamPaneSummary') {
            var teamCount = summary && summary.team_count ? summary.team_count : 0;
            var memberCount = summary && summary.member_count ? summary.member_count : 0;
            $(selector).html('合计：团队数 ' + teamCount + ' ｜ 成员数 ' + memberCount);
            return;
        }
        var productKinds = 0;
        if (summary) {
            if (summary.total_product_count !== undefined && summary.total_product_count !== null) {
                productKinds = summary.total_product_count;
            } else if (summary.team_product_count !== undefined && summary.team_product_count !== null) {
                productKinds = summary.team_product_count;
            } else if (summary.user_product_count !== undefined && summary.user_product_count !== null) {
                productKinds = summary.user_product_count;
            }
        }
        var productQty = (summary && summary.total_sales_qty !== undefined) ? summary.total_sales_qty : 0;
        var productProfitRaw = (summary && summary.total_profit_raw !== undefined) ? summary.total_profit_raw : 0;
        $(selector).html('合计：产品种类 ' + productKinds + ' ｜ 总利润 ' + formatOrderProductAmount2(productProfitRaw) + ' ｜ 总销量 ' + formatOrderProductQty(productQty));
    }

    function renderOrderProductEmpty($container, text) {
        $container.html('<div class="empty" style="text-align:center;padding:60px 20px;color:#6c757d;"><i class="bi bi-inbox" style="font-size:48px;margin-bottom:15px;display:block;"></i><p style="font-size:16px;margin:0;">' + text + '</p></div>');
    }

    function renderOrderProductCompanyPane(data) {
        var split = window.OrderProductSummarySplit = window.OrderProductSummarySplit || {};
        if (Array.isArray(data)) { split.companyProductsRaw = data.slice(); }
        split.companySortField = split.companySortField || 'total_profit';
        split.companySortOrder = split.companySortOrder || 'desc';
        var rows = sortOrderProductCompanyRows(split.companyProductsRaw || [], split.companySortField, split.companySortOrder);
        var html = '<div style="background:#ffffff;border-radius:8px;overflow:hidden;">'
            + '<div style="padding:20px;overflow-x:auto;">'
            + '<table class="wukong-table" style="width:100%;">'
            + '<thead><tr><th style="width:80px;">排名</th><th>产品名称</th>'
            + '<th style="text-align:right;"><a href="javascript:void(0);" class="order-product-company-sort" data-sort-field="total_profit" style="color:inherit;text-decoration:none;">利润' + buildOrderProductSortIndicator('total_profit') + '</a></th>'
            + '<th style="text-align:right;"><a href="javascript:void(0);" class="order-product-company-sort" data-sort-field="sale_qty" style="color:inherit;text-decoration:none;">销量' + buildOrderProductSortIndicator('sale_qty') + '</a></th>'
            + '</tr></thead><tbody>';
        if (rows && rows.length) {
            $.each(rows, function (i, item) {
                var saleQtyRaw = item.sale_qty_raw !== undefined ? item.sale_qty_raw : item.sale_qty;
                var totalProfitRaw = item.total_profit_raw !== undefined ? item.total_profit_raw : item.total_profit;
                html += '<tr>'
                    + '<td>' + (i + 1) + '</td>'
                    + '<td>' + escapeHtml(item.product_name || '') + '</td>'
                    + '<td style="text-align:right;">' + formatOrderProductAmount2(totalProfitRaw) + '</td>'
                    + '<td style="text-align:right;">' + formatOrderProductQty(saleQtyRaw) + '</td>'
                    + '</tr>';
            });
        } else {
            html += '<tr><td colspan="4" class="text-center text-muted">暂无订单产品销量数据</td></tr>';
        }
        html += '</tbody></table></div></div>';
        $('#orderProductCompanyPane').html(html);

        $('#orderProductCompanyPane').off('click.orderProductCompanySort', '.order-product-company-sort').on('click.orderProductCompanySort', '.order-product-company-sort', function () {
            var field = ($(this).attr('data-sort-field') || '').trim();
            if (!field) return;
            if (split.companySortField === field) {
                split.companySortOrder = split.companySortOrder === 'desc' ? 'asc' : 'desc';
            } else {
                split.companySortField = field;
                split.companySortOrder = 'desc';
            }
            renderOrderProductCompanyPane();
        });
    }
    // ===== [结束] 订单产品汇总第一屏利润/销量排序改造 =====

    function renderOrderProductTeamPane(data) {
        if (!data || !data.length) {
            renderOrderProductEmpty($('#orderProductTeamPane'), '当前时间范围暂无团队产品销量数据');
            return;
        }
        var html = '<div style="background:#fff;border-radius:8px;overflow:hidden;">';
        $.each(data, function (i, item) {
            var teamName = normalizeTeamName(item.team_name || '');
            var teamEncoded = encodeURIComponent(teamName);
            html += '<div class="order-product-team-block" data-team-encoded="' + teamEncoded + '" style="border-bottom:1px solid #eef2f7;">'
                + '<div style="padding:12px 16px;display:flex;align-items:center;justify-content:space-between;gap:8px;">'

    function getOrderProductDetailSortValue(item, field) {
        if (field === 'total_profit') {
            if (item && item.total_profit_raw !== undefined && item.total_profit_raw !== null) {
                return toOrderProductNumber(item.total_profit_raw);
            }
            return toOrderProductNumber(item ? item.total_profit : 0);
        }
        if (item && item.sale_qty_raw !== undefined && item.sale_qty_raw !== null) {
            return toOrderProductNumber(item.sale_qty_raw);
        }
        return toOrderProductNumber(item ? item.sale_qty : 0);
    }

    function sortOrderProductDetailRows(rows, sortField, sortOrder) {
        var list = Array.isArray(rows) ? rows.slice() : [];
        list.sort(function (a, b) {
            var orderSign = sortOrder === 'asc' ? 1 : -1;
            var aPrimary = getOrderProductDetailSortValue(a, sortField);
            var bPrimary = getOrderProductDetailSortValue(b, sortField);
            if (aPrimary !== bPrimary) { return (aPrimary - bPrimary) * orderSign; }
            var aProfit = getOrderProductDetailSortValue(a, 'total_profit');
            var bProfit = getOrderProductDetailSortValue(b, 'total_profit');
            if (aProfit !== bProfit) return bProfit - aProfit;
            var aQty = getOrderProductDetailSortValue(a, 'sale_qty');
            var bQty = getOrderProductDetailSortValue(b, 'sale_qty');
            if (aQty !== bQty) return bQty - aQty;
            var aName = $.trim((a && a.product_name) ? String(a.product_name) : '');
            var bName = $.trim((b && b.product_name) ? String(b.product_name) : '');
            return aName.localeCompare(bName, 'zh-CN');
        });
        return list;
    }

    function orderProductSummaryApplyTimeFilterAndLinkage() {
        var self = window.OrderProductSummarySplit;
        var prevTeam = (self.lastTeamName || '').trim();
        var prevUser = (self.lastUsername || '').trim();
        var prevViewMode = (self.lastViewMode || '').trim();
        var timeParams = getOrderProductSummaryTimeParams();
        if (!timeParams) return;

        return loadOrderProductSummaryData().then(function (res) {
            var teamRows = res && res.data && Array.isArray(res.data.teams) ? res.data.teams : [];
            var teamExists = false;
            if (prevTeam) {
                teamExists = teamRows.some(function (item) {
                    return normalizeTeamName(item.team_name || '') === prevTeam;
                });
            }
            if (!prevTeam || !teamExists) {
                self.lastTeamName = '';
                self.lastUsername = '';
                self.lastViewMode = '';
                resetOrderProductDetailSortState();
                self.userProductsRaw = [];
                $('#orderProductTeamPaneTitle').text('👥 团队成员列表');
                $('#orderProductUserPaneTitle').text('📦 产品利润/销量排行');
                renderOrderProductEmpty($('#orderProductUserPane'), '请点击团队或团队成员查看产品利润/销量排行');
                updateOrderProductPaneSummary('#orderProductUserPaneSummary', null);
                return null;
            }

            var $teamLink = getOrderProductTeamLinkByName(prevTeam);
            if (!$teamLink || !$teamLink.length) { return null; }

            $('#orderProductTeamPane .order-product-team-clickable').removeClass('is-active');
            $('#orderProductTeamPane .order-product-team-members').hide();
            $('#orderProductTeamPane .order-product-team-arrow').removeClass('bi-caret-down-fill').addClass('bi-caret-right-fill');
            $teamLink.addClass('is-active');
            $teamLink.find('.order-product-team-arrow').removeClass('bi-caret-right-fill').addClass('bi-caret-down-fill');
            var $block = $teamLink.closest('.order-product-team-block');
            $block.find('.order-product-team-members').html('<div class="text-muted" style="padding:8px 0;">加载中...</div>').show();

            return self.loadTeamMembers(prevTeam, true).then(function (memberRes) {
                var rows = memberRes && memberRes.data ? memberRes.data : [];
                var userExists = false;
                if (prevUser) {
                    userExists = rows.some(function (item) {
                        return $.trim(item.username || '') === prevUser;
                    });
                }

                if (prevUser && userExists) {
                    var $userLink = getOrderProductUserLinkByName(prevUser);
                    if ($userLink && $userLink.length) {
                        $('#orderProductTeamPane .order-product-user-clickable').removeClass('is-active');
                        $userLink.addClass('is-active');
                    }
                    if (prevViewMode === 'user') { return self.loadUserProducts(prevUser); }
                }

                self.lastUsername = '';
                $('#orderProductTeamPane .order-product-user-clickable').removeClass('is-active');
                return self.loadTeamProducts(prevTeam);
            });
        });
    }

    function bindOrderProductSplitLayoutEvents() {
        var $layout = $('#orderProductSummarySplitLayout');
        var $left = $layout.find('.order-product-split-left');
        var $mid = $layout.find('.order-product-split-mid');
        var $right = $layout.find('.order-product-split-right');

        $('#orderProductSplitLeftMaximize').off('click').on('click', function () {
            if ($left.hasClass('maximized')) {
                $left.removeClass('maximized').css('width', '30%');
                $mid.removeClass('hidden').css('width', '35%');
                $right.removeClass('hidden').css('width', '35%');
            } else {
                $left.addClass('maximized').css('width', '100%');
                $mid.addClass('hidden').css('width', '0');
                $right.addClass('hidden').css('width', '0');
            }
        });
        $('#orderProductSplitLeftCollapse').off('click').on('click', function () {
            if ($left.hasClass('collapsed')) {
                $left.removeClass('collapsed').css('width', '30%');
                $mid.css('width', '35%');
                $right.css('width', '35%');
            } else {
                $left.addClass('collapsed').css('width', '64px');
                $mid.css('width', 'calc((100% - 64px) / 2)');
                $right.css('width', 'calc((100% - 64px) / 2)');
            }
        });
        $('#orderProductSplitMidMaximize').off('click').on('click', function () {
            if ($mid.hasClass('maximized')) {
                $mid.removeClass('maximized').css('width', '35%');
                $left.removeClass('hidden').css('width', '30%');
                $right.removeClass('hidden').css('width', '35%');
            } else {
                $mid.addClass('maximized').css('width', '100%');
                $left.addClass('hidden').css('width', '0');
                $right.addClass('hidden').css('width', '0');
            }
        });
        $('#orderProductSplitMidCollapse').off('click').on('click', function () {
            if ($mid.hasClass('collapsed')) {
                $mid.removeClass('collapsed').css('width', '35%');
                $right.css('width', '35%');
                $left.css('width', '30%');
            } else {
                $mid.addClass('collapsed').css('width', '64px');
                $right.css('width', 'calc(70% - 64px)');
                $left.css('width', '30%');
            }
        });
        $('#orderProductSplitRightMaximize').off('click').on('click', function () {
            if ($right.hasClass('maximized')) {
                $right.removeClass('maximized').css('width', '35%');
                $left.removeClass('hidden').css('width', '30%');
                $mid.removeClass('hidden').css('width', '35%');
            } else {
                $right.addClass('maximized').css('width', '100%');
                $left.addClass('hidden').css('width', '0');
                $mid.addClass('hidden').css('width', '0');
            }
        });
        $('#orderProductSplitRightCollapse').off('click').on('click', function () {
            if ($right.hasClass('collapsed')) {
                $right.removeClass('collapsed').css('width', '35%');
                $mid.css('width', '35%');
                $left.css('width', '30%');
            } else {
                $right.addClass('collapsed').css('width', '64px');
                $mid.css('width', 'calc(70% - 64px)');
                $left.css('width', '30%');
            }
        });

        $('#orderProductSplitMidRefresh').off('click').on('click', function () {
            if (!window.OrderProductSummarySplit.lastTeamName) {
                layer.msg('请先选择团队', {icon: 2});
                return;
            }
            window.OrderProductSummarySplit.loadTeamMembers(window.OrderProductSummarySplit.lastTeamName, true);
        });
        $('#orderProductSplitRightRefresh').off('click').on('click', function () {
            var self = window.OrderProductSummarySplit;
            if (self.lastViewMode === 'user') {
                if (!self.lastUsername) { layer.msg('请先选择业务员', {icon: 2}); return; }
                resetOrderProductDetailSortState();
                self.userProductsRaw = [];
                self.loadUserProducts(self.lastUsername);
                return;
            }
            if (self.lastTeamName) {
                resetOrderProductDetailSortState();
                self.userProductsRaw = [];
                self.loadTeamProducts(self.lastTeamName);
                return;
            }
            layer.msg('请先选择团队', {icon: 2});
        });
    }

    function exportOrderProductSummaryExcel() {
        var params = getOrderProductSummaryTimeParams();
        if (!params) return;
        var split = window.OrderProductSummarySplit;
        var $btn = $('#orderProductSummaryExportBtn');
        if ($btn.data('exporting') === 1) return;
        var originalHtml = $btn.html();
        $btn.data('exporting', 1).prop('disabled', true).html('<i class="bi bi-hourglass-split"></i> 导出中');
        var loadingIndex = layer.msg('正在导出，请稍候...', {icon: 16, shade: 0.2, time: 0});
        var postData = {
            timebucket: params.timebucket || '',
            at_time: params.at_time || '',
            month_keys: params.month_keys || '',
            team_name: $.trim(split.lastTeamName || ''),
            username: $.trim(split.lastUsername || '')
        };
        fetch('{:url("DataStatistics/exportOrderProductSummary")}', {
            method: 'POST',
            headers: {'Content-Type': 'application/x-www-form-urlencoded; charset=UTF-8', 'X-Requested-With': 'XMLHttpRequest'},
            body: $.param(postData),
            credentials: 'same-origin'
        }).then(function (response) {
            var contentType = (response.headers.get('content-type') || '').toLowerCase();
            if (contentType.indexOf('application/json') !== -1) {
                return response.json().then(function (jsonRes) {
                    throw new Error((jsonRes && jsonRes.msg) ? jsonRes.msg : '导出失败，请稍后重试');
                });
            }
            if (!response.ok) { throw new Error('导出失败，请稍后重试'); }
            return response.blob().then(function (blob) {
                return {blob: blob, disposition: response.headers.get('content-disposition') || ''};
            });
        }).then(function (result) {
            if (!result || !result.blob || result.blob.size <= 0) { throw new Error('导出失败：生成文件为空'); }
            var disposition = result.disposition || '';
            var fileName = '订单产品汇总表.xlsx';
            var match = disposition.match(/filename\*=UTF-8''([^;]+)/i) || disposition.match(/filename="?([^";]+)"?/i);
            if (match && match[1]) {
                try { fileName = decodeURIComponent(match[1]); } catch (e) { fileName = match[1]; }
            }
            var url = window.URL.createObjectURL(result.blob);
            var a = document.createElement('a');
            a.href = url; a.download = fileName; a.style.display = 'none';
            document.body.appendChild(a); a.click();
            setTimeout(function () { document.body.removeChild(a); window.URL.revokeObjectURL(url); }, 100);
            layer.msg('导出成功', {icon: 1});
        }).catch(function (err) {
            layer.msg((err && err.message) ? err.message : '导出失败，请稍后重试', {icon: 2, time: 4000});
        }).finally(function () {
            layer.close(loadingIndex);
            $btn.data('exporting', 0).prop('disabled', false).html(originalHtml);
        });
    }

    $(document).ready(function () {
        initMonthQuickSelect({
            key: 'orderProductSummary',
            wrapSelector: '#orderProductSummaryMonthShortcutWrap',
            timeFilterSelector: '#orderProductSummaryTimeFilter',
            startDateSelector: '#orderProductSummaryStartDate',
            endDateSelector: '#orderProductSummaryEndDate',
            customRangeSelector: '#orderProductSummaryCustomTimeRange'
        });

        bindOrderProductSummaryEvents();
        bindOrderProductSplitLayoutEvents();
        loadOrderProductSummaryData();
    });
}());
</script>
