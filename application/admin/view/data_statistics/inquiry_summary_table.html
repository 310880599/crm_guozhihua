{include file="common/head"/}
<style>
    html, body { height: 100%; margin: 0; padding: 0; overflow: hidden; }
    #inquirySummarySplitLayout {
        display: flex;
        position: fixed;
        top: 0; left: 0; right: 0; bottom: 0;
        background: #f6f8fb;
        z-index: 1000;
    }
    .split-wrap { display: flex; height: 100%; width: 100%; overflow: hidden; }
    .split-left, .split-mid, .split-right { transition: width 0.3s ease; overflow: hidden; }
    .split-left.hidden, .split-mid.hidden, .split-right.hidden { display: none !important; }
    .split-left.collapsed, .split-mid.collapsed, .split-right.collapsed { width: 64px !important; border: none !important; }
    .split-left.maximized, .split-mid.maximized, .split-right.maximized { width: 100% !important; }
    #inquirySummarySplitLayout .inq-team-clickable.is-active,
    #inquirySummarySplitLayout .inq-member-clickable.is-active {
        background-color: #e8f1ff;
        color: #1d4ed8 !important;
        padding: 2px 6px;
        border-radius: 4px;
    }
    .split-first-filter-bar {
        padding: 8px 15px 6px;
        gap: 6px;
        margin-bottom: 0;
        align-items: flex-start;
        border-bottom: 1px solid #e9ecef;
        display: flex;
        flex-wrap: wrap;
        flex-shrink: 0;
    }
    .split-first-filter-bar .split-first-filter-main {
        width: 100%;
        display: flex;
        align-items: center;
        gap: 8px;
        flex-wrap: wrap;
    }
    .split-first-filter-bar .split-first-time-label { margin: 0; white-space: nowrap; }
    .split-first-filter-bar .split-first-time-filter { width: auto; min-width: 80px; }
    .split-first-month-shortcut { width: 100%; }
    .month-quick-select { width: 100%; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
    .month-quick-select-label { margin: 0; white-space: nowrap; font-weight: 600; }
    .month-quick-select-buttons { display: flex; flex-wrap: nowrap; gap: 6px; flex: 1; min-width: 0; overflow-x: auto; white-space: nowrap; align-items: center; }
    .month-quick-select-btn {
        margin: 0; padding: 2px 8px; min-width: auto; border-radius: 4px; font-size: 12px;
        line-height: 1.2; flex: 0 0 auto; border: 1px solid #dcdfe6; background: #fff; color: #606266; cursor: pointer;
    }
    .month-quick-select-btn.active { background: #4f7cff; color: #fff; border-color: #4f7cff; }
    .wukong-table { width: 100%; border-collapse: collapse; font-size: 13px; }
    .wukong-table th, .wukong-table td { padding: 8px 10px; border: 1px solid #e9ecef; }
    .wukong-table thead th { background: #f8f9fa; font-weight: 600; }
    .wukong-table tbody tr:hover { background: #eff6ff; }
    .inq-team-clickable, .inq-member-clickable {
        color: #4f7cff; cursor: pointer; font-weight: 600; text-decoration: none;
    }
    .inq-team-clickable:hover, .inq-member-clickable:hover {
        color: #6fa1ff; text-decoration: underline;
    }
    .pane-header {
        padding: 15px;
        background: linear-gradient(90deg, #4f7cff, #6fa1ff);
        color: #fff;
        display: flex;
        align-items: center;
        justify-content: space-between;
        flex-shrink: 0;
    }
    .pane-summary {
        padding: 10px 20px;
        border-top: 1px solid #e9ecef;
        background: #fafafa;
        flex-shrink: 0;
        font-weight: 600;
        color: #333;
    }
    .pane-empty {
        text-align: center; padding: 60px 20px; color: #6c757d;
    }
    .pane-empty .empty-icon { font-size: 48px; margin-bottom: 15px; display: block; }
    /* 团队来源汇总小方框 */
    .inquiry-team-source-summary-box {
        margin: 12px 20px 0;
        padding: 10px 12px;
        border: 1px solid #e9d5ff;
        border-radius: 10px;
        background: #ffffff;
        flex-shrink: 0;
    }
    .inquiry-team-source-summary-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
        margin-bottom: 8px;
    }
    .inquiry-team-source-summary-title {
        font-size: 14px;
        font-weight: 600;
        color: #5b21b6;
    }
    .inquiry-team-source-summary-total {
        font-size: 13px;
        color: #6b7280;
    }
    .inquiry-team-source-summary-tags {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
    }
    .inquiry-team-source-tag {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        max-width: 100%;
        padding: 4px 8px;
        background: #faf5ff;
        border: 1px solid #e9d5ff;
        border-radius: 999px;
        font-size: 12px;
        color: #4c1d95;
        line-height: 1.2;
    }
    .inquiry-team-source-tag .name {
        max-width: 160px;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
    }
    .inquiry-team-source-tag .count {
        font-weight: 700;
        color: #6d28d9;
    }
    .inquiry-team-source-summary-empty {
        color: #9ca3af;
        font-size: 13px;
        padding: 4px 0;
    }
</style>

<div id="inquirySummarySplitLayout">
    <div class="split-wrap" style="display:flex;height:100%;width:100%;overflow:hidden;">

        <!-- 左列：团队询盘汇总 -->
        <div class="split-left" style="width:30%;background:#fff;border-right:1px solid #e9ecef;display:flex;flex-direction:column;overflow:hidden;">
            <div class="pane-header">
                <span style="font-size:16px;font-weight:600;">🏢 团队询盘汇总</span>
                <div>
                    <button class="btn btn-sm btn-light" id="inqSplitLeftMaximize" title="最大化/恢复"><i class="bi bi-arrows-angle-expand"></i></button>
                    <button class="btn btn-sm btn-light" id="inqSplitLeftCollapse" title="收起/展开"><i class="bi bi-chevron-left"></i></button>
                    <a class="btn btn-sm btn-light" href="{:url('DataStatistics/index')}" title="返回" style="margin-left:8px;"><i class="bi bi-arrow-left"></i> 返回</a>
                </div>
            </div>
            <div class="split-first-filter-bar" id="inquirySummaryTimeFilterBar">
                <div class="split-first-filter-main">
                    <label class="split-first-time-label">时间筛选：</label>
                    <select id="inquirySummaryTimeFilter" class="form-select split-first-time-filter">
                        <option value="today">今天</option>
                        <option value="yesterday">昨天</option>
                        <option value="week">本周</option>
                        <option value="month" selected>本月</option>
                        <option value="year">本年</option>
                        <option value="custom">自定义</option>
                    </select>
                    <div id="inquirySummaryCustomTimeRange" style="display:none;gap:8px;align-items:center;">
                        <input type="date" id="inquirySummaryStartDate" class="form-control" style="width:150px;">
                        <span>至</span>
                        <input type="date" id="inquirySummaryEndDate" class="form-control" style="width:150px;">
                    </div>
                    <button type="button" class="btn btn-primary btn-sm split-first-filter-btn" id="inquirySummaryFilterBtn">
                        <i class="bi bi-search"></i> 筛选
                    </button>
                    <button type="button" class="btn btn-secondary btn-sm split-first-reset-btn" id="inquirySummaryResetBtn">
                        <i class="bi bi-arrow-counterclockwise"></i> 重置
                    </button>
                    <button type="button" class="btn btn-success btn-sm" id="inquirySummaryExportBtn">
                        <i class="bi bi-download"></i> 导出
                    </button>
                </div>
                <div id="inquirySummaryMonthShortcutWrap" class="split-first-month-shortcut"></div>
            </div>
            <div id="inqTeamPane" style="flex:1;overflow-y:auto;padding:12px 20px 16px;"></div>
            <div id="inqTeamPaneSummary" class="pane-summary">合计：总询盘数 0</div>
        </div>

        <!-- 中列：团队成员询盘汇总 -->
        <div class="split-mid" style="width:35%;background:#fff;border-right:1px solid #e9ecef;display:flex;flex-direction:column;overflow:hidden;">
            <div class="pane-header">
                <span style="font-size:16px;font-weight:600;" id="inqMemberPaneTitle">👥 成员询盘汇总</span>
                <div>
                    <button class="btn btn-sm btn-light" id="inqSplitMidMaximize" title="最大化/恢复"><i class="bi bi-arrows-angle-expand"></i></button>
                    <button class="btn btn-sm btn-light" id="inqSplitMidCollapse" title="收起/展开"><i class="bi bi-chevron-right"></i></button>
                </div>
            </div>
            <div id="inqTeamSourceSummaryBox" class="inquiry-team-source-summary-box">
                <div class="inquiry-team-source-summary-header">
                    <span class="inquiry-team-source-summary-title">团队来源汇总</span>
                    <span class="inquiry-team-source-summary-total" id="inqTeamSourceSummaryTotal">合计：总询盘数 0</span>
                </div>
                <div class="inquiry-team-source-summary-empty">请选择团队查看来源分布</div>
            </div>
            <div id="inqMemberPane" style="flex:1;overflow-y:auto;padding:20px;">
                <div class="pane-empty"><i class="bi bi-inbox empty-icon"></i><p>请点击团队名称查看成员询盘汇总</p></div>
            </div>
            <div id="inqMemberPaneSummary" class="pane-summary">合计：总询盘数 0</div>
        </div>

        <!-- 右列：个人询盘渠道分类 -->
        <div class="split-right" style="width:35%;background:#fff;display:flex;flex-direction:column;overflow:hidden;">
            <div class="pane-header">
                <span style="font-size:16px;font-weight:600;" id="inqChannelPaneTitle">📋 渠道分类明细</span>
                <div>
                    <button class="btn btn-sm btn-light" id="inqSplitRightMaximize" title="最大化/恢复"><i class="bi bi-arrows-angle-expand"></i></button>
                    <button class="btn btn-sm btn-light" id="inqSplitRightCollapse" title="收起/展开"><i class="bi bi-chevron-right"></i></button>
                </div>
            </div>
            <div id="inqChannelPane" style="flex:1;overflow-y:auto;padding:20px;">
                <div class="pane-empty"><i class="bi bi-inbox empty-icon"></i><p>请点击业务员名称查看渠道分类明细</p></div>
            </div>
            <div id="inqChannelPaneSummary" class="pane-summary">合计：总询盘数 0</div>
        </div>

    </div>
</div>

<template id="monthQuickSelectTemplate">
    <div class="month-quick-select">
        <label class="month-quick-select-label">月份快捷：</label>
        <div class="month-quick-select-buttons">
            <button type="button" class="month-quick-select-btn" data-month="1">1</button>
            <button type="button" class="month-quick-select-btn" data-month="2">2</button>
            <button type="button" class="month-quick-select-btn" data-month="3">3</button>
            <button type="button" class="month-quick-select-btn" data-month="4">4</button>
            <button type="button" class="month-quick-select-btn" data-month="5">5</button>
            <button type="button" class="month-quick-select-btn" data-month="6">6</button>
            <button type="button" class="month-quick-select-btn" data-month="7">7</button>
            <button type="button" class="month-quick-select-btn" data-month="8">8</button>
            <button type="button" class="month-quick-select-btn" data-month="9">9</button>
            <button type="button" class="month-quick-select-btn" data-month="10">10</button>
            <button type="button" class="month-quick-select-btn" data-month="11">11</button>
            <button type="button" class="month-quick-select-btn" data-month="12">12</button>
        </div>
    </div>
</template>

<script>
(function () {
    // ---- 月份快捷选择 ----
    var monthState = { selectedMonths: [] };

    function renderMonthQuickSelect($wrap) {
        if (!$wrap || !$wrap.length) return;
        if ($wrap.find('.month-quick-select').length) return;
        var tpl = $('#monthQuickSelectTemplate').html() || '';
        if (tpl) $wrap.html(tpl);
    }

    function syncMonthQuickState() {
        var sel = {};
        $.each(monthState.selectedMonths, function(_, m) { sel[m] = true; });
        $('#inquirySummaryMonthShortcutWrap .month-quick-select-btn').each(function() {
            var m = parseInt($(this).attr('data-month'), 10);
            $(this).toggleClass('active', !!sel[m]);
        });
    }

    function getMonthKeys() {
        if (!monthState.selectedMonths.length) return '';
        var year = new Date().getFullYear();
        return monthState.selectedMonths.map(function(m) {
            return year + '-' + (m < 10 ? '0' + m : String(m));
        }).join(',');
    }

    function clearMonthQuickState() {
        monthState.selectedMonths = [];
        syncMonthQuickState();
    }

    // ---- 时间参数 ----
    function getTimeParams() {
        var month_keys = getMonthKeys();
        if (month_keys) return { timebucket: '', at_time: '', month_keys: month_keys };
        var timeFilter = ($('#inquirySummaryTimeFilter').val() || 'month').trim();
        if (timeFilter === 'custom') {
            var s = ($('#inquirySummaryStartDate').val() || '').trim();
            var e = ($('#inquirySummaryEndDate').val() || '').trim();
            if (s && e) return { timebucket: '', at_time: s + ',' + e, month_keys: '' };
            layer.msg('请选择开始日期和结束日期', { icon: 2 });
            return null;
        }
        return { timebucket: timeFilter || 'month', at_time: '', month_keys: '' };
    }

    // ---- 工具函数 ----
    function esc(str) {
        if (str == null) return '';
        return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
    }

    function updatePaneSummary(selector, total) {
        $(selector).html('合计：总询盘数 ' + (total || 0));
    }

    function renderEmpty($container, text) {
        $container.html('<div class="pane-empty"><i class="bi bi-inbox empty-icon"></i><p>' + esc(text) + '</p></div>');
    }

    // ---- 渲染函数 ----
    function renderTeamPane(data) {
        if (!data || !data.length) {
            renderEmpty($('#inqTeamPane'), '暂无团队数据');
            return;
        }
        var html = '<div style="background:#fff;border-radius:8px;overflow:hidden;"><div style="padding:12px 0;overflow-x:auto;">'
            + '<table class="wukong-table"><thead><tr>'
            + '<th style="width:60px;">排名</th><th>团队名称</th><th style="text-align:right;">询盘数量</th>'
            + '</tr></thead><tbody>';
        var total = 0;
        $.each(data, function(i, item) {
            total += parseInt(item.yw_num || 0, 10);
            html += '<tr>'
                + '<td>' + (item.rank || (i + 1)) + '</td>'
                + '<td><a href="javascript:void(0);" class="inq-team-clickable">' + esc(item.team_name || '未分组') + '</a></td>'
                + '<td style="text-align:right;">' + (item.yw_num || 0) + '</td>'
                + '</tr>';
        });
        html += '</tbody></table></div></div>';
        $('#inqTeamPane').html(html);
        updatePaneSummary('#inqTeamPaneSummary', total);
        bindTeamClick();
    }

    function renderMemberPane(teamName, data) {
        $('#inqMemberPaneTitle').text('👥 团队：' + teamName + ' - 成员询盘汇总');
        if (!data || !data.length) {
            renderEmpty($('#inqMemberPane'), '该团队暂无成员数据');
            updatePaneSummary('#inqMemberPaneSummary', 0);
            return;
        }
        var html = '<div style="background:#fff;border-radius:8px;overflow:hidden;">'
            + '<div style="padding:8px 12px;background:#f0f7ff;border-bottom:1px solid #e9ecef;font-size:12px;color:#666;">团队：<strong>' + esc(teamName) + '</strong></div>'
            + '<div style="padding:12px 0;overflow-x:auto;">'
            + '<table class="wukong-table"><thead><tr>'
            + '<th style="width:60px;">排名</th><th>业务员</th><th style="text-align:right;">询盘数量</th>'
            + '</tr></thead><tbody>';
        var total = 0;
        $.each(data, function(i, item) {
            total += parseInt(item.yw_num || 0, 10);
            var username = (item.username || '').trim();
            html += '<tr>'
                + '<td>' + (item.rank || (i + 1)) + '</td>'
                + '<td><a href="javascript:void(0);" class="inq-member-clickable" data-username="' + encodeURIComponent(username) + '">' + esc(username) + '</a></td>'
                + '<td style="text-align:right;">' + (item.yw_num || 0) + '</td>'
                + '</tr>';
        });
        html += '</tbody></table></div></div>';
        $('#inqMemberPane').html(html);
        updatePaneSummary('#inqMemberPaneSummary', total);
        bindMemberClick();
    }

    function renderChannelPane(username, data) {
        $('#inqChannelPaneTitle').text('📋 ' + username + ' - 渠道分类明细');
        if (!data || !data.length) {
            renderEmpty($('#inqChannelPane'), '该业务员暂无渠道数据');
            updatePaneSummary('#inqChannelPaneSummary', 0);
            return;
        }
        var html = '<div style="background:#fff;border-radius:8px;overflow:hidden;">'
            + '<div style="padding:8px 12px;background:#f0f7ff;border-bottom:1px solid #e9ecef;font-size:12px;color:#666;">业务员：<strong>' + esc(username) + '</strong></div>'
            + '<div style="padding:12px 0;overflow-x:auto;">'
            + '<table class="wukong-table"><thead><tr>'
            + '<th style="width:60px;">排名</th><th>渠道名称</th><th style="text-align:right;">询盘数量</th>'
            + '</tr></thead><tbody>';
        var total = 0;
        $.each(data, function(i, item) {
            total += parseInt(item.yw_num || 0, 10);
            html += '<tr>'
                + '<td>' + (item.rank || (i + 1)) + '</td>'
                + '<td>' + esc(item.channel_name || '未分类') + '</td>'
                + '<td style="text-align:right;">' + (item.yw_num || 0) + '</td>'
                + '</tr>';
        });
        html += '</tbody></table></div></div>';
        $('#inqChannelPane').html(html);
        updatePaneSummary('#inqChannelPaneSummary', total);
    }

    // ---- 团队来源汇总渲染 ----
    function renderInquiryTeamSourceSummary(teamName, data, summary, emptyText) {
        var rawTeam = $.trim(teamName || (summary && summary.team_name) || '');
        var total = summary && summary.total_count ? Number(summary.total_count) : 0;
        if (!isFinite(total)) total = 0;
        var titleText = rawTeam ? ('团队来源汇总（' + esc(rawTeam) + '）') : '团队来源汇总';
        var html = '<div class="inquiry-team-source-summary-header">'
            + '<span class="inquiry-team-source-summary-title">' + titleText + '</span>'
            + '<span class="inquiry-team-source-summary-total">合计：总询盘数 ' + total + '</span>'
            + '</div>';
        if (data && data.length) {
            html += '<div class="inquiry-team-source-summary-tags">';
            $.each(data, function(_, item) {
                var name = $.trim((item && item.inquiry_name) ? String(item.inquiry_name) : '');
                var count = Number(item && item.yw_num ? item.yw_num : 0);
                if (!isFinite(count)) count = 0;
                if (!name) name = '未知来源';
                html += '<span class="inquiry-team-source-tag"><span class="name">' + esc(name) + '</span><span class="count">' + count + '</span></span>';
            });
            html += '</div>';
        } else {
            html += '<div class="inquiry-team-source-summary-empty">' + esc(emptyText || '暂无来源分布数据') + '</div>';
        }
        $('#inqTeamSourceSummaryBox').html(html);
    }

    // ---- 数据加载 ----
    function loadTeamSourceSummary(teamName) {
        var params = getTimeParams();
        if (!params) return;
        renderInquiryTeamSourceSummary(teamName, [], {team_name: teamName, total_count: 0}, '加载中...');
        $.ajax({
            url: '{:url("DataStatistics/getInquiryTeamSourceSummaryData")}',
            type: 'POST', dataType: 'json', timeout: 30000,
            data: $.extend({}, params, { team_name: teamName }),
            success: function(res) {
                if (res.code === 0 || res.code === 200) {
                    renderInquiryTeamSourceSummary(teamName, res.data || [], res.summary || {team_name: teamName, total_count: 0}, '暂无来源分布数据');
                } else {
                    renderInquiryTeamSourceSummary(teamName, [], {team_name: teamName, total_count: 0}, res.msg || '获取团队来源汇总失败');
                }
            },
            error: function(xhr, status) {
                renderInquiryTeamSourceSummary(teamName, [], {team_name: teamName, total_count: 0}, status === 'timeout' ? '请求超时，请稍后重试' : '网络错误，请稍后重试');
            }
        });
    }

    function loadTeamSummary() {
        var params = getTimeParams();
        if (!params) return;
        renderEmpty($('#inqTeamPane'), '加载中...');
        $.ajax({
            url: '{:url("DataStatistics/getInquiryTeamSummaryData")}',
            type: 'POST', dataType: 'json', timeout: 30000, data: params,
            success: function(res) {
                if (res.code === 0 || res.code === 200) {
                    renderTeamPane(res.data || []);
                } else {
                    renderEmpty($('#inqTeamPane'), res.msg || '获取团队汇总失败');
                    updatePaneSummary('#inqTeamPaneSummary', 0);
                }
            },
            error: function(xhr, status) {
                renderEmpty($('#inqTeamPane'), status === 'timeout' ? '请求超时，请稍后重试' : '网络错误，请稍后重试');
                updatePaneSummary('#inqTeamPaneSummary', 0);
            }
        });
    }

    function loadMemberSummary(teamName) {
        var params = getTimeParams();
        if (!params) return;
        renderEmpty($('#inqMemberPane'), '加载中...');
        $.ajax({
            url: '{:url("DataStatistics/getInquiryMemberSummaryData")}',
            type: 'POST', dataType: 'json', timeout: 30000,
            data: $.extend({}, params, { team_name: teamName }),
            success: function(res) {
                if (res.code === 0 || res.code === 200) {
                    renderMemberPane(teamName, res.data || []);
                } else {
                    renderEmpty($('#inqMemberPane'), res.msg || '获取成员汇总失败');
                    updatePaneSummary('#inqMemberPaneSummary', 0);
                }
            },
            error: function(xhr, status) {
                renderEmpty($('#inqMemberPane'), status === 'timeout' ? '请求超时，请稍后重试' : '网络错误，请稍后重试');
                updatePaneSummary('#inqMemberPaneSummary', 0);
            }
        });
    }

    function loadChannelSummary(username) {
        var params = getTimeParams();
        if (!params) return;
        renderEmpty($('#inqChannelPane'), '加载中...');
        $.ajax({
            url: '{:url("DataStatistics/getInquiryChannelSummaryData")}',
            type: 'POST', dataType: 'json', timeout: 30000,
            data: $.extend({}, params, { username: username }),
            success: function(res) {
                if (res.code === 0 || res.code === 200) {
                    renderChannelPane(username, res.data || []);
                } else {
                    renderEmpty($('#inqChannelPane'), res.msg || '获取渠道汇总失败');
                    updatePaneSummary('#inqChannelPaneSummary', 0);
                }
            },
            error: function(xhr, status) {
                renderEmpty($('#inqChannelPane'), status === 'timeout' ? '请求超时，请稍后重试' : '网络错误，请稍后重试');
                updatePaneSummary('#inqChannelPaneSummary', 0);
            }
        });
    }

    // ---- 事件绑定 ----
    function bindTeamClick() {
        $('#inqTeamPane').off('click', '.inq-team-clickable').on('click', '.inq-team-clickable', function() {
            $('#inqTeamPane .inq-team-clickable').removeClass('is-active');
            $(this).addClass('is-active');
            var teamName = $(this).text().trim();
            renderEmpty($('#inqChannelPane'), '请点击业务员名称查看渠道分类明细');
            updatePaneSummary('#inqChannelPaneSummary', 0);
            $('#inqChannelPaneTitle').text('📋 渠道分类明细');
            loadTeamSourceSummary(teamName);
            loadMemberSummary(teamName);
        });
    }

    function bindMemberClick() {
        $('#inqMemberPane').off('click', '.inq-member-clickable').on('click', '.inq-member-clickable', function() {
            $('#inqMemberPane .inq-member-clickable').removeClass('is-active');
            $(this).addClass('is-active');
            var raw = $(this).attr('data-username') || $(this).text().trim();
            var username = raw;
            try { username = decodeURIComponent(raw); } catch(e) {}
            loadChannelSummary((username || '').trim());
        });
    }

    // ---- 分栏控制 ----
    var DEFAULT_WIDTHS = { left: '30%', mid: '35%', right: '35%' };
    var COLLAPSED_WIDTH = '64px';

    function getPanels() {
        return {
            $left:  $('.split-left').first(),
            $mid:   $('.split-mid').first(),
            $right: $('.split-right').first()
        };
    }

    $('#inqSplitLeftMaximize').on('click', function() {
        var p = getPanels();
        if (p.$left.hasClass('maximized')) {
            p.$left.removeClass('maximized').css('width', DEFAULT_WIDTHS.left);
            p.$mid.removeClass('hidden').css('width', DEFAULT_WIDTHS.mid);
            p.$right.removeClass('hidden').css('width', DEFAULT_WIDTHS.right);
        } else {
            p.$left.addClass('maximized').css('width', '100%');
            p.$mid.addClass('hidden'); p.$right.addClass('hidden');
        }
    });

    $('#inqSplitLeftCollapse').on('click', function() {
        var p = getPanels();
        if (p.$left.hasClass('collapsed')) {
            p.$left.removeClass('collapsed').css('width', DEFAULT_WIDTHS.left);
            p.$mid.css('width', DEFAULT_WIDTHS.mid);
            p.$right.css('width', DEFAULT_WIDTHS.right);
        } else {
            var remaining = 'calc((100% - ' + COLLAPSED_WIDTH + ') / 2)';
            p.$left.addClass('collapsed').css('width', COLLAPSED_WIDTH);
            p.$mid.css('width', remaining); p.$right.css('width', remaining);
        }
    });

    $('#inqSplitMidMaximize').on('click', function() {
        var p = getPanels();
        if (p.$mid.hasClass('maximized')) {
            p.$mid.removeClass('maximized').css('width', DEFAULT_WIDTHS.mid);
            p.$left.removeClass('hidden').css('width', DEFAULT_WIDTHS.left);
            p.$right.removeClass('hidden').css('width', DEFAULT_WIDTHS.right);
        } else {
            p.$mid.addClass('maximized').css('width', '100%');
            p.$left.addClass('hidden'); p.$right.addClass('hidden');
        }
    });

    $('#inqSplitMidCollapse').on('click', function() {
        var p = getPanels();
        if (p.$mid.hasClass('collapsed')) {
            p.$mid.removeClass('collapsed').css('width', DEFAULT_WIDTHS.mid);
            p.$left.css('width', DEFAULT_WIDTHS.left); p.$right.css('width', DEFAULT_WIDTHS.right);
        } else {
            var remaining = 'calc((100% - ' + COLLAPSED_WIDTH + ') / 2)';
            p.$mid.addClass('collapsed').css('width', COLLAPSED_WIDTH);
            p.$left.css('width', remaining); p.$right.css('width', remaining);
        }
    });

    $('#inqSplitRightMaximize').on('click', function() {
        var p = getPanels();
        if (p.$right.hasClass('maximized')) {
            p.$right.removeClass('maximized').css('width', DEFAULT_WIDTHS.right);
            p.$left.removeClass('hidden').css('width', DEFAULT_WIDTHS.left);
            p.$mid.removeClass('hidden').css('width', DEFAULT_WIDTHS.mid);
        } else {
            p.$right.addClass('maximized').css('width', '100%');
            p.$left.addClass('hidden'); p.$mid.addClass('hidden');
        }
    });

    $('#inqSplitRightCollapse').on('click', function() {
        var p = getPanels();
        if (p.$right.hasClass('collapsed')) {
            p.$right.removeClass('collapsed').css('width', DEFAULT_WIDTHS.right);
            p.$left.css('width', DEFAULT_WIDTHS.left); p.$mid.css('width', DEFAULT_WIDTHS.mid);
        } else {
            var remaining = 'calc((100% - ' + COLLAPSED_WIDTH + ') / 2)';
            p.$right.addClass('collapsed').css('width', COLLAPSED_WIDTH);
            p.$left.css('width', remaining); p.$mid.css('width', remaining);
        }
    });

    // ---- 筛选事件 ----
    $('#inquirySummaryTimeFilter').on('change', function() {
        var v = $(this).val();
        if (v === 'custom') {
            $('#inquirySummaryCustomTimeRange').css('display', 'flex');
        } else {
            $('#inquirySummaryCustomTimeRange').css('display', 'none');
            clearMonthQuickState();
        }
    });

    $('#inquirySummaryFilterBtn').on('click', function() {
        renderInquiryTeamSourceSummary('', [], {total_count: 0}, '请选择团队查看来源分布');
        renderEmpty($('#inqMemberPane'), '请点击团队名称查看成员询盘汇总');
        updatePaneSummary('#inqMemberPaneSummary', 0);
        renderEmpty($('#inqChannelPane'), '请点击业务员名称查看渠道分类明细');
        updatePaneSummary('#inqChannelPaneSummary', 0);
        $('#inqMemberPaneTitle').text('👥 成员询盘汇总');
        $('#inqChannelPaneTitle').text('📋 渠道分类明细');
        loadTeamSummary();
    });

    $('#inquirySummaryResetBtn').on('click', function() {
        $('#inquirySummaryTimeFilter').val('month');
        $('#inquirySummaryCustomTimeRange').css('display', 'none');
        $('#inquirySummaryStartDate').val('');
        $('#inquirySummaryEndDate').val('');
        clearMonthQuickState();
        renderInquiryTeamSourceSummary('', [], {total_count: 0}, '请选择团队查看来源分布');
        renderEmpty($('#inqMemberPane'), '请点击团队名称查看成员询盘汇总');
        updatePaneSummary('#inqMemberPaneSummary', 0);
        renderEmpty($('#inqChannelPane'), '请点击业务员名称查看渠道分类明细');
        updatePaneSummary('#inqChannelPaneSummary', 0);
        $('#inqMemberPaneTitle').text('👥 成员询盘汇总');
        $('#inqChannelPaneTitle').text('📋 渠道分类明细');
        loadTeamSummary();
    });

    // ---- 导出 ----
    $('#inquirySummaryExportBtn').on('click', function() {
        var params = getTimeParams();
        if (!params) return;
        var $btn = $(this);
        var orig = $btn.html();
        $btn.prop('disabled', true).html('<i class="bi bi-hourglass-split"></i> 导出中...');
        fetch('{:url("DataStatistics/exportInquirySummary")}', {
            method: 'POST',
            headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
            body: 'timebucket=' + encodeURIComponent(params.timebucket)
                + '&at_time=' + encodeURIComponent(params.at_time)
                + '&month_keys=' + encodeURIComponent(params.month_keys)
        }).then(function(resp) {
            if (!resp.ok) { return resp.json().then(function(d) { throw new Error(d.msg || '导出失败'); }); }
            var cd = resp.headers.get('Content-Disposition') || '';
            var fnMatch = cd.match(/filename\*?=(?:UTF-8'')?([^;"\n]+)/i);
            var fn = fnMatch ? decodeURIComponent(fnMatch[1].replace(/"/g,'')) : ('inquiry_summary_' + Date.now() + '.xlsx');
            return resp.blob().then(function(blob) {
                var url = URL.createObjectURL(blob);
                var a = document.createElement('a');
                a.href = url; a.download = fn; document.body.appendChild(a); a.click();
                setTimeout(function() { URL.revokeObjectURL(url); a.remove(); }, 1000);
            });
        }).catch(function(e) {
            layer.msg(e.message || '导出失败', { icon: 2 });
        }).finally(function() {
            $btn.prop('disabled', false).html(orig);
        });
    });

    // ---- 月份快捷初始化 ----
    $(document).ready(function() {
        renderMonthQuickSelect($('#inquirySummaryMonthShortcutWrap'));
        $('#inquirySummaryMonthShortcutWrap').on('click', '.month-quick-select-btn', function() {
            var month = parseInt($(this).attr('data-month'), 10);
            if (isNaN(month)) return;
            var idx = monthState.selectedMonths.indexOf(month);
            if (idx > -1) { monthState.selectedMonths.splice(idx, 1); } else { monthState.selectedMonths.push(month); }
            monthState.selectedMonths.sort(function(a, b) { return a - b; });
            syncMonthQuickState();
            if (monthState.selectedMonths.length) {
                $('#inquirySummaryStartDate').val('');
                $('#inquirySummaryEndDate').val('');
                $('#inquirySummaryCustomTimeRange').css('display', 'none');
                if (($('#inquirySummaryTimeFilter').val() || '').trim() === 'custom') {
                    $('#inquirySummaryTimeFilter').val('month');
                }
            }
        });

        // 自动加载本月数据
        loadTeamSummary();
    });
}());
</script>
