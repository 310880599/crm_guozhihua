    <script>
        layui.use(['table', 'form'], function () {
            var table = layui.table, form = layui.form, laydate = layui.laydate, $ = layui.jquery, upload = layui.upload, util = layui.util;

            var tableIn = table.render({
                elem: '#table-list',
                url: '{:url("index")}',
                method: 'post',
                toolbar: '#topBtn',
                cols: [[
                    { checkbox: true, fixed: true, hide: false },
                    { field: 'id', title: 'ID', width: '8%', fixed: true, hide: false },
                    { field: 'inquiry_name', title: '询盘来源', width: '18%', fixed: true, hide: false },
                    {
                        field: 'status', title: '状态', width: '10%', fixed: true, hide: false,
                        templet: function (d) {
                            return parseInt(d.status) === 1
                                ? '<span class="layui-badge">已停用</span>'
                                : '<span class="layui-badge layui-bg-green">启用</span>';
                        }
                    },
                    { field: 'submit_person', title: '提交人', width: '10%', fixed: true, hide: false },
                    {
                        field: 'add_time', title: '添加时间', width: '16%', fixed: true, hide: false,
                        templet: function (d) {
                            var v = d.add_time;
                            if (!v) return '';
                            if (/^\d+$/.test(v)) return layui.util.toDateString(v * 1000);
                            return v;
                        }
                    },
                    {
                        field: 'edit_time', title: '修改时间', width: '16%', fixed: true, hide: false,
                        templet: function (d) {
                            var v = d.edit_time;
                            if (!v) return '';
                            if (/^\d+$/.test(v)) return layui.util.toDateString(v * 1000);
                            return v;
                        }
                    },
                    { align: 'center', toolbar: '#action', width: '18%', fixed: true, hide: false }
                ]],
                limit: 50,
                page: { limits: [10, 20, 30, 40, 50, 100, 9999999] },
            });


            table.on('tool(table-list)', function (obj) {
                var data = obj.data;

                if (obj.event === 'del') {
                    layer.confirm('确认停用该询盘来源？历史客户与订单数据将保留，新业务将不可再选此来源。若仍有启用中的子端口，需先停用子端口。', function (index) {
                        var loading = layer.load(1, { shade: [0.1, '#fff'] });
                        $.post(
                            "{:url('Inquiry/del')}",
                            { id: data.id },
                            function (res) {
                                layer.close(loading);
                                if (res.code === 200) {
                                    layer.msg(res.msg || '停用成功', { time: 1000, icon: 1 }, function () {
                                        tableIn.reload({ page: { curr: 1 } });
                                    });
                                } else {
                                    layer.msg(res.msg || '停用失败', { time: 2000, icon: 2 });
                                }
                            },
                            'json'
                        );
                        layer.close(index);
                    });
                }
                else if (obj.event === 'enable') {
                    layer.confirm('确认启用该询盘来源？启用后新业务可再次选择；不会自动恢复其子端口。', function (index) {
                        var loading = layer.load(1, { shade: [0.1, '#fff'] });
                        $.post(
                            "{:url('Inquiry/enable')}",
                            { id: data.id },
                            function (res) {
                                layer.close(loading);
                                if (res.code === 200) {
                                    layer.msg(res.msg || '启用成功', { time: 1000, icon: 1 }, function () {
                                        tableIn.reload({ page: { curr: 1 } });
                                    });
                                } else {
                                    layer.msg(res.msg || '启用失败', { time: 2000, icon: 2 });
                                }
                            },
                            'json'
                        );
                        layer.close(index);
                    });
                }
                else if (obj.event === 'edit') {
                    layer_add("编辑询盘来源", "{:url('Inquiry/edit')}?id=" + data.id);
                }
            });



            table.on('toolbar(table-list)', function (obj) {
                if (obj.event === 'batchDel') {
                    var rows = table.checkStatus('table-list').data || [];
                    if (!rows.length) return layer.msg('请先勾选要停用的记录', { icon: 0 });

                    var ids = rows.map(function (r) { return r.id; });
                    layer.confirm('确认停用选中的 ' + ids.length + ' 条询盘来源？历史数据保留，新业务不可再选；有启用子端口的将跳过。', function (index) {
                        var loading = layer.load(1, { shade: [0.1, '#fff'] });
                        $.post(
                            "{:url('Inquiry/batchDel')}",
                            { ids: ids },
                            function (res) {
                                layer.close(loading);
                                if (res.code === 0) {
                                    layer.msg(res.msg || '停用完成', { icon: 1, time: 1800 }, function () {
                                        tableIn.reload({ page: { curr: 1 } });
                                    });
                                } else {
                                    layer.msg(res.msg || '停用失败', { icon: 2, time: 2200 });
                                }
                            },
                            'json'
                        );
                        layer.close(index);
                    });
                } else if (obj.event === 'batchEnable') {
                    var rows = table.checkStatus('table-list').data || [];
                    if (!rows.length) return layer.msg('请先勾选要启用的记录', { icon: 0 });
                    var ids = rows.map(function (r) { return r.id; });
                    layer.confirm('确认启用选中的 ' + ids.length + ' 条询盘来源？不会自动恢复其子端口。', function (index) {
                        var loading = layer.load(1, { shade: [0.1, '#fff'] });
                        $.post(
                            "{:url('Inquiry/batchEnable')}",
                            { ids: ids },
                            function (res) {
                                layer.close(loading);
                                if (res.code === 0) {
                                    layer.msg(res.msg || '启用完成', { icon: 1, time: 1800 }, function () {
                                        tableIn.reload({ page: { curr: 1 } });
                                    });
                                } else {
                                    layer.msg(res.msg || '启用失败', { icon: 2, time: 2200 });
                                }
                            },
                            'json'
                        );
                        layer.close(index);
                    });
                } else if (obj.event === 'importExcel') {
                    layer.open({
                        type: 2,
                        title: '批量导入（Excel/CSV）',
                        area: ['600px', '360px'],
                        shadeClose: true,
                        content: ["{:url('Inquiry/import')}", 'no']
                    });
                } else if (obj.event === 'downloadTpl') {
                    window.location.href = "{:url('Inquiry/tpl')}";
                }
            });


            $('body').on('click', '#add', function () {
                var indexOpen = layer.open({
                    type: 2,
                    title: '添加询盘来源',
                    closeBtn: 1,
                    area: ['100%', '86%'],
                    anim: 2,
                    shadeClose: false,
                    maxmin: false,
                    content: ["{:url('Inquiry/add')}"]
                });
            })


            form.on('submit(LAY-app-contlist-search)', function (data) {
                table.reload('table-list', {
                    url: "{:url('Inquiry/inquirySearch')}",
                    where: data.field,
                    page: {
                        curr: 1
                    }
                });


            });
        });
    </script>


    <script>

        /*添加*/
        function layer_add(title, url) {
            var indexOpen = layer.open({
                type: 2,
                title: title,
                closeBtn: 1,
                area: ['100%', '80%'],
                anim: 2,
                shadeClose: false,
                maxmin: true,
                content: [url]
            });
        }

    </script>
